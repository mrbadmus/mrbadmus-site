  <style>
  /* ═══════════════════════════════════════════════════════════════════════
     consumer/overview.html — the parent dashboard. MRB-317 Night 3.

     Claude Design's `Parent Dashboard.dc.html`, compiled onto the Night 1–2
     plumbing. Her per-element inline styles ARE the design; the ones that
     repeat across screens are lifted here under her own `dk-` prefix and the
     one-offs stay inline exactly as she wrote them. No new tokens: every
     colour, radius and shadow below is a `--ks3-*` out of /shared/ks3.css.

     ⚠️ consumer.css puts 84px of padding on `body` (the Night 1 scaffold
     nav was fixed). Design's page owns the whole viewport, so that padding
     is removed here — but `display:none` is NOT touched. It is the flag
     gate, and only `boot()` may reveal the page.
     ═══════════════════════════════════════════════════════════════════════ */
  body {
    margin: 0;
    padding: 0;
    background: #FBF3E6;
    font-size: 17px;
  }
  a { color: #A93411; text-decoration: none; }
  a:hover { color: #7F2408; text-decoration: underline; }
  input, select, textarea, button { font: inherit; }
  input::placeholder, textarea::placeholder { color: #9A8F86; }

  .dk-root {
    min-height: 100vh;
    background: var(--ks3-ground);
    color: var(--ks3-ink);
    font-family: var(--ks3-font-body);
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 84px;
  }
  .dk-side { display: none; }

  /* ── the repeated pieces ─────────────────────────────────────────────── */
  .dk-kicker {
    margin: 0;
    font-family: var(--ks3-font-mono);
    font-size: 13px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ks3-ink-muted);
  }
  .dk-kicker-page { letter-spacing: .14em; }
  .dk-h1 {
    margin: 8px 0 0;
    font-family: var(--ks3-font-display);
    font-weight: 800;
    font-size: 34px;
    line-height: 1.02;
    letter-spacing: -.035em;
  }
  .dk-card {
    padding: 20px;
    border: 2px solid var(--ks3-ink);
    border-radius: var(--ks3-r-card);
    background: var(--ks3-card);
    box-shadow: var(--ks3-shadow-block);
  }
  .dk-card-flat {
    padding: 20px;
    border: 2px solid var(--ks3-ink);
    border-radius: var(--ks3-r-card);
    background: var(--ks3-card);
  }
  .dk-dark {
    padding: 20px;
    border-radius: var(--ks3-r-dark);
    background: var(--ks3-ink);
    color: var(--ks3-on-dark);
    box-shadow: 6px 6px 0 var(--ks3-accent);
  }
  .dk-dashed {
    padding: 26px 22px;
    border: 2px dashed var(--ks3-rule-strong);
    border-radius: var(--ks3-r-card);
    background: var(--ks3-inset);
    text-align: center;
  }
  .dk-avatar {
    display: grid;
    place-items: center;
    border-radius: 14px;
    background: var(--ks3-accent);
    border: 2px solid var(--ks3-ink);
    font-family: var(--ks3-font-display);
    font-weight: 800;
  }
  .dk-pill {
    display: grid;
    place-items: center;
    min-width: 28px;
    height: 28px;
    padding: 0 8px;
    border-radius: 99px;
    background: var(--ks3-accent-text);
    color: #fff;
    font-family: var(--ks3-font-mono);
    font-weight: 500;
    font-size: 13px;
  }
  .dk-btn-ink {
    min-height: 54px;
    width: 100%;
    border: 2px solid var(--ks3-ink);
    border-radius: var(--ks3-r-control);
    background: var(--ks3-ink);
    color: var(--ks3-on-dark);
    font-weight: 700;
    font-size: 18px;
    cursor: pointer;
  }
  .dk-btn-quiet {
    border: 0;
    background: none;
    padding: 0;
    font-weight: 700;
    font-size: 15px;
    color: var(--ks3-accent-text);
    cursor: pointer;
  }
  .dk-field {
    margin-top: 6px;
    display: block;
    width: 100%;
    box-sizing: border-box;
    min-height: 48px;
    padding: 10px 14px;
    border: 2px solid var(--ks3-option-border);
    border-radius: var(--ks3-r-control);
    background: var(--ks3-card);
    font-size: 17px;
    color: var(--ks3-ink);
  }
  .dk-tile {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 16px;
    border: 2px solid var(--ks3-ink);
    border-radius: var(--ks3-r-card);
    background: var(--ks3-card);
    color: var(--ks3-ink);
    text-decoration: none;
    text-align: left;
    cursor: pointer;
  }
  .dk-tile:hover { text-decoration: none; color: var(--ks3-ink); }
  .dk-tile-sub { font-size: 14px; color: var(--ks3-ink-muted); }
  .dk-mini {
    padding: 12px;
    border-radius: 14px;
    background: var(--ks3-band);
  }
  .dk-mini-l {
    font-family: var(--ks3-font-mono);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ks3-ink-muted);
  }
  .dk-mini-n {
    margin-top: 4px;
    font-family: var(--ks3-font-display);
    font-weight: 800;
    font-size: 24px;
    letter-spacing: -.02em;
    line-height: 1;
  }
  .dk-mini-s { font-size: 13px; color: var(--ks3-ink-muted); }
  .dk-row-band {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--ks3-band);
    font-size: 15px;
  }
  .dk-mono { font-family: var(--ks3-font-mono); font-weight: 500; }
  .dk-banner {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: var(--ks3-band);
    border-bottom: 2px solid var(--ks3-rule);
    font-size: 15px;
  }
  .dk-banner-alert {
    background: var(--ks3-alert-tint);
    border-bottom-color: var(--ks3-alert-border);
    color: var(--ks3-alert-text);
  }
  .dk-mobilehead {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px 14px;
    border-bottom: 2px solid var(--ks3-ink);
  }
  .dk-brandword {
    font-family: var(--ks3-font-display);
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -.02em;
  }
  .dk-main { max-width: 560px; margin: 0 auto; padding: 24px 20px 40px; }
  .dk-tabbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    border-top: 2px solid var(--ks3-ink);
    background: var(--ks3-card);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .dk-tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 10px 0 12px;
    border: 0;
    background: none;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
  }
  .dk-tab:hover { text-decoration: none; }

  /* ── Design's desktop layout, at her own 960 breakpoint ──────────────── */
  @media (min-width: 960px) {
    .dk-root { display: grid; grid-template-columns: 272px 1fr; padding-bottom: 0; }
    .dk-side {
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      box-sizing: border-box;
      border-right: 2px solid #221E1B;
      background: #FFFCF5;
      padding: 22px 20px 24px;
      overflow-y: auto;
    }
    .dk-mobilehead, .dk-tabbar, .dk-banner { display: none !important; }
    .dk-main { max-width: 1080px; padding: 44px 48px 80px; }
    .dk-cols { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 24px; align-items: start; }
    .dk-cards { display: grid !important; grid-template-columns: 1fr 1fr; flex-direction: unset !important; }
    .dk-narrow { max-width: 640px; }
    .dk-chat { min-height: calc(100vh - 200px) !important; }
    .dk-composer { position: static !important; }
    .dk-work { margin-top: 0 !important; }
  }
  </style>

<script src="/consumer/consumer-common.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   consumer/overview.html — six screens, one page. MRB-317, Night 3.

   Design drew overview / child / set work / chat / marked answers (+ detail)
   / settings as one component with a `screen` in its state, a bottom tab bar
   on a phone and a left sidebar from 960px up. This is that component, with
   every `const` in her file replaced by a real read.

   ── WHY ONE PAGE AND NOT SIX ───────────────────────────────────────────
   Because `GET /api/consumer/family` answers five of the six screens in one
   call. A parent tapping from the overview into a child, into their week,
   into a message, is moving inside data that is already in memory; six
   documents would refetch the family six times and lose the chat draft on
   every hop. The URL still carries the position — `?child=…&view=…` with
   `history.pushState` — so a screen is linkable, the browser Back button
   works, and a reload lands where the parent was.

   ── WHAT IS NOT INVENTED ───────────────────────────────────────────────
   Design's mock computes several sentences from numbers she made up: "20
   minutes on task" as `done × 15`, "usually logs in around 7.30pm",
   "Personal best on the last one", "Unit check next Friday", "£5.99". Every
   one of those is either computed from a real field here or DROPPED. A
   sentence on a page about somebody's child that nobody can trace to a
   source is worse than a shorter page. Each drop is listed in the run
   report; the shape and the voice of her copy are kept exactly.

   Prices come from `GET /api/consumer/pricing` (or the shared `pricing()`
   helper when the public lane's addition has landed). There is no price
   constant in this file.

   ── ACCESS vs BILLING ──────────────────────────────────────────────────
   `billing.state` chooses the banner Design drew. `billing.access` decides
   whether anything may be written, through `guard()`/`applyWritable()`.
   They are different words for different questions and a card that failed
   yesterday is `past_due` (billing) and still `full` (access).
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
  var C = window.MrBadmusConsumer;
  var esc = C.escapeHtml;

  /* ── Design's constants, kept as she wrote them ─────────────────────── */
  var YEARS  = [7, 8, 9, 10, 11];
  var BOARDS = ['AQA', 'Edexcel', 'OCR'];
  var TIERS  = ['Foundation', 'Higher', 'Not decided'];
  var ROUTES = ['Combined', 'Triple'];
  /* Her three intensities, keyed on the API's words. "Standard" is her
     label for what the backend calls `steady`; the label is hers and the
     key is the contract's, so neither has to bend. */
  var INTENSITY = {
    light:  { label: 'Light',    per: '2 a week' },
    steady: { label: 'Standard', per: '3 a week' },
    full:   { label: 'Full',     per: '4–5 a week' }
  };
  /* Her three kinds. Her second id was `retrieval`; the contract's word for
     the same thing is `practice`, so the id below is the contract's and the
     label and description are hers, verbatim. */
  var WORK_KINDS = [
    { id: 'lesson',   label: 'A lesson',        desc: 'A full 20-minute lesson on a topic.' },
    { id: 'practice', label: 'Quick questions', desc: 'Eight short recall questions, 10 minutes.' },
    { id: 'exam',     label: 'An exam question', desc: 'One 4- or 6-marker, marked instantly.' }
  ];
  var CHAT_STARTERS = ['How did today go?', 'Proud of you for keeping the streak.',
                       'Anything you want help with?'];
  var DAY_LABELS = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  var DUE_DAYS = ['Thu', 'Fri', 'Sat', 'Sun'];
  var DUE_DOW  = { Thu: 4, Fri: 5, Sat: 6, Sun: 0 };

  var MODE_TO_API = { school: 'alongside_school', home: 'home_education' };
  var MODE_FROM_API = { alongside_school: 'school', home_education: 'home' };

  var MARK = {
    tick:  '<path d="M5 12.5l4.5 4.5L19 7"/>',
    cross: '<path d="M6 6l12 12M18 6L6 18"/>',
    back:  '<path d="M15 5l-7 7 7 7"/>',
    home:  '<path d="M4 11l8-7 8 7v9H4z"/>',
    chat:  '<path d="M4 5h16v11H9l-5 4z"/>',
    user:  '<circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
    plus:  '<path d="M12 5v14M5 12h14"/>',
    send:  '<path d="M5 12h14M13 6l6 6-6 6"/>'
  };
  function svg(d, size) {
    return '<svg class="ks3-mark" viewBox="0 0 24 24" aria-hidden="true"' +
      (size ? (' style="width:' + size + 'px;height:' + size + 'px"') : '') + '>' + d + '</svg>';
  }

  /* ── formatting ─────────────────────────────────────────────────────── */
  var MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
                     'August', 'September', 'October', 'November', 'December'];
  /* Design's dates are en-GB "4 September". `toLocaleDateString` would give
     that too, but only on a machine whose locale agrees — and this is the
     date a parent reads as "when am I charged". Spelled out here so it is
     the same everywhere. Unparseable in, null out: a caller decides what an
     absent date is allowed to say, and nothing here guesses. */
  function dayMonth(iso) {
    if (!iso) { return null; }
    var d = new Date(iso);
    if (isNaN(d.getTime())) { return null; }
    return d.getDate() + ' ' + MONTHS_LONG[d.getMonth()];
  }
  function plusDaysISO(iso, n) {
    if (!iso) { return null; }
    var d = new Date(iso);
    if (isNaN(d.getTime())) { return null; }
    d.setDate(d.getDate() + n);
    return d.toISOString();
  }
  /* "yesterday, 7.40pm" — Design's shape for `lastActive`. */
  function whenLabel(iso) {
    if (!iso) { return null; }
    var d = new Date(iso);
    if (isNaN(d.getTime())) { return null; }
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var that = new Date(d); that.setHours(0, 0, 0, 0);
    var days = Math.round((today - that) / 86400000);
    var h = d.getHours(), m = d.getMinutes();
    var suffix = h < 12 ? 'am' : 'pm';
    h = h % 12; if (h === 0) { h = 12; }
    var time = h + '.' + (m < 10 ? '0' : '') + m + suffix;
    if (days === 0) { return 'today, ' + time; }
    if (days === 1) { return 'yesterday, ' + time; }
    if (days < 7) { return days + ' days ago, ' + time; }
    return dayMonth(iso) + ', ' + time;
  }
  function money(pence) { return C.money(pence); }

  /* Design's answer dates read "12 Sep". ⊕ FOUND BY DRIVING IT, 2 Sep 2026:
     `/children/:id/answers` sends `date` as a full ISO timestamp
     (`2026-09-02T06:00:04.169502+00:00`), not the short label the contract's
     example shows — and a raw timestamp on a parent's screen is not a date,
     it is a log line. So a value that parses as a date is SHOWN as one; a
     value that does not parse is passed straight through, because the
     backend may well start sending "12 Sep" and that is already right.
     Reported to the backend lane rather than papered over silently. */
  var MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                      'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function shortDate(v) {
    if (v == null || v === '') { return ''; }
    var s = String(v);
    if (!/^\d{4}-\d{2}-\d{2}/.test(s)) { return s; }
    var d = new Date(s);
    if (isNaN(d.getTime())) { return s; }
    return d.getDate() + ' ' + MONTHS_SHORT[d.getMonth()];
  }

  /* ── state ──────────────────────────────────────────────────────────── */
  var qs = new URLSearchParams(window.location.search);
  var S = {
    fam: null, parent: {}, billing: {}, kids: [],
    childId: qs.get('child') || null,
    view: qs.get('view') || 'overview',
    fromChild: false,
    answerId: null,
    answers: null, answersFor: null,
    picker: null, pickerFor: null,
    msgs: null, msgsFor: null, threads: null,
    readMarkedFor: null,
    workKind: 'practice', unitCode: null, due: 'Sat', note: '', draft: '',
    edit: null, newPass: '', confirmRemove: false,
    prices: null,
    writable: false,
    busy: ''
  };
  var ctx = null;
  var VIEWS = ['overview', 'child', 'setwork', 'chat', 'answers', 'manage'];

  function child() {
    if (!S.kids.length) { return null; }
    for (var i = 0; i < S.kids.length; i++) {
      if (String(S.kids[i].id) === String(S.childId)) { return S.kids[i]; }
    }
    return S.kids[0];
  }

  /* ── the URL is the position ────────────────────────────────────────── */
  function url() {
    var extra = {};
    var c = child();
    if (c) { extra.child = c.id; }
    if (S.view !== 'overview') { extra.view = S.view; }
    return C.href('/consumer/overview.html', extra);
  }
  function go(view, extra) {
    S.view = view;
    S.answerId = null;
    if (extra) { Object.keys(extra).forEach(function (k) { S[k] = extra[k]; }); }
    window.history.pushState({ view: S.view, child: S.childId }, '', url());
    window.scrollTo(0, 0);
    render();
    afterNav();
  }
  window.addEventListener('popstate', function () {
    var q2 = new URLSearchParams(window.location.search);
    var v = q2.get('view') || 'overview';
    S.view = VIEWS.indexOf(v) === -1 ? 'overview' : v;
    S.childId = q2.get('child') || S.childId;
    S.answerId = null;
    render();
    afterNav();
  });

  /* Each screen loads only what it needs, once. `C.section` never rejects,
     so a panel whose endpoint is down says so inside itself. */
  function afterNav() {
    var c = child();
    if (!c) { return; }
    if (S.view === 'setwork') { loadPicker(c); }
    if (S.view === 'chat')    { loadChat(c); }
    if (S.view === 'answers') { loadAnswers(c); }
  }

  /* ═══ loads ═══════════════════════════════════════════════════════════ */
  function loadFamily() {
    return C.api('/api/consumer/family', { token: ctx.token }).then(function (d) {
      d = d || {};
      S.fam = d.family || {};
      S.sub = d.subscription || null;
      S.parent = d.parent || {};
      S.billing = d.billing || {};
      S.kids = d.children || [];
      S.prefs = d.prefs || {};
      S.deletion = d.deletion || null;
      var g = C.guard(S.billing.access != null ? S.billing.access : S.billing, 'parent');
      S.writable = g.writable;
      if (!S.childId && S.kids.length) { S.childId = S.kids[0].id; }
      return d;
    });
  }

  /* Prices: the shared helper when the public lane's addition has landed,
     the route itself otherwise. Either way this file holds no price. */
  function loadPrices() {
    if (S.prices) { return Promise.resolve(S.prices); }
    var p = (C.pricing ? C.pricing() : C.api('/api/consumer/pricing'));
    return Promise.resolve(p).then(function (d) { S.prices = d || null; return S.prices; })
      .catch(function () { S.prices = null; return null; });
  }
  function tier(interval) {
    var t = S.prices && S.prices.tiers;
    if (!t) { return null; }
    return t[interval === 'year' ? 'year' : 'month'] || null;
  }

  function loadThreads() {
    return C.api('/api/consumer/chat/threads', { token: ctx.token })
      .then(function (d) { S.threads = (d && d.threads) || []; })
      .catch(function () { S.threads = null; });
  }
  function threadFor(id) {
    if (!S.threads) { return null; }
    for (var i = 0; i < S.threads.length; i++) {
      if (S.threads[i].with && String(S.threads[i].with.id) === String(id)) { return S.threads[i]; }
    }
    return null;
  }

  function loadPicker(c) {
    if (S.pickerFor === c.id) { return Promise.resolve(); }
    S.pickerFor = c.id;
    return C.api('/api/consumer/children/' + encodeURIComponent(c.id) + '/picker',
                 { token: ctx.token })
      .then(function (d) {
        S.picker = (d && d.units) || [];
        if (!S.unitCode && S.picker.length) { S.unitCode = S.picker[0].unit_code; }
        if (S.view === 'setwork') { render(); }
      })
      .catch(function (e) {
        S.picker = { error: e.message };
        if (S.view === 'setwork') { render(); }
      });
  }

  function loadAnswers(c) {
    if (S.answersFor === c.id && S.answers) { return Promise.resolve(); }
    S.answersFor = c.id;
    S.answers = null;
    return C.api('/api/consumer/children/' + encodeURIComponent(c.id) + '/answers',
                 { token: ctx.token })
      .then(function (d) {
        S.answers = (d && d.answers) || [];
        if (S.view === 'answers') { render(); }
      })
      .catch(function (e) {
        S.answers = { error: e.message };
        if (S.view === 'answers') { render(); }
      });
  }

  function loadChat(c, force) {
    if (!force && S.msgsFor === c.id && S.msgs) { return Promise.resolve(); }
    S.msgsFor = c.id;
    return C.api('/api/consumer/chat/messages?with=' + encodeURIComponent(c.id) + '&limit=50',
                 { token: ctx.token })
      .then(function (d) {
        S.msgs = (d && d.messages) || [];
        if (S.view === 'chat') { renderChatList(); markRead(c); }
      })
      .catch(function (e) {
        S.msgs = { error: e.message };
        if (S.view === 'chat') { renderChatList(); }
      });
  }

  /* Once, on open. Firing it on every poll would keep marking read the
     messages that arrived while the parent was on another tab — which is
     exactly how a parent misses one. */
  function markRead(c) {
    if (S.readMarkedFor === c.id) { return; }
    S.readMarkedFor = c.id;
    C.api('/api/consumer/chat/read', { method: 'POST', token: ctx.token, body: { with: c.id } })
      .then(function () {
        c.unread = 0;
        renderShell();
      })
      .catch(function (e) { console.error('[dash/chat-read]', e); });
  }

  /* ═══ derived values — Design's `renderVals`, over real fields ════════ */
  function modeLabel(m) {
    return m === 'home_education' || m === 'home' ? 'Home education' : 'Alongside school';
  }
  function workOf(k) { return Array.isArray(k.work) ? k.work : []; }
  function doneOf(k) { return workOf(k).filter(function (w) { return w.done; }).length; }

  function cardHeadline(k) {
    var w = workOf(k), done = doneOf(k), n = w.length;
    if (k.status === 'quiet') {
      var left = n - done;
      /* Design wrote "Two sessions due by Sunday"; the number is real here. */
      return 'Nothing done yet this week. ' + left +
             (left === 1 ? ' session' : ' sessions') + ' due by Sunday.';
    }
    if (n && done >= n) {
      /* Her sentence ended "Unit check next Friday." Next week's plan is not
         in this payload, so the claim is dropped rather than guessed. */
      return 'Week complete.';
    }
    var next = null;
    for (var i = 0; i < w.length; i++) { if (!w[i].done) { next = w[i]; break; } }
    return done + ' of ' + n + ' done. Next: ' + (next && next.title ? next.title : '—') + '.';
  }

  function scoresOf(k) { return Array.isArray(k.scores) ? k.scores : []; }

  function betterSummary(k) {
    var sc = scoresOf(k);
    if (!sc.length) { return ''; }
    var first = sc[0].pct, last = sc[sc.length - 1].pct;
    var best = sc.reduce(function (m, s) { return Math.max(m, s.pct); }, -1);
    var verb = last > first ? 'have climbed' : 'have gone';
    var line = 'Unit checks ' + verb + ' from ' + first + '% to ' + last + '% over the term.';
    if (sc.length > 1 && last >= best) { line += ' Personal best on the last one.'; }
    return line;
  }

  function doingSummary(k) {
    var w = workOf(k), done = doneOf(k);
    var mins = w.reduce(function (t, it) {
      return t + (it.done && it.mins != null && !isNaN(Number(it.mins)) ? Number(it.mins) : 0);
    }, 0);
    /* Design's third sentence was "Usually logs in around 7.30pm" — a habit
       nothing records. The slot keeps a fact we do hold. */
    var line = done + ' of ' + w.length + ' sessions done so far this week, ' +
               mins + ' minutes on task.';
    var last = whenLabel(k.lastActive);
    if (last) { line += ' Last active ' + last + '.'; }
    return line;
  }

  function nudgeLine(k) {
    if (k.status === 'never') {
      return k.first_name + ' hasn’t started. A message from you is the first thing ' +
             'they’ll see when they log in.';
    }
    if (k.status === 'quiet') {
      return 'Quiet week so far. A short message from you usually does more than a ' +
             'reminder from us.';
    }
    var t = threadFor(k.id);
    /* Her "last replied Tuesday evening" is real when the thread has an
       inbound message; when it does not, the clause is dropped. */
    if (t && t.last && t.last.mine === false && t.last.time) {
      return k.first_name + ' last replied ' + t.last.time + '. Messages land on their ' +
             'Today screen.';
    }
    return 'Messages land on ' + k.first_name + '’s Today screen.';
  }

  function metaLine(k) {
    var bits = ['Year ' + k.year_group];
    if (k.exam_board) { bits.push(k.exam_board); }
    if (k.pathway) { bits.push(k.pathway.charAt(0).toUpperCase() + k.pathway.slice(1)); }
    bits.push(modeLabel(k.mode));
    if (k.username) { bits.push('@' + k.username); }
    return bits.join(' · ');
  }

  /* ═══ shell: sidebar, header, banners, tab bar ════════════════════════ */
  var TITLES = { overview: '', child: '', setwork: 'Set work', chat: '', answers: 'Marked answers', manage: 'Settings' };
  function screenTitle() {

    return TITLES[S.view] || '';

    return S.kids.reduce(function (n, k) { return n + (k.unread || 0); }, 0);

  function bannerHtml() {
    var b = S.billing, st = String(b.state || '').toLowerCase();
    var account = esc(C.href('/consumer/account.html'));
    if (st === 'trialing') {
      var end = dayMonth(b.trial_end);
      var days = b.days_left;
      return '<div class="dk-banner"><span style="flex:1"><strong>Free week:</strong> ' +
        (days != null ? (esc(String(days)) + (days === 1 ? ' day' : ' days') + ' left.') : 'in progress.') +
        (end ? (' First payment ' + esc(end) + '.') : '') +
        '</span><a href="' + account + '" style="font-weight:700;white-space:nowrap">Billing</a></div>';
    }
    if (st === 'past_due') {
      /* ⚠️ MIDE'S RULING, MRB-317. Design's banner counted days of grace
         ("{{graceDays}} more days"). A countdown on a page about somebody's
         card is the one number a parent will misremember; the DATES are what
         they can act on, and they are what the failed-payment email says
         too. So: retry date and the date access turns read-only, never a
         day count. `retry_at` is Stripe's own next attempt; the grace end is
         `current_period_end + 7 days`, which is where `org_access_state()`
         drops the family to read_only. */
      var retry = dayMonth(b.retry_at);
      var grace = dayMonth(plusDaysISO(S.sub && S.sub.current_period_end, 7));
      var mid = '';
      if (retry) { mid += ' We try again on ' + esc(retry) + '.'; }
      if (grace) { mid += ' Work carries on until ' + esc(grace) + ' while you update the card.'; }
      return '<div class="dk-banner dk-banner-alert"><span style="flex:1">' +
        '<strong>Payment didn’t go through.</strong>' + mid +
        '</span><a href="' + account + '" style="font-weight:700;white-space:nowrap">Fix card</a></div>';
    }
    if (st === 'cancelled') {
      /* ⊕ TWO CANCELLED STATES, AND ONLY `access` TELLS THEM APART.
         The real Stripe path is cancel-at-period-end: the subscription stays
         `active` with `cancel_at_period_end: true`, and the family keeps FULL
         access — new work, marking, messages — until the period ends. Only
         when Stripe actually cancels does the row become `canceled` and the
         access drop to read_only. `billingFor` presents both as
         `state: 'cancelled'`, so the billing word cannot separate them and
         branching on it would tell a family who has paid to the end of the
         month that their work has already stopped.
         So: `access` decides the sentence. Design's original wording is the
         `full` branch — it was right for the case she was drawing. */
      var ae = dayMonth(b.access_end);
      var body = String(b.access || '') === 'full'
        ? ('<strong>Cancelled.</strong> ' +
           (ae ? ('Everything works until ' + esc(ae) + '. ') : '') +
           'Reports stay downloadable after that.')
        : ('<strong>Cancelled.</strong> You can read everything' +
           (ae ? (' until ' + esc(ae)) : '') +
           ', but new work and messages are paused. Reports stay downloadable after that.');
      return '<div class="dk-banner"><span style="flex:1">' + body + '</span>' +
        '<a href="' + account + '" style="font-weight:700;white-space:nowrap">Resume</a></div>';
    }
    return '';
  }

  function intensityLabel(k) {
    var i = INTENSITY[k.intensity] || null;
    return i ? (i.label + ' · ' + i.per) : 'How much a week';
  }
  function answersMeta(k) {
    var n = (S.answersFor === k.id && Array.isArray(S.answers)) ? S.answers.length : null;
    var left = k.humanLeft;
    if (n === 0) { return 'None yet'; }
    var bits = [];
    /* Design said "N this term"; the endpoint returns the 100 most recent
       and is not term-scoped, so the word "term" is not claimed. */
    if (n != null) { bits.push(n + (n === 1 ? ' answer' : ' answers')); }
    if (left != null) { bits.push(left + ' human mark' + (left === 1 ? '' : 's') + ' left'); }
    return bits.length ? bits.join(' · ') : 'Marked against the mark scheme';
  }

          esc(m.time || C.fmtTime(m.created_at)) + '</span></div>';

    if (wrap) { window.scrollTo(0, document.body.scrollHeight); }
  }

  function viewAnswers() {

      var a = null;
      for (var i = 0; i < list.length; i++) { if (String(list[i].id) === String(S.answerId)) { a = list[i]; } }

        'Mr Badmus for a human mark.' +
        (k.humanLeft != null

          : '') + '</p>';

      '<div style="margin-top:20px;display:flex;flex-direction:column;gap:12px">' +
      list.map(function (a) {
        var status = a.human ? 'Marked by Mr Badmus' : (a.waiting ? 'With Mr Badmus' : 'Instant mark');
        var border = a.human ? 'var(--ks3-ink)' : 'var(--ks3-rule-strong)';
        var bg = a.human ? 'var(--ks3-ink)' : 'var(--ks3-band)';
        var fg = a.human ? 'var(--ks3-on-dark)' : 'var(--ks3-ink-muted)';
        var score = a.human ? ((a.humanScore || '') + ' · Mr Badmus') : (a.aiScore || '');
        return '<button data-act="open-answer" data-id="' + esc(a.id) + '" ' +
          'style="text-align:left;display:block;width:100%;padding:16px 18px;' +

          'box-shadow:var(--ks3-shadow-card);color:var(--ks3-ink);cursor:pointer">' +
          '<div style="display:flex;align-items:center;gap:10px">' +

           '<p style="margin:0;font-weight:700;font-size:17px">Remove ' + esc(k.first_name) + '?</p>' +
           '<p style="margin:8px 0 0;font-size:15px;color:var(--ks3-ink-body)">Their login stops ' +
             'working today. ' + esc(removeBilling()) + ' Their reports and marked answers stay in ' +

           '<div style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px">' +

             '<button data-act="do-remove" data-write style="min-height:46px;' +
               'border:2px solid var(--ks3-ink);border-radius:var(--ks3-r-control);background:var(--ks3-ink);' +
               'color:var(--ks3-on-dark);font-weight:700;font-size:15px;cursor:pointer">Remove</button>' +
           '</div></div>')
        : ('<button class="dk-btn-quiet" data-act="ask-remove">Remove ' + esc(k.first_name) +
           ' from the account</button>')) +

    return html;

  function removeBilling() {
    if (S.kids.length > 1) {
      var t = tier(S.billing.interval);
      return t ? ('Your next bill drops by ' + money(t.rest) + '.') : 'Your next bill goes down.';
    }
    return 'With no children left, the subscription is cancelled at the end of this period.';
  }

  function noChild() {
    return '<div class="dk-narrow"><p class="dk-kicker dk-kicker-page">Nothing to show</p>' +
      '<h1 class="dk-h1">No child selected</h1>' +
      '<p style="margin:12px 0 0;font-size:16px;color:var(--ks3-ink-body)">Go back to your family ' +
      'and choose one.</p></div>';
  }

  /* ═══ render ══════════════════════════════════════════════════════════ */
  function render() {
    renderShell();
    var st = String(S.billing.state || '').toLowerCase();
    var host = document.getElementById('c-main');
    /* Design's locked screen REPLACES the dashboard. It replaces the
       DASHBOARD — the overview — and not the reports, answers and chat
       history its own copy promises are "still yours". Reaching those from
       the locked screen therefore works, read-only. */
    if ((st === 'locked' || st === 'none') && S.view === 'overview') {
      host.style.maxWidth = '';
      host.innerHTML = viewLocked();
    } else if (S.view === 'child')   { host.innerHTML = viewChild(); }
    else if (S.view === 'setwork')   { host.innerHTML = viewSetWork(); }
    else if (S.view === 'chat')      { host.innerHTML = viewChat(); renderChatList(); }
    else if (S.view === 'answers')   { host.innerHTML = viewAnswers(); }
    else if (S.view === 'manage')    { host.innerHTML = viewManage(); }
    else                             { host.innerHTML = viewOverview(); }

    if (S.view === 'answers' && S.answers && S.answers.error) {
      C.fail(document.getElementById('dk-answers-fail'), S.answers.error,
             'Exam marking may not be switched on for this environment yet.');
    }
    C.applyWritable(host, S.writable);
    bindInputs();
  }

  /* Inputs keep their value in state so a re-render never loses a half-typed
     message, and they do NOT re-render on every keystroke — a page that
     rebuilds itself per character loses the caret. */
  function bindInputs() {
    var d = document.getElementById('dk-draft');
    if (d) {
      d.addEventListener('input', function () { S.draft = d.value; });
      d.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); send(); }
      });
    }
    var n = document.getElementById('dk-note');
    if (n) { n.addEventListener('input', function () { S.note = n.value; }); }
    var nm = document.getElementById('dk-name');
    if (nm) { nm.addEventListener('input', function () { S.edit.first_name = nm.value; }); }
  }

  function msg(text, kind) {
    var el = document.getElementById('dk-msg');
    if (!el) { return; }
    if (!text) { el.innerHTML = ''; return; }
    var alert = kind === 'error';
    el.innerHTML = '<div style="margin-top:16px;padding:12px 15px;border:2px solid ' +
      (alert ? 'var(--ks3-alert-border)' : 'var(--ks3-ok)') + ';border-radius:var(--ks3-r-panel);' +
      'background:' + (alert ? 'var(--ks3-alert-tint)' : 'var(--ks3-ok-tint)') + ';color:' +
      (alert ? 'var(--ks3-alert-text)' : 'var(--ks3-ok-text)') + ';font-size:15px">' +
      esc(text) + '</div>';
  }

  /* ═══ actions ═════════════════════════════════════════════════════════ */
  function childPath(suffix) {
    return '/api/consumer/children/' + encodeURIComponent(child().id) + suffix;
  }

  function reloadFamily() {
    return loadFamily().then(function () { render(); });
  }

  function send() {
    var k = child();
    var text = (S.draft || '').trim();
    if (!text) { return; }
    S.draft = '';
    var input = document.getElementById('dk-draft');
    if (input) { input.value = ''; }
    C.api('/api/consumer/chat/send', {
      method: 'POST', token: ctx.token, body: { to: k.id, text: text }
    }).then(function () { return loadChat(k, true); })
      .catch(function (e) { S.draft = text; if (input) { input.value = text; } msg(e.message, 'error'); });
  }

  function checkout(interval) {
    C.api('/api/consumer/checkout', {
      method: 'POST', token: ctx.token, body: { interval: interval || 'month' }
    }).then(function (d) {
      if (d && d.url) { window.location.href = d.url; return; }
      msg('We couldn’t open the payment page. Please try again in a moment.', 'error');
    }).catch(function (e) {
      if (e.code === 'no_children') {
        return msg('Add a child first — the subscription is priced per child, so there’s nothing ' +
                   'to start yet.', 'error');
      }
      msg(e.message, 'error');
    });
  }

  var ACTS = {
    'tab-home': function () { go('overview'); },
    'tab-chat': function () { S.readMarkedFor = null; go('chat', { fromChild: false }); },
    'back': function () {
      if (S.view === 'answers' && S.answerId) { S.answerId = null; return render(); }
      if (S.view === 'child' || (S.view === 'chat' && !S.fromChild)) { return go('overview'); }
      go('child');
    },
    'open-child': function (el) { S.childId = el.getAttribute('data-id'); go('child'); },
    'open-chat': function () { S.readMarkedFor = null; go('chat', { fromChild: true }); },
    'open-setwork': function () { go('setwork'); },
    'open-answers': function () { go('answers'); },
    'open-manage': function () { S.edit = null; S.newPass = ''; S.confirmRemove = false; go('manage'); },
    'open-answer': function (el) { S.answerId = el.getAttribute('data-id'); render(); window.scrollTo(0, 0); },
    'starter': function (el) {
      S.draft = el.getAttribute('data-text');
      var d = document.getElementById('dk-draft');
      if (d) { d.value = S.draft; d.focus(); }
    },
    'send': function () { send(); },
    'checkout': function () { checkout('month'); },

    'pick-kind': function (el) { S.workKind = el.getAttribute('data-id'); render(); },
    'pick-unit': function (el) { S.unitCode = el.getAttribute('data-id'); render(); },
    'pick-due':  function (el) { S.due = el.getAttribute('data-id'); render(); },

    'pick-intensity': function (el) { S.edit.intensity = el.getAttribute('data-id'); render(); },
    'pick-year':  function (el) { S.edit.year_group = Number(el.getAttribute('data-id')); render(); },
    'pick-board': function (el) { S.edit.exam_board = el.getAttribute('data-id'); render(); },
    'pick-route': function (el) { S.edit.pathway = el.getAttribute('data-id'); render(); },
    'pick-tier':  function (el) { S.edit.tier = el.getAttribute('data-id') || null; render(); },
    'pick-mode':  function (el) { S.edit.mode = el.getAttribute('data-id'); render(); },

    'ask-remove':    function () { S.confirmRemove = true; render(); },
    'cancel-remove': function () { S.confirmRemove = false; render(); },

    'pause': function (el) {
      var k = child(), want = !k.paused;
      C.setBusy(el, true, 'Saving…');
      C.api(childPath('/pause'), { method: 'POST', token: ctx.token, body: { paused: want } })
        .then(function () { return reloadFamily(); })
        .then(function () {
          msg(want
            ? (child().first_name + '’s plan is paused. Nothing new will be set until you start it again.')
            : (child().first_name + '’s plan is running again.'), 'ok');
        })
        .catch(function (e) { C.setBusy(el, false); msg(e.message, 'error'); });
    },

    'remove-work': function (el) {
      var id = el.getAttribute('data-id');
      C.setBusy(el, true, '…');
      C.api(childPath('/work/' + encodeURIComponent(id)), { method: 'DELETE', token: ctx.token })
        .then(function () { return reloadFamily(); })
        .then(function () { msg('Taken off their week.', 'ok'); })
        .catch(function (e) {
          C.setBusy(el, false);
          /* The contract's 409: a done item is a record and is never
             removable. Say that, not the code. */
          msg(e.code === 'not_removable'
            ? 'That one is already done, so it stays on the record.'
            : e.message, 'error');
        });
    },

    'submit-work': function (el) {
      var k = child();
      if (!S.unitCode) { return msg('Choose a topic first.', 'error'); }
      var body = { kind: S.workKind, unit_code: S.unitCode, scheduled_for: dueDate(S.due) };
      if (S.note) { body.note = S.note; }
      C.setBusy(el, true, 'Setting…');
      C.api(childPath('/work'), { method: 'POST', token: ctx.token, body: body })
        .then(function () { S.note = ''; return reloadFamily(); })
        .then(function () {
          go('child');
          msg('Set. ' + k.first_name + ' will see it with your name on it.', 'ok');
        })
        .catch(function (e) { C.setBusy(el, false); msg(e.message, 'error'); });
    },

    'reset-pass': function (el) {
      /* `{}` asks the backend to generate one and hand it back ONCE
         (night3-api §C6). It is never stored here and never emailed. */
      C.setBusy(el, true, 'Making one…');
      C.api(childPath('/password'), { method: 'POST', token: ctx.token, body: {} })
        .then(function (d) {
          if (d && d.password) { S.newPass = d.password; render(); return; }
          C.setBusy(el, false);
          msg('The new password wasn’t returned, so there is nothing to show you. ' +
              'Please try again.', 'error');
        })
        .catch(function (e) { C.setBusy(el, false); msg(e.message, 'error'); });
    },

    'save-manage': function (el) {
      var k = child(), e = S.edit;
      var body = {
        first_name: e.first_name, year_group: e.year_group, mode: e.mode,
        intensity: e.intensity
      };
      if (Number(e.year_group) >= 10) {
        body.exam_board = e.exam_board;
        body.tier = e.tier;
        body.pathway = e.pathway;
      }
      var replan = String(e.year_group) !== String(k.year_group) || e.mode !== k.mode;
      var cursors = (k.position && k.position.cursors) || null;
      C.setBusy(el, true, 'Saving…');
      C.api('/api/consumer/children/' + encodeURIComponent(k.id), {
        method: 'PATCH', token: ctx.token, body: body
      }).then(function () {
        /* Year and mode change which scheme of work the child is on, so the
           cursors have to be re-anchored against the new one. Sending the
           cursors back is what does that: the route clamps each to the new
           scheme's length and returns fresh labels. Nothing already done is
           touched. */
        if (replan && cursors && Object.keys(cursors).length) {
          return C.api(childPath('/position'), {
            method: 'POST', token: ctx.token, body: { cursors: cursors }
          }).catch(function (err) { console.error('[dash/position]', err); });
        }
      }).then(function () {
        S.edit = null;
        return reloadFamily();
      }).then(function () {
        go('child');
        msg('Saved.', 'ok');
      }).catch(function (err) { C.setBusy(el, false); msg(err.message, 'error'); });
    },

    'do-remove': function (el) {
      var k = child();
      C.setBusy(el, true, 'Removing…');
      C.api('/api/consumer/children/' + encodeURIComponent(k.id), {
        method: 'DELETE', token: ctx.token
      }).then(function () {
        S.childId = null;
        S.confirmRemove = false;
        S.edit = null;
        return loadFamily();
      }).then(function () {
        go('overview');
        msg(k.first_name + ' has been removed.', 'ok');
      }).catch(function (e) { C.setBusy(el, false); msg(e.message, 'error'); });
    }
  };

  /* The four due-day labels Design drew, resolved to the next real date each
     one names. On a Wednesday "Thu" is tomorrow; on a Friday it is next
     Thursday. Never a date in the past — work set for yesterday is work
     nobody will see. */
  function dueDate(label) {
    var want = DUE_DOW[label];
    var d = new Date();
    d.setHours(12, 0, 0, 0);
    var add = (want - d.getDay() + 7) % 7;
    d.setDate(d.getDate() + add);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  document.getElementById('dk-root').addEventListener('click', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!el) { return; }
    var act = ACTS[el.getAttribute('data-act')];
    if (!act) { return; }
    ev.preventDefault();
    act(el);
  });

  /* ═══ boot ════════════════════════════════════════════════════════════ */
  C.boot({ requireSession: true, run: function (context) {
    ctx = context;
    if (VIEWS.indexOf(S.view) === -1) { S.view = 'overview'; }

    /* ONE binding, `event: '*'`. Two bindings on one channel subscribe
       cleanly and deliver nothing — see subscribeMessages(). */
    var rt = C.subscribeMessages(ctx.sb, function (row) {
      if (!row) { return; }
      var k = child();
      var forOpenChild = k && (String(row.sender_id) === String(k.id) ||
                               String(row.recipient_id) === String(k.id));
      if (forOpenChild && S.view === 'chat') { loadChat(k, true); return; }
      /* Not the open thread: the badge counts still have to move, and the
         family read is what owns them. */
      loadFamily().then(renderShell).catch(function () {});
    });
    window.addEventListener('beforeunload', function () { rt.unsubscribe(); });

    return Promise.all([loadFamily(), loadPrices()])
      .then(function () {
        render();
        afterNav();
        return loadThreads().then(function () { if (S.view === 'child') { render(); } });
      })
      .catch(function (e) {
        C.fail(document.getElementById('c-main'), e.message,
               'Refresh in a moment. If it keeps happening, email support@mrbadmus.com.');
      });
  } });
})();
</script>
