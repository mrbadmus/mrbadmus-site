     false, cards: false })`) and is why the name is plural. It is
     wired to the sheet's close button AND to the overlay's, and the
     two are mutually exclusive by construction — `openCards` clears
     `account` and `openAccount` clears `cards` — so closing both is
     never closing something the student wanted left open. */
  closeAll = () => this.setState({ account: false, cards: false });

  /* THE DECK IS DATA AND IS READ THROUGH `MRB_DATA` LIKE EVERYTHING
     ELSE. Design's `deck()` returns six authored sample cards; ours
     returns whatever `shared/student-live.js` built from the lessons
     this class has covered, already ranked. There is no length cap
     anywhere in here: a class that has covered twenty lessons gets
     every card those lessons carry. */
  benchDeck() {
    var d = MRB_DATA('cards');
    return (d && d.length) ? d : [];
  }

  /* ⚠️ AN EMPTY DECK MUST NOT OPEN AN EMPTY OVERLAY. A surface with
     a counter reading 00 / 00 and a Reveal button over nothing is
     worse than a card that says what is true and waits. */
  openCards = (e) => {
    if (e && e.preventDefault) { e.preventDefault(); }
    if (!this.benchDeck().length) { return; }
    this.setState({ cards: true, account: false, flipped: false, recall: false });
  };

  /* REVEALING A CARD IS WHAT COUNTS AS SEEING IT, and flipping past
     one is not. The count feeds the least-seen half of the ranking
     (see `rankForPractice` in shared/student-live.js), so counting a
     card the student never turned over would push a card they have
     not practised to the back of tomorrow's deck.

     Through the sink, lazily, like every other write: on the fixture
     there is no sink, `_sinkCall` returns null, and Design's file
     behaves exactly as drawn. */
  flipCard = () => {
    const deck = this.benchDeck();
    if (!deck.length) { return; }
    const showing = !this.state.flipped;
    this.setState({ flipped: showing });
    if (!showing) { return; }
    const n = deck.length;
    const at = deck[((this.state.idx % n) + n) % n];
    if (at && at.id) { _sinkCall('cardSeen', at.id); }
  };

  /* Design's own `next`: forward one, face down. The modulo lives in
     `cardVals` below, so this can add without bound and the deck
     wraps — which is what Design drew and what a revision stack
     should do. */
  nextCard = () => this.setState((p) => ({ idx: p.idx + 1, flipped: false }));

  /* ⚠️ THE PIP ROW DROPS PAST TWENTY-FOUR CARDS, AND THE COUNTER DOES
     NOT. Design's row is `display:flex;gap:6px` inside a 390px panel
     with 18px of padding either side, so N pips are each
     (354 - 6(N-1)) / N pixels wide against a fixed height of 3px. At
     24 that is 9px — three times its own height, still legibly a bar
     with a 2px radius on each end. At 25 it goes under 3:1 and keeps
     shrinking; by 40 it is 3px, a square, and the row has stopped
     being a position and become texture.

     So past 24 the row is emitted EMPTY and disappears — the `<for>`
     renders nothing, the container has no children, and
     `[data-pip-row]:empty{display:none}` in build_student_port.py
     takes the 16px flex gap with it. `stackPos` is untouched at any
     length, so the student always knows where they are; what goes is
     the graphic that could no longer say it. */
  PIP_MAX = 24;

  cardVals() {
    const s = this.state;
    const deck = this.benchDeck();
    const n = deck.length;
    const pad = (x) => (x < 10 ? '0' + x : '' + x);
    const idx = n ? (((s.idx % n) + n) % n) : 0;
    /* The empty card carries no tag, no topic and no back — nothing
       that would read as a card with content missing from it. Its
       front is the one honest sentence, supplied as data. */
    const card = n ? deck[idx]
      : { tag: '', topic: '', front: MRB_DATA('cardsEmpty'),
          back: '', mine: false };
    return {
      cardCount: pad(n),
      stackPos: n ? (pad(idx + 1) + ' / ' + pad(n)) : '',
      topFront: card.front,
      topMine: card.mine,
      card: card,
      /* ⚠️ `cardPips`, NOT Design's `pips` — the live recall
         round already owns that name in this same scope object,
         and it won. The grafted `<for>` is renamed to match by
         `SET_EXPR`; see the note beside it for what the collision
         actually rendered. */
      cardPips: (n && n <= this.PIP_MAX)
        ? deck.map((_, i) => ({ on: i <= idx ? '1' : '0' })) : [],
      flipOn: s.flipped ? '1' : '0',
      flipLabel: s.flipped ? 'Hide' : 'Reveal',
      flip: this.flipCard,
      next: this.nextCard,
      openCards: this.openCards,
      cardsOpen: s.cards
    };
  }

  /* PAINT AND TICK IN ONE PLACE, deliberately. The attribute on
     documentElement is what the six `[data-bench-theme]` rules key on;
     `state.theme` is what the six `data-on` values key on. They are
     two statements about one preference, and anything that moves one
     without the other leaves a page wearing damson with harbour
     ticked. This is also the path a FAILED WRITE takes back. */
  showBenchTheme = (t) => {
    if (typeof document !== 'undefined' && document.documentElement) {
      document.documentElement.setAttribute('data-bench-theme', t);
    }
    this.setState({ theme: t });
  };

  /* OPTIMISTIC, AND HONEST ABOUT FAILING.

     The paint happens first and the network is never waited on: a
     colour a student asked for has to arrive under their finger, not
     after a round trip to Frankfurt on a school wifi.

     ⚠️ WHAT HAPPENS WHEN THE WRITE FAILS IS A RULING, not an
     oversight. The tick is not decoration — it is the page saying
     THIS IS YOUR SAVED PREFERENCE. If the write did not land, that
     sentence is false, and it stays false until the student reloads
     tomorrow on a different machine and finds their theme gone with no
     idea when it went. So a failure puts the previous theme back —
     visibly, under their eye, in the moment they can simply press it
     again — and the page never claims a preference the database does
     not hold. The alternative (keep the colour, log the error) is the
     hand-in stamp defect this port already removed once: a false
     confirmation is worse than a visible failure, because it stops the
     student worrying about it.

     ⚠️ THERE IS DELIBERATELY NO "same theme, do nothing" SHORTCUT,
     and the first draft had one. It looks free and it is not, because
     the page's theme and the DATABASE's theme are not the same fact.
     A student who has never chosen sits on harbour with `bench_theme`
     NULL — no preference. Pressing HARBOUR is that student CHOOSING
     harbour, and with the shortcut in place it wrote nothing at all,
     so the row stayed NULL and their choice would silently follow the
     default the day the default moved. NULL means 'never chose'; it
     cannot also mean 'chose the thing that is currently default'.
     The cost of dropping it is one redundant PATCH of a few dozen
     bytes when a student presses the swatch they are already on.

     `ok === false` rather than a throw is the sink's own vocabulary:
     `_sinkCall` swallows exceptions by design, so the writer reports a
     refusal by RESOLVING false. A null return (no sink at all, which is
     every fixture and every gate) takes neither branch and the picker
     behaves exactly as Design's file does. */
  pickBenchTheme = (t) => {
    if (this.benchThemes.indexOf(t) < 0) { return; }
    const was = this.state.theme;
    this.showBenchTheme(t);
    const out = _sinkCall('saveBenchTheme', t);
    if (out && typeof out.then === 'function') {
      const back = () => this.showBenchTheme(was);
      out.then(function (ok) { if (ok === false) { back(); } }, back);
    }
  };
  pickWeek = (n) => this.setState((s) => ({ week: s.week === n ? null : n }));
  clearWeek = () => this.setState({ week: null });
  resetFilters = () => this.setState({ week: null, tab: 'all' });
  pickTab = (id) => this.setState({ tab: id });
  toggleRow = (id) => this.setState((s) => ({ open: s.open === id ? null : id }));
  toggleTask = (k) => this.setState((s) => ({ bench: Object.assign({}, s.bench, { [k]: !s.bench[k] }) }));
  pickBoardWeek = (w) => this.setState({ boardWeek: w });
  toggleSize = () => this.setState((s) => ({ boardSize: s.boardSize === 5 ? 10 : 5 }));

  /* Routes to /class/8r-sc1/assignments/:id, an existing platform page.
     Here it records the visit: task one ticks, as it would on return. */
  openAssignment = () => {
    /* ⊕ RULED 22 Aug 2026 — P1, extended by P4. The bench's
       primary button. It opens the assignment while there is one
       open, and revisits the lessons once the week is done — one
       button, one destination, both named by the data. */
    const href = MRB_DATA('benchPrimaryHref');
    if (href) { window.location.href = href; return; }
    this.setState((s) => ({ bench: Object.assign({}, s.bench, { t1: true }) }));
  };

  /* ⊕ 23 Aug 2026 — PHASE 3, part 3 of 5. The old round's METHODS,
     replaced by the amended round's. Every name below is Design's
     own, spelled Design's way, because Design's grafted markup is
     what resolves them: `build` looks an `if` up with a null miss
     list, so one letter out is a branch that renders NOTHING,
     silently, on a page whose build printed a graft and whose gates
     all stay green.

     ⚠️ AND NO GATE OPENS THIS SURFACE. `student_behaviour` requires
     every step of a drive to be performable on Design's ORIGINAL
     file, and pressing `Practise recall` there opens the round this
     unit retires — so the two files would diverge by a whole screen
     and the drive cannot be kept. The seven `Recall` drives are
     retired with it. `student_themes` is extended instead: it drives
     the port alone, needs no oracle, and is the one gate that CAN
     open the round. */

  /* THE ROUND IS min(5, POOL) — ruling P2, revised QUICKFIX-2026-08-24
     from Design's 6 to the ruled 5 — and the number is computed in ONE
     place so nothing can state a size it will not show. `practiceBank`
     arrives from student-live.js already ranked by `rankForPractice`;
     this file neither sorts it nor chooses from it, which is what keeps
     one definition of 'what should this student practise next' in one
     file.

     ⚠️ THE PROGRESS BAR'S SIX BUCKETS ARE UNCHANGED, AND STILL CORRECT.
     `qStep` below already scales `step / size` onto Design's six CSS
     buckets for any real size — built for the pool of four on 8r/Sc1,
     proved at 4, 6, 12 and 15 — so a round of five needs no further
     change there; it is the same generalisation doing the same job. */
  RECALL_MAX = 5;

  practiceBank() {
    var b = MRB_DATA('practiceBank');
    return (b && b.length) ? b : [];
  }

  recallSize() {
    return Math.min(this.RECALL_MAX, this.practiceBank().length);
  }

  /* NO REPEAT WITHIN A ROUND, STRUCTURALLY RATHER THAN BY CHECKING.
     A round is `size` CONSECUTIVE items of a bank of `length`, and
     `size` is `min(6, length)` — so the modulo can never come back
     round to an index it has already handed out. Design's own
     arithmetic, with the real size in place of Design's literal 6:
     Design writes `length: 6` over a bank of 8, which would repeat
     two questions in every round the moment a real bank was shorter
     than six. Round two starts where round one stopped, so a student
     with a long bank works THROUGH it rather than round the same
     six; with a bank of exactly `size` the same questions come back,
     which is the honest answer rather than a defect. */
  recallRound() {
    const bank = this.practiceBank();
    const size = this.recallSize();
    if (!size) { return []; }
    const start = ((this.state.rno - 1) * size) % bank.length;
    const out = [];
    for (var i = 0; i < size; i += 1) {
      out.push(bank[(start + i) % bank.length]);
    }
    return out;
  }

  /* ⚠️ AN EMPTY BANK MUST NOT OPEN AN EMPTY ROUND — the same rule
     `openCards` follows one surface over. It cannot normally be
     reached at all: `practiceLabel` is empty with no bank and its
     binding is marked `drop`, so the button is not on the page. This
     is the second lock, because the first one lives in another
     file. */
  openRecall = (e) => {
    if (e && e.preventDefault) { e.preventDefault(); }
    if (!this.recallSize()) { return; }
    this.setState({ recall: true, cards: false, account: false, menu: false });
  };
  closeRecall = () => this.setState({ recall: false });

  /* ⛔ NOTHING IS HANDED IN, AND THIS METHOD IS WHERE THAT IS TRUE
     OR NOT. There is no submission, no attempt row, no score and no
     network call of any kind anywhere in the round. The one thing a
     round writes is a per-device SEEN COUNT, in localStorage, which
     feeds the least-seen half of the ordering and is read by nothing
     a student or a teacher ever sees. */
  recallAdvance = (scored) => {
    const size = this.recallSize();
    this.setState((s) => {
      const last = s.rqi >= size - 1;
      const streak = scored ? s.rstreak + 1 : 0;
      return {
        rstreak: streak,
        /* ⊕ P2, CARRIED. A streak BREAKS only when there was one:
           getting the first question of a round wrong zeroes a
           streak that was already zero, and nothing was broken. */
        rbroke: s.rbroke || (!scored && s.rstreak > 0),
        rbest: Math.max(s.rbest, streak),
        rright: s.rright + (scored ? 1 : 0),
        rpick: null, rchecked: false,
        rqi: last ? s.rqi : s.rqi + 1,
        rdone: last,
        rrounds: last ? s.rrounds + 1 : s.rrounds
      };
    });
  };

  nextRecall = () => {
    const at = this.recallRound()[this.state.rqi];
    this.recallAdvance(!!at && this.state.rpick === at.answer);
  };
  skipRecall = () => this.recallAdvance(false);

  /* CHECKING IS WHAT COUNTS AS SEEING A QUESTION, and moving past
     one is not — the same distinction `flipCard` draws between
     revealing a card and flicking past it. Through the sink, lazily:
     on the fixture there is none, `_sinkCall` returns null, and
     Design's file behaves exactly as drawn. */
  checkRecall = () => {
    if (this.state.rchecked || this.state.rpick === null) { return; }
    this.setState({ rchecked: true });
    const at = this.recallRound()[this.state.rqi];
    if (at && at.id) { _sinkCall('questionSeen', at.id); }
  };

  /* Design's own `anotherRound`, with `rbroke` reset alongside the
     streak it belongs to — see the retired P2 note above for why
     that is the ruling being kept rather than bent. `rbest` and
     `rrounds` survive it: a student's best run, and how many rounds
     they have done, are facts about the sitting and not about a
     round. */
  anotherRound = () => this.setState((s) => ({
    rno: s.rno + 1, rqi: 0, rpick: null, rchecked: false,
    rright: 0, rdone: false, rstreak: 0, rbroke: false
  }));

  recallVals() {
    const s = this.state;
    const pad = (x) => (x < 10 ? '0' + x : '' + x);
    const size = this.recallSize();
    const round = this.recallRound();
    const at = Math.min(s.rqi, Math.max(0, size - 1));
    const qq = round[at];
    /* With no bank there is no surface: `openRecall` refuses and the
       button is not on the page. This is what stops a state reached
       some other way from indexing an empty array. */
    if (!size || !qq) {
      return {
        recallOpen: false, inRound: false, roundDone: false,
        q: { topic: '', q: '', note: '' }, opts: [], qpips: [],
        checked: false, canCheck: false, verdict: '',
        nextLabel: '', streakLabel: '', roundLabel: '',
        roundScore: '', qPos: '', qStep: '0',
        check: this.checkRecall, nextQ: this.nextRecall,
        skipQ: this.skipRecall, anotherRound: this.anotherRound,
        openRecall: this.openRecall, closeRecall: this.closeRecall
      };
    }
    const gotIt = s.rchecked && s.rpick === qq.answer;
    const optState = (i) => {
      if (!s.rchecked) { return s.rpick === i ? 'picked' : 'idle'; }
      if (i === qq.answer) { return 'correct'; }
      return s.rpick === i ? 'wrong' : 'idle';
    };
    const opts = (qq.options || []).map((label, i) => ({
      label: label, letter: 'ABCD'[i], st: optState(i),
      right: s.rchecked && i === qq.answer,
      pick: () => { if (!this.state.rchecked) { this.setState({ rpick: i }); } }
    }));
    /* ⚠️ THE LINE UNDER THE VERDICT IS THE ONE WRITTEN AGAINST THE
       ANSWER THE STUDENT GAVE, and it is empty when they were right.
       Design's amended sample carries ONE note per question and
       prints it whatever was picked; the real corpus carries a `why`
       per OPTION, and — measured across both content sources, and
       recorded in the 21 Aug ruling — the ones that exist are always
       the DISTRACTORS. The teaching in a multiple-choice question
       lands on the MISTAKE. A correct answer gets the verdict word
       and nothing beneath it, which is that ruling exactly, and the
       slot does not stand open because the verdict is in it. Both
       shapes are read, so the fixture keeps Design's behaviour byte
       for byte. */
    const note = Array.isArray(qq.notes)
      ? (s.rpick === null ? '' : (qq.notes[s.rpick] || ''))
      : (qq.note || '');
    /* ⚠️⚠️ THE PROGRESS BAR ASSUMES SIX, AND THE POOL DOES NOT.
       Design's grafted CSS carries `.rprog[data-w="0"]` … `["6"]` at
       0/17/33/50/67/83/100%, and Design's own logic feeds it the RAW
       step index — right for a round of six and wrong for every
       other length. With the real pool of FOUR on 8r/Sc1, a student
       who had answered all four would have seen a bar at 67%: the
       round complete, and the graphic saying it was not.

       The step is scaled onto Design's six buckets instead, so no
       CSS is added and Design's stylesheet is not touched: a round of
       six is unchanged (the scale is the identity), a round of four
       reads 0 / 33 / 50 / 83(*) / 100 and a round of two reads
       0 / 50 / 100 — both measured in the browser, not derived on
       paper. (*) 3 of 4 is 75%, which falls exactly between the 67%
       and 83% buckets, and `Math.round` takes the half upward. The
       buckets are 17 points apart and a 3px bar is not a readout;
       what matters is that the bar MOVES on every question and is
       FULL when the round is done, and both hold at every length.

       ⚑ AND IT NOW REACHES 100%, WHICH DESIGN'S NEVER DID. Design
       pins `qi` at the last question when the round ends, so the bar
       stopped at 83% over a finished round. The step here is the
       number of questions COMPLETED, which is the size once the
       round is done. */
    const step = s.rdone ? size : s.rqi;
    return {
      recallOpen: s.recall,
      inRound: s.recall && !s.rdone,
      roundDone: s.rdone,
      roundLabel: 'ROUND ' + pad(s.rno),
      /* Both of these STATE THE REAL SIZE, which is ruling P2's whole
         requirement. The two text nodes that used to spell it out in
         a WORD — `SIX QUESTIONS · UNLIMITED ROUNDS` and `OF SIX` —
         are retired with the old round's markup, so there is no
         wording left on the page that CAN be wrong about it. */
      roundScore: s.rright + ' / ' + size,
      qPos: pad(Math.min(s.rqi + 1, size)) + ' / ' + pad(size),
      qStep: String(Math.round((step / size) * 6)),
      qpips: round.map((_, i) => ({ on: i <= s.rqi ? '1' : '0' })),
      q: { topic: qq.topic, q: qq.q, note: note },
      opts: opts,
      checked: s.rchecked,
      canCheck: !s.rchecked,
      verdict: gotIt ? 'Correct.' : 'Not this time.',
      nextLabel: s.rqi >= size - 1 ? 'Finish the round' : 'Next question',
      /* ⊕ P2, CARRIED WHOLE. Three states and not two: nothing said
         before a streak exists, the count while one runs, and the
         word only once one has actually broken. Design's amended line
         prints `STREAK 00` in the first state, which is P2's defect
         in a politer font. */
      streakLabel: s.rstreak > 0 ? 'STREAK ' + pad(s.rstreak)
        : (s.rbroke ? 'STREAK BROKEN' : ''),
      check: this.checkRecall,
      nextQ: this.nextRecall,
      skipQ: this.skipRecall,
      anotherRound: this.anotherRound,
      openRecall: this.openRecall,
      closeRecall: this.closeRecall
    };
  }

  renderVals() {
    const st = this.state;
    const fresh = (this.props.classState ?? 'Work set') === 'Fresh class';
    const hideScores = this.props.hideScores ?? false;
    const forced = { 'Phone 360': 360, 'Phone 390': 390, 'Tablet 820': 820, 'Desktop 1460': 1460 }[this.props.layout ?? 'Auto'];
    const W = forced || st.w;

    /* Breakpoints. desk >= 1024 · tablet 720-1023 · phone < 720 */
    const desk = W >= 1024;
    const wide = W >= 720;
    const narrow = !wide;
    const onClass = st.view === 'class';
    const dash = '\u2014';
    const pad = (n) => (n < 10 ? '0' + n : String(n));
    const pc = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '0%');
    const all = fresh ? [] : this.work;

    const marked = all.filter((w) => w.status === 'marked');
    const handed = all.filter((w) => w.status === 'marked' || w.status === 'pending');
    const onTime = handed.filter((w) => !w.late).length;
    const avg = marked.length ? Math.round(marked.reduce((s, w) => s + w.score, 0) / marked.length) : null;

    const readings = ([
      { label: MRB_DATA('handedLabel'), value: all.length ? handed.length + '/' + all.length : dash, caption: 'THIS TERM', pct: pc(handed.length, all.length) },
      { label: 'On time', value: handed.length ? onTime + '/' + handed.length : dash, caption: MRB_DATA('handedCaption'), pct: pc(onTime, handed.length), bar: 'var(--ks3-ok)' },
      { label: 'Avg score', value: avg == null ? dash : avg + '%', caption: marked.length ? marked.length + ' MARKED' : 'NOT MARKED YET', pct: avg == null ? '0%' : avg + '%' },
      { label: MRB_DATA('practiceTileLabel'), value: fresh ? '0' : MRB_DATA('practiceAnswered'), caption: 'ANSWERED \u00B7 WK ' + MRB_DATA('weekNumber'), pct: fresh ? '0%' : MRB_DATA('practicePct') }
    ]).map((r) => Object.assign({ bar: 'var(--st-accent)' }, r));

    const weeks = [];
    for (let n = 1; n <= 12; n++) {
      const items = all.filter((w) => w.week === n);
      const sel = st.week === n;
      weeks.push({
        num: pad(n), onClick: () => this.pickWeek(n),
        trough: n <= MRB_DATA('currentWeek') ? 'var(--st-rule-fact)' : 'var(--st-crumb-bg)',
        stackH: !items.length ? '0%' : items.length > 1 ? '100%' : '70%',
        /* ⊕ RULED 23 Aug 2026 — the DONE segment is espresso, so
           the legend's DONE dot above it still keys something
           that is on the page. Open and missed are unchanged. */
        segs: items.map((w) => ({ bg: w.status === 'open' ? 'var(--st-accent)' : w.status === 'missed' ? 'var(--err)' : 'var(--pg-strong)' })),
        /* ⊕ RULED 23 Aug 2026 — the selected week takes the bench
           theme, per Design's `--wk-edge:var(--b-ground)`. The
           trough, the nowDot and `numColor` do not move; see the
           note above this entry for why each one stays. */
        ring: sel ? '0 0 0 1.5px var(--b-ground)' : 'none',
        numColor: sel ? 'var(--st-ink)' : n === MRB_DATA('currentWeek') ? 'var(--ks3-accent-text)' : 'var(--st-ghost)',
        nowDot: n === MRB_DATA('currentWeek') ? 'var(--st-accent)' : 'transparent'
      });
    }

    const tabDefs = [
      { id: 'all', label: 'All', n: all.length },
      { id: 'todo', label: 'To do', n: all.filter((w) => w.status === 'open' || w.status === 'missed').length },
      { id: 'marked', label: 'Marked', n: marked.length }
    ];
    const tabs = tabDefs.map((t) => ({
      label: t.label + ' ' + t.n, onClick: () => this.pickTab(t.id),
      bg: st.tab === t.id ? 'var(--st-paper)' : 'transparent',
      color: st.tab === t.id ? 'var(--st-ink)' : 'var(--st-caption)'
    }));

    let list = all;
    if (st.tab === 'todo') list = list.filter((w) => w.status === 'open' || w.status === 'missed');
    if (st.tab === 'marked') list = list.filter((w) => w.status === 'marked');
    if (st.week != null) list = list.filter((w) => w.week === st.week);

    const rows = list.map((w) => {
      const isMarked = w.status === 'marked';
      const showScore = isMarked && !hideScores;
      const expanded = st.open === w.id;
      const longWord = w.status === 'open' ? MRB_DATA('dueWordLong') : w.status === 'pending' ? 'WITH ' + MRB_DATA('teacherName').toUpperCase() : w.status === 'missed' ? 'MISSED' : 'MARKED';
