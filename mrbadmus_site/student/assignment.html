        keyBg: 'var(--err)', keyBorder: '2px solid var(--err)', keyColor: cream,
        keyAnim: 'mrbMark .3s ease-out both', tick: false, cross: true,
        markColor: 'var(--err)', status: 'NOT THIS ONE', statusColor: 'var(--err)'
      }, noteBlock(i, 'var(--err-border)', 'var(--st-body)'));
      if (s === 'answer') return Object.assign(o, {
        bg: 'var(--st-paper)', border: '2px solid var(--ks3-ok)', color: 'var(--st-ink)',
        keyBg: 'transparent', keyBorder: '2px solid var(--ks3-ok)', keyColor: 'var(--ks3-ok-text)',
        keyAnim: 'none', tick: true, cross: false,
        markColor: 'var(--ks3-ok)', status: 'THE ANSWER', statusColor: 'var(--ks3-ok-text)'
      }, noteBlock(i, 'var(--st-rule-soft)', 'var(--st-muted)'));
      /* ⊕ RULED 23 Aug 2026 — an option a student did not pick is
         still an option they have to be able to read. --st-rule-fact
         is a between-rows hairline for use on paper; as the outline
         of a box on the cream page ground it is all but invisible.
         Design's own `idle` values, one tier down. */
      return Object.assign(o, {
        bg: 'transparent', border: '1.5px solid var(--st-rule-strong)', color: 'var(--st-muted)',
        keyBg: 'transparent', keyBorder: '1.5px solid var(--st-rule-strong)', keyColor: 'var(--st-caption)',
        keyAnim: 'none', tick: false, cross: false, status: '', note: ''
      });
    });

    const markFor = (i) => {
      const a = answers[i];
      const done = a != null;
      const ok = done && a === this.questions[i].a;
      const isHeld = !!st.held[i];
      return {
        num: pad(i + 1), ok: ok, bad: done && !ok, left: !done,
        held: isHeld, current: i === idx,
        onClick: () => (wide || st.view === 'done' ? this.go(i) : this.toggleSheet())

    };

    const markers = [];
    for (let i = 0; i < total; i++) {
      const m = markFor(i);
      const hatch = ',repeating-linear-gradient(45deg,rgba(251,243,230,0.62) 0 3px,rgba(251,243,230,0) 3px 6px)';
      let bg = 'var(--st-rule-soft)', bd = '1px solid var(--st-rule)', mark = 'transparent';

        bd: m.ok ? 'none' : m.bad ? '1.5px solid var(--err)' : '1.2px dashed var(--st-rule-strong)',
        numColor: m.ok ? 'var(--st-ground)' : m.bad ? 'var(--err)' : 'var(--st-ghost)',

        bd: m.ok ? 'none' : m.bad ? '1.5px solid var(--st-ember)' : '1px solid var(--st-room-line-strong)',

           disc. `bg` above is `--st-cream`, which the theme bridge
           maps to the theme's INK inside this card, so the tick has
           to be the theme's GROUND or it disappears on chalk. */

        yourKey: keys[a], yourText: qq.o[a], yourNote: _line(qq, a),
        /* the correct option's line, closed when unauthored — see noteBlock above.
           The review screen is the SECOND place it surfaces, and it was missed on
           the first pass: closing it only on the question card would have left the
           end-of-assignment review showing an empty rule under every right answer. */
        ansKey: keys[qq.a], ansText: qq.o[qq.a], ansNote: _line(qq, qq.a),
        jumpLabel: 'LOOK AT QUESTION ' + pad(i + 1),
        onClick: () => this.go(i)

    const pctVal = nDone ? Math.round((nRight / total) * 100) : 0;
    /* ⊕ RULED 23 Aug 2026 — AND WHAT IT SAYS WHEN THE ANSWER IS NOT HELD.

       An answer given offline that the device would not keep is not held, so
       the page may not print the held count at it. It prints that sentence's
       literal negation, in Design's own grammar, with a real number:

           OFFLINE · 01 NOT HELD ON THIS DEVICE

       counted — and nothing whatever about storage, quotas, private browsing,
       or the platform. There is no hatch legend beside it, because there is
       nothing hatched.

       When both exist the NOT-HELD count wins, because it is the fact that
       changes what the student should do next. In practice a store either
       works from the first answer or from none, so both is close to

    const netNote = st.net === 'sent'
      ? 'BACK ONLINE \u00B7 ' + pad(st.sentN || 0) + ' SENT'
      : offline
        ? (notKept.length
            ? 'OFFLINE \u00B7 ' + pad(notKept.length) + ' NOT HELD ON THIS DEVICE'
            : 'OFFLINE \u00B7 ' + pad(heldKeys.length) + ' HELD ON THIS DEVICE')
        : '';

    const onQ = st.view === 'q' && !st.handing;
    const onDone = st.view === 'done' && !st.handing;

    return {

      frameW: forced ? forced + 'px' : '100%',
      frameEdge: forced ? '1px solid var(--st-rule)' : 'none',
      wide: wide,

      shellCols: desk ? 'minmax(0,1fr) 320px' : 'none',
      optCols: desk ? '1fr 1fr' : 'minmax(0,1fr)',
      showStrip: !desk && onQ,
      showReadout: !desk && onQ,
      rail: desk && onQ,

      wrongCols: desk ? 'repeat(2,minmax(0,1fr))' : 'minmax(0,1fr)',

      onQ: onQ, onDone: onDone, handing: st.handing,
      /* ⊕ RULED 22 Aug 2026 — W5. “Complete” replaces the old wording everywhere.
         The button marks the work finished; it does not transfer it, because
         the transfer happened one answer at a time all week. Design's
         typography and placement are untouched — only the words change. */
      screenLabel: onDone ? (st.late ? 'Completed late' : 'Complete') : handed ? 'Review' : 'Question ' + pad(idx + 1),

      clockColor: st.paused || handed ? 'var(--st-muted)' : 'var(--st-ink)',
      dotBg: st.paused || handed ? 'transparent' : 'var(--st-accent)',
      dotBorder: st.paused || handed ? '1.5px solid var(--st-rule-strong)' : 'none',
      timerLabel: handed ? 'TOTAL' : st.paused ? 'PAUSED' : '',

      offline: offline, netNote: netNote,
      netSwatch: st.net === 'sent' ? 'var(--st-ink)' : 'repeating-linear-gradient(45deg,var(--st-ink) 0 3px,var(--st-chip-tint) 3px 6px)',
      heldCount: heldKeys.length,

      sheet: st.sheet && !desk, toggleSheet: this.toggleSheet,
      sheetTitle: 'All ' + total + ' questions',
      answeredText: 'ANSWERED ' + pad(nDone) + ' / ' + pad(total),
      hasRight: nDone > 0, rightText: pad(nRight) + ' RIGHT',
      leftText: nLeft ? pad(nLeft) + ' LEFT' : 'NONE LEFT',
      leftColor: nLeft ? 'var(--st-caption)' : 'var(--ks3-accent-text)',
      railStats: [
        { label: 'ANSWERED', value: pad(nDone) + '/' + pad(total), color: 'var(--st-ink)' },
        { label: 'RIGHT', value: pad(nRight), color: 'var(--st-ink)' },
        { label: 'TIME', value: this.mmss(st.elapsed), color: st.paused ? 'var(--st-muted)' : 'var(--st-ink)' }
      ].map((s, i) => Object.assign(s, { edge: i < 2 ? '1px solid var(--st-rule-fact)' : 'none', pl: i ? '13px' : '0' })),

      /* ⊕ RULED 22 Aug 2026 — three welded values in one line of Design's.
         The week was 04 for every class in every week of every year; the topic
         was one real class's; and "2 DAYS LATE" was a fixed number of days
         printed over whatever the real overdue period happened to be.
         `topicTitle` is already bound from the markup, so nothing new is
         carried for it — the same key, upper-cased for this position. */
      headMeta: (MRB_DATA('weekLabel') ? MRB_DATA('weekLabel') + ' \u00B7 ' : '') + total + ' QUESTIONS',
      dueLead: MRB_DATA('topicTitle').toUpperCase() + ' \u00B7 ' + this.DUE,
      dueFlag: st.late ? '\u00B7 ' + MRB_DATA('lateText').toUpperCase() : '',
      /* ⊕ RULED 23 Aug 2026 — the eyebrow says which question this
         is, and stops there. The topic is already in the crumb bar
         and in the marker sheet's own eyebrow; it was being said a
         third time in the smallest type on the screen. */
      qEyebrow: 'Question ' + pad(idx + 1) + ' of ' + pad(total),
      qText: q.q,
      options: options,

      hasFig: !!figKey,
      figMicro: figKey === 'micro', figBubbles: figKey === 'bubbles', figFov: figKey === 'fov',
      figPlant: figKey === 'plant', figCells: figKey === 'cells', figScale: figKey === 'scale',
      figSlot: figKey === 'slot',
      figCaption: figKey ? this.figCaptions[figKey] : '',
      figHint: figKey === 'slot' ? '' : zoom ? 'TAP TO SHRINK' : 'TAP TO ENLARGE',
      figCap: zoom ? 'min(72vh,620px)' : 'clamp(132px,34cqw,232px)',
      toggleZoom: this.toggleZoom,

      showAction: onQ,
      back: st.idx > 0 ? this.back : () => {},
      backCursor: idx > 0 ? 'pointer' : 'default',
      backColor: idx > 0 ? 'var(--st-body)' : 'var(--st-faint)',
      backBorder: idx > 0 ? 'var(--st-btn-border)' : 'var(--st-rule-fact)',
      next: this.next, jumpNext: this.jumpNext, handIn: this.handIn, goSummary: this.goSummary,
      confirm: this.confirm, showConfirm: !locked && sel != null,
      showNext: !handed && !allDone && idx < total - 1 && (locked || sel == null),
      showNextQuiet: ((handed || allDone) && idx < total - 1) || (!locked && sel != null && idx < total - 1),
      showJump: !handed && !allDone && idx === total - 1 && (locked || sel == null),
      jumpLabel: 'NEXT UNANSWERED',
      showHandIn: !handed && allDone,
      showSummary: handed,

      handStamp: st.handedAt || '', handMeta: pad(nDone) + ' / ' + pad(total) + ' ANSWERED \u00B7 ' + this.mmss(st.elapsed) + ' ON THE CLOCK',
      /* The stamp is whatever the server said, and nothing when it said
         nothing — never a manufactured date. The separator goes with it, so an
         absent stamp leaves "Completed" rather than "Completed ·". */
      doneEyebrow: 'Completed' + (st.handedAt ? ' ' + st.handedAt : '') + (st.late ? ' \u00B7 ' + MRB_DATA('lateText') : ''),
      doneKicker: st.late ? 'Marked \u00B7 completed late' : (MRB_DATA('weekLabel') ? 'Marked \u00B7 ' + MRB_DATA('weekLabel').toLowerCase() : 'Marked'),
      scoreFrac: nRight + ' / ' + total, scorePct: pctVal + '%',
      /* ⊕ RULED 23 Aug 2026 — WRONG counts answers, not absences.
         `wrongList` already excludes the unanswered (it skips
         `a == null`); `nDone` already counts the answered. See
         student_rulings.py for what the old line told a child. */
      doneStats: [
        { label: 'RIGHT', value: pad(nRight) },
        { label: 'WRONG', value: pad(wrongList.length) },
        { label: 'MISSED', value: pad(total - nDone) },
        { label: 'TIME TAKEN', value: this.mmss(st.elapsed) }
      ].map((s, i, a) => Object.assign(s, { edge: i < a.length - 1 ? '1px solid var(--st-room-line)' : 'none', pl: i ? '15px' : '0' })),
      wrongList: wrongList, noneWrong: wrongList.length === 0,
      wrongCount: pad(wrongList.length) + ' OF ' + pad(total),
      reviewAll: this.reviewAll, reviewLabel: 'Look through all ' + total,
      goClass: this.goClass,
      /* ⊕ RULED 23 Aug 2026 — the brand's own destination; see
         RETARGET_ON in student_rulings.py. Node 15 only. */
      goKS3: () => { window.location.href = '/ks3/index.html'; },
      /* ⊕ QUICKFIX-2026-08-24 — TWO NAMES, NOT ONE, HAD TO LAND HERE.
         `student-runtime.js`'s `build()` resolves BOTH an `<if>`'s
         expression AND an `on` handler with the identical call —
         `lookup(node.e / node.on, scope, ctx.miss)` — reading THIS
         render scope, never `MRB_DATA` and never `this.<method>`
         directly. Every other WRAP key (`benchOpen`,
         `benchDoneLessons`, …) and every other SET_ON name
         (`goLessons`, `readFeedback`, `goClass` two lines up) is a key
         in its page's own equivalent object for exactly this reason.
         Node 348 was wired (SET_ON) and gated (WRAP) but this file
         named neither key here — the WRAP lookup found nothing and
         `<if>` read that as false (button never rendered); once the
         `<if>` was fed, the SAME missing lookup left `on="openLesson"`
         resolving to nothing, so Design's dead `href="#top"` was all
         that fired on click. Both found by driving the real page and
         reading what actually rendered, not by reading the diff —
         which is exactly the gap this note is for. */
      assignmentLessonHref: MRB_DATA('assignmentLessonHref'),
      openLesson: this.openLesson
    };
  }
}
