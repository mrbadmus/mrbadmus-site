<script>
/* No data reaches this page except through here, and there is no
   fallback. A missing key is a THROWN ERROR and a blank page, deliberately:
   Design's delivery is a SAMPLE — twelve invented classes and fifty-four
   invented children — and the alternative to a blank page is a teacher shown
   a class they do not teach, with names that look real. */
function MRB_DATA(k){var d=window.__MRB_DATA__;
  if(!d||!(k in d))throw new Error('teacher page: no data for "'+k+'"');
  return d[k];}
/* Several of Design's methods look a value up PER CLASS — the score matrix,
   the roster, the assignment list, one paper's question grid, one class's
   weeks. The id is part of the question, so it is part of the error. */
function MRB_PICK(mapKey, id){var m=MRB_DATA(mapKey);
  if(!m||!(id in m))throw new Error('teacher page: no '+mapKey+' for "'+id+'"');
  return m[id];}
/* One query parameter, read once. `teacher-live.js` reads the same three
   (`class`, `student`, `paper`) and derives the screen from the PATH, so
   these two must not disagree about what a URL means. */
function MRB_Q(name){
  return new URLSearchParams(window.location.search).get(name) || '';}
/* The sandbox thread. `teacher/classes.html` has always done this on every
   card click; dropping it would send a teacher testing against the test
   project back into production data one navigation later. */
function MRB_ENV(){var c=window.MrBadmusConfig;
  return (c&&c.environment==='test')?'test':'';}
/* ⚠️ THE FILENAMES ARE THE CONTRACT. `teacher-live.js` maps the PATH back to a
   screen (`SCREEN_BY_PAGE`) and prefetches only the grids that screen draws,
   so a link to the wrong file is a page that stays pending for ever with
   nothing in the console. The two maps are inverses and must stay so. */
var MRB_PAGE = {classes:'classes.html', 'class':'class-detail.html',
  student:'student-detail.html', marking:'assignment.html',
  digest:'digest.html', 'import':'import.html', insights:'insights.html'};
function MRB_GO(screen, params){
  var f = MRB_PAGE[screen];
  if(!f)throw new Error('teacher page: no page for screen "'+screen+'"');
  var q = [], env = MRB_ENV(), k;
  for(k in params){ if(params[k]!=null&&params[k]!=='')
    q.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k])); }
  if(env)q.push('env='+env);
  window.location.href = '/teacher/'+f+(q.length?('?'+q.join('&')):'');}
/* Design's Back buttons chose between two screens from state. Six URLs later
   the browser knows the real answer — and a page opened from a bookmark has no
   state to consult. Falls through to the class list rather than being a dead
   press. */
function MRB_BACK(){if(window.history.length>1){window.history.back();return;}
  MRB_GO('classes',{});}
/* The composer opens on a template, and Design opens it on `3`. The six
   templates are the DB enum now and their ids are strings, so `3` selects
   nothing and looks like a rendering bug rather than a data one. */
function MRB_FIRST_TEMPLATE(){var t=MRB_DATA('TEMPLATES');
  return (t&&t[0])?t[0].id:'';}
/* Which paper is "the newest marked one". Taken from teacher-live.js rather
   than reimplemented: Design reaches for index 1 and assumes it exists and is
   closed, which is true only when there is exactly one open paper. Two answers
   to this question is how the page and the prefetch disagree about which grid
   was fetched. */
function MRB_NEWEST_MARKED(papers){
  var L=window.MrBadmusTeacherLive;
  if(L&&L.newestMarkedIdx)return L.newestMarkedIdx(papers||[]);
  for(var i=0;i<(papers||[]).length;i++){
    if(papers[i].when==='marked')return i;}
  return -1;}
/* "N late of M marked". ⚠️ AND THE UNKNOWNS ARE SHOWN, NOT HIDDEN. `is_late`
   is NULL on every submission written before 22 Aug 2026 and on any with no
   deadline, so "unknown" is a real population and not a rounding error. Folded
   into "late" it overstates; folded into "on time" it understates; left out
   entirely it is a number a teacher reads as a zero. */
/* A matrix for NO CLASS. `renderVals` reads `matrixFor(k)` unconditionally on
   every screen, and a teacher with no classes at all is a real first day
   rather than an error — so the shape exists and every figure in it is empty.
   Zero is NOT the same as empty here: `classMean: 0` would be a claim about
   how a class did, and there is no class. */
/* A class for NO CLASS. `renderVals` reads `k.code` in seven places, so a
   null cannot travel: `crumb`, `backToClass`, `student.meta`, `insSub`,
   `insScopeTabs`, `digestSub` and `chart.scopeLabel` all dereference it
   unconditionally. An em dash and zeros, so the page draws itself with
   nothing in it rather than throwing. */
function MRB_NO_CLASS(){return {id:'',code:'—',subject:'',year:'',
  ks:'',n:0,week:[0,0],last:'No activity yet',state:'empty'};}

   always did - `MrBadmusTeacherData.insertClassShoutout` - and these six
   helpers are the whole of what the ported page needed to reach it.

   WARNING: NOTHING HERE REJECTS. Every one of them resolves, with a count and
   the first error, because the callers are Design's SYNCHRONOUS `renderVals`
   closures: an unhandled rejection out of one is a console error a teacher
   never sees, in front of a composer that still looks like it sent. */

/* The signed-in teacher. `MrBadmusTeacherGuard` validates the JWT at boot and
   hands `ctx.user` to `teacher-live.js`, which keeps only `ctx.profile` -
   `first_name`, `role`, `school_id`, and no id. So the id is asked for again
   here, once, and held. RLS enforces `author_id = auth.uid()`, so a wrong one
   is refused by the database rather than written. */
function MRB_AUTHOR_ID(){
  if(MRB_AUTHOR_ID._id){return Promise.resolve(MRB_AUTHOR_ID._id);}
  var g=window.MrBadmusTeacherGuard;
  var sb=(g&&g.getClient)?g.getClient():null;
  if(!sb){return Promise.reject(new Error('teacher page: no data layer'));}
  return sb.auth.getUser().then(function(r){
    var u=r&&r.data&&r.data.user;
    if(!u||!u.id){throw new Error('teacher page: not signed in');}
    MRB_AUTHOR_ID._id=u.id;

/* What went wrong, in a sentence a teacher can act on. The two named branches
   are the ones the hand-written composer already surfaced, kept word for word
   in meaning: an RLS refusal is about access, a CHECK refusal is about the
   message or the template. Anything else is "try again", because guessing
   further would be putting words in the database's mouth. */

  if(/check constraint/i.test(m))

           "not one this school uses.";
  if(/no data layer|not signed in/i.test(m))

           "again.";

/* `#compose-error` is the hand-written page's own validation line, carried

   is `hidden`, and WITHOUT the stylesheet that used to lay it out. So it is
   written here for the region to hold and it is NOT the visible surface; the
   TOAST is, because the toast is the one notice surface Design drew. Stated
   rather than implied: if Design ever draws an inline error in the composer,
   this is the line to move onto it. */

  if(!el){return;}
  if(msg){el.hidden=false;el.textContent=msg;}
  else{el.hidden=true;el.textContent='';}}

  ids=ids||[];
  var no=function(e){return Promise.resolve({ok:0,fail:ids.length||1,error:e});};
  if(!classId){return no(new Error('teacher page: no class'));}
  if(!ids.length){return no(new Error('teacher page: no recipient'));}

            segs: [{ pct: Math.round((b.today / t) * 100), fill: 'var(--ks3-ok)' }, { pct: Math.round((b.week / t) * 100), fill: 'var(--st-hatch-b)' }, { pct: Math.round((b.stale / t) * 100), fill: 'var(--st-rule-strong)' }] };
        });
        return { ...base, type: 'stack', title: 'Last seen, by class', stacks,
          legend: [{ label: 'Today', fill: 'var(--ks3-ok)' }, { label: 'This week', fill: 'var(--st-hatch-b)' }, { label: '2+ weeks', fill: 'var(--st-rule-strong)' }],
          tiles: [tile('Active today', totals.today, 'Across ' + live.length + ' classes'), tile('This week', totals.week, ''), tile('2+ weeks', totals.stale, 'Worth chasing')],
          note: totals.stale + ' students have not opened anything for two weeks or more' };
      }
      const rows = this.rosterFor(k);
      const b = this.bucketsOf(rows);
      const cold = rows.filter(r => r.hours >= 168).map(r => r.name);
      return { ...base, type: 'cols', title: k.code + ' — last seen',
        cols: this.colsFrom([{ label: 'Today', value: String(b.today), raw: b.today }, { label: 'This week', value: String(b.week), raw: b.week }, { label: '2+ weeks', value: String(b.stale), raw: b.stale, flag: b.stale > 0 }]),
        tiles: [tile('Students', k.n, 'On the roster'), tile('Active today', b.today, ''), tile('2+ weeks', b.stale, cold.length ? 'Worth chasing' : 'None')],
        note: cold.length ? 'Not seen for two weeks: ' + cold.slice(0, 3).join(', ') + (cold.length > 3 ? ' and ' + (cold.length - 3) + ' more' : '') : 'Everyone has opened something this week' };
    }

    if (all) {
      const rows = live.map(c => {
        const m = mx(c);
        const asked = m.colAsked[0] || 0;
        const pct = asked ? Math.round((m.colSub[0] / asked) * 100) : 0;
        return { label: c.code, sub: c.ks, value: m.colSub[0] + '/' + asked, pct, fill: pct < 60 ? 'var(--st-accent)' : 'var(--st-hatch-b)' };
      });
      const subs = live.reduce((a, c) => a + mx(c).colSub[0], 0);
      const seats = live.reduce((a, c) => a + c.n, 0);
      const done = live.filter(c => mx(c).colSub[0] === c.n).length;
      const low = rows.slice().sort((a, b) => a.pct - b.pct)[0];
      return { ...base, title: 'Submissions this week', rows,
        tiles: [tile('Submitted', subs + '/' + seats, 'Across ' + live.length + ' classes'), tile('Outstanding', seats - subs, 'Students yet to submit'), tile('Everyone in', done + '/' + live.length, 'Classes complete')],
        note: low ? 'Lowest return: ' + low.label + ' at ' + low.pct + '% (' + low.value + ')' : '' };
    }
    const m = mx(k);
    const rows = this.papersFor(k).map(p => {
      const asked = m.colAsked[p.idx] || 0;
      const pct = asked ? Math.round((m.colSub[p.idx] / asked) * 100) : 0;
      return { label: p.title, sub: (p.when === 'upcoming' ? 'Open · due ' + p.due.replace('Due ', '') : 'Marked · due ' + p.due), value: p.sub, pct, fill: pct < 60 ? 'var(--st-accent)' : 'var(--st-hatch-b)' };
    });
    const lowP = rows.slice().sort((a, b) => a.pct - b.pct)[0];
    return { ...base, title: k.code + ' — submissions by assignment', rows,
      tiles: [tile('This week', m.colSub[0] + '/' + k.n, 'Open assignment'), tile('Outstanding', k.n - m.colSub[0], 'Students yet to submit'), tile('Assignments', rows.length, 'Set this term')],
      note: lowP ? 'Weakest return: ' + lowP.label + ' at ' + lowP.pct + '%' : '' };
  }

  paper() {
    const list = this.papersFor(this.klass());
    const i = this.state.paperIdx;
    if (i == null || i === '') {
      const n = window.MrBadmusTeacherLive
        ? window.MrBadmusTeacherLive.newestMarkedIdx(list) : -1;
      return n >= 0 ? list[n] : (list[0] || null);
    }
    if (!list[Number(i)]) {
      throw new Error('teacher page: assignment ' + i + ' is not in this class');
    }
    return list[Number(i)];
  }
  student() {
    const rows = this.rosterFor(this.klass());
    const found = rows.filter(r => r.id === this.state.studentId)[0];
    if (found) return found;
    if (this.state.studentId) {
      throw new Error('teacher page: student "' + this.state.studentId + '" is not on this class\'s roster');
    }
    return null;
  }
  meanOf(k) { return this.matrixFor(k).classMean; }
  cellStyle(v) {
    if (v === 1) return { w: 9, h: 9, r: '50%', bg: 'var(--ks3-ok)', bd: 'none' };
    if (v === 0) return { w: 9, h: 9, r: '50%', bg: 'transparent', bd: '1.5px solid var(--st-rule-strong)' };
    if (v === 3) return { w: 9, h: 9, r: '2px', bg: 'var(--st-hatch-b)', bd: '1.5px solid var(--st-hatch-b)' };
    return { w: 9, h: 2, r: '1px', bg: 'var(--st-rule-strong)', bd: 'none' };
  }

  renderVals() {
    const s = this.state;
    const meter = (this.props.cardMeter ?? 'bar') === 'bar';
    const hideEmpty = this.props.hideEmptyClasses ?? false;
    const compact = (this.props.density ?? 'comfortable') === 'compact';
    const teacher = MRB_DATA('teacherName');

    const k = this.klass();
    const kRoster = this.rosterFor(k);
    const kPapers = this.papersFor(k);
    const kMx = this.matrixFor(k);
    const st = this.student();
    const pp = this.paper();
    const totalStudents = this.CLASSES.reduce((a, c) => a + c.n, 0);
    const totalSubs = this.CLASSES.reduce((a, c) => a + c.week[0], 0);
    const liveClasses = this.CLASSES.filter(c => c.state === 'live');

    const pill = (on) => on
      ? { bg: 'var(--st-paper)', fg: 'var(--st-ink)', bc: 'var(--st-btn-border)' }
      : { bg: 'transparent', fg: 'var(--st-caption)', bc: 'transparent' };

    let list = this.CLASSES.filter(c => s.ks === 'All' || c.ks === s.ks);
    if (hideEmpty) list = list.filter(c => c.n > 0);
    if (s.sort === 'activity') {
      const rank = { live: 1, nowork: 0, empty: 0 };
      list = list.slice().sort((a, b) => {
        const ga = a.state === 'live' ? (a.week[1] - a.week[0]) : 999;
        const gb = b.state === 'live' ? (b.week[1] - b.week[0]) : 999;
        return gb - ga;
      });
    }

    const cards = list.map(c => ({
      code: c.code,
      subject: c.subject,
      dots: this.dotsFor(c.subject),
      meta: 'Year ' + c.year + ' · ' + c.ks + ' · ' + MRB_DATA('yearLabel'),
      live: c.state === 'live',
      noWork: c.state === 'nowork',
      empty: c.state === 'empty',
      weekLabel: c.week[0] + '/' + c.week[1],
      weekSub: c.week[0] === c.week[1]
        ? 'Everyone in · ' + c.n + ' students'
        : (c.week[1] - c.week[0]) + ' still to submit · ' + c.n + ' students',
      pct: c.week[1] ? Math.round((c.week[0] / c.week[1]) * 100) : 0,
      emptyLine: c.state === 'empty' ? 'No students yet' : c.n + ' students · no work set',
      activity: c.state === 'empty' ? c.last : 'Last activity ' + c.last,
      open: () => MRB_GO(c.n > 0 ? 'class' : 'import', { 'class': c.id }),
      act: (e) => { e.stopPropagation(); MRB_GO('import', { 'class': c.id }); }
    }));

    /* Which week the class screen is scoped to: 0 is the open assignment,
       1+ are the weeks behind it. Every figure below reads the same matrix
       column, so a past week can't disagree with the term view. */
    const wi = this.weekIdxFor(k);
    const wPast = wi > 0;
    const weekTabs = kPapers.slice().reverse().map((p, n) => {
      const i = p.idx;
      const on = i === wi;
      return {
        idx: String(i),
        range: p.range,
        on,
        now: i === 0,
        pick: () => this.pickWeek(i),
        bg: on ? 'var(--st-num-well)' : 'transparent',
        ring: on ? 'inset 0 0 0 1.5px var(--st-accent)' : 'none',
        divider: n === 0 || on ? 'transparent' : 'var(--st-rule-soft)',
        dateColor: on ? 'var(--st-ink)' : 'var(--st-muted)'
      };
    });
    const backOff = wi >= kPapers.length - 1;
    const fwdOff = wi <= 0;
    const wPaper = kPapers[wi];
    const wMean = kMx.colMean[wi];
    const wLate = Math.max(0, kMx.colSub[wi] - kMx.colOnTime[wi]);
    const kTermMean = this.meanOf(k);
    const wGap = wMean != null && kTermMean != null ? wMean - kTermMean : null;
    const weekNote = !kPapers.length ? ''
      : (wPast
        ? 'Week of ' + wPaper.range + ' · ' + wPaper.title + ' · marked, due ' + wPaper.due
        : 'Week of ' + wPaper.range + ' · ' + wPaper.title + ' · open, due ' + wPaper.due.replace(/^Due /, ''));

    const roster = kRoster.map(r => {
      const mrow = kMx.byId[r.id];
      const sc = mrow ? mrow.scores[wi] : null;
      const late = !!(mrow && mrow.late[wi]);
      const scPct = mrow && mrow.pct[wi] != null ? mrow.pct[wi] : null;
      const lateState = mrow ? mrow.late[wi] : null;
      return {
        id: r.id,
        name: r.name,
        initials: this.initials(r.name),
        hue: this.hueFor(r.name),
        hasWork: kPapers.length > 0,
        pct: wPast ? (scPct == null ? 0 : scPct) : (r.inWeek ? 100 : 0),
        weekLabel: kPapers.length === 0 ? 'No work set'
          : (wPast
            ? (scPct == null ? 'Not submitted'
              : scPct + '% · ' + (lateState === true ? 'late'
                : (lateState === false ? 'on time' : 'timing unknown')))
            : (r.inWeek ? 'Submitted' : 'Not in')),
        avg: r.avg == null ? '—' : r.avg + '%',
        last: r.last,
        flag: r.flag,
        open: () => MRB_GO('student', { student: r.id, 'class': k && k.id })
      };
    });

    const paperRow = (p) => ({
      title: p.title, due: p.due, sub: p.sub, mean: p.mean, sel: p.idx === wi,
      open: () => MRB_GO('marking', { 'class': k && k.id, paper: p.idx })
    });

    const kAsked = (i) => kMx.colSub[i] + '/' + (kMx.colAsked[i] || 0);
    const kOnTimePct = (i) => {
      const known = kMx.colOnTime[i] + kMx.colLate[i];
      return known ? Math.round((kMx.colOnTime[i] / known) * 100) + '%' : '—';
    };
    const flagged = kRoster.filter(r => r.flag).length;
    const kMean = this.meanOf(k);
    const upcomingPaper = kPapers.filter(p => p.when === 'upcoming')[0];

    const pGrid = pp ? this.gridFor(k, pp.idx) : null;
    const questions = pGrid ? pGrid.stems.map((q, qi) => ({ id: q.id, text: q.text, pct: pGrid.qpct[qi] })) : [];
    const scored = questions.filter(q => q.pct != null);
    const worst = scored.length ? scored.reduce((a, q) => (q.pct < a.pct ? q : a), scored[0]) : null;

    const grid = pGrid ? pGrid.rows.map(r => ({
      name: r.name, initials: r.initials, hue: r.hue,
      cells: r.raw.map(v => this.cellStyle(v)),
      score: r.score,
      open: () => MRB_GO('student', { student: r.id, 'class': k && k.id })
    })) : [];

    const digestRows = this.CLASSES.map(c => {
      const live = c.state === 'live';
      const m = live ? this.meanOf(c) : null;
      const fl = live ? this.rosterFor(c).filter(r => r.flag).length : 0;
      return {
        code: c.code, ks: c.ks,
        sub: live ? c.week[0] + '/' + c.week[1] : '—',
        mean: m == null ? '—' : m + '%',
        ontime: live && this.matrixFor(c).markedPct != null ? this.matrixFor(c).markedPct + '%' : '—',
        needs: c.state === 'empty'
          ? 'Roster not imported'
          : (c.state === 'nowork' ? 'No work set' : (fl ? (fl === 1 ? '1 student to chase' : fl + ' students to chase') : 'Nothing outstanding')),
        open: () => c.n > 0 ? MRB_GO('class', { 'class': c.id }) : this.ping('No students in ' + c.code + ' yet')
      };
    });

    const chartKind = s.chartKind || 'submissions';
    const chartScope = s.chartScope || 'all';
    const chart = this.chartFor(chartKind, chartScope);

    const isClassReport = s.digestScope === 'class';
    const kFlagged = kRoster.filter(r => r.flag).length;
    const classReportRows = kPapers.map(p => {
      const missing = Math.max(0, (kMx.colAsked[p.idx] || 0) - kMx.colSub[p.idx]);
      return {
        code: p.title,
        ks: p.when === 'upcoming' ? 'Open' : 'Marked',
        sub: p.sub,
        mean: p.mean,
        ontime: p.when === 'upcoming' ? '—' : String(kMx.colOnTime[p.idx]),
        needs: missing === 0
          ? 'Everyone submitted'
          : (p.when === 'upcoming'
            ? (missing === 1 ? '1 still to submit' : missing + ' still to submit')
            : (missing === 1 ? '1 never submitted' : missing + ' never submitted')),
        open: () => this.setState({ screen: 'marking', paperId: p.id })
      };
    });

    const pool = MRB_DATA('searchPool');
    const q = String(s.search || '').toLowerCase();
    const results = pool.filter(p => !q || p.name.toLowerCase().indexOf(q) > -1).slice(0, 12).map(p => ({
      name: p.name, klass: p.klass, avg: p.avg,
      initials: this.initials(p.name), hue: this.hueFor(p.name),
      open: () => MRB_GO('student', { student: p.id, 'class': p.classId })
    }));

    const stRow = st ? kMx.byId[st.id] : null;
    const stHistory = st && kPapers.length ? kPapers.map((p, i) => {
      const open = i === 0;
      const sc = stRow ? stRow.scores[i] : null;
      const lateState = (!open && sc != null) ? stRow.late[i] : null;
      const late = lateState === true;
      const pct = stRow ? stRow.pct[i] : null;
      const stampS = stRow ? stRow.stampShort[i] : null;
      const tone = open ? 'neutral'
        : (sc == null || late ? 'warn'
          : (lateState === false ? 'ok' : 'neutral'));
      return {
        marked: !open && sc != null,
        missing: !open && sc == null,
        late: late,
        pct: open ? null : pct,
        title: p.title,
        due: p.due.replace('Due ', ''),
        submitted: open ? (sc != null ? st.last : 'Not yet') : (stampS || '—'),
        score: open || sc == null || stRow.max[i] == null ? '—'
          : sc + '/' + stRow.max[i] + (pct == null ? '' : ' · ' + pct + '%'),
        status: open ? (sc != null ? 'In progress' : 'Nothing in')
          : (sc == null ? 'Nothing in'
            : (lateState === true ? 'Late'
              : (lateState === false ? 'On time' : 'Submitted'))),
        stFg: tone === 'neutral' ? 'var(--st-caption)' : (tone === 'warn' ? 'var(--st-accent-text)' : 'var(--ks3-ok-text)'),
        stBg: tone === 'neutral' ? 'var(--st-num-well)' : (tone === 'warn' ? 'var(--st-chip-tint)' : 'var(--ks3-ok-tint)'),
        stBc: tone === 'neutral' ? 'var(--st-rule-soft)' : (tone === 'warn' ? 'var(--st-chip-tint-border)' : 'var(--ks3-ok-tint)'),
        stDot: tone === 'neutral' ? 'var(--st-rule-strong)' : (tone === 'warn' ? 'var(--st-accent)' : 'var(--ks3-ok)'),
        stDotR: tone === 'warn' ? '1px' : '50%',
        open: () => MRB_GO('marking', { 'class': k && k.id, paper: p.idx })
      };
    }) : [];

    const stMarked = stHistory.filter(h => h.marked);
    const stOnTime = stMarked.filter(h => h.lateState === false).length;
    const stLate = stMarked.filter(h => h.lateState === true).length;
    const stUnknown = stMarked.length - stOnTime - stLate;
    const stMissing = stHistory.filter(h => h.missing).length;
    const stTimeSub = (function () {
      const bits = [];
      if (stLate) { bits.push(stLate === 1 ? '1 late'
        : stLate + ' late'); }
      if (stUnknown) { bits.push(stUnknown + ' timing unknown'); }
      if (stMissing) { bits.push(stMissing + ' not submitted'); }
      if (bits.length) { return bits.join(' · '); }
      return stOnTime ? 'Every deadline met' : 'Nothing submitted yet';
    })();
    const stAvg = stMarked.length ? Math.round(stMarked.reduce((a, h) => a + h.pct, 0) / stMarked.length) : null;
    const dgMarkedSub = liveClasses.reduce((a, c) => a + this.matrixFor(c).markedSub, 0);
    const dgOnTime = liveClasses.reduce((a, c) => a + this.matrixFor(c).markedOnTime, 0);
    const dgLate = liveClasses.reduce((a, c) => a + this.matrixFor(c).markedLate, 0);
    const dgUnknown = liveClasses.reduce((a, c) => a + this.matrixFor(c).markedLateUnknown, 0);
    const dgKnown = dgOnTime + dgLate;
    const dgOnPct = dgKnown ? Math.round((dgOnTime / dgKnown) * 100) : null;

    return {
      teacher,
      rowPad: compact ? '10px 18px' : '13px 18px',
      showMeter: meter,
      crumb: s.screen === 'classes' ? 'My classes' : (s.screen === 'import' ? 'Import' : (s.screen === 'digest' ? 'Digest' : (s.screen === 'insights' ? 'Insights' : k.code))),
      isClasses: s.screen === 'classes',
      isClass: s.screen === 'class',
      isStudent: s.screen === 'student',
      isMarking: s.screen === 'marking',
      isDigest: s.screen === 'digest',
      isImport: s.screen === 'import',
      classLine: teacher + ' · ' + this.CLASSES.length + ' classes · ' + totalStudents + ' students',
      shownLine: cards.length + ' shown',
      noneShown: !cards.length,
      noneShownLine: s.ks === 'All' ? 'No classes'
        : 'No ' + s.ks + ' classes',
      ksTabs: ['All', 'KS3', 'KS4'].map(t => ({ label: t, ...pill(s.ks === t), pick: () => this.setState({ ks: t }) })),
      sortTabs: [{ k: 'code', l: 'Class code' }, { k: 'activity', l: 'Most missing' }].map(o => ({
        label: o.l,
        fg: s.sort === o.k ? 'var(--st-ink)' : 'var(--st-caption)',
        bc: s.sort === o.k ? 'var(--st-btn-border)' : 'transparent',
        pick: () => this.setState({ sort: o.k })
      })),
      cards,
      klass: {
        code: k.code,
        subject: k.subject,
        dots: this.dotsFor(k.subject),
        longMeta: 'Year ' + k.year + ' · ' + k.ks + ' · ' + MRB_DATA('yearLabel') + ' · ' + k.n + ' students · ' + (kPapers.length ? kPapers.length + (kPapers.length === 1 ? ' assignment' : ' assignments') : 'no assignments'),
        rosterLine: k.n + ' active members',
        paperLine: kPapers.length ? kPapers.length + ' assignments' : 'None set',
        hasWork: kPapers.length > 0,
        noWork: kPapers.length === 0,
        noWorkLine: k.n + ' students are enrolled and waiting. Last activity ' + k.last + '.',
        tiles: kPapers.length ? (wPast ? [
          { label: 'Submitted', value: kAsked(wi), sub: wPaper.title },
          { label: 'Week mean', value: wMean == null ? '—' : wMean + '%', sub: wGap == null ? 'Nothing marked' : (wGap === 0 ? 'Level with the term average' : Math.abs(wGap) + (Math.abs(wGap) === 1 ? ' point ' : ' points ') + (wGap > 0 ? 'above' : 'below') + ' the term average') },
          { label: 'On time', value: kOnTimePct(wi), sub: MRB_LATE_LINE(kMx.colLate[wi], kMx.colLateUnknown[wi], kMx.colSub[wi], 'submitted') },
          { label: 'Not submitted', value: String(Math.max(0, (kMx.colAsked[wi] || 0) - kMx.colSub[wi])), sub: 'Of ' + (kMx.colAsked[wi] || 0) + ' asked' }
        ] : [
          { label: 'This week', value: kAsked(0), sub: upcomingPaper ? upcomingPaper.title : '' },
          { label: 'Class mean', value: kMean == null ? '—' : kMean + '%', sub: 'Across ' + kMx.markedIdx.length + (kMx.markedIdx.length === 1 ? ' marked assignment' : ' marked assignments') },
          { label: 'On time', value: kMx.markedPct == null ? '—' : kMx.markedPct + '%', sub: MRB_LATE_LINE(kMx.markedLate, kMx.markedLateUnknown, kMx.markedSub, 'marked') },
          { label: 'Needs a look', value: String(flagged), sub: flagged ? 'Nothing in this week, and behind' : 'Everyone accounted for' }
        ]) : [
          { label: 'This week', value: '—', sub: 'No work set' },
          { label: 'Class mean', value: '—', sub: 'Nothing marked yet' },
          { label: 'Students', value: String(k.n), sub: 'On the roster' },
          { label: 'Last activity', value: k.last, sub: 'Newest submission' }
        ]
      },
      roster,
      weekTabs,
      weekNote,
      weekBack: () => { if (!backOff) this.pickWeek(wi + 1); },
      weekFwd: () => { if (!fwdOff) this.pickWeek(wi - 1); },
      weekBackColor: backOff ? 'var(--st-rule-strong)' : 'var(--st-ink)',
      weekFwdColor: fwdOff ? 'var(--st-rule-strong)' : 'var(--st-ink)',
      weekBackCursor: backOff ? 'default' : 'pointer',
      weekFwdCursor: fwdOff ? 'default' : 'pointer',
      rosterWeekCol: !kPapers.length ? 'This week' : (wPast ? wPaper.range : 'This week'),
      upcomingLabel: 'Upcoming ' + kPapers.filter(p => p.when === 'upcoming').length,
      markedLabel: 'Marked ' + kPapers.filter(p => p.when === 'marked').length,
      upcoming: kPapers.filter(p => p.when === 'upcoming').map(paperRow),
      marked: kPapers.filter(p => p.when === 'marked').map(paperRow),
      templates: this.TEMPLATES.map(t => ({
        label: t.label,
        fg: s.boTpl === t.id ? 'var(--st-accent-text)' : 'var(--st-ink)',
        bg: s.boTpl === t.id ? 'var(--st-chip-tint)' : 'var(--st-paper)',
        bc: s.boTpl === t.id ? 'var(--st-chip-tint-border)' : 'var(--st-btn-border)',
        pick: () => this.setState({ boTpl: t.id })
      })),
      feed: (MRB_DATA('FEED')[k && k.id] || []),
      noteCount: (s.note || '').length + ' / 500',
      backToClass: 'Back to ' + k.code,
      student: {
        name: st ? st.name : '—',
        initials: st ? this.initials(st.name) : '',
        hue: st ? this.hueFor(st.name) : 'var(--st-rule-strong)',
        meta: k.code + ' · ' + k.subject + ' · Year ' + k.year + ' · ' + k.ks,
        subLine: stHistory.length + ' assignments',
        tiles: [
          { label: 'Submissions', value: String(stMarked.length), sub: 'Of ' + kPapers.length + ' set this term' },
          { label: 'On time', value: MRB_ONTIME_VALUE(stOnTime, stLate),
            sub: stTimeSub },
          { label: 'Avg score', value: stAvg == null ? '—' : stAvg + '%', sub: 'Class mean ' + (kMean == null ? '—' : kMean + '%') },
          { label: 'Last active', value: st ? st.last : '—', sub: stHistory[0] && stHistory[0].status === 'In progress' ? stHistory[0].title : k.code + ' · ' + k.subject }
        ],
        history: stHistory
      },
      paper: pp ? {
        title: pp.title,
        eyebrow: k.code + ' · Set ' + pp.set + ' · Due ' + pp.due.replace('Due ', ''),
        tiles: [
          { label: 'Submitted', value: pp.sub, sub: pp.when === 'upcoming' ? 'Still open' : 'Marked automatically' },
          { label: 'Class mean', value: pp.mean, sub: pGrid ? pGrid.qLine : '' },
          { label: 'On time',
            value: pp.when === 'upcoming' ? '—'
              : MRB_ONTIME_VALUE(kMx.colOnTime[pp.idx], kMx.colLate[pp.idx]),
            sub: pp.when === 'upcoming' ? 'Not due yet'
              : MRB_ONTIME_SUB(kMx.colOnTime[pp.idx], kMx.colLate[pp.idx],
                               kMx.colLateUnknown[pp.idx], 'submitted') },
          { label: 'Lowest', value: worst ? worst.id + ' · ' + worst.pct + '%' : '—', sub: worst ? worst.text : '' }
        ],
        questions: questions.map(qq => ({
          id: qq.id, text: qq.text, pct: qq.pct == null ? 0 : qq.pct,
          label: qq.pct == null ? 'Not marked' : qq.pct + '%',
          worst: !!(worst && qq.pct != null && qq.id === worst.id),
          fill: qq.pct == null ? 'var(--st-rule-soft)'
            : (qq.pct < 50 ? 'var(--st-accent)' : (qq.pct < 70 ? 'var(--st-hatch-b)' : 'var(--ks3-ok)'))
        })),
        qids: questions.map(qq => ({ id: qq.id })),
        grid
      } : { title: '—', eyebrow: k.code, tiles: [], questions: [], qids: [], grid: [] },
      isInsights: s.screen === 'insights',
      insSub: chartScope === 'all'
        ? liveClasses.length + ' active classes · ' + totalStudents + ' students on roll'
        : k.code + ' · ' + k.n + ' students · ' + kPapers.length + ' assignments',
      insScopeTabs: [{ id: 'all', label: 'All classes' }, { id: k.id, label: k.code }].map(o => ({
        label: o.label,
        ...(chartScope === o.id
          ? { bg: 'var(--st-paper)', fg: 'var(--st-ink)', bc: 'var(--st-btn-border)' }
          : { bg: 'transparent', fg: 'var(--st-caption)', bc: 'transparent' }),
        pick: () => this.setState({ chartScope: o.id })
      })),
      insChips: this.CHART_KINDS.map(o => ({
        label: o.label,
        fg: chartKind === o.id ? 'var(--st-paper)' : 'var(--st-ink)',
        bg: chartKind === o.id ? 'var(--st-accent-text)' : 'var(--st-paper)',
        bc: chartKind === o.id ? 'var(--st-accent-text)' : 'var(--st-btn-border)',
        pick: () => this.setState({ chartKind: o.id })
      })),
      chart: {
        ...chart,
        isBars: chart.type === 'bars',
        isCols: chart.type === 'cols',
        isStack: chart.type === 'stack',
        hasLegend: chart.legend.length > 0,
        scopeLabel: chartScope === 'all' ? 'All classes' : k.code
      },
      openInsights: () => MRB_GO('insights', s.screen === 'class' ? { 'class': k && k.id } : {}),
      goBackFromInsights: () => MRB_BACK(),
      digestTitle: isClassReport ? k.code + ' report' : 'Weekly digest',
      digestTableTitle: isClassReport ? 'By assignment' : 'By class',
      digestColTitle: isClassReport ? 'Assignment' : 'Class',
      digestSub: isClassReport
        ? k.n + ' students · ' + kPapers.length + ' assignments this term'
        : this.CLASSES.length + ' classes · ' + totalStudents + ' students · ' + totalSubs + ' submissions',
      digestTiles: isClassReport ? [
        { label: 'Submissions', value: kAsked(0), sub: 'This week' },
        { label: 'Class mean', value: kMean == null ? '—' : kMean + '%', sub: 'Across ' + kMx.markedIdx.length + (kMx.markedIdx.length === 1 ? ' marked assignment' : ' marked assignments') },
        { label: 'On time', value: kMx.markedPct == null ? '—' : kMx.markedPct + '%', sub: MRB_LATE_LINE(kMx.markedLate, kMx.markedLateUnknown, kMx.markedSub, 'marked') },
        { label: 'Needs a look', value: String(kFlagged), sub: kFlagged ? 'Nothing in this week, and behind' : 'Everyone accounted for' }
      ] : [
        { label: 'Submissions', value: String(totalSubs), sub: 'Across ' + liveClasses.length + (liveClasses.length === 1 ? ' active class' : ' active classes') },
        { label: 'Mean score', value: liveClasses.length ? Math.round(liveClasses.reduce((a, c) => a + (this.meanOf(c) || 0), 0) / liveClasses.length) + '%' : '—', sub: 'Mean of ' + liveClasses.length + (liveClasses.length === 1 ? ' class mean' : ' class means') },
        { label: 'On time',
          value: dgOnPct == null ? '—' : dgOnPct + '%',
          sub: MRB_ONTIME_SUB(dgOnTime, dgLate, dgUnknown,
                              'marked submissions') },
        { label: 'Needs a look', value: String(liveClasses.reduce((a, c) => a + this.rosterFor(c).filter(r => r.flag).length, 0)), sub: 'Students with nothing in' }
      ],
      digestRows: isClassReport ? classReportRows : digestRows,
      importSteps: [1, 2, 3].map(n => {
        const on = s.importStep === n;
        const done = s.importStep > n;
        return {
          n: String(n), label: ['Upload', 'Map columns', 'Confirm'][n - 1],
          bg: on ? 'var(--st-paper)' : 'transparent',
          bc: on ? 'var(--st-edge)' : 'var(--st-rule-soft)',
          fg: on || done ? 'var(--st-ink)' : 'var(--st-caption)',
          numBg: on ? 'var(--st-accent-text)' : 'var(--st-num-well)',
          numFg: on ? 'var(--st-paper)' : 'var(--st-caption)'
        };
      }),
      imp1: s.importStep === 1,
      imp2: s.importStep === 2,
      imp3: s.importStep === 3,
      mapRows: MRB_DATA('IMPORT_MAP_ROWS'),
      previewRows: MRB_DATA('IMPORT_PREVIEW_ROWS'),
      bulkOpen: s.modal === 'bulk',
      searchOpen: s.modal === 'search',
      bulkStudents: kRoster.map(r => {
        const on = s.boSel.indexOf(r.id) > -1;
        return {
          name: r.name,
          fg: on ? 'var(--st-accent-text)' : 'var(--st-ink)',
          bg: on ? 'var(--st-chip-tint)' : 'var(--st-paper)',
          bc: on ? 'var(--st-chip-tint-border)' : 'var(--st-btn-border)',
          dot: on ? 'var(--st-accent)' : this.hueFor(r.name),
          toggle: () => this.setState({ boSel: on ? s.boSel.filter(x => x !== r.id) : s.boSel.concat([r.id]) })
        };
      }),
      bulkSummary: s.boSel.length + ' selected · ' + (this.TEMPLATES.filter(t => t.id === s.boTpl)[0] || { label: 'no template' }).label,
      bulkTop: () => this.setState({ boSel: kRoster.filter(r => r.inWeek).map(r => r.id) }),
      sendBulk: () => {
        const ids = (s.boSel || []).slice();
        if (!ids.length) {
          return this.ping('Pick at least one student'); }
        this.ping('Sending to ' + ids.length + '…');
        const cid = k && k.id;
        MRB_SEND_SHOUTOUTS(cid, ids, s.boTpl, null).then((r) => {
          if (!r.ok) {
            return this.ping(MRB_SHOUTOUT_WHY(r.error)); }
          if (r.fail) {
            /* The sheet stays open and the selection stays put: some of
               these children were told and some were not, and the teacher
               is the only one who can decide what to do about it. */
            return this.ping('Sent to ' + r.ok + ' of ' + ids.length +
              ' — ' + MRB_SHOUTOUT_WHY(r.error)); }
          MRB_REFRESH_FEED(cid).then(() => {
            this.setState({ modal: null, boSel: [],
              toast: 'Shoutout sent to ' + r.ok +
                (r.ok === 1 ? ' student' : ' students') });
          });
        });
      },
      searchPlaceholder: MRB_DATA('searchPlaceholder'),
      searchResults: results,
      searchFoot: results.length + ' of ' + pool.length + ' students · type to narrow',
      setSearch: (e) => this.setState({ search: e.target.value }),
      pickRecipient: (e) => this.setState({ recipient: e.target.value }),
      setNote: (e) => this.setState({ note: e.target.value }),
      sendShoutout: () => {
        const rid = s.recipient;
        const body = String(s.note || '').trim();
        if (!rid) { return this.ping('Pick a student first'); }
        if (!s.boTpl && !body) {
          return this.ping('Pick a template, or write a message'); }
        if (body.length > 500) {
          MRB_COMPOSE_ERROR('Message too long — 500 characters at most.');
          return this.ping('Message too long — 500 characters at most'); }
        MRB_COMPOSE_ERROR('');
        this.ping('Sending…');
        const cid = k && k.id;
        MRB_SEND_SHOUTOUTS(cid, [rid], s.boTpl, body || null)
          .then((r) => {
            if (!r.ok) {
              const why = MRB_SHOUTOUT_WHY(r.error);
              MRB_COMPOSE_ERROR(why);
              return this.ping(why);
            }
            /* Design's fields are uncontrolled and the runtime carries
               their values over a redraw, so the DOM is cleared before
               the state is. */
            MRB_COMPOSE_RESET();
            MRB_REFRESH_FEED(cid).then(() => {
              this.setState({ recipient: '', note: '', toast: '' });
            });
          });
      },
      hasToast: !!s.toast,
      toast: s.toast,
      signOut: () => window.MrBadmusTeacherGuard.signOut(),
      goClasses: () => MRB_GO('classes', {}),
      goClass: () => MRB_GO('class', { 'class': k && k.id }),
      goDigest: () => MRB_GO('digest', {}),
      goReport: () => MRB_GO('digest', { 'class': k && k.id }),
      goImport: () => MRB_GO('import', {}),
      goBackFromDigest: () => MRB_BACK(),
      doPrint: () => window.print(),
      openSearch: () => this.setState({ modal: 'search', search: '' }),
      openBulk: () => this.setState({ modal: 'bulk' }),
      closeModal: () => this.setState({ modal: null }),
      stop: (e) => e.stopPropagation(),
      impNext: () => this.setState({ importStep: Math.min(3, s.importStep + 1) }),
      impBack: () => this.setState({ importStep: Math.max(1, s.importStep - 1) }),
      impDone: () => {
        /* The REAL import is the live wizard's `#confirm-import`, which is carried
           into this page as a live region. Design's button is its PRESENTATION;
           this is the only seam a generated page can offer it. */
        window.dispatchEvent(new CustomEvent('mrb-import-confirm'));
        const line = MRB_DATA('importCountLabel');
        if (line) { this.ping(line); }
      },
      pastYears: () => { const ys = MRB_DATA('pastYears');
        return this.ping(ys.length
          ? ys.map(y => y.name).join(', ') + (ys.length === 1 ? ' is read-only' : ' are read-only')
          : 'No earlier years to open'); }
    };
  }
}
