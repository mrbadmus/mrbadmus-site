function cxPaintAccounts() {
  var host = cxEl('cx-pane-accounts');
  host.innerHTML = CX.detail ? cxDetailHtml() : cxAccountsListHtml();
  cxWireAccounts();
}

function cxWireAccounts() {
  var q = cxEl('cx-q');
  if (q) {
    var t = null;
    q.oninput = function () {
      CX.q = q.value;
      /* Debounced: the search is a server-side `q=` and a request per
         keystroke on a list this size is a request per keystroke. */
      if (t) { clearTimeout(t); }
      t = setTimeout(function () {
        cxLoadAccounts().then(cxPaintAccounts).catch(function (e) {
          cxFail(cxEl('cx-pane-accounts'), e.message, 'Refresh in a moment to try again.');
        });
      }, 300);
    };
  }
  var toggle = cxEl('cx-neworg-toggle');
  if (toggle) { toggle.onclick = function () { CX.showNewOrg = !CX.showNewOrg; cxPaintAccounts(); }; }
  var mk = cxEl('cx-neworg-go');
  if (mk) { mk.onclick = cxCreateOrg; }
  var back = cxEl('cx-detail-back');
  if (back) {
    back.onclick = function () {
      CX.detail = null; CX.detailId = null; CX.said = ''; CX.showResetPick = false;
      cxPaintAccounts();
    };
  }
  var resetGo = cxEl('cx-reset-go');
  if (resetGo) { resetGo.onclick = cxResetChildPassword; }
}

async function cxOpenAccount(id) {
  CX.detailId = id; CX.said = ''; CX.saidBad = false; CX.showResetPick = false;
  cxEl('cx-pane-accounts').innerHTML = '<p class="empty">Loading…</p>';
  try {
    var d = await consumerApi('/api/consumer/admin/accounts/' + encodeURIComponent(id));
    CX.detail = (d && d.account) || d;
    cxPaintAccounts();
  } catch (e) {
    CX.detail = null;
    cxFail(cxEl('cx-pane-accounts'), e.message, 'Go back and try again in a moment.');
  }
}

/* Every action is a POST whose result is a sentence, and every one of them
   writes an audit row the timeline then shows — so the detail is reloaded
   rather than patched, and the operator can SEE that what they did was
   recorded. */
async function cxRunAction(id) {
  var d = CX.detail;
  if (!d) { return; }
  if (id === 'reset-password') { CX.showResetPick = true; CX.said = ''; return cxPaintAccounts(); }

  var org = encodeURIComponent(d.id);
  var spec = {
    'extend-trial': { path: '/api/consumer/admin/orgs/' + org + '/extend-trial', body: { days: 7 },
                      said: 'Trial extended by 7 days.' },
    'resend':       { path: '/api/consumer/admin/orgs/' + org + '/resend-verification', body: {},
                      said: 'Verification email sent again.' },
    'human-marks':  { path: '/api/consumer/admin/orgs/' + org + '/human-marks', body: { add: 2 },
                      said: 'Two more human marks added this month.' },
    'unlock':       { path: '/api/consumer/admin/orgs/' + org + '/unlock', body: {},
                      said: 'Unlocked for 14 days, no charge.' }
  }[id];
  if (!spec) { return; }

  CX.said = 'Working…'; CX.saidBad = false; cxPaintAccounts();
  try {
    var out = await consumerApi(spec.path, { method: 'POST', body: spec.body });
    /* Two of these say something back that changes what the sentence means:
       extend-trial reports whether it moved a live Stripe trial or wrote a
       comp (`path`), and human-marks warns that its top-up outlives the
       month (`note`). Neither is decoration. */
    var extra = '';
    if (out && out.path === 'stripe') { extra = ' (moved on Stripe).'; }
    else if (out && out.path === 'comp') { extra = ' (as a comp — no Stripe trial to move).'; }
    if (out && out.note) { extra += ' ' + out.note; }
    var line = spec.said + extra + ' Logged to the timeline.';
    CX.said = line;
    CX.saidBad = false;
    await cxOpenAccount(d.id);
    CX.said = line;
    cxPaintAccounts();
  } catch (e) {
    CX.said = e.message;
    CX.saidBad = true;
    cxPaintAccounts();
  }
}

async function cxResetChildPassword() {
  var pick = cxEl('cx-reset-child');
  if (!pick) { return; }
  var child = pick.value;
  var btn = cxEl('cx-reset-go');
  btn.disabled = true;
  CX.said = 'Working…'; CX.saidBad = false;
  try {
    var out = await consumerApi('/api/consumer/admin/children/' + encodeURIComponent(child) + '/password',
                                { method: 'POST', body: {} });
    /* Shown ONCE — it is generated on the server, returned here and stored
       nowhere. Said out loud in full, because the operator is about to read
       it down a phone to a parent. */
    CX.said = 'New password, shown once: ' + ((out && out.password) || '(not returned)');
    CX.saidBad = false;
    CX.showResetPick = false;
    cxPaintAccounts();
  } catch (e) {
    CX.said = e.message;
    CX.saidBad = true;
    cxPaintAccounts();
  }
}

async function cxCreateOrg() {
  var msg = cxEl('cx-neworg-msg');
  var btn = cxEl('cx-neworg-go');
  var body = {
    name: cxEl('no-name').value.trim(),
    seat_cap: cxEl('no-seats').value.trim(),
    period_end: cxEl('no-end').value.trim(),
    contact_name: cxEl('no-cname').value.trim(),
    contact_email: cxEl('no-cemail').value.trim()
  };
  var domain = cxEl('no-domain').value.trim();
  if (domain) { body.email_domain = domain; }

  /* Validated here as well as on the backend, because a seat cap typed as
     "forty" and a period end typed as "next July" are both mistakes this
     page can catch without a round trip — and because §D3's 400s are the
     last place anyone would look for a typo. */
  if (!body.name) { msg.textContent = 'Give the organisation a name — nothing was created.'; return; }
  if (!/^\d+$/.test(body.seat_cap) || Number(body.seat_cap) < 1) {
    msg.textContent = 'The seat cap is a whole number of seats — nothing was created.'; return;
  }
  body.seat_cap = Number(body.seat_cap);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(body.period_end)) {
    msg.textContent = 'The period end is a date — nothing was created.'; return;
  }
  if (body.contact_email.indexOf('@') === -1) {
    msg.textContent = 'The contact needs an email address — nothing was created.'; return;
  }

  btn.disabled = true;
  msg.textContent = 'Creating…';
  try {
    var out = await consumerApi('/api/consumer/admin/orgs', { method: 'POST', body: body });
    /* The route creates four rows and reports anything it could not do —
       an academic year that already existed, a contact already on another
       school. Empty on a clean create. Said out loud rather than dropped:
       the whole point of creating an organisation from here rather than by
       SQL is that the person doing it can see what happened. */
    var warnings = (out && out.org && out.org.warnings) || [];
    CX.showNewOrg = false;
    await cxLoadAccounts();
    cxPaintAccounts();
    var m = cxEl('cx-neworg-msg');
    if (m) { m.textContent = warnings.length ? ('Created, with: ' + warnings.join(' ')) : 'Created.'; }
    if (out && out.org && out.org.id) {
      await cxOpenAccount(out.org.id);
      if (warnings.length) { CX.said = 'Created, with: ' + warnings.join(' '); CX.saidBad = true; cxPaintAccounts(); }
    }
  } catch (e) {
    btn.disabled = false;
    msg.textContent = e.message;
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   MARKING QUEUE
   ═══════════════════════════════════════════════════════════════════════ */

/* Design's four snippets, verbatim. They append rather than replace, so a
   marker can stack "Agree with the instant mark." onto their own sentence. */
var CX_SNIPPETS = [
  { label: 'Agree with instant mark', text: 'Agree with the instant mark. ' },
  { label: 'Name the term',           text: 'Name things. The marks are on the nouns. ' },
  { label: 'Finish the sentence',     text: 'You stop one sentence early. End every explanation with the "so what". ' },
  { label: 'Quote the equation',      text: 'Quote the equation first, then use it. ' }
];

/* Her `age(h)`: hours under a day, then days and hours. */
function cxAgeLabel(h) {
  if (h == null || isNaN(h)) { return '—'; }
  h = Math.max(0, Math.floor(h));
  return h < 24 ? (h + 'h') : (Math.floor(h / 24) + 'd ' + (h % 24) + 'h');
}
function cxHoursSince(iso) {
  if (!iso) { return null; }
  var t = new Date(iso).getTime();
  if (isNaN(t)) { return null; }
  return (Date.now() - t) / 3600000;
}

/* ⚠️ TWO SHAPES OF `ai.hits`, AND THE DIFFERENCE IS SILENT. The contract
   sends the AI's awarded points as an array of INDICES; Design's mock sends
   an array of BOOLEANS, one per scheme point. Read as indices, a boolean
   array becomes `hits[0]` and `hits[1]` (true → 1, false → 0) — a mark of
   one or two on every answer, plausible enough to ship and wrong every
   time. So the shape is sniffed rather than assumed. */
function cxHitsArray(ai, n) {
  var out = [];
  var i;
  for (i = 0; i < n; i++) { out.push(false); }
  var hits = (ai && ai.hits) || [];
  if (!hits.length) { return out; }
  var booleans = hits.every(function (h) { return typeof h === 'boolean'; });
  if (booleans) {
    for (i = 0; i < n; i++) { out[i] = !!hits[i]; }
  } else {
    hits.forEach(function (idx) {
      var k = Number(idx);
      if (!isNaN(k) && k >= 0 && k < n) { out[k] = true; }
    });
  }
  return out;
}

function cxHitsFor(row) {
  var scheme = ((row.question || {}).scheme) || [];
  if (CX.hits[row.id]) { return CX.hits[row.id].slice(); }
  return cxHitsArray(row.ai, scheme.length);
}

function cxSortedQueue() {
  var rows = ((CX.queue && CX.queue.pending) || []).slice();
  rows.forEach(function (r) { r._h = cxHoursSince(r.sent_at); });
  if (CX.sort === 'oldest')      { rows.sort(function (a, b) { return (b._h || 0) - (a._h || 0); }); }
  else if (CX.sort === 'newest') { rows.sort(function (a, b) { return (a._h || 0) - (b._h || 0); }); }
  else {
    rows.sort(function (a, b) {
      var ao = a.org ? 0 : 1, bo = b.org ? 0 : 1;
      return (ao - bo) || ((b._h || 0) - (a._h || 0));
    });
  }
  return rows;
}

function cxQueueItemHtml(r, isOpen) {
  var kid = r.child || {};
  var q = r.question || {};
  var late = (r._h != null && r._h > 48);
  var ai = cxHitsArray(r.ai, (q.scheme || []).length).filter(Boolean).length;
  return '<button type="button" class="cx-qitem' + (isOpen ? ' is-open' : '') + (late ? ' is-late' : '') + '" ' +
    'data-answer="' + escapeHtml(r.id) + '">' +
    '<div class="cx-qmeta"><span class="who">' + escapeHtml(kid.name || 'A child') + '</span>' +
      '<span>Y' + escapeHtml(cxDash(kid.year)) + '</span>' +
      '<span class="age' + (late ? ' late' : '') + '">' + escapeHtml(cxAgeLabel(r._h)) + '</span></div>' +
    '<p class="cx-qtext">' + escapeHtml(q.text || '') + '</p>' +
    '<div class="cx-qfoot"><span>' + escapeHtml(cxNum(q.marks)) + ' marks</span>' +
      '<span>· instant ' + ai + '/' + escapeHtml(cxNum(q.marks)) + '</span>' +
      (r.org ? ('<span>· ' + escapeHtml(cxOrgName(r)) + '</span>') : '') +
    '</div>' +
  '</button>';
}

function cxMarkingHtml() {
  var rows = cxSortedQueue();
  var cur = rows.filter(function (r) { return r.id === CX.currentId; })[0] || rows[0] || null;
  if (cur) { CX.currentId = cur.id; }

  var oldest = rows.length ? cxAgeLabel(Math.max.apply(null, rows.map(function (r) { return r._h || 0; }))) : '–';

  var sorts = [
    { id: 'oldest', label: 'Oldest first' },
    { id: 'newest', label: 'Newest' },
    { id: 'org',    label: 'Organisations' }
  ];

  var aside =
    '<aside class="cx-queue">' +
      '<div class="cx-qhead">' +
        '<div style="display:flex;align-items:baseline;gap:10px;">' +
          '<h1 class="cx-h1" style="font-size:26px;">Queue</h1>' +
          '<span class="ac-mono" style="color:var(--ks3-on-dark-muted);">' + rows.length + ' waiting</span></div>' +
        '<div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;">' +
          sorts.map(function (s) {
            return '<button type="button" class="cx-fpill" data-sort="' + s.id + '" ' +
              'aria-pressed="' + (CX.sort === s.id ? 'true' : 'false') + '">' + escapeHtml(s.label) + '</button>';
          }).join('') +
        '</div>' +
      '</div>' +
      '<div class="cx-qscroll">' +
        (rows.length
          ? rows.map(function (r) { return cxQueueItemHtml(r, cur && r.id === cur.id); }).join('')
          : '<p class="empty" style="padding:40px 20px;text-align:center;">Queue clear. Nothing older than today.</p>') +
      '</div>' +
      '<div class="cx-qfootline">Marked today: <strong>' + CX.markedToday + '</strong> · Oldest: <strong>' +
        escapeHtml(oldest) + '</strong> · SLA 3 school days</div>' +
    '</aside>';

  var mobile = rows.length
    ? '<div class="cx-mlist"><select class="cx-mselect" id="cx-mpick" aria-label="Answer to mark">' +
      rows.map(function (r) {
        var kid = r.child || {};
        return '<option value="' + escapeHtml(r.id) + '"' + (cur && r.id === cur.id ? ' selected' : '') + '>' +
          escapeHtml((kid.name || 'A child') + ' · ' + cxAgeLabel(r._h) + ' · ' + ((r.question || {}).topic || '')) +
          '</option>';
      }).join('') + '</select></div>'
    : '';

  return '<div class="cx-shell">' + aside + mobile +
    '<main class="cx-pane">' + (cur ? cxPaneHtml(cur) : cxAllMarkedHtml()) + '</main></div>';
}

function cxAllMarkedHtml() {
  return '<div class="cx-allmarked"><p>All marked.</p>' +
    '<p class="cx-note">' + CX.markedToday + ' today. The queue refills as children send answers.</p></div>';
}

function cxPaneHtml(r) {
  var kid = r.child || {};
  var q = r.question || {};
  var scheme = q.scheme || [];
  var hits = cxHitsFor(r);
  var aiHits = cxHitsArray(r.ai, scheme.length);
  var aiScore = aiHits.filter(Boolean).length;
  /* The score IS the count of awarded points, clamped to the question's
     marks — never a number typed into a box. A typed digit can disagree with
     the ticks above it; a count cannot. */
  var mine = Math.min(hits.filter(Boolean).length, q.marks == null ? 99 : Number(q.marks));
  var note = CX.notes[r.id] || '';
  var canSend = note.trim().length >= 10;
  var parents = (r.parent_names || []).filter(Boolean);

  return '' +
    '<div class="cx-cur-head">' +
      '<span class="cx-cur-initial">' + escapeHtml((kid.name || '?').charAt(0)) + '</span>' +
      '<span><strong style="color:var(--st-room-text);font-size:16px;">' + escapeHtml(kid.name || 'A child') +
        '</strong> · Year ' + escapeHtml(cxDash(kid.year)) +
        (kid.mode ? (' · ' + escapeHtml(kid.mode)) : '') +
        ' · sent ' + escapeHtml(cxAgeLabel(r._h)) + ' ago</span>' +
      /* Design linked this to "#". There is no operator route that lists one
         child's answers, so it is a count rather than a dead link. */
      '<span class="ac-muted" style="margin-left:auto;">Previous answers: ' +
        escapeHtml(cxNum(r.prev_count)) + '</span>' +
    '</div>' +
    '<p class="cx-eyebrow" style="margin-top:18px;">' +
      escapeHtml([q.topic, (q.marks != null ? q.marks + ' marks' : null), kid.board]
        .filter(Boolean).join(' · ')) + '</p>' +
    '<h2 class="cx-q2">' + escapeHtml(q.text || '') + '</h2>' +

    '<div class="cx-panels">' +
      '<section class="cx-panel">' +
        '<p class="cx-eyebrow">' + escapeHtml(kid.name || 'They') + ' wrote</p>' +
        '<p class="cx-wrote">' + escapeHtml(r.answer || '') + '</p>' +
      '</section>' +
      '<section class="cx-panel">' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;">' +
          '<p class="cx-eyebrow">Mark scheme · instant mark ' + aiScore + '/' + escapeHtml(cxNum(q.marks)) + '</p>' +
          '<span class="cx-score" id="cx-myscore">' + mine +
            '<small>/' + escapeHtml(cxNum(q.marks)) + '</small></span>' +
        '</div>' +
        (scheme.length
          ? '<ul class="cx-points">' + scheme.map(function (pt, i) {
              var on = !!hits[i];
              var diff = (on !== !!aiHits[i]) ? (on ? 'you +1' : 'you −1') : '';
              return '<li><button type="button" class="cx-point' + (on ? ' on' : '') + '" ' +
                'data-point="' + i + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
                '<span class="cx-box">' + (on ? cxTick() : '') + '</span>' +
                '<span class="txt">' + escapeHtml(cxSchemeText(pt)) + '</span>' +
                (diff ? ('<span class="diff">' + escapeHtml(diff) + '</span>') : '') +
                '</button></li>';
            }).join('') + '</ul>'
          : '<p class="cx-note">This question has no mark scheme on record.</p>') +
        '<p class="cx-note">Tap a point to award or remove it. Starts from the instant mark.</p>' +
      '</section>' +
    '</div>' +

    '<section class="cx-panel" style="margin-top:16px;">' +
      '<p class="cx-eyebrow">Your note to ' + escapeHtml(kid.name || 'them') + '</p>' +
      '<textarea class="cx-ta" id="cx-note" rows="4" ' +
        'placeholder="Two or three lines. What they did right, then the one thing to change.">' +
        escapeHtml(note) + '</textarea>' +
      '<div class="cx-snips">' + CX_SNIPPETS.map(function (s, i) {
        return '<button type="button" class="cx-snip" data-snip="' + i + '">' + escapeHtml(s.label) + '</button>';
      }).join('') + '</div>' +
      '<div class="cx-sendrow">' +
        '<button type="button" class="cx-send" id="cx-send"' + (canSend ? '' : ' disabled') + '>' +
          'Send mark · ' + mine + '/' + escapeHtml(cxNum(q.marks)) + '</button>' +
        '<button type="button" class="cx-skip" id="cx-skip">Skip for now</button>' +
        '<span class="cx-sends-to">Sends to ' + escapeHtml(kid.name || 'them') +
          (parents.length ? (' and emails ' + escapeHtml(parents.join(' and '))) : '') + '.</span>' +
      '</div>' +
      '<p class="cx-note" id="cx-send-msg"></p>' +
    '</section>';
}

function cxPaintMarking() {
  var host = cxEl('cx-pane-marking');
  host.innerHTML = cxMarkingHtml();
  cxWireMarking();
}

function cxWireMarking() {
  var pick = cxEl('cx-mpick');
  if (pick) { pick.onchange = function () { CX.currentId = pick.value; cxPaintMarking(); }; }

  var note = cxEl('cx-note');
  if (note) {
    note.oninput = function () {
      CX.notes[CX.currentId] = note.value;
      /* Only the send button changes, so the textarea is not re-rendered
         and the caret does not jump to the end mid-sentence. */
      var send = cxEl('cx-send');
      if (send) { send.disabled = note.value.trim().length < 10; }
    };
  }
  var send = cxEl('cx-send');
  if (send) { send.onclick = cxSendMark; }
  var skip = cxEl('cx-skip');
  if (skip) { skip.onclick = cxSkip; }
}

function cxCurrentRow() {
  return ((CX.queue && CX.queue.pending) || []).filter(function (r) { return r.id === CX.currentId; })[0] || null;
}

function cxTogglePoint(i) {
  var r = cxCurrentRow();
  if (!r) { return; }
  var hits = cxHitsFor(r);
  hits[i] = !hits[i];
  CX.hits[r.id] = hits;
  cxPaintMarking();
}

function cxUseSnippet(i) {
  var s = CX_SNIPPETS[i];
  if (!s) { return; }
  var cur = CX.notes[CX.currentId] || '';
  CX.notes[CX.currentId] = (cur ? cur.replace(/\s*$/, ' ') : '') + s.text;
  cxPaintMarking();
}

function cxSkip() {
  var rows = cxSortedQueue();
  if (rows.length < 2) { return; }
  var i = rows.findIndex(function (r) { return r.id === CX.currentId; });
  CX.currentId = rows[(i + 1) % rows.length].id;
  cxPaintMarking();
}

async function cxSendMark() {
  var r = cxCurrentRow();
  if (!r) { return; }
  var q = r.question || {};
  var note = (CX.notes[r.id] || '').trim();
  var msg = cxEl('cx-send-msg');
  /* Both guards are also on the backend. They are here because a mark sent
     with no note is a number a child cannot learn anything from, and the
     backend's 400 `feedback_required` is the last place anyone would look
     for the reason the button did nothing. */
  if (note.length < 10) { msg.textContent = 'Write a line or two first — nothing was sent.'; return; }
  var hits = cxHitsFor(r);
  var score = Math.min(hits.filter(Boolean).length, q.marks == null ? 99 : Number(q.marks));

  var btn = cxEl('cx-send');
  btn.disabled = true;
  msg.textContent = 'Sending…';
  try {
    await consumerApi('/api/consumer/admin/exam-answers/' + encodeURIComponent(r.id) + '/mb-mark',
                      { method: 'POST', body: { score: score, feedback: note } });
    CX.markedToday += 1;
    delete CX.hits[r.id];
    delete CX.notes[r.id];
    CX.currentId = null;
    CX.queue = await consumerApi('/api/consumer/admin/mb-queue');
    cxPaintMarking();
  } catch (e) {
    btn.disabled = false;
    msg.textContent = e.message;
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   THE THREE KEPT DRAWERS — MRB-312/314/315.
   Loaded on first open, not on page load: three more requests behind a
   closed <details> is three requests nobody asked for.
   ═══════════════════════════════════════════════════════════════════════ */

async function cxRenderUsage() {
  return cxSection('cx-usage', async function (host) {
    var d = await consumerApi('/api/consumer/admin/usage');
    var rows = (d && (d.usage || d.orgs || d.rows)) || (Array.isArray(d) ? d : []);
    if (!rows.length) {
      host.innerHTML = '<p class="empty">No AI usage recorded yet this month.</p>';
      return;
    }

    var table =
      '<div class="cx-scroll"><table class="cx-table"><thead><tr>' +
        '<th>Account</th><th>Tutor</th><th>Marks</th><th>Explains</th>' +
        '<th>Tokens in</th><th>Tokens out</th><th>Cost (est.)</th>' +
      '</tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr>' +
          '<td>' + escapeHtml(cxOrgName(r)) + '</td>' +
          '<td class="num">' + escapeHtml(cxNum(r.tutor_turns)) + '</td>' +
          '<td class="num">' + escapeHtml(cxNum(r.ai_marks)) + '</td>' +
          '<td class="num">' + escapeHtml(cxNum(r.explains)) + '</td>' +
          '<td class="num">' + escapeHtml(cxNum(r.input_tokens)) + '</td>' +
          '<td class="num">' + escapeHtml(cxNum(r.output_tokens)) + '</td>' +
          '<td class="num">' + escapeHtml(cxPence(r.cost_pence_estimate)) + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="cx-note">Cost is an ESTIMATE, from token counts at the ' +
      'published rate — not an invoice.</p>';

    /* The editors sit under the table rather than inside it, because a row
       of number inputs inside a horizontally-scrolling table is a form you
       cannot see while you fill it in on a phone. */
    var editors = rows.map(function (r) {
      var id = (r.org && r.org.id) || r.org_id || r.id;
      var lim = r.limits || {};
      if (!id) { return ''; }
      return '<div class="cx-block" data-org="' + escapeHtml(id) + '">' +
        '<div class="cx-t">' + escapeHtml(cxOrgName(r, id)) + '</div>' +
        '<div class="cx-fields">' +
          '<label>Tutor turns a day<input class="cx-in" type="number" min="0" ' +
            'inputmode="numeric" data-lim="tutor_turns_per_day" value="' +
            escapeHtml(lim.tutor_turns_per_day != null ? String(lim.tutor_turns_per_day) : '') +
            '" placeholder="platform default"/></label>' +
          '<label>AI marks a month<input class="cx-in" type="number" min="0" ' +
            'inputmode="numeric" data-lim="ai_marks_per_month" value="' +
            escapeHtml(lim.ai_marks_per_month != null ? String(lim.ai_marks_per_month) : '') +
            '" placeholder="platform default"/></label>' +
          '<label>Mr Badmus marks a month<input class="cx-in" type="number" min="0" ' +
            'inputmode="numeric" data-lim="mb_marks_per_month" value="' +
            escapeHtml(lim.mb_marks_per_month != null ? String(lim.mb_marks_per_month) : '') +
            '" placeholder="platform default"/></label>' +
        '</div>' +
        '<label class="cx-check">' +
          '<input type="checkbox" data-enforce' +
          ((r.enforce || lim.enforce) ? ' checked' : '') + '/>' +
          '<span>Actually refuse when a cap is reached</span>' +
        '</label>' +
        '<button class="cx-btn plain" type="button" data-limits>Save limits</button>' +
        '<p class="cx-note" data-msg></p>' +
      '</div>';
    }).join('');

    host.innerHTML = table + '<h3 class="cx-sub" style="margin-top:18px;">Caps</h3>' + editors;

    host.onclick = function (ev) {
      var btn = ev.target.closest ? ev.target.closest('button[data-limits]') : null;
      if (!btn) { return; }
      var block = btn.closest('.cx-block');
      var id = block.getAttribute('data-org');
      var msgEl = block.querySelector('[data-msg]');
      var body = { enforce: block.querySelector('[data-enforce]').checked };
      var bad = false;
      Array.prototype.forEach.call(block.querySelectorAll('[data-lim]'), function (el) {
        var v = String(el.value).trim();
        /* ⚠️ `validity.badInput` FIRST, and it is not belt-and-braces. These
           are `type="number"` inputs, and a number input containing "abc"
           reports `value === ''` — the letters are on screen, and the DOM
           says the field is empty. Without this check the branch below reads
           that as "blank", which means "use the platform default", so typing
           nonsense into a cap would have cleared the cap and reported
           "Saved." Driving it found exactly that. */
        if (el.validity && el.validity.badInput) { bad = true; return; }
        /* Blank means "use the platform default", and is sent as null so the
           backend can tell it apart from a deliberate zero — which means
           "none at all" and is a completely different instruction. */
        if (v === '') { body[el.getAttribute('data-lim')] = null; return; }
        if (!/^\d+$/.test(v)) { bad = true; return; }
        body[el.getAttribute('data-lim')] = Number(v);
      });
      if (bad) {
        msgEl.textContent = 'Limits must be whole numbers (or blank for the default). Nothing was saved.';
        return;
      }
      btn.disabled = true;
      msgEl.textContent = 'Saving…';
      consumerApi('/api/consumer/admin/orgs/' + encodeURIComponent(id) + '/limits', {
        method: 'POST', body: body
      }).then(function () {
        btn.disabled = false;
        msgEl.textContent = 'Saved.';
      }).catch(function (e) {
        btn.disabled = false;
        msgEl.textContent = e.message;
      });
    };
  });
}

async function cxRenderEmails() {
  return cxSection('cx-emails', async function (host) {
    var d = await consumerApi('/api/consumer/admin/emails?limit=50');
    var rows = (d && (d.emails || d.log || d.rows)) || (Array.isArray(d) ? d : []);
    if (!rows.length) {
      host.innerHTML = '<p class="empty">No emails logged yet.</p>';
      return;
    }
    host.innerHTML =
      '<div class="cx-scroll"><table class="cx-table"><thead><tr>' +
        '<th>When</th><th>Type</th><th>To</th><th>Subject</th><th>Outcome</th>' +
      '</tr></thead><tbody>' +
      rows.map(function (r) {
        var out = String(r.outcome || r.status || '');
        return '<tr>' +
          '<td>' + escapeHtml(r.created_at ? dateLabel(r.created_at) : '—') + '</td>' +
          '<td>' + escapeHtml(r.type || '—') + '</td>' +
          '<td>' + escapeHtml(r.recipient_email || r.to_email || r.to || '—') + '</td>' +
          '<td style="white-space:normal;">' + escapeHtml(r.subject || '—') + '</td>' +
          '<td>' + escapeHtml(out || '—') + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="cx-note">“dry_run” means no email key is configured in this ' +
      'environment, so the message was rendered and logged but never sent. ' +
      '“skipped” means the recipient was a child — we never email children.</p>';
  });
}

function cxWireReportNote() {
  var btn = cxEl('cx-note-save');
  if (!btn || btn.dataset.wired) { return; }
  btn.dataset.wired = '1';
  btn.addEventListener('click', function () {
    var child = cxEl('cx-note-child').value.trim();
    var term  = cxEl('cx-note-term').value.trim();
    var text  = cxEl('cx-note-text').value.trim();
    var msg   = cxEl('cx-note-msg');
    if (!child) { msg.textContent = 'A child id is needed — nothing was saved.'; return; }
    if (!/^[a-z]+-\d{4}$/i.test(term)) {
      msg.textContent = 'The term looks like “autumn-2026”. Nothing was saved.';
      return;
    }
    if (!text) { msg.textContent = 'Write the note first — nothing was saved.'; return; }
    btn.disabled = true;
    msg.textContent = 'Saving…';
    consumerApi('/api/consumer/admin/children/' + encodeURIComponent(child) + '/report-note', {
      method: 'POST', body: { term: term, note: text }
    }).then(function () {
      btn.disabled = false;
      msg.textContent = 'Saved. It appears on that term’s report.';
    }).catch(function (e) {
      btn.disabled = false;
      msg.textContent = e.message;
    });
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   TABS, DELEGATION, AND THE ENTRY POINT
   ═══════════════════════════════════════════════════════════════════════ */

function cxShowTab(name) {
  CX.tab = name;
  Array.prototype.forEach.call(document.querySelectorAll('#cx-tabs button'), function (b) {
    b.setAttribute('aria-selected', b.getAttribute('data-tab') === name ? 'true' : 'false');
  });
  cxEl('cx-pane-marking').hidden  = (name !== 'marking');
  cxEl('cx-pane-accounts').hidden = (name !== 'accounts');
}

/* ONE delegated listener for the whole card. The panes are re-rendered on
   every interaction, so per-node handlers would be re-bound each time and
   left behind on detached nodes. */
function cxWireCard() {
  var card = cxEl('consumer-card');
  card.addEventListener('click', function (ev) {
    var t = ev.target;
    if (!t || !t.closest) { return; }
    var b;
    if ((b = t.closest('#cx-tabs button'))) { return cxShowTab(b.getAttribute('data-tab')); }
    if ((b = t.closest('[data-filter]'))) {
      CX.filter = b.getAttribute('data-filter');
      cxEl('cx-pane-accounts').innerHTML = '<p class="empty">Loading…</p>';
      return cxLoadAccounts().then(cxPaintAccounts).catch(function (e) {
        cxFail(cxEl('cx-pane-accounts'), e.message, 'Refresh in a moment to try again.');
      });
    }
    if ((b = t.closest('[data-account]'))) { return cxOpenAccount(b.getAttribute('data-account')); }
    if ((b = t.closest('[data-action]')))  { return cxRunAction(b.getAttribute('data-action')); }
    if ((b = t.closest('[data-sort]')))    { CX.sort = b.getAttribute('data-sort'); return cxPaintMarking(); }
    if ((b = t.closest('[data-answer]')))  { CX.currentId = b.getAttribute('data-answer'); return cxPaintMarking(); }
    if ((b = t.closest('[data-point]')))   { return cxTogglePoint(Number(b.getAttribute('data-point'))); }
    if ((b = t.closest('[data-snip]')))    { return cxUseSnippet(Number(b.getAttribute('data-snip'))); }
  });

  /* The drawers load on first open. `toggle` fires for both directions, so
     the guard is the flag rather than the direction. */
  var loaded = {};
  Array.prototype.forEach.call(card.querySelectorAll('.cx-drawer'), function (d) {
    d.addEventListener('toggle', function () {
      if (!d.open) { return; }
      var body = d.querySelector('div[id]');
      if (!body || loaded[body.id]) { return; }
      loaded[body.id] = true;
      if (body.id === 'cx-usage')       { cxRenderUsage(); }
      if (body.id === 'cx-emails')      { cxRenderEmails(); }
      if (body.id === 'cx-report-note') { cxWireReportNote(); }
    });
  });
}

async function renderConsumer() {
  if (!consumerEnabled()) { return; }        // see the header: nothing, not even a request

  cxEl('consumer-card').style.display = 'block';
  cxWireCard();
  cxShowTab('marking');

  /* Both screens load in parallel and each fails alone, for the reason
     `cxSection` gives: the accounts tab being down must not take the queue
     with it, and vice versa. */
  await Promise.all([
    cxSection('cx-pane-marking', async function () {
      CX.queue = await consumerApi('/api/consumer/admin/mb-queue');
      cxPaintMarking();
    }),
    cxSection('cx-pane-accounts', async function () {
      await cxLoadAccounts();
      cxPaintAccounts();
    })
  ]);
}

MrBadmusTeacherGuard.requireTeacherRole({
  onAllowed: async function (ctx) {
    sb = MrBadmusTeacherGuard.getClient();
    uid = ctx.user.id;

    if (window.MrBadmusConfig.environment === 'test') {
      var pill = document.getElementById('env-pill');
      pill.className = 'pill env-test';
      pill.style.display = 'inline-block';
    }

    /* THE GUARD ABOVE ONLY PROVED "a teacher". This is the admin gate, and
       it is the same predicate the nav link uses. Fail-closed: any error
       inside `isAdmin` returns false, so a network blip refuses rather than
       admits. */
    var ok = false;
    try { ok = await window.MrBadmusAdminScope.isAdmin(sb, uid); }
    catch (e) { ok = false; }

    if (!ok) {
      notice('This page is for school admins',
             'Your account doesn’t have school admin access, so there’s ' +
             'nothing for you here. Your own classes are on the My classes page.');
      return;
    }

    try {
      await render(ctx);
    } catch (e) {
      console.error('[admin]', e);
      /* An honest failure, in the same plain voice as the refusal. It must
         not be mistaken for "you have no access" — that would send an admin
         to ask for a permission they already hold. */
      notice('We couldn’t load the school right now',
             'Something went wrong fetching your school’s teachers and ' +
             'classes. Please refresh the page in a moment.');
      return;
    }

    /* MRB-308 — LAST, AND SEPARATELY CAUGHT. The school view above is the
       reason anyone opens this page; the consumer card is an extra. It
       runs only after the school view has rendered, and its own failures
       are handled inside it, so nothing about the consumer product can
       blank the teachers and classes lists. Returns immediately when the
       launch flag is off. */
    try {
      await renderConsumer();
    } catch (e) {
      console.error('[admin/consumer]', e);
    }
  },
});
</script>
