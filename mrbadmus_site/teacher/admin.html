<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#F7F1E5"/>
  <title>School — Mr Badmus AI</title>
  <link rel="preload" href="/shared/fonts/fraunces-var-latin.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="/shared/fonts/plus-jakarta-sans-var-latin.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="stylesheet" href="/shared/tokens.css?v=bbfbe9e0"/>
  <style>
    html { background: var(--bg); }
    :root {
      --darker: var(--bg);
      --dark:   var(--sunken);
      --card2:  var(--sunken);
      --shadow: var(--shadow-card);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--darker);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      padding: 80px 20px 60px;
      /* Hidden until the guard's onAllowed fires AND the admin-scope check
         answers. Fail-closed: if the guard bounces, the scope check refuses,
         or JS fails outright, the page never reveals school-wide staff data.
         The refusal state reveals the body too — see `notice()` — so a
         legitimate teacher who lands here gets a sentence, never a page that
         stays blank and looks broken. */
      display: none;
    }

    nav.top-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .pill.env-test { background: var(--higher-soft); color: var(--higher); }
    .pill.env-prod { background: var(--sunken); color: var(--muted); }
    .signout-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 8px;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .signout-btn:hover { border-color: var(--danger); color: var(--danger); }

    .container { max-width: 980px; margin: 0 auto; }
    .page-header { margin-bottom: 10px; }
    .page-header h1 {
      font-family: var(--font-serif);
      font-optical-sizing: auto;
      font-weight: 600;
      letter-spacing: -0.01em;
      font-size: 1.7rem;
    }
    .page-sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 28px; }
    .page-sub .sep { padding: 0 6px; opacity: 0.6; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 26px 30px;
      margin-bottom: 22px;
    }
    .card h2 {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* At a glance */
    .stats { display: flex; flex-wrap: wrap; gap: 12px; }
    .stat {
      flex: 1 1 150px;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }
    .stat .n { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
    .stat .l {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }

    /* A row — used for both teachers and classes. Flex, not a table, so it
       reflows at 390px instead of scrolling sideways. */
    .row {
      display: flex;
      align-items: baseline;
      gap: 10px 14px;
      flex-wrap: wrap;
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }
    .row:first-of-type { border-top: none; }
    .row .name { font-weight: 700; font-size: 1rem; }
    .row .meta { color: var(--muted); font-size: 0.84rem; }
    .row .right { margin-left: auto; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }

    /* Classes card: one heading per year group, each a fresh "table" of
       rows — the first row under a heading gets no top border of its own
       (`.row:first-of-type` is scoped per parent), so the heading is the
       only divider between one year and the next. */
    .year-heading {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 22px;
      padding: 16px 0 8px;
      border-top: 2px solid var(--text);
    }
    .year-group:first-child .year-heading { border-top: none; margin-top: 0; padding-top: 0; }
    @media (max-width: 560px) {
      body { padding: 76px 14px 50px; }
      .card { padding: 20px 16px; }
      .row .right { margin-left: 0; width: 100%; }
      /* At 390px the nav has no room to be generous. Without these three the
         wordmark and "My classes" run into each other with no gap at all, and
         "Sign out" wraps onto a second line — which makes the bar two rows
         tall and tucks the page heading underneath the fixed nav. The
         `gap` separates them, `nowrap` keeps each control on one line. */
      nav.top-nav { padding: 10px 14px; gap: 12px; }
      nav.top-nav > a { white-space: nowrap; }
      .nav-right { gap: 8px; }
      .nav-right a, .signout-btn { white-space: nowrap; }
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: var(--sunken);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .tag.pending { background: var(--higher-soft); color: var(--higher); border-color: transparent; }
    .tag.you     { background: var(--accent); color: var(--on-accent); border-color: transparent; }

    .classlist { color: var(--muted); font-size: 0.84rem; }
    .count { font-variant-numeric: tabular-nums; font-weight: 700; }
    .muted { color: var(--muted); }
    .empty { color: var(--muted); font-size: 0.9rem; }

    a.classlink { color: var(--text); text-decoration: none; font-weight: 700; }
    a.classlink:hover { color: var(--accent); text-decoration: underline; }

    /* The refusal, and the honest-failure state. Plain words, no codes. */
    .notice { max-width: 620px; margin: 40px auto; text-align: center; }
    .notice h1 {
      font-family: var(--font-serif);
      font-optical-sizing: auto;
      font-weight: 600;
      font-size: 1.5rem;
      margin-bottom: 10px;
    }
    .notice p { color: var(--muted); font-size: 1rem; line-height: 1.6; }
    .notice a { color: var(--accent); font-weight: 700; }


    /* ═══════════════════════════════════════════════════════════════════
       MRB-317 Night 3 — THE CONSUMER CARD IS A DARK ROOM.

       Everything under `#consumer-card` is Claude Design's `Admin
       Accounts.dc.html` and `Admin Marking Queue.dc.html`, which she drew
       on the 3D-studio's dark palette rather than on this page's cream
       one. That is a deliberate difference and not drift: the school view
       above is a read-only record a head of department looks at once a
       term, and this is the operator console Mide marks in, at night,
       between lessons. Two jobs, two rooms.

       ── THE FOUR IMPORTED TOKENS ───────────────────────────────────────
       `--st-room`, `--st-room-panel`, `--st-room-text` and `--st-ember`
       are the ONLY values copied out of Design's
       `_ds/tokens/src-styles-tokens.css`, because they are the only
       `--st-*` names her two admin surfaces use (verified by grep). They
       are scoped to `#consumer-card` rather than to `:root` so that
       nothing above the card can pick them up by accident. Every other
       colour on these two screens is already a `--ks3-*` token out of
       /shared/tokens.css, which this page loads — `--ks3-dark-rule`,
       `--ks3-on-dark-muted`, `--ks3-on-dark-body`, `--ks3-dark-panel`,
       `--ks3-ok`, `--ks3-accent`, `--ks3-ink`, and the three font faces.

       ⚠️ PHONE-FIRST, AND THAT IS A WORKING FACT RATHER THAN A PREFERENCE.
       The marking queue is where Mide marks a child's exam answer, and he
       does that between lessons, on a phone, standing up. So: 44px minimum
       on anything you press, 16px on every text input (below 16px iOS
       Safari zooms the whole page on focus, which throws away the layout
       mid-mark), one column until there is genuinely room for two, and no
       table that has to be scrolled sideways to find the number you were
       reading. Design's own sizes are 13–15px on several controls; where
       hers falls under those floors, the floor wins and the deviation is
       recorded here.
       ═══════════════════════════════════════════════════════════════════ */
    #consumer-card {
      /* Design's four. */
      --st-room:       #15110C;
      --st-room-panel: #1E1913;
      --st-room-text:  #B7AA98;
      --st-ember:      #F2946E;
      /* Her two page-level literals: the link colour and the placeholder
         grey. Neither is an --st-* name in her tokens file; both are
         written straight into the page-level styles of both admin surfaces. */
      --cx-link:        #F4B860;
      --cx-placeholder: #8A7F72;

      background: var(--st-room);
      color: var(--st-room-text);
      border-color: #000;
      font-family: var(--ks3-font-body);
      font-size: 16px;
      line-height: 1.5;
      padding: 0;
      overflow: hidden;
    }
    #consumer-card a { color: var(--cx-link); text-decoration: none; }
    #consumer-card a:hover { color: #F6EEDF; }
    #consumer-card input, #consumer-card textarea,
    #consumer-card button, #consumer-card select { font: inherit; }
    #consumer-card input::placeholder,
    #consumer-card textarea::placeholder { color: var(--cx-placeholder); }
    /* ⚠️ ID-SCOPED ON PURPOSE, AND FOUND BY MEASURING IT. The `font: inherit`
       reset two rules above is `#consumer-card input` — an ID selector — and
       it BEATS every class rule below, so `.cx-in { font-size: 16px }` lost
       to the 0.78rem set on its own <label> and the report-note fields
       rendered at 12.48px. That is under the 16px floor at which iOS Safari
       zooms the whole page on focus, on the one card that exists to be used
       on a phone. Measured at a 390px viewport by the Night 3 drive. */
    #consumer-card .cx-in, #consumer-card .cx-ta,
    #consumer-card .cx-search, #consumer-card .cx-mselect { font-size: 16px; }
    #consumer-card .empty { color: var(--ks3-on-dark-muted); }

    /* ── the room's own header + tabs ─────────────────────────────────── */
    .cx-head {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 16px 20px;
      border-bottom: 1px solid var(--ks3-dark-rule);
      background: var(--st-room-panel);
    }
    /* ⚠️ "MrBadmus", not "MrBadmusAI". The nav wordmark at the top of this
       page belongs to the SCHOOL admin surface and keeps its "AI"; this one
       belongs to the consumer product, where the short form is the ruling
       (see consumer-common.js). No chevron either way — a staff surface
       carries the wordmark alone. */
    .cx-word {
      font-family: var(--ks3-font-display); font-weight: 800;
      font-size: 20px; letter-spacing: -0.02em; color: var(--st-room-text);
    }
    .cx-pill-admin {
      padding: 3px 9px; border: 1px solid var(--ks3-dark-rule); border-radius: 99px;
      font-family: var(--ks3-font-mono); font-size: 11px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--st-ember);
    }
    .cx-tabs { display: flex; gap: 18px; margin-left: 10px; }
    .cx-tabs button {
      min-height: 44px; padding: 0; border: 0; background: none;
      font-weight: 600; font-size: 15px; color: var(--ks3-on-dark-muted);
      cursor: pointer; border-bottom: 2px solid transparent;
    }
    .cx-tabs button[aria-selected="true"] {
      color: var(--st-room-text); border-bottom-color: var(--st-ember);
    }
    .cx-body { padding: clamp(16px, 3vw, 28px); }

    /* ── stats strip ──────────────────────────────────────────────────── */
    .cx-stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;
    }
    .cx-stat {
      padding: 14px 16px; border: 1px solid var(--ks3-dark-rule);
      border-radius: 14px; background: var(--st-room-panel);
    }
    .cx-stat .l {
      font-family: var(--ks3-font-mono); font-size: 11px; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--ks3-on-dark-muted);
    }
    .cx-stat .v {
      margin-top: 4px; font-family: var(--ks3-font-display); font-weight: 800;
      font-size: 28px; letter-spacing: -0.03em; line-height: 1; color: var(--st-room-text);
    }
    .cx-stat .n { margin-top: 2px; font-size: 12px; color: var(--ks3-on-dark-muted); }
    .cx-stat .n.ember { color: var(--st-ember); }

    /* ── search + filter pills ────────────────────────────────────────── */
    .cx-controls {
      margin-top: 24px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    .cx-search {
      flex: 1 1 220px; min-height: 44px; padding: 0 14px;
      border: 1px solid var(--ks3-dark-rule); border-radius: 12px;
      background: var(--st-room-panel); color: var(--st-room-text);
      /* 16px, not her 15px. See the iOS note above. */
      font-size: 16px;
    }
    .cx-search:focus { outline: 2px solid var(--st-ember); }
    .cx-fpill {
      min-height: 44px; padding: 8px 14px;
      border: 1px solid var(--ks3-dark-rule); border-radius: 99px;
      background: transparent; font-weight: 600; font-size: 14px;
      color: var(--st-room-text); cursor: pointer;
    }
    .cx-fpill[aria-pressed="true"] {
      border-color: var(--st-ember); background: var(--ks3-dark-panel);
    }

    /* ── the accounts table ───────────────────────────────────────────── */
    .cx-tbl {
      margin-top: 14px; border: 1px solid var(--ks3-dark-rule);
      border-radius: 16px; background: var(--st-room-panel); overflow: hidden;
    }
    .cx-hd { display: none; }
    .ac-row {
      display: grid; grid-template-columns: 1fr; gap: 4px;
      width: 100%; text-align: left; padding: 14px 18px;
      border: 0; border-bottom: 1px solid var(--ks3-dark-rule);
      background: none; color: var(--st-room-text); cursor: pointer;
      min-height: 44px;
    }
    .ac-row:hover { background: var(--ks3-dark-panel); }
    .ac-name { font-weight: 700; font-size: 15px; }
    .ac-sub {
      display: block; font-size: 12px; color: var(--ks3-on-dark-muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ac-kids { font-size: 14px; color: var(--ks3-on-dark-body); }
    .ac-muted { font-size: 13px; color: var(--ks3-on-dark-muted); }
    .ac-mono { font-family: var(--ks3-font-mono); font-size: 14px; }
    .cx-bpill {
      display: inline-block; padding: 3px 9px; border-radius: 99px;
      border: 1px solid var(--ks3-dark-rule); font-size: 12px; font-weight: 700;
    }
    @media (min-width: 1000px) {
      .cx-hd, .ac-row {
        display: grid; grid-template-columns: 2fr 1.2fr 1fr 1fr 1fr 1fr;
        gap: 12px; align-items: center;
      }
      .cx-hd {
        padding: 10px 18px; border-bottom: 1px solid var(--ks3-dark-rule);
        font-family: var(--ks3-font-mono); font-size: 11px; letter-spacing: 0.1em;
        text-transform: uppercase; color: var(--ks3-on-dark-muted);
      }
    }

    /* ── panels shared by the detail view and the marking pane ────────── */
    .cx-panel {
      padding: 18px 20px; border: 1px solid var(--ks3-dark-rule);
      border-radius: 16px; background: var(--st-room-panel);
    }
    .cx-panels {
      margin-top: 16px; display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px; align-items: start;
    }
    .cx-eyebrow {
      margin: 0; font-family: var(--ks3-font-mono); font-size: 11px;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--ks3-on-dark-muted);
    }
    .cx-h1 {
      margin: 0; font-family: var(--ks3-font-display); font-weight: 800;
      font-size: 28px; letter-spacing: -0.03em; color: var(--st-room-text);
    }
    .cx-back {
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 44px; padding: 0; border: 0; background: none;
      font-weight: 700; font-size: 14px; color: var(--st-ember); cursor: pointer;
    }
    .cx-back .ks3-mark { width: 14px; height: 14px; }
    .cx-rowlist { margin: 10px 0 0; padding: 0; list-style: none; font-size: 15px; }
    .cx-rowlist li {
      display: flex; justify-content: space-between; gap: 10px;
      padding: 8px 0; border-bottom: 1px solid var(--ks3-dark-rule);
    }
    .cx-kv { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
    .cx-kv li { display: flex; justify-content: space-between; gap: 10px; }
    .cx-kv .k { color: var(--ks3-on-dark-muted); }
    .cx-kv .v { font-family: var(--ks3-font-mono); font-size: 14px; text-align: right; }
    .cx-timeline { margin: 10px 0 0; padding: 0; list-style: none; font-size: 14px; }
    .cx-timeline li {
      display: flex; gap: 14px; padding: 8px 0;
      border-bottom: 1px solid var(--ks3-dark-rule);
    }
    .cx-timeline .when {
      flex: 0 0 92px; font-family: var(--ks3-font-mono); font-size: 12px;
      color: var(--ks3-on-dark-muted);
    }

    /* ── the five support actions ─────────────────────────────────────── */
    .cx-acts { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .cx-act {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      min-height: 44px; padding: 10px 14px;
      border: 1px solid var(--ks3-dark-rule); border-radius: 12px; background: transparent;
      color: var(--st-room-text); font-weight: 600; font-size: 14px;
      text-align: left; cursor: pointer;
    }
    .cx-act .hint { font-size: 12px; color: var(--ks3-on-dark-muted); }
    /* Disabled, not hidden: Design shows the unavailable actions greyed with
       the reason beside them ("Not on trial", "Not locked"), which is how a
       reader learns the rule rather than wondering where the button went. */
    .cx-act:disabled { color: var(--ks3-on-dark-muted); cursor: not-allowed; opacity: 0.75; }
    .cx-said {
      margin: 12px 0 0; padding: 10px 12px; border-radius: 10px;
      background: rgba(46, 155, 95, 0.15); border: 1px solid var(--ks3-ok);
      font-size: 14px; color: var(--st-room-text);
    }
    .cx-said.bad { background: rgba(242, 148, 110, 0.14); border-color: var(--st-ember); }

    /* ── the marking queue ────────────────────────────────────────────── */
    .cx-shell { display: grid; grid-template-columns: 1fr; }
    .cx-queue { display: none; }
    .cx-mlist { padding: 0 0 14px; }
    @media (min-width: 1000px) {
      .cx-shell { grid-template-columns: 320px 1fr; min-height: 520px; }
      .cx-queue {
        display: flex; flex-direction: column;
        border-right: 1px solid var(--ks3-dark-rule); background: var(--st-room-panel);
      }
      .cx-mlist { display: none !important; }
    }
    .cx-qhead { padding: 18px 18px 12px; }
    .cx-qscroll { flex: 1; overflow: auto; display: flex; flex-direction: column; max-height: 560px; }
    .cx-qitem {
      text-align: left; padding: 14px 18px; border: 0;
      border-top: 1px solid var(--ks3-dark-rule); border-left: 3px solid transparent;
      background: none; color: var(--st-room-text); cursor: pointer; min-height: 44px;
    }
    .cx-qitem.is-open { border-left-color: var(--st-ember); background: var(--ks3-dark-panel); }
    .cx-qitem.is-late { border-left-color: var(--ks3-accent); }
    .cx-qitem.is-open.is-late { border-left-color: var(--st-ember); }
    .cx-qmeta {
      display: flex; align-items: center; gap: 8px; font-size: 13px;
      color: var(--ks3-on-dark-muted);
    }
    .cx-qmeta .who { font-weight: 700; color: var(--st-room-text); }
    .cx-qmeta .age { margin-left: auto; font-family: var(--ks3-font-mono); }
    .cx-qmeta .age.late { color: var(--st-ember); }
    .cx-qtext {
      margin: 6px 0 0; font-size: 15px; line-height: 1.4; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .cx-qfoot {
      margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap;
      font-family: var(--ks3-font-mono); font-size: 12px; color: var(--ks3-on-dark-muted);
    }
    .cx-qfootline {
      padding: 14px 18px; border-top: 1px solid var(--ks3-dark-rule);
      font-size: 13px; color: var(--ks3-on-dark-muted);
    }
    .cx-qfootline strong { color: var(--st-room-text); }
    .cx-pane { padding: clamp(16px, 3vw, 28px); max-width: 920px; width: 100%; box-sizing: border-box; }
    .cx-mselect {
      width: 100%; min-height: 44px; padding: 0 10px;
      border: 1px solid var(--ks3-dark-rule); border-radius: 10px;
      background: var(--st-room-panel); color: var(--st-room-text); font-size: 16px;
    }
    .cx-cur-head {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
      font-size: 14px; color: var(--ks3-on-dark-muted);
    }
    .cx-cur-initial {
      display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px;
      background: var(--ks3-accent); color: var(--ks3-ink);
      font-family: var(--ks3-font-display); font-weight: 800; font-size: 15px;
    }
    .cx-q2 {
      margin: 8px 0 0; font-family: var(--ks3-font-display); font-weight: 800;
      font-size: clamp(20px, 2.4vw, 26px); line-height: 1.2; letter-spacing: -0.03em;
      color: var(--st-room-text);
    }
    .cx-wrote { margin: 10px 0 0; font-size: 17px; line-height: 1.65; color: var(--st-room-text); white-space: pre-wrap; }
    .cx-score {

<script>
/* ═══════════════════════════════════════════════════════════════════════
   MRB-303 Job 2 — Admin v1: the READ-ONLY school view.

   Who reaches it: a teacher whose account carries the `school_admin` or
   `slt` scope (or the legacy `profiles.role = 'admin'` path). The predicate
   is NOT written here — it is `MrBadmusAdminScope.isAdmin`, the same
   function that decides whether the Admin link appears in the nav, so the
   link and the page cannot disagree.

   ⛔ THIS PAGE WROTE NOTHING — and the SCHOOL half of it still doesn't.
   No form, no button that mutates, no RPC. Every control on the school
   view is a link. That is the whole of "v1", and it is why that part of
   the page can be shipped against production data on the strength of RLS
   alone.

   ⊕ MRB-308, 1 Sep 2026 — THE CONSUMER CARD IS THE EXCEPTION, and it is
   written here rather than left as a contradiction between a header
   comment and the code under it.

   The "Consumer accounts" card at the bottom has three buttons that
   mutate: comp an org, extend a trial, set a seat cap. What has NOT
   changed is the reason the old sentence was safe — none of those writes
   goes near Supabase from this browser. Each is a POST to
   /api/consumer/admin/*, and the backend re-derives the caller's admin
   standing from the JWT before it does anything. The anon key in this
   page still cannot write a single consumer row, and RLS is still the
   only thing standing behind the school view above.

   So the invariant that actually holds is narrower and more useful than
   the one it replaces: THIS PAGE MAKES NO DIRECT DATABASE WRITE. If you
   are about to add an `sb.from(...).update()` here, that is still the
   line, and it is still where v1 stops.

   ⚠️ WHERE THE NUMBERS COME FROM, and why none of them is computed here.
   `shared/teacher-data.js` already owns the reads the teacher dashboard
   derives from, and a second implementation of "how many students are in
   this class" is a second answer that will drift from the first:

     · the academic year   → `TD.loadAcademicYears()`, which applies
       `workingAcademicYear` from class-entry.js. NEVER `is_current`: that
       flag is moved by hand on 1 September and on 30 Aug 2026 it still
       pointed at 2025-26 on production. Never a literal year string either.
     · roster counts + the subject pill → `TD.loadClassMatrices()`, exactly
       as `teacher-live.js`'s `base()` does it (`pack.members.length`,
       `pack.class.pill_label`).

   ⚠️ AND WHERE ONE NUMBER CANNOT: `loadClassMatrices` DRIVES OFF
   `class_teachers` AND THROWS `not_authorised` FOR ANY CLASS THAT RETURNS
   NO DRIVER ROW. That is right for a teacher — a class they do not teach
   should not silently vanish — but a school-wide view legitimately contains
   classes NOBODY has been assigned to yet. On production today that is 57
   of 69 classes for 2026-27, because the teachers those classes belong to
   have not claimed their accounts. Handing all 69 ids to it throws and the
   page renders nothing.

   So the ids are SPLIT: classes with a live `class_teachers` row go through
   `loadClassMatrices` and get the dashboard's own numbers; the remainder
   get their roster count from `countMembers()` below, which is a deliberate
   mirror of that function's member stage (same table, same
   `deleted_at`/`left_at` filters, same "skip a soft-deleted student"
   defence) and is commented as such. Two code paths, one definition.

   ⚠️ NO `subjectFromCode` HERE, ON PURPOSE. It lives in `teacher-live.js`,
   which cannot be loaded on this page — that file self-runs a full
   dashboard boot on load (its own guard, its own mount into `#mrb-teacher`)
   — and copying it would be the second answer this file exists to avoid.
   The subject shown is `pill_label`, which `loadClassMatrices` derives from
   `class_teachers.subject_id` and hands over ready-made. A class with no
   teacher has no pill, which is honest rather than guessed.
   ═══════════════════════════════════════════════════════════════════════ */

var sb = null, uid = null;

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// Keep the environment on every hop, exactly as the ported pages' MRB_GO
// does — a tester on TEST must not be dropped onto production data.
function envQ() {
  return (window.MrBadmusConfig && window.MrBadmusConfig.environment === 'test')
    ? 'env=test' : '';
}
function classHref(id) {
  var q = ['class=' + encodeURIComponent(id)];
  if (envQ()) { q.push(envQ()); }
  return '/teacher/class-detail.html?' + q.join('&');
}

/* Reveal the page with a sentence instead of data. Used for the scope
   refusal AND for "no school on your account" — never a blank page, never a
   silent redirect, and never a status code or the word RLS. */
function notice(title, body) {
  document.getElementById('notice-title').textContent = title;
  document.getElementById('notice-body').textContent = body;
  document.getElementById('main').style.display = 'none';
  document.getElementById('notice').style.display = 'block';
  document.body.style.display = 'block';
}

// PostgREST takes the id list in the URL, so long lists are chunked. Same
// reason and same shape as teacher-data.js's own `inChunks`.
async function inChunks(ids, fn, size) {
  var out = [];
  for (var i = 0; i < ids.length; i += (size || 40)) {
    out = out.concat(await fn(ids.slice(i, i + (size || 40))) || []);
  }
  return out;
}

/* The mirror named in the header comment. Only ever called for classes that
   have NO `class_teachers` row, which is exactly the set `loadClassMatrices`
   refuses to answer for. Filters copied from its member stage so the two
   cannot mean different things by "a student in this class". */
async function countMembers(classIds) {
  var counts = {};
  classIds.forEach(function (id) { counts[id] = 0; });
  // One shape on every path — an early return of a bare map would make
  // `fallback.counts` undefined and silently zero every roster.
  if (!classIds.length) { return { counts: counts, rows: [] }; }
  var rows = await inChunks(classIds, async function (chunk) {
    var r = await sb.from('class_members')
      .select('class_id, student_id, left_at, student:student_id ( id, deleted_at )')
      .in('class_id', chunk)
      .is('deleted_at', null);
    if (r.error) { throw r.error; }
    return r.data || [];
  });
  rows.forEach(function (m) {
    if (!m.student || m.student.deleted_at) { return; }   // same defence
    if (m.left_at != null) { return; }                    // active only
    counts[m.class_id] = (counts[m.class_id] || 0) + 1;
  });
  return { counts: counts, rows: rows };
}

/* Access in plain words — the same vocabulary teacher-profile.html uses, and
   never the word "scope". */
function accessLabels(scopeRows, nowIso) {
  var labels = [];
  (scopeRows || []).forEach(function (g) {
    var live = !g.deleted_at && g.started_at <= nowIso &&
               (!g.ended_at || g.ended_at > nowIso);
    if (!live) { return; }
    if (g.scope === 'hod') { labels.push('Head of ' + (g.department || 'department')); }
    else if (g.scope === 'slt') { labels.push('Senior leadership'); }
    else if (g.scope === 'school_admin') { labels.push('School admin'); }
  });
  return labels;
}

function fullName(p) {
  var n = ((p.first_name || '') + ' ' + (p.last_name || '')).trim();
  return n || p.display_name || 'Unnamed';
}

function dateLabel(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) { return ''; }
  var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate() + ' ' + M[d.getMonth()] + ' ' + d.getFullYear();
}

async function render(ctx) {
  var TD = window.MrBadmusTeacherData;
  var schoolId = ctx.profile.school_id;

  if (!schoolId) {
    /* Real and reachable: production has an `admin` profile with a null
       school. Every read below is school-scoped, so there is nothing to
       show and saying so is better than an empty page of headings. */
    notice('No school linked to your account',
           'Your account isn’t attached to a school yet, so there’s ' +
           'nothing to show here. Once a school is linked this page will ' +
           'list its teachers and classes.');
    return;
  }

  // ── the year, and the school's name ────────────────────────────────────
  var schoolRes, yearIdx;
  var pair = await Promise.all([
    sb.from('schools').select('name').eq('id', schoolId).single(),
    TD.loadAcademicYears(),
  ]);
  schoolRes = pair[0]; yearIdx = pair[1];

  var working = yearIdx.working;
  var schoolName = (schoolRes.data && schoolRes.data.name) || 'Your school';
  document.getElementById('school-line').innerHTML =
    escapeHtml(schoolName) +
    (working ? '<span class="sep">·</span>' + escapeHtml(working.name || '') : '');

  if (!working) {
    notice('No academic year set up',
           'This school has no academic year on record, so there are no ' +
           'classes to show yet.');
    return;
  }

  // ── classes in the school, for the working year ────────────────────────
  var clsRes = await sb.from('classes')
    .select('id, name, key_stage, year_group, academic_year_id')
    .eq('school_id', schoolId)
    .eq('academic_year_id', working.id)
    .is('deleted_at', null);
  if (clsRes.error) { throw clsRes.error; }
  var classes = clsRes.data || [];
  var classIds = classes.map(function (c) { return c.id; });

  // ── who teaches what, school-wide (RLS: class_teachers_admin_read) ─────
  var links = classIds.length ? await inChunks(classIds, async function (chunk) {
    var r = await sb.from('class_teachers')
      .select('class_id, teacher_id')
      .in('class_id', chunk)
      .is('deleted_at', null)
      .is('ended_at', null);
    if (r.error) { throw r.error; }
    return r.data || [];
  }) : [];

  /* A teacher can hold two links to one class (one per subject) — production
     and the TEST fixtures both contain that shape — so the pairs are made
     unique before anything counts them. Counting rows would have reported
     "Mide Badmus, 2 classes" for one class taught twice. */
  var teacherOf = {};                 // classId -> [teacherId]
  var classesOf = {};                 // teacherId -> [classId]
  links.forEach(function (l) {
    if (!l.class_id || !l.teacher_id) { return; }
    teacherOf[l.class_id] = teacherOf[l.class_id] || [];
    classesOf[l.teacher_id] = classesOf[l.teacher_id] || [];
    if (teacherOf[l.class_id].indexOf(l.teacher_id) === -1) {
      teacherOf[l.class_id].push(l.teacher_id);
    }
    if (classesOf[l.teacher_id].indexOf(l.class_id) === -1) {
      classesOf[l.teacher_id].push(l.class_id);
    }
  });

  // ── the split described in the header comment ──────────────────────────
  var linked = classIds.filter(function (id) { return teacherOf[id]; });
  var unlinked = classIds.filter(function (id) { return !teacherOf[id]; });

  var packs = linked.length ? await TD.loadClassMatrices(linked) : {};
  var fallback = await countMembers(unlinked);

  var rosterOf = {}, pillOf = {};
  var students = {};                              // distinct student ids
  linked.forEach(function (id) {
    var pack = packs[id];
    if (!pack) { return; }
    rosterOf[id] = pack.members.length;           // base()'s own `n`
    pillOf[id] = pack.class.pill_label || '';
    pack.members.forEach(function (m) { students[m.student_id] = 1; });
  });
  unlinked.forEach(function (id) { rosterOf[id] = fallback.counts[id] || 0; });
  (fallback.rows || []).forEach(function (m) {
    if (m.student && !m.student.deleted_at && m.left_at == null) {
      students[m.student_id] = 1;
    }
  });

  // ── the people ─────────────────────────────────────────────────────────
  var peopleRes = await Promise.all([
    sb.from('profiles')
      .select('id, first_name, last_name, display_name, role')
      .eq('school_id', schoolId)
      .in('role', ['teacher', 'hod', 'admin'])
      .is('deleted_at', null),
    sb.from('staff_scopes')
      .select('profile_id, scope, department, started_at, ended_at, deleted_at')
      .eq('school_id', schoolId),
    /* ⚠️ AN EMPTY LIST HERE IS NOT AN ERROR. `pending_staff` RLS is
       `school_admin` ONLY — slt is deliberately not on it — so an
       slt-scoped viewer is handed zero rows by the database and the
       "Not yet signed in" section correctly shows nothing. That is the policy doing
       its job, and it must degrade to silence rather than to a failure. */
    sb.from('pending_staff')
      .select('id, first_name, last_name, email, profile_role, claimed_at, claimed_profile_id')
      .eq('school_id', schoolId)
      .is('deleted_at', null),
  ]);
  var profiles = peopleRes[0].data || [];
  var scopeRows = peopleRes[1].data || [];
  var pending = peopleRes[2].data || [];

  var scopesBy = {};
  scopeRows.forEach(function (s) {
    (scopesBy[s.profile_id] = scopesBy[s.profile_id] || []).push(s);
  });

  /* A claimed invitation is NOT a second person. The claim carries
     `claimed_profile_id`, so it becomes an annotation on that teacher's live
     row and never a row of its own — otherwise every teacher who has signed
     in would appear twice, once as themselves and once as their own
     invitation. */
  var claimedOn = {};
  pending.forEach(function (p) {
    if (p.claimed_at && p.claimed_profile_id) { claimedOn[p.claimed_profile_id] = p.claimed_at; }
  });
  var unclaimed = pending.filter(function (p) { return !p.claimed_at; });

  var nowIso = new Date().toISOString();
  var nameById = {};
  profiles.forEach(function (p) { nameById[p.id] = fullName(p); });

  // ── at a glance ────────────────────────────────────────────────────────
  var stats = [
    [classes.length, classes.length === 1 ? 'Class' : 'Classes'],
    [Object.keys(students).length, 'Students'],
    [profiles.length, profiles.length === 1 ? 'Teacher' : 'Teachers'],
    [unclaimed.length, 'Not yet signed in'],
  ];
  document.getElementById('stats').innerHTML = stats.map(function (s) {
    return '<div class="stat"><div class="n">' + s[0] + '</div>' +
           '<div class="l">' + escapeHtml(s[1]) + '</div></div>';
  }).join('');

  // ── teachers ───────────────────────────────────────────────────────────
  profiles.sort(function (a, b) {
    return fullName(a).localeCompare(fullName(b), undefined, { numeric: true });
  });

  var rows = profiles.map(function (p) {
    var mine = (classesOf[p.id] || []).map(function (id) {
      var c = classes.filter(function (x) { return x.id === id; })[0];
      return c ? c.name : null;
    }).filter(Boolean).sort(function (a, b) {
      return String(a).localeCompare(String(b), undefined, { numeric: true });
    });

    var labels = accessLabels(scopesBy[p.id], nowIso);
    // The legacy dual-read path is real access and is shown as such, so an
    // admin reading this list is not told something the database disagrees
    // with. See the note in teacher-admin-nav.js.
    if (!labels.length && p.role === 'admin') { labels.push('School admin'); }

    var bits = [];
    bits.push('<span class="name">' + escapeHtml(fullName(p)) + '</span>');
    if (p.id === uid) { bits.push('<span class="tag you">You</span>'); }
    labels.forEach(function (l) { bits.push('<span class="tag">' + escapeHtml(l) + '</span>'); });
    if (claimedOn[p.id]) {
      bits.push('<span class="meta">Joined ' + escapeHtml(dateLabel(claimedOn[p.id])) + '</span>');
    }

    /* An honest zero. A teacher with no classes this year shows "0 classes",
       never a blank — a blank reads as "we could not find out", and this
       page must never say that when it knows. */
    var right = '<span class="count">' + mine.length + '</span> ' +
                '<span class="meta">' + (mine.length === 1 ? 'class' : 'classes') + '</span>';

    return '<div class="row">' + bits.join(' ') +
           '<span class="right">' + right + '</span></div>';
  });

  unclaimed.sort(function (a, b) {
    return String((a.last_name || '') + a.first_name)
      .localeCompare(String((b.last_name || '') + b.first_name), undefined, { numeric: true });
  });
  unclaimed.forEach(function (p) {
    /* The seeded name is the fallback display name and the email is the
       identity — the claim matches on email only, never on a name. */
    var nm = ((p.first_name || '') + ' ' + (p.last_name || '')).trim() || p.email;
    rows.push('<div class="row">' +
      '<span class="name muted">' + escapeHtml(nm) + '</span> ' +
      '<span class="tag pending">Not yet signed in</span> ' +
      '<span class="meta">' + escapeHtml(p.email || '') + '</span>' +
      '</div>');
  });

  if (!rows.length) {
    document.getElementById('teachers-empty').style.display = 'block';
  } else {
    document.getElementById('teachers').innerHTML = rows.join('');
  }

  // ── classes, grouped by year group ──────────────────────────────────────
  var byYear = {};
  classes.forEach(function (c) {
    var y = c.year_group == null ? 'Other' : String(c.year_group);
    (byYear[y] = byYear[y] || []).push(c);
  });
  var years = Object.keys(byYear).sort(function (a, b) {
    if (a === 'Other') { return 1; }
    if (b === 'Other') { return -1; }
    return Number(a) - Number(b);
  });

  var yearGroupsHtml = years.map(function (y) {
    var group = byYear[y].slice().sort(function (a, b) {
      return String(a.name).localeCompare(String(b.name), undefined, { numeric: true });
    });

    var crows = group.map(function (c) {
      var who = (teacherOf[c.id] || []).map(function (id) {
        return nameById[id] || 'Another teacher';
      }).sort();
      var n = rosterOf[c.id];

      var left = '<a class="classlink" href="' + escapeHtml(classHref(c.id)) + '">' +
                 escapeHtml(c.name) + '</a>';

      var right = '<span class="count">' + (n == null ? 0 : n) + '</span> ' +
                  '<span class="meta">' + (n === 1 ? 'student' : 'students') + '</span>' +
                  '<span class="classlist">' +
                  (who.length ? escapeHtml(who.join(', ')) : 'No teacher assigned') +
                  '</span>';

      return '<div class="row">' + left +
             '<span class="right">' + right + '</span></div>';
    });

    return '<div class="year-group">' +
           '<div class="year-heading">' +
           (y === 'Other' ? 'Other' : 'Year ' + escapeHtml(y)) +
           '</div>' + crows.join('') + '</div>';
  });

  if (!classes.length) {
    document.getElementById('classes-empty').style.display = 'block';
  } else {
    document.getElementById('classes').innerHTML = yearGroupsHtml.join('');
  }

  document.getElementById('main').style.display = 'block';
  document.body.style.display = 'block';
}

/* ═══════════════════════════════════════════════════════════════════════
   MRB-308/317 — THE CONSUMER OPERATOR CONSOLE.

   Claude Design's `Admin Accounts.dc.html` and `Admin Marking Queue.dc.html`,
   compiled against the real API, as two tabs of one card on this page.

   ── THE CARD IS INVISIBLE UNLESS THE LAUNCH FLAG IS ON ─────────────────
   `CONSUMER_SIGNUP_ENABLED` must be EXACTLY `true`. Absent, undefined, the
   string "false", or a config.js that failed to load all mean OFF, and OFF
   means `renderConsumer` returns before it has read anything: no card, no
   heading, no empty state, and — the part that matters — no request to
   /api/consumer/*. A school admin on a site with the consumer product
   switched off must not be able to tell from this page that it exists.

   The card is `display:none` in the markup as well as here, so the "on"
   path is the only path that ever reveals it. Fail-closed in both places.

   ── AND IT IS THE LAST THING THE PAGE DOES ─────────────────────────────
   Called AFTER `render()` has finished and revealed the school view, with
   its own catch. A consumer backend that is down, slow, or answering 404
   because the SECOND switch is off must not take the teachers and classes
   lists down with it — those are the reason a school admin opened this
   page, and they come from Supabase and know nothing about any of this.

   ── WHAT IS DESIGN'S, AND THE FOUR PLACES THIS DEPARTS FROM HER ────────
   1. NO CHEVRON, and the wordmark is "MrBadmus". She drew her BrandMark
      beside it; Mide's ruling 1 on MRB-316 makes an admin surface a STAFF
      surface, which carries the wordmark alone. The nav at the top of THIS
      page is the school brand and keeps its "AI" — the two coexist on one
      document deliberately.
   2. `card` reads "—". §D1 says reading a payment method is a Stripe call
      per account and sends `null` tonight. A dash is honest; "Visa ···4242"
      would not be.
   3. "Previous answers (n)" is TEXT, not a link. She linked it to "#".
      There is no operator route that lists one child's answers — the only
      one that exists is `requireGuardian` — so rather than ship a link that
      goes nowhere, the count is stated and the link is not drawn.
   4. ⊕ADDED: a "New organisation" form under the accounts table. §D3's
      `POST /admin/orgs` exists precisely so an organisation can be opened
      without SQL; Design drew no control for it because she was not told
      the route existed.

   ── AND WHAT IS NOT DESIGN'S AT ALL ────────────────────────────────────
   The three collapsed drawers at the foot — AI usage and caps, the email
   log, the report note — are the Night 2 operator tools (MRB-312/314/315).
   Mide uses all three and none of them has another home, so they stay,
   restyled into this room and closed by default so the two screens Design
   DID draw are what the card opens on. They load lazily, on first open.
   ═══════════════════════════════════════════════════════════════════════ */

function consumerEnabled() {
  return !!(window.MrBadmusConfig && window.MrBadmusConfig.CONSUMER_SIGNUP_ENABLED === true);
}

/* The backend seam. Always MrBadmusConfig.BACKEND_URL, never a literal —
   the ?api= override in config.js exists precisely so this file has no
   opinion about which backend answers. The JWT is read fresh on every call
   rather than captured once: this page can sit open for a long time and a
   token captured at load is a token that expires while somebody is looking
   at it. */
async function consumerApi(path, opts) {
  opts = opts || {};
  var base = (window.MrBadmusConfig && window.MrBadmusConfig.BACKEND_URL) || '';
  var sess = await sb.auth.getSession();
  var token = sess && sess.data && sess.data.session && sess.data.session.access_token;
  var init = { method: opts.method || 'GET', headers: {} };
  if (token) { init.headers['Authorization'] = 'Bearer ' + token; }
  if (opts.body != null) {
    init.headers['Content-Type'] = 'application/json';
    init.body = JSON.stringify(opts.body);
  }
  var res;
  try {
    res = await fetch(base + path, init);
  } catch (e) {
    // "Failed to fetch" is not a sentence anyone can act on.
    throw new Error('We couldn’t reach the consumer service.');
  }
  var text = await res.text();
  var data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
  if (res.ok) { return data; }
  /* The contract gives every consumer error BOTH a machine `error` code and
     a human `message`. The message wins on screen; the code is carried on
     the Error for the two places that branch on it. */
  var code = (data && data.error) || '';
  var msg  = (data && data.message) || '';
  /* A 404 with nothing in it means the BACKEND half of the two-switch gate
     is off while the frontend half is on. Naming it is worth a line —
     otherwise every button fails identically and reads as a bug here. */
  if (!msg && res.status === 404) {
    msg = 'The consumer service isn’t switched on for this environment.';
  }
  if (!msg && (res.status === 401 || res.status === 403)) {
    msg = 'Your session doesn’t have access to consumer accounts.';
  }
  var err = new Error(msg || code || 'Something went wrong. Please try again in a moment.');
  err.status = res.status;
  err.code = code;
  err.data = data;
  throw err;
}

function cxEl(id) { return document.getElementById(id); }

function cxFail(host, message, hint) {
  host.innerHTML = '<p class="empty">' + escapeHtml(message) +
    (hint ? (' ' + escapeHtml(hint)) : '') + '</p>';
}

/* Never rejects. One panel, one failure, in its own words. */
async function cxSection(hostId, load) {
  var host = cxEl(hostId);
  if (!host) { return; }
  try {
    await load(host);
  } catch (e) {
    console.error('[admin/consumer/' + hostId + ']', e);
    cxFail(host, e.message, 'Refresh in a moment to try again.');
  }
}

/* ⊕ FOUND BY DRIVING IT, 2 Sep 2026. The contract says the mark scheme is
   `scheme: [strings]`, and on `/child/exam-questions` it is. On
   `/admin/mb-queue` the same field arrives as an array of OBJECTS, and the
   first render of this queue printed four lines of `[object Object]` where
   the mark scheme should have been — on the one screen whose entire job is
   to show a marker the scheme next to the answer.

   Rather than betting on one shape, read both. A string is itself; an object
   gives up its text under whichever of the conventional keys it uses. A
   shape with none of them renders as nothing rather than as `[object
   Object]`, because a blank line is at least honest. */
function cxSchemeText(pt) {
  if (pt == null) { return ''; }
  if (typeof pt === 'string') { return pt; }
  return String(pt.text || pt.point || pt.criterion || pt.description || '');
}

/* The usage rows carry the org as a plain string; the queue rows carry it as
   an object. Both spellings, in one place, so the two readers cannot drift. */
function cxOrgName(r, fallback) {
  if (!r) { return fallback || '—'; }
  if (r.org && typeof r.org === 'object' && r.org.name) { return r.org.name; }
  if (typeof r.org === 'string' && r.org) { return r.org; }
  return r.name || fallback || '—';
}

function cxPence(p) {
  if (p == null || isNaN(Number(p))) { return '—'; }
  var n = Math.round(Number(p));
  return '£' + Math.floor(n / 100) + '.' + (n % 100 < 10 ? '0' : '') + (n % 100);
}
function cxNum(n) { return (n == null) ? '—' : String(n); }

/* An honest blank. A field the backend did not send is not zero and is not
   an empty string — it is a dash, visibly. */
function cxDash(v) { return (v == null || v === '') ? '—' : String(v); }

function cxTick() {
  return '<svg class="ks3-mark" viewBox="0 0 24 24" aria-hidden="true" style="width:13px;height:13px;">' +
         '<path d="M5 12.5l4.5 4.5L19 7"/></svg>';
}
function cxBack() {
  return '<svg class="ks3-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
}
