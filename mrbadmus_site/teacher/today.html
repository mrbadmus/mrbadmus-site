<script>
/* ══════════════════════════════════════════════════════════════════════════
   MRB-306 — TODAY
   ══════════════════════════════════════════════════════════════════════════

   The teacher's day, built from `timetable_entries` (WS-1's seed) and the
   class reads `teacher-data.js` already owns.

   WHAT THIS PAGE WILL NOT DO
   · It will not invent a clock time. `school_period_times` is empty on
     purpose, so lessons are ordered by period NUMBER and labelled
     "Period 1 … 5". A wrong time in front of someone about to walk into a
     room is worse than no time at all.
   · It will not compose an assignment, or offer to. Composition happens in
     ONE place — the backend's `/api/class/current-assignment` — and no
     teacher surface calls it, so a teacher cannot cause it however the
     button is worded. Where there is no work set this page says so plainly
     rather than offering an action that would do nothing.
   · It will not read a deadline from the device clock. The weekday is
     interpreted in the school's timezone (`schoolWeekday`), and that decides
     only WHICH ROW of the grid to show — never whether something is late.
   ═══════════════════════════════════════════════════════════════════════ */

const DAY_NAMES = { 1:'Monday', 2:'Tuesday', 3:'Wednesday', 4:'Thursday', 5:'Friday', 6:'Saturday', 7:'Sunday' };
const DAY_SHORT = ['', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

function el(id) { return document.getElementById(id); }

function notice(title, bodyHtml) {
  el('main').style.display = 'none';
  el('notice-title').textContent = title;
  el('notice-body').innerHTML = bodyHtml;
  el('notice').style.display = 'block';
  document.body.style.display = 'block';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

/* Time-of-day greeting. From the clock, which is fine — being wished good
   afternoon at 11:59 is a cosmetic error, and nothing here is a deadline. */
function greetingFor(name) {
  const h = new Date().getHours();
  const part = h < 12 ? 'Good morning' : (h < 18 ? 'Good afternoon' : 'Good evening');
  return name ? (part + ', ' + name) : part;
}

/* The name students see. `display_name` is the "What name should students
   see" field; where a teacher has not set one, fall back the same way
   `class_teachers_for_viewer` does, so one person is never named two ways. */
function teacherName(profile) {
  if (!profile) { return ''; }
  const dn = (profile.display_name || '').trim();
  if (dn) { return dn; }
  const fl = ((profile.first_name || '') + ' ' + (profile.last_name || '')).trim();
  return fl || '';
}

/* KS3 /Sc → Science, KS4 /Sc → Combined Science, /Ph /Ch /Bi → the separate
   science. The subject comes from the CLASS CODE, never from tier or
   pathway, which are deliberately absent from every teacher surface. */
function subjectFromCode(code, keyStage) {
  const m = /\/([A-Za-z]{2})/.exec(code || '');
  if (!m) { return ''; }
  const s = m[1].toLowerCase();
  if (s === 'ph') { return 'Physics'; }
  if (s === 'ch') { return 'Chemistry'; }
  if (s === 'bi') { return 'Biology'; }
  if (s === 'sc') { return keyStage === 'KS4' ? 'Combined Science' : 'Science'; }
  return '';
}

/* The next teaching day at or after `from`, among the days this teacher
   actually teaches. Returns null when the timetable is empty. */
function nextTeachingDay(days, from) {
  if (!days.length) { return null; }
  for (let i = 0; i < 7; i++) {
    const d = ((from - 1 + i) % 7) + 1;
    if (days.indexOf(d) !== -1) { return d; }
  }
  return null;
}

MrBadmusTeacherGuard.requireTeacherRole({
  onDenied: function () { /* the guard redirects; nothing to draw */ },
  onAllowed: async function (ctx) {
    /* ⚠️ 'block', NEVER ''. The stylesheet says `body { display: none }` so a
       page reveals itself by SETTING a value; assigning '' removes the inline
       style and falls straight back to none — a page that passes every text
       assertion (the nodes are all there) and renders a blank screen. Caught
       by looking at the screenshot, not by the assertions. */
    document.body.style.display = 'block';
    const TD = window.MrBadmusTeacherData;

    let entries;
    try {
      entries = await TD.loadTimetable();
    } catch (e) {
      console.error('[today] loadTimetable failed', e);
      return notice('Today is unavailable',
        'Your timetable could not be loaded just now. Refresh in a moment, or open ' +
        '<a href="/teacher/classes.html">My classes</a>.');
    }

    const name = teacherName(ctx && ctx.profile);
    el('greeting').textContent = greetingFor(name);

    /* ── NO TIMETABLE AT ALL ────────────────────────────────────────────
       An honest prompt, and deliberately NOT a promise. Upload is not built
       yet, so this does not offer it; it says what the page needs and where
       the work already is. */
    if (!entries.length) {
      el('day-line').textContent = 'No timetable yet.';
      el('daybar').style.display = 'none';
      el('lessons-heading').textContent = 'Your lessons';
      el('lessons').innerHTML =
        '<div class="prompt">' +
        '<p>Today shows your lessons in order, each one telling you who still owes you ' +
        'this week&rsquo;s work before you walk in. It needs your timetable first, and ' +
        'there isn&rsquo;t one on your account yet.</p>' +
        /* ⊕ Now that the editor exists this offers it. It did NOT before —
           an action that led nowhere would have been worse than none. */
        '<a class="btn" href="/teacher/timetable.html">Set up my timetable</a>' +
        '</div>';
      el('main').style.display = 'block';
      return;
    }

    const todayWeekday = TD.schoolWeekday();
    const taughtDays = [];
    entries.forEach(function (e) {
      if (taughtDays.indexOf(e.weekday) === -1) { taughtDays.push(e.weekday); }
    });
    taughtDays.sort();

    /* Which day are we showing, and is it actually today? Weekend, or a
       weekday with no lessons, both fall through to the next teaching day —
       and the page SAYS which day it is showing rather than letting a
       Saturday quietly render Monday's lessons as "today". */
    let showDay = todayWeekday;
    let isToday = true;
    if (taughtDays.indexOf(todayWeekday) === -1) {
      showDay = nextTeachingDay(taughtDays, todayWeekday);
      isToday = false;
    }

    const dayEntries = entries.filter(function (e) { return e.weekday === showDay; })
                              .sort(function (a, b) { return a.period - b.period; });

    // The weekday rail, so a teacher can see the shape of their week.
    el('daybar').innerHTML = [1,2,3,4,5].map(function (d) {
      const on = d === showDay ? ' on' : '';
      const n = entries.filter(function (e) { return e.weekday === d; }).length;
      return '<span class="' + ('' + on).trim() + '">' + DAY_SHORT[d] + ' &middot; ' + n + '</span>';
    }).join('');

    if (isToday) {
      el('day-line').textContent = DAY_NAMES[showDay] + ' \u00B7 ' +
        dayEntries.length + (dayEntries.length === 1 ? ' lesson' : ' lessons');
      el('lessons-heading').textContent = 'Today\u2019s lessons';
    } else {
      /* Honest label. It is NOT today, and the heading says so. */
      const why = todayWeekday >= 6 ? 'No lessons at the weekend.' : 'No lessons today.';
      el('day-line').textContent = why + ' Showing your next teaching day.';
      el('lessons-heading').textContent = 'Next: ' + DAY_NAMES[showDay];
    }

    /* A standing way back to the editor once a timetable exists — a teacher's
       rooms and sets change, and finding the page should not require
       remembering the URL. */
    const edit = document.createElement('a');
    edit.className = 'btn';
    edit.href = '/teacher/timetable.html';
    edit.textContent = 'Edit timetable';
    edit.style.cssText = 'margin-left:auto;font-size:0.8rem;padding:7px 11px;min-height:0;';
    const h = el('lessons-heading');
    if (h && h.parentNode) {
      h.style.display = 'flex';
      h.style.alignItems = 'center';
      h.appendChild(edit);
    }

    if (!dayEntries.length) {
      el('lessons').innerHTML = '<div class="empty">Nothing timetabled.</div>';
      el('main').style.display = 'block';
      return;
    }

    /* Draw the lessons FIRST, from the timetable alone, then fill each one's
       state in as the class reads land. A teacher gets their room order
       immediately rather than waiting on the slowest class. */
    el('lessons').innerHTML = dayEntries.map(function (e) {
      const subj = subjectFromCode(e.className, e.keyStage);
      const meta = [e.keyStage, subj].filter(Boolean).join(' \u00B7 ');
      return '<a class="lesson" href="/teacher/class-detail.html?class=' + encodeURIComponent(e.classId) + '">' +
             '<div class="lesson-period">Period ' + e.period + '</div>' +
             '<div class="lesson-body">' +
             '<div class="lesson-code">' + esc(e.className || 'Class') + '</div>' +
             '<div class="lesson-meta">' + esc(meta) + '</div>' +
             '<div class="lesson-state clear" data-state-for="' + esc(e.classId) + '">' +
             '<span class="skel" style="display:inline-block;width:150px;height:11px;"></span>' +
             '</div>' +
             '</div></a>';
    }).join('');
    el('main').style.display = 'block';

    /* ── PER-CLASS STATE ────────────────────────────────────────────────
       One read for every class on the day, in parallel — not one wave per
       lesson (the MRB-292 lesson). Each cell is filled independently, so one
       slow or failing class cannot blank the others. */
    const classIds = [];
    dayEntries.forEach(function (e) {
      if (e.classId && classIds.indexOf(e.classId) === -1) { classIds.push(e.classId); }
    });

    let matrices = null;
    try {
      matrices = await TD.loadClassMatrices(classIds);
    } catch (err) {
      console.warn('[today] class state unavailable', err);
    }

    classIds.forEach(function (cid) {
      const cells = document.querySelectorAll('[data-state-for="' + cid + '"]');
      if (!cells.length) { return; }

      /* ⚠️ UNKNOWN IS NOT ZERO. Where the read failed the line says nothing
         rather than "0 to chase", which would be a made-up reassurance about
         a class this page could not see. */
      if (!matrices) {
        cells.forEach(function (c) { c.innerHTML = ''; });
        return;
      }

      const pack = matrices[cid];
      const state = describeClass(pack);
      cells.forEach(function (c) {
        c.className = 'lesson-state ' + (state.chase ? 'chase' : 'clear');
        c.textContent = state.text;
      });
    });
  }
});

/* What to say about one class, from its own submission rows.

   ⚠️ The doneness test is the UNION — completed_at, submitted_at, or
   status === 'complete' — the same one `teacher-live.js`'s cellOf() uses, so
   this page cannot disagree with the class screens ("one number, one
   source"), and it can never count a student as owing work when their own
   page reads Complete. The literal is 'complete', NOT 'completed'. */
function describeClass(pack) {
  if (!pack) { return { text: '', chase: false }; }

  const assignments = pack.assignments || [];
  const members = pack.members || [];
  if (!assignments.length) {
    /* No work set. Say so; do NOT offer to set it — nothing on a teacher
       surface can compose an assignment. */
    return { text: 'No work set this week.', chase: false };
  }
  if (!members.length) {
    return { text: 'No students on this class yet.', chase: false };
  }

  // This week's work: the newest by due date, nulls first — the same order
  // buildPapers uses, where index 0 is the week the class opens parked on.
  const papers = assignments.slice().sort(function (a, b) {
    if (a.due_at == null && b.due_at == null) { return 0; }
    if (a.due_at == null) { return -1; }
    if (b.due_at == null) { return 1; }
    return a.due_at < b.due_at ? 1 : -1;
  });
  const paper = papers[0];
  if (!paper) { return { text: '', chase: false }; }

  const subs = (pack.submissions || []).filter(function (s) {
    return s.assignment_id === paper.id;
  });
  const doneBy = {};
  subs.forEach(function (s) {
    const done = !!(s.completed_at || s.submitted_at) || s.status === 'complete';
    if (done) { doneBy[s.student_id] = true; }
  });

  const total = members.length;
  const inCount = members.filter(function (m) { return doneBy[m.student_id]; }).length;
  const owing = total - inCount;

  if (owing === 0) {
    return { text: inCount + ' of ' + total + ' in \u00B7 nothing to chase', chase: false };
  }
  return {
    text: inCount + ' of ' + total + ' in \u00B7 ' + owing +
          (owing === 1 ? ' still to hand in' : ' still to hand in'),
    chase: true
  };
}
</script>
</body>
</html>
