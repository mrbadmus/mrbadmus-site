<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FBF3E6">
<title>Seating plans · MrBadmusAI</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  HAND-WRITTEN — MRB-322. There is no generator behind this page.
  ══════════════════════════════════════════════════════════════════════════

  It sits beside six teacher screens that ARE generated (build_teacher_port.py
  writes classes/class-detail/student-detail/assignment/digest/insights) and
  three that are not (admin, import, today, timetable). This one is in the
  second group: no Design delivery exists for seating plans, and Mide ruled
  that v1 is built from the v3 dashboard's component language, with Design
  free to pass over it later. So this file is edited directly — but its
  vocabulary is borrowed, not invented, and lives in shared/seating.css.

  ⚠️ A build WILL modify this file: generate_site_v5.py restamps every
  `?v=` cache-bust query and round-trips the result back over the repo copy.
  That one-line diff is expected and has to be committed — prepush_gate
  refuses to record a receipt while a tracked file is modified.

  ── Where the per-class entry point is, and why it is here ───────────────
  The brief asked for a Seating plan section reachable from a class as well
  as from the nav. `teacher/class-detail.html` is GENERATED by the lane that
  owns build_teacher_port.py, and this lane must not touch it — so the
  class-scoped view lives HERE, at #/class/<id>, and the per-class section on
  the class page becomes a one-line link that lane can add after the merge.
  Same destination, no shared file, nothing to rebase.

  ── Brand ────────────────────────────────────────────────────────────────
  Staff surface: the plain wordmark, no logo asset. It is drawn the way the
  v3 teacher screens draw it — Bricolage 600 in --st-ink — rather than with
  CLAUDE.md's canonical staff snippet, which pins Sora and `--text` from the
  older token set that this design system does not define. The RULE (plain
  text, no logo, no chevron) is followed exactly; only the face follows the
  pages either side of it.
-->
<link rel="preload" href="/shared/fonts/bricolage-grotesque-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/shared/fonts/instrument-sans-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/shared/teacher-ds.css?v=fba5f719">
<link rel="stylesheet" href="/shared/seating.css?v=1ca5298c">
</head>
<body class="sp-body">

<nav class="sp-nav">
  <a href="/index.html" class="sp-brand"
     style="font:600 20px/1 var(--st-display);letter-spacing:-0.025em;color:var(--st-ink);text-decoration:none;">MrBadmusAI</a>
  <div class="sp-nav__right">
    <a class="sp-nav__link" href="/teacher/classes.html">My classes</a>
    <a class="sp-nav__link" href="/teacher/today.html">Today</a>
    <button class="sp-btn sp-btn--quiet" type="button"
            onclick="MrBadmusTeacherGuard.signOut()">Sign out</button>
  </div>
</nav>

<div class="sp-wrap">
  <div class="sp-printhead" id="sp-printhead"></div>
  <main id="sp-main" aria-live="polite"></main>
</div>

<input type="file" id="sp-file" class="sp-file" accept="image/*" tabindex="-1" aria-hidden="true">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/shared/config.js?v=06f24811"></script>
<!-- ⚠️ class-entry.js before any data module: seating-data delegates the
     working-academic-year rule to it and MRB-267 made that load order
     load-bearing across every page that reads a class list. -->
<script src="/shared/class-entry.js?v=d47329ae"></script>
<script src="/shared/teacher-guard.js?v=2efdc820"></script>
<script src="/shared/seating-canvas.js?v=66ace40a"></script>
<script src="/shared/seating-data.js?v=bc287d2f"></script>
<script src="/shared/seating-photo.js?v=de93bec8"></script>
<script>
(function () {
  'use strict';

  var D = window.MrBadmusSeatingData;
  var SC = window.SeatingCanvas;
  var main = document.getElementById('sp-main');
  var printhead = document.getElementById('sp-printhead');
  var fileInput = document.getElementById('sp-file');

  // ── Page state ─────────────────────────────────────────────────────────
  // `held` is the pupil currently picked up. It is the whole of the touch
  // story: HTML5 drag-and-drop does not exist on a tablet, and this screen is
  // used on one, so tap-to-pick / tap-to-place is the primary way a pupil
  // reaches a chair and dragging is the shortcut on top of it.
  var S = {
    canvas: null, layout: null, plan: null, cls: null,
    roster: [], held: null, me: null, dirty: false, mode: 'edit',
    lastSource: 'manual', saving: false
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function el(html) {
    var t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function shortDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function say(msg, kind) {
    var n = document.getElementById('sp-msg');
    if (!n) return;
    n.className = 'sp-note' + (kind === 'warn' ? ' sp-note--warn' : '');
    n.textContent = msg;
    n.hidden = !msg;
  }

  function teardownCanvas() {
    if (S.canvas) { S.canvas.destroy(); S.canvas = null; }
  }

  // ── Router ─────────────────────────────────────────────────────────────

  function parseHash() {
    var h = (location.hash || '#/layouts').replace(/^#/, '');
    var q = {};
    var qi = h.indexOf('?');
    if (qi >= 0) {
      h.slice(qi + 1).split('&').forEach(function (p) {
        var kv = p.split('=');
        q[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
      });
      h = h.slice(0, qi);
    }
    return { parts: h.split('/').filter(Boolean), q: q };
  }

  function go(hash) { location.hash = hash; }

  /* Every view writes into #sp-main AFTER awaiting the database, so two fast
     navigations can interleave and the slower one paints over the newer view.
     Each run takes a token and checks it is still the current one before it
     touches the DOM. */
  var routeToken = 0;
  function stale(token) { return token !== routeToken; }

  async function route() {
    var token = ++routeToken;
    teardownCanvas();
    S.held = null;
    // These are per-view state. Leaving them set leaked a 'template' source
    // onto the next hand-drawn layout, and left the unsaved-changes prompt
    // armed on screens that have nothing to save.
    S.dirty = false;
    S.lastSource = 'manual';
    printhead.innerHTML = '';
    var r = parseHash();
    var view = r.parts[0] || 'layouts';

    try {
      if (view === 'layouts') return await viewLayouts(token);
      if (view === 'layout') {
        if (r.parts[1] === 'new') return await viewLayoutBuilder(null, r.q, token);
        return await viewLayoutBuilder(r.parts[1], r.q, token);
      }
      if (view === 'class') return await viewClass(r.parts[1], token);
      if (view === 'plan') {
        if (r.parts[1] === 'new') return await viewPlan(null, r.q, token);
        return await viewPlan(r.parts[1], r.q, token);
      }
      go('#/layouts');
    } catch (err) {
      console.error('[seating]', err);
      main.innerHTML = '';
      main.appendChild(el(
        '<div class="sp-empty"><p class="sp-empty__title">That did not load</p>' +
        '<p class="sp-empty__body">' + esc(err.message || 'Something went wrong.') +
        '</p><a class="sp-btn" href="#/layouts">Back to rooms</a></div>'));
    }
  }

  // ── View: browse layouts ───────────────────────────────────────────────

  async function viewLayouts(token) {
    main.innerHTML =
      '<div class="sp-head">' +
        '<div><p class="sp-head__eyebrow">Seating</p>' +
        '<h1 class="sp-head__title">Rooms</h1>' +
        '<p class="sp-head__sub">A layout is the shape of a room — where the ' +
        'desks are and how many chairs each one has. Draw it once, then place ' +
        'any class on it.</p></div>' +
        '<div class="sp-head__actions">' +
          '<a class="sp-btn sp-btn--primary" href="#/layout/new">New layout</a>' +
        '</div>' +
      '</div>' +
      '<div id="sp-msg" class="sp-note" hidden></div>' +
      '<div class="sp-rooms" id="sp-rooms" role="group" aria-label="Filter by room"></div>' +
      '<div id="sp-list"></div>';

    var layouts = await D.listRoomLayouts();
    if (stale(token)) return;
    var byRoom = {};
    layouts.forEach(function (l) { (byRoom[l.room_code] = byRoom[l.room_code] || []).push(l); });

    // The room strip is built from the data layer's list, never from a copy
    // typed into this file — seating_tells fails the build if a fourth copy
    // of the room list appears here.
    var strip = document.getElementById('sp-rooms');
    var filter = null;

    function paintStrip() {
      strip.innerHTML = '';
      var all = el('<button class="sp-room" type="button" aria-pressed="' +
                   (filter === null) + '">All<span class="sp-room__n">' +
                   layouts.length + '</span></button>');
      all.addEventListener('click', function () { filter = null; paintStrip(); paintList(); });
      strip.appendChild(all);
      D.ROOMS.forEach(function (code) {
        var n = (byRoom[code] || []).length;
        var b = el('<button class="sp-room" type="button" aria-pressed="' +
                   (filter === code) + '">' + esc(code) +
                   '<span class="sp-room__n">' + n + '</span></button>');
        b.addEventListener('click', function () { filter = code; paintStrip(); paintList(); });
        strip.appendChild(b);
      });
    }

    function paintList() {
      var list = document.getElementById('sp-list');
      var rows = filter ? (byRoom[filter] || []) : layouts;
      list.innerHTML = '';
      if (!rows.length) {
        list.appendChild(el(
          '<div class="sp-empty"><p class="sp-empty__title">' +
          (filter ? 'Nothing drawn for ' + esc(filter) + ' yet' : 'No layouts yet') +
          '</p><p class="sp-empty__body">Start from a template, build the room ' +
          'by hand, or photograph the empty classroom and correct what comes ' +
          'back.</p><a class="sp-btn sp-btn--primary" href="#/layout/new' +
          (filter ? '?room=' + encodeURIComponent(filter) : '') + '">New layout</a></div>'));
        return;
      }
      var grid = el('<div class="sp-grid"></div>');
      rows.forEach(function (l) {
        var card = el(
          '<button class="sp-card" type="button">' +
            '<div class="sp-card__top">' +
              '<span class="sp-card__room">' + esc(l.room_code) + '</span>' +
              '<span class="sp-card__src">' + esc(l.source) + '</span>' +
            '</div>' +
            '<div class="sp-card__thumb"></div>' +
            '<p class="sp-card__name">' + esc(l.name || 'Untitled layout') + '</p>' +
            '<div class="sp-card__meta">' +
              '<span>' + l.desk_count + ' desks · ' + l.seat_count + ' seats</span>' +
              '<span>' + esc(l.author_name) + '</span>' +
            '</div>' +
          '</button>');
        // A still thumbnail of the real layout, in view mode so it renders no
        // handles and no drop targets — the card is a picture, not a control.
        var thumb = card.querySelector('.sp-card__thumb');
        try {
          SC.create({ mount: thumb, mode: 'view', layout: l.layout });
        } catch (e) { /* a bad stored layout must not blank the whole list */ }
        card.addEventListener('click', function () { go('#/layout/' + l.id); });
        grid.appendChild(card);
      });
      list.appendChild(grid);
    }

    paintStrip();
    paintList();
  }

  // ── View: layout builder ───────────────────────────────────────────────

  async function viewLayoutBuilder(id, q, token) {
    var existing = null;
    if (id) {
      existing = await D.loadRoomLayout(id);
      if (!existing) throw new Error('That layout has been retired.');
    }
    S.me = await D.me();
    var canEdit = existing ? existing.can_edit : true;
    S.mode = canEdit ? 'edit' : 'view';

    // A room code off the hash is user input. An unknown one used to leave
    // the dropdown showing S01 while `room` still held the bogus value, so
    // Save failed naming a room the screen was not displaying.
    var wanted = existing ? existing.room_code : (q.room || '');
    var room = D.ROOMS.indexOf(wanted) !== -1 ? wanted : D.ROOMS[0];
    var name = existing ? (existing.name || '') : '';

    main.innerHTML =
      '<div class="sp-head">' +
        '<div><p class="sp-head__eyebrow">' +
          (existing ? esc(existing.room_code) + ' · by ' + esc(existing.author_name)
                    : 'New layout') + '</p>' +
        '<h1 class="sp-head__title">' +
          (existing ? esc(existing.name || 'Untitled layout') : 'Draw the room') + '</h1>' +
        '<p class="sp-head__sub">' +
          (canEdit
            ? 'Drag desks into the shape of the real room. It does not need to ' +
              'be tidy — a skewed room should look skewed.'
            : 'This layout belongs to ' + esc(existing.author_name) +
              '. You can place a class on it, but only they or an admin can ' +
              'change its shape.') +
        '</p></div>' +
        '<div class="sp-head__actions" id="sp-head-actions"></div>' +
      '</div>' +
      '<div id="sp-msg" class="sp-note" hidden></div>' +
      '<div class="sp-studio">' +
        '<div class="sp-stage" id="sp-stage"></div>' +
        '<aside class="sp-side" id="sp-side"></aside>' +
      '</div>';

    // Controls a viewer cannot use are ABSENT. There is no disabled Save on
    // this page — someone else's layout simply has no Save.
    var actions = document.getElementById('sp-head-actions');
    if (canEdit) {
      var save = el('<button class="sp-btn sp-btn--primary" type="button">Save layout</button>');
      save.addEventListener('click', onSave);
      actions.appendChild(save);
    }
    if (existing) {
      var use = el('<a class="sp-btn" href="#/plan/new?layout=' + existing.id + '">Place a class</a>');
      actions.appendChild(use);
    }
    actions.appendChild(el('<a class="sp-btn sp-btn--quiet" href="#/layouts">Rooms</a>'));

    S.layout = existing ? existing.layout : SC.emptyLayout();
    S.canvas = SC.create({
      mount: document.getElementById('sp-stage'),
      mode: S.mode,
      layout: S.layout,
      onChange: function (l) { S.layout = l; S.dirty = true; paintSide(); },
      onSelect: function () { paintSide(); }
    });

    paintSide();

    function paintSide() {
      var side = document.getElementById('sp-side');
      if (!side) return;
      if (!canEdit) {
        // View mode: facts, not controls.
        var desks = (S.layout.desks || []).length;
        var seats = 0;
        (S.layout.desks || []).forEach(function (d) { seats += d.seats; });
        side.innerHTML =
          '<p class="sp-side__h">This room</p>' +
          '<div class="sp-count"><span>' + desks + ' desks</span><span>' +
          seats + ' seats</span></div>' +
          '<p style="color:var(--st-muted);font-size:.86rem;margin:0">Front of the ' +
          'room is marked on the plan.</p>';
        return;
      }

      var sel = S.canvas ? S.canvas.getSelected() : null;
      var html =
        '<p class="sp-side__h">Room</p>' +
        '<select id="sp-room" class="sp-btn" style="width:100%"></select>' +
        '<p class="sp-side__h">Name this layout</p>' +
        '<input id="sp-name" class="sp-btn" style="width:100%;font-weight:400" ' +
          'placeholder="e.g. exam rows" value="' + esc(name) + '">' +
        '<p class="sp-side__h">Start from</p>' +
        '<div class="sp-tools">' +
          '<button class="sp-btn" type="button" data-tpl="rows">Rows</button>' +
          '<button class="sp-btn" type="button" data-tpl="pairedRows">Paired</button>' +
          '<button class="sp-btn" type="button" data-tpl="uShape">U-shape</button>' +
          '<button class="sp-btn" type="button" data-tpl="clusters">Clusters</button>' +
          '<button class="sp-btn" type="button" data-act="photo">Photo of the room</button>' +
        '</div>' +
        '<p class="sp-side__h">Desks</p>' +
        '<div class="sp-tools">' +
          '<button class="sp-btn" type="button" data-act="add-rect">Add desk</button>' +
          '<button class="sp-btn" type="button" data-act="add-round">Add round</button>' +
        '</div>';

      if (sel) {
        html +=
          '<p class="sp-side__h">Selected desk</p>' +
          '<div class="sp-tools">' +
            '<button class="sp-btn" type="button" data-rot="-15">Turn ↺</button>' +
            '<button class="sp-btn" type="button" data-rot="15">Turn ↻</button>' +
            '<button class="sp-btn" type="button" data-shape="rect">Rectangle</button>' +
            '<button class="sp-btn" type="button" data-shape="round">Round</button>' +
          '</div>' +
          '<p class="sp-side__h">Chairs at this desk</p>' +
          '<div class="sp-tools">' +
            [1, 2, 3, 4, 5, 6].map(function (n) {
              return '<button class="sp-btn" type="button" data-seats="' + n + '">' + n + '</button>';
            }).join('') +
          '</div>' +
          '<div class="sp-tools" style="margin-top:9px">' +
            '<button class="sp-btn sp-btn--danger" type="button" data-act="delete">Remove desk</button>' +
          '</div>';
      }

      html +=
        '<p class="sp-side__h">Front of the room</p>' +
        '<div class="sp-tools">' +
          ['top', 'right', 'bottom', 'left'].map(function (f) {
            return '<button class="sp-btn" type="button" data-front="' + f + '"' +
                   (S.layout.front === f ? ' aria-pressed="true"' : '') + '>' + f + '</button>';
          }).join('') +
        '</div>' +
        '<div class="sp-tools" style="margin-top:9px">' +
          '<button class="sp-btn" type="button" data-act="teacher">Teacher desk</button>' +
        '</div>' +
        '<p class="sp-side__h">History</p>' +
        '<div class="sp-tools">' +
          '<button class="sp-btn" type="button" data-act="undo">Undo</button>' +
          '<button class="sp-btn" type="button" data-act="redo">Redo</button>' +
        '</div>';

      side.innerHTML = html;

      var roomSel = document.getElementById('sp-room');
      D.ROOMS.forEach(function (code) {
        var o = document.createElement('option');
        o.value = code; o.textContent = code;
        if (code === room) o.selected = true;
        roomSel.appendChild(o);
      });
      roomSel.addEventListener('change', function () { room = roomSel.value; S.dirty = true; });
      document.getElementById('sp-name').addEventListener('input', function (e) {
        name = e.target.value; S.dirty = true;
      });
    }

    document.getElementById('sp-side').addEventListener('click', function (ev) {
      var b = ev.target.closest('button');
      if (!b || !S.canvas) return;

      var tpl = b.getAttribute('data-tpl');
      if (tpl) {
        S.canvas.setLayout(SC.templates[tpl](30));
        S.layout = S.canvas.getLayout();
        // How a layout was STARTED is what `source` records, and it is only
        // ever set here, in the photo handler, or left at 'manual'. It is not
        // a claim about the finished shape — a teacher drags a scanned room
        // until it is right, and it is still the photo that got them there.
        S.lastSource = 'template';
        S.dirty = true; paintSide();
        return;
      }
      var rot = b.getAttribute('data-rot');
      if (rot) { rotateSelected(Number(rot)); return; }
      var seats = b.getAttribute('data-seats');
      if (seats) { S.canvas.setSeatsForSelected(Number(seats)); return; }
      var shape = b.getAttribute('data-shape');
      if (shape) { S.canvas.setShapeForSelected(shape); return; }
      var front = b.getAttribute('data-front');
      if (front) { S.canvas.setFront(front); S.layout = S.canvas.getLayout(); paintSide(); return; }

      switch (b.getAttribute('data-act')) {
        case 'add-rect':  S.canvas.addDesk({ shape: 'rect', seats: 2 }); break;
        case 'add-round': S.canvas.addDesk({ shape: 'round', seats: 4 }); break;
        case 'delete':    S.canvas.deleteSelected(); paintSide(); break;
        case 'teacher':   S.canvas.toggleTeacherDesk(); break;
        case 'undo':      S.canvas.undo(); S.layout = S.canvas.getLayout(); paintSide(); break;
        case 'redo':      S.canvas.redo(); S.layout = S.canvas.getLayout(); paintSide(); break;
        case 'photo':     startPhoto(); break;
      }
    });

    // The engine keeps rotation as a gesture rather than a method, so the
    // button nudge does it through the public API. One press is one undo
    // entry, which is what a button should cost.
    function rotateSelected(by) {
      var sel = S.canvas.getSelected();
      if (!sel) { say('Select a desk first, then turn it.'); return; }
      var l = S.canvas.getLayout();
      l.desks.forEach(function (d) {
        if (d.id === sel) d.rotation = ((d.rotation + by + 540) % 360) - 180;
      });
      S.canvas.setLayout(l);
      S.canvas.selectDesk(sel);
      S.layout = S.canvas.getLayout();
      say('');
    }

    function startPhoto() {
      say('');
      fileInput.value = '';
      fileInput.onchange = async function () {
        var f = fileInput.files && fileInput.files[0];
        if (!f) return;
        var side = document.getElementById('sp-side');
        var busy = el('<div class="sp-busy"><span class="sp-spin"></span>' +
                      '<span>Reading the room…</span></div>');
        side.insertBefore(busy, side.firstChild);
        var res;
        try {
          res = await window.MrBadmusSeatingPhoto.scan(f);
        } catch (err) {
          res = { ok: false, message: err.message || 'The scan could not start.' };
        }
        busy.remove();
        if (!res.ok) {
          say(res.message, 'warn');
          return;
        }
        S.canvas.setLayout(res.layout);
        S.layout = S.canvas.getLayout();
        S.lastSource = 'photo';
        S.dirty = true;
        paintSide();
        say('This is a starting point read from the photo — drag the desks ' +
            'until they match the real room, then save.');
      };
      fileInput.click();
    }

    async function onSave() {
      // Two clicks used to make two rows. Neither button is ever disabled —
      // the guard is a flag, not a greyed-out control.
      if (S.saving) return;
      S.saving = true;
      say('');
      try {
        var layout = S.canvas.getLayout();
        if (!layout.desks.length) { say('Add at least one desk before saving.', 'warn'); return; }
        var source = existing ? existing.source : 'manual';
        if (!existing && S.lastSource) source = S.lastSource;
        var saved = existing
          ? await D.updateRoomLayout(existing.id, { layout: layout, name: name || null, room_code: room })
          : await D.createRoomLayout({ room_code: room, name: name || null,
                                       layout: layout, source: source });
        S.dirty = false;
        go('#/layout/' + saved.id);
        if (existing) { say('Saved.'); }
      } catch (err) {
        say(err.code === 'not_permitted'
              ? 'This layout belongs to someone else, so it cannot be changed here.'
              : (err.message || 'Could not save.'), 'warn');
      }
    }
  }

  // ── View: one class's seating plans ────────────────────────────────────

  async function viewClass(classId, token) {
    var cls = await D.loadClass(classId);
    if (!cls) throw new Error('That class could not be found.');
    var plans = await D.listPlansForClass(classId);
    if (stale(token)) return;

    main.innerHTML =
      '<div class="sp-head">' +
        '<div><p class="sp-head__eyebrow">Seating · ' + esc(cls.name) + '</p>' +
        '<h1 class="sp-head__title">Plans for ' + esc(cls.name) + '</h1>' +
        '<p class="sp-head__sub">Every plan puts this class on one room layout. ' +
        'Anyone who teaches this class can open them; only the person who made ' +
        'a plan — or an admin — can change it.</p></div>' +
        '<div class="sp-head__actions">' +
          '<a class="sp-btn sp-btn--primary" href="#/plan/new?class=' + esc(classId) + '">New plan</a>' +
          '<a class="sp-btn sp-btn--quiet" href="#/layouts">Rooms</a>' +
        '</div>' +
      '</div>' +
      '<div id="sp-msg" class="sp-note" hidden></div>' +
      '<div id="sp-list"></div>';

    var list = document.getElementById('sp-list');
    if (!plans.length) {
      list.appendChild(el(
        '<div class="sp-empty"><p class="sp-empty__title">No plans yet for ' +
        esc(cls.name) + '</p><p class="sp-empty__body">Pick a room layout and ' +
        'drag the class onto it.</p><a class="sp-btn sp-btn--primary" href="#/plan/new?class=' +
        esc(classId) + '">New plan</a></div>'));
      return;
    }
    var grid = el('<div class="sp-grid"></div>');
    plans.forEach(function (p) {
      var card = el(
        '<button class="sp-card" type="button">' +
          '<div class="sp-card__top">' +
            '<span class="sp-card__room">' + esc(p.room_code || '—') + '</span>' +
            '<span class="sp-card__src">' + (p.can_edit ? 'yours' : 'view only') + '</span>' +
          '</div>' +
          '<div class="sp-card__thumb"></div>' +
          '<p class="sp-card__name">' + esc(p.name || 'Untitled plan') + '</p>' +
          '<div class="sp-card__meta">' +
            '<span>' + p.seated_count + ' seated</span>' +
            '<span>' + esc(p.author_name) + ' · ' + esc(shortDate(p.updated_at)) + '</span>' +
          '</div>' +
        '</button>');
      if (p.layout) {
        try { SC.create({ mount: card.querySelector('.sp-card__thumb'), mode: 'view', layout: p.layout }); }
        catch (e) { /* a retired or malformed layout still lists */ }
      }
      card.addEventListener('click', function () { go('#/plan/' + p.id); });
      grid.appendChild(card);
    });
    list.appendChild(grid);
  }

  // ── View: the plan editor ──────────────────────────────────────────────

  async function viewPlan(planId, q, token) {
    S.me = await D.me();
    var plan = null, classId = q.class || null, layoutId = q.layout || null;

    if (planId) {
      plan = await D.loadSeatingPlan(planId);
      if (!plan) throw new Error('That plan is not available to you.');
      classId = plan.class_id;
      layoutId = plan.room_layout_id;
    }

    // A new plan needs both halves. Whichever is missing, ask for it.
    if (!classId) return await pickClass(layoutId);
    if (!layoutId) return await pickLayout(classId);

    var cls = await D.loadClass(classId);

    /*
      ⚠️ A plan you may read, for a class you may not.
      This is the one place two permission models meet and disagree, and it is
      a live seam rather than a bug in either.

      MRB-322 was ruled to give ACTIVE cover teacher visibility, so
      `auth_user_teaches_class_now()` counts a cover stint that has started and
      not yet ended. Everything else in the estate — `classes`, `class_members`
      and the pupils' own `profiles` — is still gated by the older
      `auth_user_teaches_class()`, which asks `ended_at IS NULL` and therefore
      reads any cover booked with an end date as already finished.

      So a cover teacher can open the seating plan and cannot read the names on
      it. Measured, not assumed: on TEST, active cover reads the plan (1) and
      reads the class, its members and their profiles as 0.

      Closing that gap means widening shared policies that every teacher screen
      depends on, which would make a cover teacher look like a class teacher
      across the whole product. That is Mide's call, not this lane's, and it is
      written up. Until he makes it, the page says plainly what it can and
      cannot show rather than drawing an empty room and letting the teacher
      conclude nobody has been seated.
    */
    var rosterBlocked = false;
    if (!cls && plan) {
      rosterBlocked = true;
      cls = { id: classId, name: 'this class' };
    }
    if (!cls) throw new Error('That class could not be found.');
    var layoutRow = plan && plan.layout
      ? { room_code: plan.room_code, layout: plan.layout }
      : await D.loadRoomLayout(layoutId);
    if (!layoutRow) throw new Error('That room layout has been retired.');

    S.cls = cls;
    S.plan = plan;
    S.roster = rosterBlocked ? [] : await D.loadClassRoster(classId);
    var canEdit = rosterBlocked ? false : (plan ? plan.can_edit : true);
    S.mode = canEdit ? 'plan' : 'view';

    var planName = plan ? (plan.name || '') : (cls.name + ' — ' + layoutRow.room_code);

    main.innerHTML =
      '<div class="sp-head">' +
        '<div><p class="sp-head__eyebrow">' + esc(cls.name) + ' · ' +
          esc(layoutRow.room_code) + (plan ? ' · by ' + esc(plan.author_name) : '') + '</p>' +
        '<h1 class="sp-head__title">' + esc(planName) + '</h1>' +
        '<p class="sp-head__sub">' +
          (rosterBlocked
            ? 'You can open this plan, but not the class list behind it — you ' +
              'are not recorded as a teacher of this class for the whole of ' +
              'this year. An admin can add you, and the names will appear.'
            : canEdit
            ? 'Tap a name, then tap a chair. Tap an occupied chair to pick that ' +
              'pupil up: tap another chair to move them, tap a second ' +
              'pupil to swap the two, or tap their own chair again to ' +
              'take them out of the room.'
            : 'This plan belongs to ' + esc(plan.author_name) + '. You can read ' +
              'it and print it.') +
        '</p></div>' +
        '<div class="sp-head__actions" id="sp-head-actions"></div>' +
      '</div>' +
      '<div id="sp-msg" class="sp-note" hidden></div>' +
      '<div class="sp-studio">' +
        '<div class="sp-stage" id="sp-stage"></div>' +
        '<aside class="sp-side" id="sp-side"></aside>' +
      '</div>';

    var actions = document.getElementById('sp-head-actions');
    if (canEdit) {
      var save = el('<button class="sp-btn sp-btn--primary" type="button">Save plan</button>');
      save.addEventListener('click', onSavePlan);
      actions.appendChild(save);
    }
    var print = el('<button class="sp-btn" type="button">Print</button>');
    print.addEventListener('click', doPrint);
    actions.appendChild(print);
    actions.appendChild(el('<a class="sp-btn sp-btn--quiet" href="#/class/' +
                           esc(classId) + '">All plans</a>'));

    S.canvas = SC.create({
      mount: document.getElementById('sp-stage'),
      mode: S.mode,
      layout: layoutRow.layout,
      onSeatActivate: onSeat,
      onAssign: function () { S.dirty = true; paintRoster(); }
    });

    /*
      Rehydrating a saved plan is where two kinds of rot show up, and both used
      to pass silently.

      A seat id is DERIVED from a desk — `d3:2` is the third chair at desk d3 —
      so it stops existing the moment somebody edits that room down from four
      chairs to two, or deletes the desk. The assignment survives in the row.
      It draws nothing, because nothing renders a chair that is not there; and
      it used to be COUNTED AS SEATED, because the tally walked the whole map.
      A teacher could reduce a desk, reopen the plan, read "0 unseated", print
      it, and walk into a lesson with two children standing up.

      The other is a pupil id the roster cannot resolve — usually someone who
      has left the class, but it is indistinguishable from a roster read that
      came back SHORT because the reader is not allowed to see the pupils. That
      second case is the dangerous one: save is a whole-object overwrite, so a
      reader with an empty roster and a live Save button would have written
      `{}` over the whole plan and been told "Saved."

      So: seats that no longer exist are dropped and reported; pupils that
      cannot be resolved are reported; and if NONE of them resolved while the
      plan clearly holds some, the page decides it is not looking at the whole
      truth and refuses to let anyone write over it.
    */
    var lostSeats = 0, unresolved = 0;
    if (plan && plan.assignments) {
      var liveSeats = {};
      S.canvas.seatIds().forEach(function (id) { liveSeats[id] = 1; });
      var byId = {};
      S.roster.forEach(function (s) { byId[s.id] = s; });
      var map = {};
      Object.keys(plan.assignments).forEach(function (seatId) {
        var sid = plan.assignments[seatId];
        if (!liveSeats[seatId]) { lostSeats++; return; }
        if (!byId[sid]) { unresolved++; return; }
        map[seatId] = { id: sid, label: byId[sid].label };
      });
      var stored = Object.keys(plan.assignments).length;
      if (stored > 0 && Object.keys(map).length === 0 && unresolved > 0) {
        rosterBlocked = true;
        canEdit = false;
        S.mode = 'view';
        S.canvas.setMode('view');
      }
      S.canvas.setAssignments(map);
    }

    // The Save button is created before rehydration, so if rehydration decided
    // this reader is not seeing the whole plan, take it away again.
    if (!canEdit) {
      var live = actions.querySelectorAll('button');
      [].slice.call(live).forEach(function (b) {
        if (/save plan/i.test(b.textContent)) b.remove();
      });
    }

    paintRoster();
    if (lostSeats || unresolved) {
      say(
        (lostSeats
          ? (lostSeats === 1
              ? 'One seat in this plan no longer exists — the room was changed ' +
                'after the plan was made, so that pupil is back on the list. '
              : lostSeats + ' seats in this plan no longer exist — the room was ' +
                'changed after the plan was made, so those pupils are back on ' +
                'the list. ')
          : '') +
        (unresolved
          ? (unresolved === 1 ? 'One seat held someone ' : unresolved + ' seats held people ') +
            'this class list does not contain' +
            (rosterBlocked
              ? ', and none of the names could be read — this plan is shown ' +
                'read-only rather than risk saving over it.'
              : ' — saving will clear those seats.')
          : ''),
        'warn');
    }
    fillPrintHead(cls, layoutRow.room_code);

    function seatedIds() {
      var a = S.canvas.getAssignments();
      var out = {};
      Object.keys(a).forEach(function (k) { out[a[k].id] = k; });
      return out;
    }

    function paintRoster() {
      var side = document.getElementById('sp-side');
      if (!side) return;
      if (rosterBlocked) {
        side.innerHTML =
          '<p class="sp-side__h">Class list</p>' +
          '<p class="sp-note sp-note--warn" style="margin:0">The class list is ' +
          'not visible to you, so the chairs on this plan are shown empty. ' +
          'This is a permissions gap, not an empty room.</p>';
        return;
      }
      var seated = seatedIds();
      var capacity = S.canvas.seatIds().length;
      var unseated = S.roster.filter(function (s) { return !seated[s.id]; });

      // The unseated count is never hidden and never softened. Twenty-eight
      // pupils in a room with twenty-six chairs is a problem the teacher has
      // to solve before the lesson starts, and the screen's job is to say so.
      var html =
        '<div class="sp-count">' +
          '<span>' + S.roster.length + ' on roll · ' + capacity + ' chairs</span>' +
          '<span class="sp-count__unseated' + (unseated.length ? '' : ' sp-count__unseated--none') +
            '">' + unseated.length + ' unseated</span>' +
        '</div>';

      if (capacity < S.roster.length) {
        html += '<p class="sp-note sp-note--warn" style="margin-bottom:12px">' +
                'This room has ' + (S.roster.length - capacity) + ' fewer chairs ' +
                'than pupils.</p>';
      }

      html += '<p class="sp-side__h">Class list</p><ul class="sp-roster" id="sp-roster"></ul>';
      side.innerHTML = html;

      var ul = document.getElementById('sp-roster');
      S.roster.forEach(function (s) {
        var isSeated = !!seated[s.id];
        var li = el('<li class="sp-pupil' + (isSeated ? ' sp-pupil--seated' : '') + '"' +
                    (canEdit ? ' draggable="true" tabindex="0"' : '') +
                    ' data-id="' + esc(s.id) + '"' +
                    ' aria-grabbed="' + (S.held && S.held.id === s.id) + '">' +
                    '<span class="sp-pupil__dot"></span>' +
                    '<span>' + esc(s.label) + '</span></li>');
        if (canEdit) {
          li.addEventListener('click', function () { pickUp(s); });
          li.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pickUp(s); }
          });
          // The engine accepts a native HTML5 drop onto a chair. That is the
          // mouse shortcut; it does nothing on a tablet, which is exactly why
          // pickUp/onSeat above is the primary path and not a fallback.
          li.addEventListener('dragstart', function (ev) {
            ev.dataTransfer.setData('application/json',
              JSON.stringify({ id: s.id, label: s.label }));
            ev.dataTransfer.effectAllowed = 'move';
          });
        }
        ul.appendChild(li);
      });
    }

    function pickUp(s) {
      if (!canEdit) return;
      if (S.held && S.held.id === s.id) { S.held = null; say(''); }
      else { S.held = { id: s.id, label: s.label }; say('Holding ' + s.label + ' — now tap a chair.'); }
      paintRoster();
    }

    /*
      Picking a seated pupil up does NOT empty their chair, and that is the
      whole of why swapping works.

      It used to unassign first, which read fine on screen and quietly broke
      the swap the help text promises: once the chair is empty the engine can
      no longer see where the held pupil came FROM, so dropping them on an
      occupied chair displaced whoever was sitting there instead of trading
      places with them. One pupil ended up out of the room every time two were
      exchanged — and the plan still looked plausible, which is the part that
      makes it worth this comment. Leaving them seated lets `assign()` find the
      source seat and do the trade itself.

      Taking someone out of the room is therefore its own gesture: tap their
      chair to pick them up, tap the same chair again to lift them out.
    */
    function onSeat(seatId) {
      if (!canEdit) return;
      var a = S.canvas.getAssignments();
      var sitting = a[seatId] || null;

      if (S.held) {
        if (sitting && sitting.id === S.held.id) {
          S.canvas.unassign(seatId);       // second tap on their own chair
          say('');
        } else {
          S.canvas.assign(seatId, S.held); // the engine swaps when both sit
          say('');
        }
        S.held = null;
      } else if (sitting) {
        S.held = { id: sitting.id, label: sitting.label };
        say('Holding ' + sitting.label + ' — tap another chair to move them, ' +
            'or tap their chair again to take them out.');
      } else {
        return;
      }
      S.dirty = true;
      paintRoster();
    }

    async function onSavePlan() {
      if (S.saving) return;
      S.saving = true;
      say('');
      try {
        var a = S.canvas.getAssignments();
        var flat = {};
        Object.keys(a).forEach(function (seatId) { flat[seatId] = a[seatId].id; });
        var saved = plan
          ? await D.updateSeatingPlan(plan.id, { assignments: flat, name: planName })
          : await D.createSeatingPlan({ class_id: classId, room_layout_id: layoutId,
                                        name: planName, assignments: flat });
        S.dirty = false;
        if (!plan) { go('#/plan/' + saved.id); }
        else { plan = saved; say('Saved.'); }
      } catch (err) {
        say(err.code === 'not_permitted'
              ? 'This plan belongs to someone else, so it cannot be changed here.'
              : (err.message || 'Could not save.'), 'warn');
      } finally {
        S.saving = false;
      }
    }

    function doPrint() {
      fillPrintHead(cls, layoutRow.room_code);
      window.print();
    }
  }

  function fillPrintHead(cls, roomCode) {
    var who = S.me ? D.displayName(S.me) : '';
    var when = new Date().toLocaleDateString('en-GB',
      { day: 'numeric', month: 'long', year: 'numeric' });
    printhead.innerHTML =
      '<div class="sp-printhead__main">' + esc(cls.name) +
        ' <span class="sp-printhead__room">' + esc(roomCode) + '</span></div>' +
      '<div class="sp-printhead__meta">' + esc(who) + '<br>' + esc(when) + '</div>';
  }

  // ── Pickers for a half-specified new plan ──────────────────────────────

  async function pickClass(layoutId) {
    var classes = await D.myClasses();
    main.innerHTML =
      '<div class="sp-head"><div><p class="sp-head__eyebrow">New plan</p>' +
      '<h1 class="sp-head__title">Which class?</h1></div>' +
      '<div class="sp-head__actions"><a class="sp-btn sp-btn--quiet" href="#/layouts">Rooms</a></div></div>' +
      '<div id="sp-msg" class="sp-note" hidden></div><div id="sp-list"></div>';
    var list = document.getElementById('sp-list');
    if (!classes.length) {
      list.appendChild(el('<div class="sp-empty"><p class="sp-empty__title">' +
        'No classes this year</p><p class="sp-empty__body">Seating plans follow ' +
        'the classes you teach. Once you have one, it will appear here.</p></div>'));
      return;
    }
    var grid = el('<div class="sp-grid"></div>');
    classes.forEach(function (c) {
      var card = el('<button class="sp-card" type="button">' +
        '<div class="sp-card__top"><span class="sp-card__room">' + esc(c.name) +
        '</span><span class="sp-card__src">' + esc(c.key_stage || '') + '</span></div>' +
        '<p class="sp-card__name">Year ' + esc(c.year_group) + '</p></button>');
      card.addEventListener('click', function () {
        go('#/plan/new?class=' + encodeURIComponent(c.id) +
           (layoutId ? '&layout=' + encodeURIComponent(layoutId) : ''));
      });
      grid.appendChild(card);
    });
    list.appendChild(grid);
  }

  async function pickLayout(classId) {
    var layouts = await D.listRoomLayouts();
    main.innerHTML =
      '<div class="sp-head"><div><p class="sp-head__eyebrow">New plan</p>' +
      '<h1 class="sp-head__title">Which room?</h1>' +
      '<p class="sp-head__sub">Any layout in the school can be used, whoever ' +
      'drew it.</p></div>' +
      '<div class="sp-head__actions">' +
        '<a class="sp-btn" href="#/layout/new">New layout</a>' +
        '<a class="sp-btn sp-btn--quiet" href="#/class/' + esc(classId) + '">Back</a>' +
      '</div></div>' +
      '<div id="sp-msg" class="sp-note" hidden></div><div id="sp-list"></div>';
    var list = document.getElementById('sp-list');
    if (!layouts.length) {
      list.appendChild(el('<div class="sp-empty"><p class="sp-empty__title">' +
        'No layouts yet</p><p class="sp-empty__body">Draw the room first — from ' +
        'a template, by hand, or from a photograph.</p>' +
        '<a class="sp-btn sp-btn--primary" href="#/layout/new">New layout</a></div>'));
      return;
    }
    var grid = el('<div class="sp-grid"></div>');
    layouts.forEach(function (l) {
      var card = el('<button class="sp-card" type="button">' +
        '<div class="sp-card__top"><span class="sp-card__room">' + esc(l.room_code) +
        '</span><span class="sp-card__src">' + esc(l.source) + '</span></div>' +
        '<div class="sp-card__thumb"></div>' +
        '<p class="sp-card__name">' + esc(l.name || 'Untitled layout') + '</p>' +
        '<div class="sp-card__meta"><span>' + l.seat_count + ' seats</span><span>' +
        esc(l.author_name) + '</span></div></button>');
      try { SC.create({ mount: card.querySelector('.sp-card__thumb'), mode: 'view', layout: l.layout }); }
      catch (e) { /* keep the row */ }
      card.addEventListener('click', function () {
        go('#/plan/new?class=' + encodeURIComponent(classId) +
           '&layout=' + encodeURIComponent(l.id));
      });
      grid.appendChild(card);
    });
    list.appendChild(grid);
  }

  // ── Boot ───────────────────────────────────────────────────────────────

  /*
    Unsaved work is guarded in TWO places, because the page has two ways of
    leaving a screen and `beforeunload` only sees one of them.

    Closing the tab fires beforeunload. Clicking "Rooms" does not — every
    navigation here is a hash change, and a hash change fires nothing the
    browser will pause on. So dragging three desks and clicking away used to
    discard the lot without a word, while the flag it left set armed a
    "Leave site?" prompt on the next unrelated screen. Wrong in both
    directions, from one missing reset.

    hashchange fires AFTER the address has already changed, so the guard puts
    the old hash back when the teacher says no — and ignores the hashchange
    that restoring it causes.
  */
  var lastHash = location.hash || '#/layouts';
  var restoring = false;

  window.addEventListener('beforeunload', function (ev) {
    if (!S.dirty) return;
    ev.preventDefault();
    ev.returnValue = '';
  });

  window.addEventListener('hashchange', function () {
    if (restoring) { restoring = false; return; }
    if (S.dirty && !window.confirm(
          'This room has changes you have not saved. Leave without saving?')) {
      restoring = true;
      location.hash = lastHash;
      return;
    }
    lastHash = location.hash;
    route();
  });

  MrBadmusTeacherGuard.requireTeacherRole({
    onAllowed: function () {
      document.body.style.display = '';
      route();
    }
  });
})();
</script>
</body>
</html>
