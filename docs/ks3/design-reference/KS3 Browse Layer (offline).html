ne;font-size:18px;line-height:1.4\"><span style=\"font-family:'DM Mono',monospace;color:#12A150;font-weight:500\">02<\u002Fspan>Animal and plant cells<\u002Fli>\n        <li style=\"display:flex;gap:12px;align-items:baseline;font-size:18px;line-height:1.4\"><span style=\"font-family:'DM Mono',monospace;color:#12A150;font-weight:500\">03<\u002Fspan>From cells to organs<\u002Fli>\n        <li style=\"display:flex;gap:12px;align-items:baseline;font-size:18px;line-height:1.4\"><span style=\"font-family:'DM Mono',monospace;color:#12A150;font-weight:500\">04<\u002Fspan>Unicellular life<\u002Fli>\n      <\u002Fol>\n      <span style=\"margin-top:auto;font-size:16px;font-weight:600;color:#8A7F76\">Lessons being written<\u002Fspan>\n    <\u002Fdiv>\n\n    <button type=\"button\" sc-camel-on-click=\"{{ toSubject }}\" data-reveal=\"1\" style=\"text-align:left;cursor:pointer;background:#FFFBF3;border:2px solid #231F1C;border-radius:26px;box-shadow:5px 5px 0 #E4572E;padding:26px;display:flex;flex-direction:column;gap:16px;transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s\" style-hover=\"transform:translate(-4px,-4px);box-shadow:9px 9px 0 #E4572E\" style-active=\"transform:translate(2px,2px);box-shadow:1px 1px 0 #E4572E\">\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <span style=\"width:22px;height:22px;border-radius:99px;background:#E4572E;border:2px solid #231F1C;animation:ring 2.4s infinite\"><\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:32px;letter-spacing:-.025em\">Chemistry<\u002Fh2>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8A7F76\">Unit C1 · 4 lessons<\u002Fdiv>\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:23px;margin-top:5px\">Particles and their behaviour<\u002Fdiv>\n      <\u002Fdiv>\n      <ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px\">\n        <li style=\"display:flex;gap:12px;align-items:baseline;font-size:18px;line-height:1.4\"><span style=\"font-family:'DM Mono',monospace;color:#E4572E;font-weight:500\">01<\u002Fspan>The particle model<\u002Fli>\n        <li style=\"display:flex;gap:12px;align-items:baseline;font-size:18px;line-height:1.4\"><span style=\"font-family:'DM Mono',monospace;color:#E4572E;font-weight:500\">02<\u002Fspan>Solids, liquids and gases<\u002Fli>\n        <li style=\"display:flex;gap:12px;align-items:baseline;font-size:18px;line-height:1.4\"><span style=\"font-family:'DM Mono',monospace;color:#E4572E;font-weight:500\">03<\u002Fspan>Changes of state<\u002Fli>\n        <li style=\"display:flex;gap:12px;align-items:baseline;font-size:18px;line-height:1.4;font-weight:700\"><span style=\"font-family:'DM Mono',monospace;color:#E4572E;font-weight:500\">04<\u002Fspan>Gas pressure<\u002Fli>\n      <\u002Fol>\n      <span style=\"margin-top:auto;font-size:17px;font-weight:700;color:#B33A1E\">Open these four lessons →<\u002Fspan>\n    <\u002Fbutton>\n\n    <div data-reveal=\"1\" style=\"background:#FFFBF3;border:2px solid #231F1C;border-radius:26px;box-shadow:5px 5px 0 #2F5CE0;padding:26px;display:flex;flex-direction:column;gap:16px\">\n      <div style=\"display:flex;align-items:center;gap:12px\">\n        <span style=\"width:22px;height:22px;border-radius:99px;background:#2F5CE0;border:2px solid #231F1C\"><\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:32px;letter-spacing:-.025em\">Physics<\u002Fh2>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8A7F76\">Unit P1 · 3 lessons<\u002Fdiv>\n        <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:23px;margin-top:5px\">Describing motion<\u002Fdiv>\n      <\u002Fdiv>\n      <ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px\">\n        <li style=\"display:flex;gap:12px;align-items:baseline;font-size:18px;line-height:1.4\"><span style=\"font-family:'DM Mono',monospace;color:#2F5CE0;font-weight:500\">01<\u002Fspan>Speed<\u002Fli>\n        <li style=\"display:flex;gap:12px;align-items:baseline;font-size:18px;line-height:1.4\"><span style=\"font-family:'DM Mono',monospace;color:#2F5CE0;font-weight:500\">02<\u002Fspan>Distance–time graphs<\u002Fli>\n        <li style=\"display:flex;gap:12px;align-items:baseline;font-size:18px;line-height:1.4\"><span style=\"font-family:'DM Mono',monospace;color:#2F5CE0;font-weight:500\">03<\u002Fspan>Relative motion<\u002Fli>\n      <\u002Fol>\n      <span style=\"margin-top:auto;font-size:16px;font-weight:600;color:#8A7F76\">Lessons being written<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isSubject }}\">\n<main data-screen-label=\"Chemistry unit\" style=\"max-width:1240px;margin:0 auto;padding:52px 32px 90px;animation:screenIn .45s cubic-bezier(.2,.8,.2,1) both\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:52px;align-items:end\">\n    <div>\n      <span style=\"font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8A7F76\">Year 7 · Autumn First Half<\u002Fspan>\n      <h1 style=\"margin:12px 0 0;display:flex;align-items:center;gap:18px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(44px,5.4vw,70px);line-height:.95;letter-spacing:-.035em\"><span style=\"width:26px;height:26px;border-radius:99px;background:#E4572E;border:3px solid #231F1C\"><\u002Fspan>Chemistry<\u002Fh1>\n      <p style=\"margin:22px 0 0;font-size:21px;line-height:1.55;max-width:48ch;color:#3D3630\">Four lessons that build one idea: everything is made of particles, and how those particles move explains what you can see.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#231F1C;color:#FBF3E6;border-radius:24px;padding:24px;box-shadow:5px 5px 0 #E4572E\">\n      <div style=\"font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#B9A98F\">Unit C1 · lessons 1 to 4 of 6<\u002Fdiv>\n      <div style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;line-height:1.1;margin-top:8px;letter-spacing:-.02em\">Particles and their behaviour<\u002Fdiv>\n      <p style=\"margin:14px 0 0;font-size:17px;line-height:1.55;color:#E4DBCB\">By the end you can explain melting, boiling and gas pressure using nothing but particles and their movement.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <section style=\"margin-top:52px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:36px;align-items:start\">\n    <div style=\"position:relative;padding-left:0\">\n      <div style=\"position:absolute;left:31px;top:40px;bottom:40px;width:3px;background:repeating-linear-gradient(#231F1C 0 9px,transparent 9px 18px);opacity:.35\"><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:18px;position:relative\">\n        <sc-for list=\"{{ lessons }}\" as=\"l\" hint-placeholder-count=\"4\">\n          <button type=\"button\" sc-camel-on-click=\"{{ l.go }}\" data-reveal=\"1\" style=\"text-align:left;cursor:pointer;display:grid;grid-template-columns:64px minmax(0,1fr);gap:18px;align-items:start;transition:transform .18s cubic-bezier(.34,1.56,.64,1)\" style-hover=\"transform:translateX(5px)\">\n            <span style=\"width:64px;height:64px;border-radius:20px;background:{{ l.numBg }};color:{{ l.numFg }};border:3px solid #231F1C;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:27px;box-shadow:3px 3px 0 #231F1C;animation:{{ l.pulse }}\">{{ l.n }}<\u002Fspan>\n            <span style=\"background:#FFFBF3;border:2px solid #231F1C;border-radius:22px;box-shadow:4px 4px 0 #231F1C;padding:20px 22px;display:flex;flex-direction:column;gap:8px\">\n              <span style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n                <span style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;letter-spacing:-.02em\">{{ l.title }}<\u002Fspan>\n                <span style=\"font-size:12px;font-weight:700;letter-spacing:.12em;padding:5px 10px;border-radius:8px;background:#F3E8D6;color:#6B615A\">{{ l.kind }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-size:18px;line-height:1.5;color:#3D3630\">{{ l.blurb }}<\u002Fspan>\n              <span style=\"font-size:17px;font-weight:700;color:{{ l.ctaColor }}\">{{ l.cta }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <aside style=\"position:sticky;top:96px;display:flex;flex-direction:column;gap:18px\">\n      <div style=\"background:#FDE8DF;border:2px solid #231F1C;border-radius:22px;padding:22px\">\n        <h3 style=\"margin:0 0 12px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px\">Words this unit gives you<\u002Fh3>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n          <span style=\"padding:8px 13px;border-radius:11px;background:#FFFBF3;border:2px solid #231F1C;font-size:16px;font-weight:600\">particle<\u002Fspan>\n          <span style=\"padding:8px 13px;border-radius:11px;background:#FFFBF3;border:2px solid #231F1C;font-size:16px;font-weight:600\">state<\u002Fspan>\n          <span style=\"padding:8px 13px;border-radius:11px;background:#FFFBF3;border:2px solid #231F1C;font-size:16px;font-weight:600\">melting point<\u002Fspan>\n          <span style=\"padding:8px 13px;border-radius:11px;background:#FFFBF3;border:2px solid #231F1C;font-size:16px;font-weight:600\">collision<\u002Fspan>\n          <span style=\"padding:8px 13px;border-radius:11px;background:#FFFBF3;border:2px solid #231F1C;font-size:16px;font-weight:600\">pressure<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFBF3;border:2px solid #231F1C;border-radius:22px;padding:22px\">\n        <h3 style=\"margin:0 0 10px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px\">Later this year<\u002Fh3>\n        <p style=\"margin:0 0 12px;font-size:17px;line-height:1.5;color:#6B615A\">The last two lessons of C1 come back in Half term 3.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;gap:12px;align-items:baseline;font-size:18px\"><span style=\"font-family:'DM Mono',monospace;color:#B9A98F\">05<\u002Fspan>Diffusion<\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline;font-size:18px\"><span style=\"font-family:'DM Mono',monospace;color:#B9A98F\">06<\u002Fspan>Density<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isLesson }}\">\n<main data-screen-label=\"Lesson: Gas pressure\" style=\"max-width:1240px;margin:0 auto;padding:44px 32px 100px;animation:screenIn .45s cubic-bezier(.2,.8,.2,1) both\">\n  <div style=\"display:grid;grid-template-columns:64px minmax(0,940px);gap:34px;max-width:100%;justify-content:center\">\n\n    <div style=\"position:relative\">\n      <div style=\"position:sticky;top:100px;display:flex;flex-direction:column;align-items:center;gap:0\">\n        <div style=\"position:absolute;left:50%;top:14px;bottom:14px;width:4px;margin-left:-2px;background:#E3D6C0;border-radius:99px\"><\u002Fdiv>\n        <div style=\"position:absolute;left:50%;top:14px;width:4px;margin-left:-2px;background:#E4572E;border-radius:99px;height:{{ spineFill }};transition:height .5s cubic-bezier(.2,.8,.2,1)\"><\u002Fdiv>\n        <sc-for list=\"{{ stages }}\" as=\"s\" hint-placeholder-count=\"5\">\n          <a href=\"{{ s.href }}\" style=\"position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;margin-bottom:26px;text-decoration:none\">\n            <span style=\"width:34px;height:34px;border-radius:12px;border:3px solid #231F1C;background:{{ s.bg }};color:{{ s.fg }};display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:16px;box-shadow:2px 2px 0 #231F1C\">{{ s.mark }}<\u002Fspan>\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A7F76;text-align:center;line-height:1.2\">{{ s.label }}<\u002Fspan>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <article>\n      <header>\n        <div style=\"font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8A7F76\">Particles and their behaviour · Lesson 4 · Model<\u002Fdiv>\n        <h1 style=\"margin:12px 0 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(48px,6vw,78px);line-height:.94;letter-spacing:-.035em\">Gas pressure<\u002Fh1>\n        <p style=\"margin:16px 0 0;font-size:26px;font-weight:600;line-height:1.35;color:#B33A1E;max-width:24ch\">What is actually pushing on the inside of a balloon?<\u002Fp>\n        <sc-if value=\"{{ showDraft }}\" hint-placeholder-val=\"{{ true }}\">\n          <span style=\"display:inline-block;margin-top:20px;padding:9px 16px;border-radius:999px;background:#FDE8DF;border:2px solid #E4572E;font-size:15px;font-weight:700;color:#B33A1E\">Draft — not yet science-reviewed<\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fheader>\n\n      <section id=\"s-hook\" style=\"margin-top:40px;background:#231F1C;color:#FBF3E6;border-radius:32px;padding:34px;box-shadow:7px 7px 0 #E4572E\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:34px;align-items:center\">\n          <div>\n            <div style=\"font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#FFC53D\">Start here<\u002Fdiv>\n            <h2 style=\"margin:10px 0 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:40px;line-height:1.05;letter-spacing:-.03em\">The marshmallow in the vacuum jar<\u002Fh2>\n            <p style=\"margin:16px 0 0;font-size:19px;line-height:1.65;color:#E4DBCB\">You already know gas particles are far apart and moving fast. Here is what that lets them do. A marshmallow sits in a sealed jar. Pump the air out and it swells up. Let the air back in and it shrivels.<\u002Fp>\n            <p style=\"margin:18px 0 0;font-size:23px;font-weight:700;line-height:1.35;color:#FFC53D\">Nothing was added to the marshmallow. So why did it grow?<\u002Fp>\n            <button type=\"button\" sc-camel-on-click=\"{{ togglePump }}\" style=\"margin-top:22px;cursor:pointer;padding:16px 26px;border-radius:15px;background:#FFC53D;color:#231F1C;border:2px solid #FBF3E6;font-weight:700;font-size:19px;transition:transform .16s cubic-bezier(.34,1.56,.64,1)\" style-hover=\"transform:translateY(-3px)\" style-active=\"transform:translateY(2px)\">{{ pumpLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:14px\">\n            <div style=\"position:relative;width:250px;height:250px;border-radius:26px;border:4px solid #FBF3E6;background:#2E2823;overflow:hidden\">\n              <div style=\"position:absolute;inset:0;opacity:{{ airOpacity }};transition:opacity 1s ease\">\n                <span style=\"position:absolute;left:12%;top:14%;width:7px;height:7px;border-radius:99px;background:#8FB7FF;animation:drift 2.1s ease-in-out infinite alternate\"><\u002Fspan>\n                <span style=\"position:absolute;left:78%;top:9%;width:6px;height:6px;border-radius:99px;background:#8FB7FF;animation:drift 2.7s ease-in-out infinite alternate\"><\u002Fspan>\n                <span style=\"position:absolute;left:35%;top:7%;width:8px;height:8px;border-radius:99px;background:#8FB7FF;animation:drift 3.1s ease-in-out infinite alternate\"><\u002Fspan>\n                <span style=\"position:absolute;left:60%;top:20%;width:6px;height:6px;border-radius:99px;background:#8FB7FF;animation:drift 2.4s ease-in-out infinite alternate\"><\u002Fspan>\n                <span style=\"position:absolute;left:8%;top:44%;width:8px;height:8px;border-radius:99px;background:#8FB7FF;animation:drift 2.9s ease-in-out infinite alternate\"><\u002Fspan>\n                <span style=\"position:absolute;left:88%;top:38%;width:7px;height:7px;border-radius:99px;background:#8FB7FF;animation:drift 2.2s ease-in-out infinite alternate\"><\u002Fspan>\n                <span style=\"position:absolute;left:16%;top:74%;width:6px;height:6px;border-radius:99px;background:#8FB7FF;animation:drift 3.3s ease-in-out infinite alternate\"><\u002Fspan>\n                <span style=\"position:absolute;left:46%;top:88%;width:8px;height:8px;border-radius:99px;background:#8FB7FF;animation:drift 2.6s ease-in-out infinite alternate\"><\u002Fspan>\n                <span style=\"position:absolute;left:82%;top:78%;width:7px;height:7px;border-radius:99px;background:#8FB7FF;animation:drift 3s ease-in-out infinite alternate\"><\u002Fspan>\n                <span style=\"position:absolute;left:66%;top:62%;width:6px;height:6px;border-radius:99px;background:#8FB7FF;animation:drift 2.3s ease-in-out infinite alternate\"><\u002Fspan>\n                <span style=\"position:absolute;left:26%;top:30%;width:6px;height:6px;border-radius:99px;background:#8FB7FF;animation:drift 2.8s ease-in-out infinite alternate\"><\u002Fspan>\n                <span style=\"position:absolute;left:92%;top:58%;width:6px;height:6px;border-radius:99px;background:#8FB7FF;animation:drift 3.4s ease-in-out infinite alternate\"><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"position:absolute;left:50%;top:50%;width:100px;height:76px;margin:-38px 0 0 -50px;border-radius:26px;background:#FFF3E0;border:3px solid #FBF3E6;display:grid;place-items:center;transform:scale({{ mScale }});transition:transform 1.1s cubic-bezier(.34,1.4,.64,1)\">\n                <span style=\"display:flex;gap:7px\">\n                  <span style=\"width:8px;height:8px;border-radius:99px;background:#E4572E\"><\u002Fspan>\n                  <span style=\"width:8px;height:8px;border-radius:99px;background:#E4572E\"><\u002Fspan>\n                  <span style=\"width:8px;height:8px;border-radius:99px;background:#E4572E\"><\u002Fspan>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:16px;font-size:14px;font-weight:600;color:#B9A98F\">\n              <span style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:10px;height:10px;border-radius:99px;background:#8FB7FF\"><\u002Fspan>air in the jar<\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:10px;height:10px;border-radius:99px;background:#E4572E\"><\u002Fspan>gas inside<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"s-idea\" style=\"margin-top:34px\" data-reveal=\"1\">\n        <div style=\"background:#FFFBF3;border:2px solid #231F1C;border-radius:28px;padding:30px;box-shadow:5px 5px 0 #231F1C\">\n          <div style=\"font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8A7F76\">Your turn<\u002Fdiv>\n          <h2 style=\"margin:10px 0 20px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:31px;line-height:1.2;letter-spacing:-.02em\">Commit first. What causes the pressure inside a blown-up balloon?<\u002Fh2>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <sc-for list=\"{{ q1 }}\" as=\"o\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" style=\"display:flex;align-items:center;gap:15px;width:100%;text-align:left;cursor:pointer;padding:17px 19px;border-radius:17px;font-size:19px;font-weight:600;transition:transform .15s,box-shadow .15s;background:{{ o.bg }};border:2px solid {{ o.bc }};color:{{ o.fg }};box-shadow:{{ o.sh }};animation:{{ o.an }}\" style-hover=\"transform:translate(-2px,-2px)\">\n                <span style=\"flex:0 0 30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:16px;font-weight:800;background:{{ o.mbg }};color:{{ o.mfg }}\">{{ o.mark }}<\u002Fspan>\n                <span style=\"flex:1\">{{ o.t }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ q1Done }}\">\n            <p style=\"margin:20px 0 0;padding:16px 20px;border-radius:16px;background:{{ q1Tint }};font-size:19px;line-height:1.55;font-weight:600;animation:rise .4s both\">{{ q1Msg }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;align-items:start\">\n          <div style=\"background:#FFF7EC;border:2px solid #231F1C;border-radius:28px;padding:28px 30px\">\n            <p style=\"margin:0;font-size:20px;line-height:1.7\">Gas particles move fast in every direction. Each time one hits a wall it gives that wall a <strong>tiny push<\u002Fstrong>. There are so many hits each second that they add up to one steady push. <strong>That push is gas pressure.<\u002Fstrong><\u002Fp>\n            <p style=\"margin:16px 0 0;font-size:20px;line-height:1.7\">So the marshmallow has gas pushing out from inside, and air pushing in from outside. Pump the outside air away and the inside push has nothing left to balance it — so the marshmallow swells.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#231F1C;color:#FBF3E6;border-radius:28px;padding:26px 28px\">\n            <div style=\"font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#FFC53D\">Hold on to this<\u002Fdiv>\n            <p style=\"margin:12px 0 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:26px;line-height:1.25;letter-spacing:-.02em\">Pressure is a count of hits, not a squeeze.<\u002Fp>\n            <p style=\"margin:14px 0 0;font-size:18px;line-height:1.6;color:#E4DBCB\">More hits per second on the wall means more pressure. That single sentence explains every question in this lesson.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"s-trap\" style=\"margin-top:34px\" data-reveal=\"1\">\n        <div style=\"background:#FFC53D;border:2px solid #231F1C;border-radius:28px;padding:30px;box-shadow:5px 5px 0 #231F1C\">\n          <div style=\"display:flex;align-items:center;gap:12px\">\n            <span style=\"width:34px;height:34px;border-radius:11px;background:#231F1C;color:#FFC53D;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px\">!<\u002Fspan>\n            <div style=\"font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#5A430A\">Think again — the classic trap<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:16px 0 0;font-size:23px;font-weight:700;line-height:1.4;font-style:italic\">“The particles are squashed up against each other, and that squashing is what pushes.”<\u002Fp>\n          <p style=\"margin:14px 0 22px;font-size:20px;line-height:1.6;color:#3D3630\">Predict before you run it. Spread the <strong>same<\u002Fstrong> particles out into a bigger box. What happens to the pressure?<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <sc-for list=\"{{ q2 }}\" as=\"o\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" style=\"display:flex;align-items:center;gap:15px;width:100%;text-align:left;cursor:pointer;padding:17px 19px;border-radius:17px;font-size:19px;font-weight:600;transition:transform .15s,box-shadow .15s;background:{{ o.bg }};border:2px solid {{ o.bc }};color:{{ o.fg }};box-shadow:{{ o.sh }};animation:{{ o.an }}\" style-hover=\"transform:translate(-2px,-2px)\">\n                <span style=\"flex:0 0 30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:16px;font-weight:800;background:{{ o.mbg }};color:{{ o.mfg }}\">{{ o.mark }}<\u002Fspan>\n                <span style=\"flex:1\">{{ o.t }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:22px;background:#231F1C;border-radius:22px;padding:20px\">\n            <div style=\"position:relative;border-radius:14px;overflow:hidden;background:#3A332E\">\n              <canvas ref=\"{{ trapCanvas }}\" style=\"width:100%;height:190px\"><\u002Fcanvas>\n              <sc-if value=\"{{ trapLocked }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"position:absolute;inset:0;background:rgba(35,31,28,.86);display:grid;place-items:center;padding:20px;text-align:center\">\n                  <span style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:22px;color:#FFC53D;line-height:1.3\">Make your prediction first — then the wall moves.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:20px;margin-top:16px;flex-wrap:wrap\">\n              <div style=\"display:flex;align-items:baseline;gap:10px\">\n                <span style=\"font-family:'DM Mono',monospace;font-size:34px;font-weight:500;color:#FFC53D\" ref=\"{{ trapHits }}\">0<\u002Fspan>\n                <span style=\"font-size:16px;font-weight:600;color:#B9A98F\">wall hits per second<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"flex:1;min-width:160px;height:14px;border-radius:99px;background:#3A332E;overflow:hidden\"><div ref=\"{{ trapBar }}\" style=\"height:100%;width:10%;background:#FFC53D;border-radius:99px\"><\u002Fdiv><\u002Fdiv>\n              <sc-if value=\"{{ q2Done }}\">\n                <button type=\"button\" sc-camel-on-click=\"{{ runTrap }}\" style=\"cursor:pointer;padding:13px 22px;border-radius:14px;background:#FFC53D;color:#231F1C;border:2px solid #FFC53D;font-weight:700;font-size:17px;transition:transform .15s\" style-hover=\"transform:translateY(-2px)\">{{ trapBtn }}<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ q2Done }}\">\n            <p style=\"margin:20px 0 0;padding:16px 20px;border-radius:16px;background:#FFF7EC;border:2px solid #231F1C;font-size:19px;line-height:1.6;font-weight:600;animation:rise .4s both\">{{ q2Msg }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"margin-top:34px\" data-reveal=\"1\">\n        <h2 style=\"margin:0 0 16px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;letter-spacing:-.025em\">Words to know<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ flipPressure }}\" style=\"text-align:left;cursor:pointer;background:#FFFBF3;border:2px solid #231F1C;border-radius:24px;padding:26px;min-height:190px;display:flex;flex-direction:column;gap:10px;box-shadow:5px 5px 0 #2F5CE0;transition:transform .18s cubic-bezier(.34,1.56,.64,1)\" style-hover=\"transform:translate(-3px,-3px)\">\n            <span style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:32px;letter-spacing:-.02em\">pressure<\u002Fspan>\n            <sc-if value=\"{{ pressureOpen }}\">\n              <span style=\"display:flex;flex-direction:column;gap:10px;animation:rise .35s both\">\n                <span style=\"font-size:20px;line-height:1.55\">How hard a force pushes on each bit of a surface.<\u002Fspan>\n                <span style=\"font-size:16px;line-height:1.5;color:#6B615A\">You will meet pressure = force ÷ area as a calculation in Physics P5.<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ pressureShut }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"margin-top:auto;font-size:17px;font-weight:700;color:#2F5CE0\">Say it in your head, then tap to check →<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ flipCollision }}\" style=\"text-align:left;cursor:pointer;background:#FFFBF3;border:2px solid #231F1C;border-radius:24px;padding:26px;min-height:190px;display:flex;flex-direction:column;gap:10px;box-shadow:5px 5px 0 #2F5CE0;transition:transform .18s cubic-bezier(.34,1.56,.64,1)\" style-hover=\"transform:translate(-3px,-3px)\">\n            <span style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:32px;letter-spacing:-.02em\">collision<\u002Fspan>\n            <sc-if value=\"{{ collisionOpen }}\">\n              <span style=\"display:flex;flex-direction:column;gap:10px;animation:rise .35s both\">\n                <span style=\"font-size:20px;line-height:1.55\">When a moving particle hits something and bounces off.<\u002Fspan>\n                <span style=\"font-size:16px;line-height:1.5;color:#6B615A\">Every collision with a wall is one tiny push. Billions of them make the pressure.<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ collisionShut }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"margin-top:auto;font-size:17px;font-weight:700;color:#2F5CE0\">Say it in your head, then tap to check →<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"margin-top:34px\" data-reveal=\"1\">\n        <div style=\"background:#FFFBF3;border:2px solid #231F1C;border-radius:28px;padding:30px;box-shadow:5px 5px 0 #231F1C\">\n          <div style=\"font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8A7F76\">Your turn<\u002Fdiv>\n          <h2 style=\"margin:10px 0 20px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:31px;line-height:1.2;letter-spacing:-.02em\">Now change something else. A sealed can of air is heated and the pressure inside rises. Why?<\u002Fh2>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <sc-for list=\"{{ q3 }}\" as=\"o\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" style=\"display:flex;align-items:center;gap:15px;width:100%;text-align:left;cursor:pointer;padding:17px 19px;border-radius:17px;font-size:19px;font-weight:600;transition:transform .15s,box-shadow .15s;background:{{ o.bg }};border:2px solid {{ o.bc }};color:{{ o.fg }};box-shadow:{{ o.sh }};animation:{{ o.an }}\" style-hover=\"transform:translate(-2px,-2px)\">\n                <span style=\"flex:0 0 30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:16px;font-weight:800;background:{{ o.mbg }};color:{{ o.mfg }}\">{{ o.mark }}<\u002Fspan>\n                <span style=\"flex:1\">{{ o.t }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ q3Done }}\">\n            <p style=\"margin:20px 0 0;padding:16px 20px;border-radius:16px;background:{{ q3Tint }};font-size:19px;line-height:1.55;font-weight:600;animation:rise .4s both\">{{ q3Msg }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ q3Done }}\">\n          <div style=\"margin-top:22px;background:#FFC53D;border:2px solid #231F1C;border-radius:28px;padding:28px 30px;box-shadow:5px 5px 0 #231F1C;animation:rise .45s both\">\n            <div style=\"display:flex;align-items:center;gap:12px\">\n              <span style=\"width:34px;height:34px;border-radius:11px;background:#231F1C;color:#FFC53D;display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px\">!<\u002Fspan>\n              <div style=\"font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#5A430A\">Think again<\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:16px 0 0;font-size:22px;font-weight:700;line-height:1.4;font-style:italic\">“Heating makes the particles themselves get bigger.”<\u002Fp>\n            <p style=\"margin:14px 0 0;font-size:20px;line-height:1.6;color:#3D3630\">Test it. If every particle really had grown, what would happen to the <strong>mass<\u002Fstrong> of gas in the sealed can?<\u002Fp>\n            <button type=\"button\" sc-camel-on-click=\"{{ toggleMass }}\" style=\"margin-top:18px;cursor:pointer;padding:14px 22px;border-radius:14px;background:#231F1C;color:#FFC53D;border:2px solid #231F1C;font-weight:700;font-size:18px;transition:transform .15s\" style-hover=\"transform:translateY(-2px)\">{{ massBtn }}<\u002Fbutton>\n            <sc-if value=\"{{ massOpen }}\">\n              <p style=\"margin:18px 0 0;padding:18px 20px;border-radius:16px;background:#FFF7EC;border:2px solid #231F1C;font-size:19px;line-height:1.65;animation:rise .4s both\">Nothing got in or out, so the mass cannot change — and it doesn't. The particles are exactly the same particles they always were. Only their <strong>speed<\u002Fstrong> changed. Faster particles reach the walls more often and land harder, and that is the whole reason the pressure rose.<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n\n      <section id=\"s-lab\" style=\"margin-top:34px\" data-reveal=\"1\">\n        <div style=\"background:#231F1C;color:#FBF3E6;border-radius:32px;padding:32px;box-shadow:7px 7px 0 #2F5CE0\">\n          <div style=\"display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap\">\n            <div>\n              <div style=\"font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8FB7FF\">Investigate<\u002Fdiv>\n              <h2 style=\"margin:10px 0 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:38px;line-height:1.05;letter-spacing:-.03em\">The particle lab<\u002Fh2>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:18px;line-height:1.55;color:#E4DBCB;max-width:38ch\">Change <strong style=\"color:#FFC53D\">one control at a time<\u002Fstrong>. Predict what the counter will do before you press.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:22px;padding:20px 22px;border-radius:20px;background:#3A332E\">\n            <p style=\"margin:0 0 14px;font-size:20px;font-weight:600;line-height:1.5\">Predict first: what happens to the pressure if you squash the gas into half the space?<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px\">\n              <sc-for list=\"{{ q4 }}\" as=\"o\" hint-placeholder-count=\"3\">\n                <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" style=\"text-align:left;cursor:pointer;padding:16px 18px;border-radius:15px;font-size:18px;font-weight:600;transition:transform .15s;background:{{ o.dbg }};border:2px solid {{ o.dbc }};color:{{ o.dfg }};animation:{{ o.an }}\" style-hover=\"transform:translateY(-3px)\">{{ o.t }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px;align-items:start\">\n            <div>\n              <div style=\"border-radius:20px;overflow:hidden;background:#3A332E;border:2px solid #4A423B\">\n                <canvas ref=\"{{ labCanvas }}\" style=\"width:100%;height:300px\"><\u002Fcanvas>\n              <\u002Fdiv>\n              <div style=\"margin-top:16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap\">\n                <div style=\"display:flex;align-items:baseline;gap:10px\">\n                  <span style=\"font-family:'DM Mono',monospace;font-size:44px;font-weight:500;color:#FFC53D\" ref=\"{{ labHits }}\">0<\u002Fspan>\n                  <span style=\"font-size:17px;font-weight:600;color:#B9A98F\">wall hits per second<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"flex:1;min-width:150px;height:16px;border-radius:99px;background:#3A332E;overflow:hidden\"><div ref=\"{{ labBar }}\" style=\"height:100%;width:10%;background:#2F5CE0;border-radius:99px\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"margin:12px 0 0;font-size:18px;line-height:1.6;color:#E4DBCB\">That counter <strong style=\"color:#FFC53D\">is<\u002Fstrong> the pressure. Every wall hit is one push.<\u002Fp>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:18px\">\n              <sc-for list=\"{{ controls }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <div>\n                  <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px\">\n                    <span style=\"font-size:18px;font-weight:700\">{{ c.label }}<\u002Fspan>\n                    <span style=\"font-size:15px;font-weight:600;color:#FFC53D\">{{ c.current }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:5px;border-radius:15px;background:#3A332E\">\n                    <sc-for list=\"{{ c.steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ s.set }}\" style=\"cursor:pointer;padding:12px 6px;border-radius:11px;font-size:16px;font-weight:700;transition:transform .15s;background:{{ s.bg }};color:{{ s.fg }}\" style-hover=\"transform:translateY(-2px)\">{{ s.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ q4Done }}\">\n                <p style=\"margin:0;padding:18px 20px;border-radius:18px;background:#FFC53D;color:#231F1C;font-size:18px;line-height:1.6;font-weight:600;animation:rise .4s both\">{{ q4Msg }}<\u002Fp>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"margin-top:34px\" data-reveal=\"1\">\n        <div style=\"background:#FFFBF3;border:2px solid #231F1C;border-radius:28px;padding:30px;box-shadow:5px 5px 0 #231F1C\">\n          <div style=\"font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8A7F76\">Your turn<\u002Fdiv>\n          <h2 style=\"margin:10px 0 8px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:31px;line-height:1.2;letter-spacing:-.02em\">Three of these raise the pressure. One is a trap.<\u002Fh2>\n          <p style=\"margin:0 0 20px;font-size:19px;line-height:1.55;color:#3D3630\">Say why each one works before you tap it.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:14px\">\n            <sc-for list=\"{{ ways }}\" as=\"w\" hint-placeholder-count=\"4\">\n              <button type=\"button\" sc-camel-on-click=\"{{ w.pick }}\" style=\"text-align:left;cursor:pointer;padding:20px 18px;border-radius:20px;min-height:150px;display:flex;flex-direction:column;gap:10px;transition:transform .16s cubic-bezier(.34,1.56,.64,1);background:{{ w.bg }};border:2px solid {{ w.bc }};box-shadow:{{ w.sh }};animation:{{ w.an }}\" style-hover=\"transform:translate(-3px,-3px)\">\n                <span style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:21px;line-height:1.2\">{{ w.t }}<\u002Fspan>\n                <sc-if value=\"{{ w.open }}\">\n                  <span style=\"font-size:16px;line-height:1.5;color:#3D3630;animation:rise .3s both\">{{ w.why }}<\u002Fspan>\n                <\u002Fsc-if>\n                <span style=\"margin-top:auto;font-size:15px;font-weight:700;color:{{ w.tagFg }}\">{{ w.tag }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"margin-top:34px\" data-reveal=\"1\">\n        <div style=\"background:#FFF7EC;border:2px solid #231F1C;border-radius:28px;padding:30px\">\n          <div style=\"font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8A7F76\">Your turn · in your own words<\u002Fdiv>\n          <h2 style=\"margin:10px 0 16px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;line-height:1.25;letter-spacing:-.02em\">Back to the marshmallow. Explain why it swelled when the air was pumped out of the jar.<\u002Fh2>\n          <button type=\"button\" sc-camel-on-click=\"{{ toggleOwn }}\" style=\"cursor:pointer;padding:15px 24px;border-radius:15px;background:#231F1C;color:#FBF3E6;border:2px solid #231F1C;font-weight:700;font-size:18px;transition:transform .15s\" style-hover=\"transform:translateY(-2px)\">{{ ownBtn }}<\u002Fbutton>\n          <sc-if value=\"{{ ownOpen }}\">\n            <div style=\"margin-top:20px;padding:22px;border-radius:20px;background:#FFFBF3;border:2px solid #231F1C;animation:rise .4s both\">\n              <p style=\"margin:0 0 14px;font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8A7F76\">Did you say all three?<\u002Fp>\n              <div style=\"display:flex;flex-direction:column;gap:12px\">\n                <div style=\"display:flex;gap:13px;align-items:baseline;font-size:19px;line-height:1.55\"><span style=\"flex:0 0 26px;height:26px;border-radius:9px;background:#E2F6E9;border:2px solid #12A150;display:grid;place-items:center;font-size:14px;font-weight:800;color:#0B6E37\">1<\u002Fspan><span>Gas inside the marshmallow pushes out on its skin.<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:13px;align-items:baseline;font-size:19px;line-height:1.55\"><span style=\"flex:0 0 26px;height:26px;border-radius:9px;background:#E2F6E9;border:2px solid #12A150;display:grid;place-items:center;font-size:14px;font-weight:800;color:#0B6E37\">2<\u002Fspan><span>Air in the jar normally pushes back in, and the two pushes balance.<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:13px;align-items:baseline;font-size:19px;line-height:1.55\"><span style=\"flex:0 0 26px;height:26px;border-radius:9px;background:#E2F6E9;border:2px solid #12A150;display:grid;place-items:center;font-size:14px;font-weight:800;color:#0B6E37\">3<\u002Fspan><span>Pump the air away and the outside push nearly vanishes, so the inside push wins and the marshmallow expands.<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"s-master\" style=\"margin-top:34px\" data-reveal=\"1\">\n        <div style=\"background:#FFFBF3;border:3px solid #231F1C;border-radius:32px;padding:32px;box-shadow:7px 7px 0 #12A150;position:relative;overflow:hidden\">\n          <div style=\"display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap\">\n            <h2 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:38px;letter-spacing:-.03em\">Mastery ladder<\u002Fh2>\n            <sc-if value=\"{{ ladderOpen }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;align-items:center;gap:12px\">\n                <span style=\"font-size:17px;font-weight:700;color:#6B615A\">{{ ladderCount }} of 4 rungs<\u002Fspan>\n                <div style=\"width:140px;height:14px;border-radius:99px;background:#F0E4CF;overflow:hidden\"><div style=\"height:100%;background:#12A150;border-radius:99px;width:{{ ladderPct }};transition:width .5s cubic-bezier(.2,.8,.2,1)\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ ladderDone }}\">\n              <span style=\"padding:12px 20px;border-radius:16px;background:#12A150;color:#FFF;border:3px solid #231F1C;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.02em;animation:stamp .6s cubic-bezier(.2,.8,.2,1) both\">All four rungs<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:26px;display:flex;flex-direction:column;gap:22px\">\n            <div style=\"border-left:4px solid #E4572E;padding-left:22px\">\n              <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;color:#B33A1E\">1 · Recall<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:8px 0 16px;font-size:21px;font-weight:600;line-height:1.4\">What causes the pressure of a gas on the walls of its container?<\u002Fp>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:11px\">\n                <sc-for list=\"{{ m1 }}\" as=\"o\" hint-placeholder-count=\"4\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" style=\"text-align:left;cursor:pointer;padding:15px 17px;border-radius:15px;font-size:18px;font-weight:600;transition:transform .15s;background:{{ o.bg }};border:2px solid {{ o.bc }};color:{{ o.fg }};animation:{{ o.an }}\" style-hover=\"transform:translateY(-2px)\">{{ o.t }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"border-left:4px solid #E4572E;padding-left:22px\">\n              <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;color:#B33A1E\">2 · Apply<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:8px 0 16px;font-size:21px;font-weight:600;line-height:1.4\">A sealed syringe of gas is squashed to half its volume. What happens to the pressure, and why?<\u002Fp>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:11px\">\n                <sc-for list=\"{{ m2 }}\" as=\"o\" hint-placeholder-count=\"4\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" style=\"text-align:left;cursor:pointer;padding:15px 17px;border-radius:15px;font-size:18px;font-weight:600;transition:transform .15s;background:{{ o.bg }};border:2px solid {{ o.bc }};color:{{ o.fg }};animation:{{ o.an }}\" style-hover=\"transform:translateY(-2px)\">{{ o.t }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"border-left:4px solid #E4572E;padding-left:22px\">\n              <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;color:#B33A1E\">3 · Explain<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:8px 0 14px;font-size:21px;font-weight:600;line-height:1.4\">Explain why the pressure inside a sealed can rises when it is heated.<\u002Fp>\n              <button type=\"button\" sc-camel-on-click=\"{{ toggleM3 }}\" style=\"cursor:pointer;padding:12px 20px;border-radius:13px;background:#F3E8D6;border:2px solid #231F1C;font-weight:700;font-size:17px;transition:transform .15s\" style-hover=\"transform:translateY(-2px)\">{{ m3Btn }}<\u002Fbutton>\n              <sc-if value=\"{{ m3Open }}\">\n                <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:10px;animation:rise .35s both\">\n                  <sc-for list=\"{{ m3Points }}\" as=\"p\" hint-placeholder-count=\"3\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ p.tick }}\" style=\"display:flex;gap:13px;align-items:center;text-align:left;cursor:pointer;padding:14px 16px;border-radius:14px;font-size:18px;line-height:1.5;background:{{ p.bg }};border:2px solid {{ p.bc }};transition:transform .15s\" style-hover=\"transform:translateX(3px)\">\n                      <span style=\"flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:15px;font-weight:800;background:{{ p.mbg }};color:{{ p.mfg }}\">{{ p.mark }}<\u002Fspan>\n                      <span style=\"flex:1\">{{ p.t }}<\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <div style=\"border-left:4px solid #E4572E;padding-left:22px\">\n              <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px;color:#B33A1E\">4 · Produce<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:8px 0 14px;font-size:21px;font-weight:600;line-height:1.4\">Predict what happens to a sealed, part-inflated balloon taken to the top of a mountain, and explain it.<\u002Fp>\n              <button type=\"button\" sc-camel-on-click=\"{{ toggleM4 }}\" style=\"cursor:pointer;padding:12px 20px;border-radius:13px;background:#F3E8D6;border:2px solid #231F1C;font-weight:700;font-size:17px;transition:transform .15s\" style-hover=\"transform:translateY(-2px)\">{{ m4Btn }}<\u002Fbutton>\n              <sc-if value=\"{{ m4Open }}\">\n                <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:10px;animation:rise .35s both\">\n                  <sc-for list=\"{{ m4Points }}\" as=\"p\" hint-placeholder-count=\"3\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ p.tick }}\" style=\"display:flex;gap:13px;align-items:center;text-align:left;cursor:pointer;padding:14px 16px;border-radius:14px;font-size:18px;line-height:1.5;background:{{ p.bg }};border:2px solid {{ p.bc }};transition:transform .15s\" style-hover=\"transform:translateX(3px)\">\n                      <span style=\"flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:15px;font-weight:800;background:{{ p.mbg }};color:{{ p.mfg }}\">{{ p.mark }}<\u002Fspan>\n                      <span style=\"flex:1\">{{ p.t }}<\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"margin-top:34px\" data-reveal=\"1\">\n        <div style=\"background:#231F1C;color:#FBF3E6;border-radius:32px;padding:34px;box-shadow:7px 7px 0 #FFC53D\">\n          <div style=\"font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#FFC53D\">Key note<\u002Fdiv>\n          <p style=\"margin:14px 0 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:32px;line-height:1.3;letter-spacing:-.02em\">Gas pressure is billions of particles hitting the walls every second. More particles, less space, or a higher temperature all mean more collisions — and more pressure. The particles never change size.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"margin-top:34px\" data-reveal=\"1\">\n        <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:18px\">\n          <span style=\"font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#7A4FD8\">Going further<\u002Fspan>\n          <span style=\"flex:1;height:2px;background:#DCCDF3\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;align-items:start\">\n          <div style=\"background:#F2ECFC;border:2px solid #7A4FD8;border-radius:26px;padding:26px 28px\">\n            <p style=\"margin:0;font-size:19px;line-height:1.7\">Heating does <strong>two<\u002Fstrong> jobs at once, and most answers only mention one of them. Faster particles reach the walls more often. They also arrive harder, because they are moving faster when they land. Both of those raise the pressure — and not one extra particle was added to do it.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#FFFBF3;border:2px solid #231F1C;border-radius:26px;padding:26px 28px\">\n            <div style=\"font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8A7F76\">Your turn<\u002Fdiv>\n            <p style=\"margin:10px 0 16px;font-size:19px;line-height:1.55;font-weight:600\">Same two effects, somewhere they matter. Why does an aerosol can carry the warning 'do not place on a fire'?<\u002Fp>\n            <button type=\"button\" sc-camel-on-click=\"{{ toggleAero }}\" style=\"cursor:pointer;padding:13px 20px;border-radius:13px;background:#7A4FD8;color:#FFF;border:2px solid #231F1C;font-weight:700;font-size:17px;transition:transform .15s\" style-hover=\"transform:translateY(-2px)\">{{ aeroBtn }}<\u002Fbutton>\n            <sc-if value=\"{{ aeroOpen }}\">\n              <p style=\"margin:16px 0 0;font-size:18px;line-height:1.65;animation:rise .35s both\">Heat makes the particles inside move much faster. They hit the can walls more often and harder, so the pressure climbs fast. The can is sealed and rigid, so the gas has nowhere to go — and it can burst.<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"margin-top:34px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px\" data-reveal=\"1\">\n        <div style=\"background:#FFFBF3;border:2px solid #231F1C;border-radius:24px;padding:24px\">\n          <h3 style=\"margin:0 0 12px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px\">Before this lesson<\u002Fh3>\n          <button type=\"button\" sc-camel-on-click=\"{{ toSubject }}\" style=\"cursor:pointer;display:block;text-align:left;font-size:19px;font-weight:600;color:#B33A1E\">Solids, liquids and gases →<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"background:#FFFBF3;border:2px solid #231F1C;border-radius:24px;padding:24px\">\n          <h3 style=\"margin:0 0 12px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px\">At GCSE this becomes<\u002Fh3>\n          <p style=\"margin:0;font-size:19px;line-height:1.5\">States of matter, and the gas laws in Physics.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#E4572E;border:2px solid #231F1C;border-radius:24px;padding:24px;color:#FFF7EC\">\n          <h3 style=\"margin:0 0 8px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:24px\">Stuck? Ask Mr Badmus AI<\u002Fh3>\n          <p style=\"margin:0 0 14px;font-size:18px;line-height:1.5\">Ask anything about this lesson and get it explained another way.<\u002Fp>\n          <span style=\"display:inline-block;padding:11px 18px;border-radius:12px;background:#FFF7EC;color:#B33A1E;font-weight:700;font-size:17px\">Start a question →<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Farticle>\n  <\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<footer style=\"border-top:2px solid #231F1C;background:#F3E8D6\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:34px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap\">\n    <span style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px\">MrBadmusAI · Key Stage 3 Science<\u002Fspan>\n    <div style=\"display:flex;gap:22px;font-size:17px;font-weight:600;color:#6B615A\">\n      <button type=\"button\" sc-camel-on-click=\"{{ toHub }}\" style=\"cursor:pointer\">All of KS3<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ toYear }}\" style=\"cursor:pointer\">Year 7<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ toSubject }}\" style=\"cursor:pointer\">Chemistry<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;hub&quot;,&quot;year&quot;,&quot;halfterm&quot;,&quot;subject&quot;,&quot;lesson&quot;],&quot;default&quot;:&quot;hub&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;showDraftFlags&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;ambientMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    screen: this.props.startScreen || 'hub',\n    pumped: false,\n    answers: {},\n    wayPicks: {},\n    open: {},\n    ticks: {},\n    lab: { space: 1, temp: 1, count: 1 },\n    trapRun: false\n  };\n  sims = {};\n  trapCanvas = React.createRef();\n  labCanvas = React.createRef();\n  trapHits = React.createRef();\n  labHits = React.createRef();\n  trapBar = React.createRef();\n  labBar = React.createRef();\n\n  componentDidMount() {\n    this.loop = this.loop.bind(this);\n    this.raf = requestAnimationFrame(this.loop);\n    this._lastScreen = this.state.screen;\n    this.setupReveal();\n  }\n  componentDidUpdate(prevProps) {\n    if (prevProps && prevProps.startScreen !== this.props.startScreen && this.props.startScreen) {\n      this.setState({ screen: this.props.startScreen });\n    }\n    if (this._lastScreen !== this.state.screen) {\n      this._lastScreen = this.state.screen;\n      window.scrollTo(0, 0);\n      this.setupReveal();\n    }\n  }\n  componentWillUnmount() {\n    cancelAnimationFrame(this.raf);\n    if (this.io) this.io.disconnect();\n    clearTimeout(this.failsafe);\n  }\n\n  setupReveal() {\n    if (this.io) this.io.disconnect();\n    this.io = new IntersectionObserver((es) => {\n      es.forEach((e) => {\n        if (e.isIntersecting) {\n          e.target.style.opacity = '1';\n          e.target.style.transform = 'none';\n          this.io.unobserve(e.target);\n        }\n      });\n    }, { rootMargin: '0px 0px -6% 0px' });\n    requestAnimationFrame(() => {\n      document.querySelectorAll('[data-reveal]').forEach((el) => {\n        if (el.__rev) return;\n        el.__rev = 1;\n        if (el.getBoundingClientRect().top < window.innerHeight * 0.95) return;\n        el.style.opacity = '0';\n        el.style.transform = 'translateY(24px)';\n        el.style.transition = 'opacity .6s cubic-bezier(.2,.8,.2,1), transform .6s cubic-bezier(.2,.8,.2,1)';\n        this.io.observe(el);\n      });\n    });\n    clearTimeout(this.failsafe);\n    this.failsafe = setTimeout(() => {\n      document.querySelectorAll('[data-reveal]').forEach((el) => { el.style.opacity = '1'; el.style.transform = 'none'; });\n    }, 5000);\n  }\n\n  loop() {\n    const now = performance.now();\n    const dt = Math.min(0.05, (now - (this.tPrev || now)) / 1000);\n    this.tPrev = now;\n    if (this.state.screen === 'lesson') {\n      this.runSim('trap', this.trapCanvas.current, 46, 1, this.state.trapRun ? 1 : 0.46, dt, this.trapHits.current, this.trapBar.current, 200);\n      const L = this.state.lab;\n      const SP = [0.4, 0.7, 1], TM = [0.62, 1, 1.55], CT = [26, 54, 96];\n      this.runSim('lab', this.labCanvas.current, CT[L.count], TM[L.temp], SP[L.space], dt, this.labHits.current, this.labBar.current, 300);\n    }\n    this.raf = requestAnimationFrame(this.loop);\n  }\n\n  runSim(key, cv, n, speedMul, boxTarget, dt, hitsEl, barEl, scale) {\n    if (!cv) return;\n    const w = cv.clientWidth, h = cv.clientHeight;\n    if (!w || !h) return;\n    const dpr = Math.min(2, window.devicePixelRatio || 1);\n    if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }\n    let s = this.sims[key];\n    if (!s) s = this.sims[key] = { p: [], box: boxTarget, hits: [], sm: 0, sp: speedMul, read: 0 };\n    s.box += (boxTarget - s.box) * Math.min(1, dt * 2.6);\n    if (s.sp !== speedMul) { const r = speedMul / s.sp; s.p.forEach((q) => { q.vx *= r; q.vy *= r; }); s.sp = speedMul; }\n    const pad = 12, bw = Math.max(40, (w - pad * 2) * s.box), bh = h - pad * 2;\n    const base = 108 * speedMul;\n    while (s.p.length < n) {\n      const a = Math.random() * Math.PI * 2;\n      s.p.push({ x: pad + Math.random() * bw, y: pad + Math.random() * bh, vx: Math.cos(a) * base, vy: Math.sin(a) * base });\n    }\n    if (s.p.length > n) s.p.length = n;\n    const now = performance.now();\n    for (const q of s.p) {\n      q.x += q.vx * dt; q.y += q.vy * dt;\n      if (q.x < pad) { q.x = pad; q.vx = Math.abs(q.vx); s.hits.push(now); }\n      else if (q.x > pad + bw) { q.x = pad + bw; q.vx = -Math.abs(q.vx); s.hits.push(now); }\n      if (q.y < pad) { q.y = pad; q.vy = Math.abs(q.vy); s.hits.push(now); }\n      else if (q.y > pad + bh) { q.y = pad + bh; q.vy = -Math.abs(q.vy); s.hits.push(now); }\n    }\n    while (s.hits.length && s.hits[0] < now - 1000) s.hits.shift();\n    s.sm += (s.hits.length - s.sm) * Math.min(1, dt * 2.2);\n    const ctx = cv.getContext('2d');\n    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    ctx.clearRect(0, 0, w, h);\n    ctx.fillStyle = '#F7EFE1';\n    ctx.fillRect(pad, pad, bw, bh);\n    ctx.fillStyle = '#231F1C';\n    ctx.fillRect(pad + bw - 4, pad - 4, 8, bh + 8);\n    ctx.fillStyle = '#E4572E';\n    for (const q of s.p) { ctx.beginPath(); ctx.arc(q.x, q.y, 3.4, 0, 6.284); ctx.fill(); }\n    if (hitsEl && now - s.read > 110) { s.read = now; hitsEl.textContent = String(Math.round(s.sm)); }\n    if (barEl) barEl.style.width = Math.max(4, Math.min(100, (s.sm / scale) * 100)) + '%';\n  }\n\n  go(screen) { this.setState({ screen }); }\n  pick(qid, i) { if (this.state.answers[qid] != null) return; this.setState((s) => ({ answers: Object.assign({}, s.answers, { [qid]: i }) })); }\n  toggle(k) { this.setState((s) => ({ open: Object.assign({}, s.open, { [k]: !s.open[k] }) })); }\n  tick(k) { this.setState((s) => ({ ticks: Object.assign({}, s.ticks, { [k]: !s.ticks[k] }) })); }\n\n  mk(qid, list, wide) {\n    const picked = this.state.answers[qid];\n    const done = picked != null;\n    const L = ['A', 'B', 'C', 'D'];\n    return list.map((o, i) => {\n      const chosen = picked === i;\n      let bg = '#FFFBF3', bc = '#E3D6C0', fg = '#231F1C', sh = '2px 2px 0 #E3D6C0', mbg = '#F3E8D6', mfg = '#6B615A', mark = L[i], an = 'none';\n      let dbg = '#463E37', dbc = '#5A5049', dfg = '#FBF3E6';\n      if (done && o.ok) { bg = '#E2F6E9'; bc = '#12A150'; sh = '3px 3px 0 #12A150'; mbg = '#12A150'; mfg = '#FFF'; mark = '✓'; an = 'popIn .4s both'; dbg = '#12A150'; dbc = '#12A150'; dfg = '#FFF'; }\n      else if (chosen) { bg = '#F3E8D6'; bc = '#231F1C'; sh = '3px 3px 0 #231F1C'; mbg = '#231F1C'; mfg = '#FBF3E6'; mark = '✕'; an = 'shake .4s both'; dbg = '#5A5049'; dbc = '#231F1C'; }\n      else if (done) { bg = '#FBF3E6'; bc = '#EBDFCB'; fg = '#9A8F86'; sh = 'none'; mbg = '#F3E8D6'; mfg = '#B9A98F'; dbg = '#3A332E'; dbc = '#4A423B'; dfg = '#8F857D'; }\n      return { t: o.t, bg, bc, fg, sh, mbg, mfg, mark, an, dbg, dbc, dfg, pick: () => this.pick(qid, i) };\n    });\n  }\n  msg(qid, list) {\n    const p = this.state.answers[qid];\n    if (p == null) return { done: false, msg: '', tint: '#FFFBF3' };\n    const o = list[p];\n    return { done: true, msg: o.fb, tint: o.ok ? '#E2F6E9' : '#F3E8D6' };\n  }\n\n  renderVals() {\n    const S = this.state, P = this.props;\n    const screen = S.screen;\n    const go = (k) => () => this.go(k);\n    const ambient = P.ambientMotion === false ? 'none' : 'floaty';\n\n    const crumbSpec = {\n      hub: [['Key Stage 3', null]],\n      year: [['KS3', 'hub'], ['Year 7', null]],\n      halfterm: [['KS3', 'hub'], ['Year 7', 'year'], ['Autumn First Half', null]],\n      subject: [['KS3', 'hub'], ['Year 7', 'year'], ['Autumn First Half', 'halfterm'], ['Chemistry', null]],\n      lesson: [['KS3', 'hub'], ['Chemistry', 'subject'], ['Particles and their behaviour', 'subject'], ['Gas pressure', null]]\n    }[screen] || [];\n    const crumbs = crumbSpec.map((c, i) => ({\n      label: c[0], sep: i < crumbSpec.length - 1 ? '›' : '',\n      color: c[1] ? '#B33A1E' : '#6B615A',\n      go: c[1] ? go(c[1]) : () => {}\n    }));\n\n    const years = [\n      { n: 7, units: 9, lessons: 55, tint: '#FDE8DF', blurb: 'Cells, particles, forces and motion — the foundations everything else sits on.', go: go('year') },\n      { n: 8, units: 13, lessons: 79, tint: '#E2F6E9', blurb: 'Reactions, body systems, electricity and waves. The biggest year of KS3.', go: go('year') },\n      { n: 9, units: 11, lessons: 51, tint: '#E1E8FE', blurb: 'Inheritance, the periodic table and energy — the run-up to GCSE.', go: go('year') }\n    ];\n\n    const ht = (n, name, meta, bio, chem, phys, target) => ({ n, name, meta, bio, chem, phys, go: go(target || 'year') });\n    const autumn = [\n      ht(1, 'Autumn First Half', '11 lessons · 3 units', 'Cells and organisation', 'Particles and their behaviour', 'Describing motion', 'halfterm'),\n      ht(2, 'Autumn Second Half', '9 lessons · 3 units', 'Movement and the skeleton', 'Elements and compounds', 'Forces and their effects')\n    ];\n    const spring = [\n      ht(3, 'Spring First Half', '10 lessons · 3 units', 'Nutrition and digestion', 'Chemical reactions', 'Energy stores and transfers'),\n      ht(4, 'Spring Second Half', '8 lessons · 4 units', 'Breathing and respiration', 'Acids and alkalis', 'Current electricity')\n    ];\n    const summer = [\n      ht(5, 'Summer First Half', '9 lessons · 3 units', 'Plants and photosynthesis', 'Separating mixtures', 'Sound and hearing'),\n      ht(6, 'Summer Second Half', '8 lessons · 3 units', 'Ecosystems and interdependence', 'The Earth and its resources', 'Light and seeing')\n    ];\n\n    const lessonSpec = [\n      { n: 1, title: 'The particle model', kind: 'MODEL', blurb: 'One idea that explains almost everything: matter is made of tiny moving particles.' },\n      { n: 2, title: 'Solids, liquids and gases', kind: 'CONTRAST', blurb: 'Same particles, three arrangements. Why a gas fills the room and a solid holds its shape.' },\n      { n: 3, title: 'Changes of state', kind: 'PROCESS', blurb: 'What melting and boiling actually do to the particles — and what they do not do.' },\n      { n: 4, title: 'Gas pressure', kind: 'MODEL', blurb: 'Why a marshmallow swells in a vacuum jar, and what is really pushing on a balloon.' }\n    ];\n    const lessons = lessonSpec.map((l) => {\n      const current = l.n === 4;\n      return Object.assign({}, l, {\n        numBg: current ? '#E4572E' : '#FFFBF3',\n        numFg: current ? '#FFF7EC' : '#231F1C',\n        pulse: current && P.ambientMotion !== false ? 'ring 2.6s infinite' : 'none',\n        cta: current ? 'Open this lesson →' : 'Being written',\n        ctaColor: current ? '#B33A1E' : '#9A8F86',\n        go: current ? go('lesson') : () => {}\n      });\n    });\n\n    const Q1 = [\n      { t: 'The particles pushing against each other', ok: false, fb: 'Not quite — particles in a gas are far apart and mostly miss each other. The push you feel comes from hits on the wall, not on each other.' },\n      { t: 'The particles hitting the balloon wall', ok: true, fb: 'Yes. Every single hit is a tiny push, and billions of them a second add up to one steady push.' },\n      { t: 'The air inside trying to escape', ok: false, fb: 'Close, but air does not \"try\" anything. Particles just move in straight lines until they hit something — and hitting the wall is the push.' }\n    ];\n    const Q2 = [\n      { t: 'It rises — the particles have more room to move', ok: false, fb: 'More room means each particle travels further between hits, so it reaches the wall less often. Fewer hits per second means less pressure.' },\n      { t: 'It falls — fewer wall hits every second', ok: true, fb: 'Exactly. Same particles, same speed — but a longer journey to the wall, so fewer hits a second. Press run and watch the counter drop.' },\n      { t: 'It stays the same — same number of particles', ok: false, fb: 'The number of particles is only half the story. Pressure counts hits per second, and spreading them out makes the hits less frequent.' }\n    ];\n    const Q3 = [\n      { t: 'Each particle swells to a bigger size', ok: false, fb: 'Particles never change size. If they did, the mass of gas in a sealed can would change — and it does not.' },\n      { t: 'Each particle moves faster than before', ok: true, fb: 'Yes. Heat is movement. Faster particles reach the walls more often and land harder, so the pressure climbs.' },\n      { t: 'Extra particles appear inside the can', ok: false, fb: 'The can is sealed, so nothing can get in. The same particles are simply moving faster.' }\n    ];\n    const Q4 = [\n      { t: 'Pressure halves', ok: false, fb: 'The other way round — less space means the particles reach the walls sooner, so hits per second go up.' },\n      { t: 'Pressure stays the same', ok: false, fb: 'Space matters. Halve the space and each particle has half as far to travel before it hits a wall.' },\n      { t: 'Pressure doubles', ok: true, fb: 'Squashing the gas into half the space doubles how often the particles hit the walls, so the pressure doubles. Now try temperature and particle count the same way.' }\n    ];\n    const M1 = [\n      { t: 'Particles hitting the walls', ok: true }, { t: 'Particles pushing each other', ok: false },\n      { t: 'Particles resting on the bottom', ok: false }, { t: 'The weight of the particles', ok: false }\n    ];\n    const M2 = [\n      { t: 'Falls — the particles have less room', ok: false }, { t: 'Rises — the particles hit the walls more often', ok: true },\n      { t: 'Stays the same — the number of particles is unchanged', ok: false }, { t: 'Rises — the particles get bigger', ok: false }\n    ];\n\n    const f1 = this.msg('q1', Q1), f2 = this.msg('q2', Q2), f3 = this.msg('q3', Q3), f4 = this.msg('q4', Q4);\n\n    const waySpec = [\n      { t: 'Squash the gas into half the space', ok: true, why: 'Shorter trip to the wall, so more hits every second.' },\n      { t: 'Heat the gas in a sealed can', ok: true, why: 'Faster particles arrive more often and land harder.' },\n      { t: 'Pump in twice as many particles', ok: true, why: 'Twice as many particles means roughly twice as many hits.' },\n      { t: 'Make each particle bigger', ok: false, why: 'Particles never change size. This one cannot happen at all.' }\n    ];\n    const ways = waySpec.map((w, i) => {\n      const open = !!S.wayPicks[i];\n      let bg = '#FFFBF3', bc = '#231F1C', sh = '4px 4px 0 #231F1C', tag = 'Tap to check', tagFg = '#6B615A', an = 'none';\n      if (open && w.ok) { bg = '#E2F6E9'; bc = '#12A150'; sh = '4px 4px 0 #12A150'; tag = 'Raises the pressure'; tagFg = '#0B6E37'; an = 'popIn .35s both'; }\n      else if (open) { bg = '#F3E8D6'; bc = '#231F1C'; sh = '4px 4px 0 #231F1C'; tag = 'This is the trap'; tagFg = '#231F1C'; an = 'shake .4s both'; }\n      return { t: w.t, why: w.why, open, bg, bc, sh, tag, tagFg, an, pick: () => this.setState((s) => ({ wayPicks: Object.assign({}, s.wayPicks, { [i]: true }) })) };\n    });\n\n    const SPACE = ['Squashed', 'Normal', 'Roomy'], TEMPL = ['Cool', 'Warm', 'Hot'], COUNTL = ['Few', 'Some', 'Lots'];\n    const ctrl = (label, key, labels) => ({\n      label, current: labels[S.lab[key]],\n      steps: labels.map((t, i) => ({\n        label: t,\n        bg: S.lab[key] === i ? '#FFC53D' : 'transparent',\n        fg: S.lab[key] === i ? '#231F1C' : '#B9A98F',\n        set: () => this.setState((s) => ({ lab: Object.assign({}, s.lab, { [key]: i }) }))\n      }))\n    });\n    const controls = [ctrl('Space to move in', 'space', SPACE), ctrl('Temperature', 'temp', TEMPL), ctrl('How many particles', 'count', COUNTL)];\n\n    const m3pts = ['Heating makes the particles move faster.', 'Faster particles hit the walls more often each second.', 'They also hit harder, because they are moving faster.', 'More hits, and harder hits, means higher pressure.'];\n    const m4pts = ['Air pressure outside is lower at the top of a mountain.', 'The gas inside the balloon still pushes out just as hard.', 'The outside push no longer balances it, so the balloon expands.'];\n    const pts = (prefix, list) => list.map((t, i) => {\n      const on = !!S.ticks[prefix + i];\n      return { t, mark: on ? '✓' : '', bg: on ? '#E2F6E9' : '#FFFBF3', bc: on ? '#12A150' : '#E3D6C0', mbg: on ? '#12A150' : '#F3E8D6', mfg: '#FFF', tick: () => this.tick(prefix + i) };\n    });\n    const allTicked = (prefix, list) => list.every((_, i) => S.ticks[prefix + i]);\n\n    const r1 = S.answers.m1 != null && M1[S.answers.m1].ok;\n    const r2 = S.answers.m2 != null && M2[S.answers.m2].ok;\n    const r3 = !!S.open.m3 && allTicked('m3', m3pts);\n    const r4 = !!S.open.m4 && allTicked('m4', m4pts);\n    const ladderCount = [r1, r2, r3, r4].filter(Boolean).length;\n\n    const stageDone = [S.pumped, f1.done, f2.done && S.trapRun, f4.done, ladderCount === 4];\n    const stageSpec = [['Hook', '#s-hook'], ['Idea', '#s-idea'], ['Trap', '#s-trap'], ['Lab', '#s-lab'], ['Master', '#s-master']];\n    const stages = stageSpec.map((s, i) => ({\n      label: s[0], href: s[1], mark: stageDone[i] ? '✓' : String(i + 1),\n      bg: stageDone[i] ? '#E4572E' : '#FFFBF3', fg: stageDone[i] ? '#FFF7EC' : '#231F1C'\n    }));\n    const filled = stageDone.filter(Boolean).length;\n\n    return {\n      isHub: screen === 'hub', isYear: screen === 'year', isTerm: screen === 'halfterm',\n      isSubject: screen === 'subject', isLesson: screen === 'lesson',\n      crumbs, years, autumn, spring, summer, lessons, ambient,\n      toHub: go('hub'), toYear: go('year'), toTerm: go('halfterm'), toSubject: go('subject'), toLesson: go('lesson'),\n      showDraft: P.showDraftFlags !== false,\n      stages, spineFill: filled === 0 ? '0px' : ((filled - 1) * 78 + 3) + 'px',\n      pumped: S.pumped, airOpacity: S.pumped ? 0.12 : 1, mScale: S.pumped ? 1.42 : 1,\n      pumpLabel: S.pumped ? 'Let the air back in' : 'Pump the air out',\n      togglePump: () => this.setState((s) => ({ pumped: !s.pumped })),\n      q1: this.mk('q1', Q1), q1Done: f1.done, q1Msg: f1.msg, q1Tint: f1.tint,\n      q2: this.mk('q2', Q2), q2Done: f2.done, q2Msg: f2.msg,\n      q3: this.mk('q3', Q3), q3Done: f3.done, q3Msg: f3.msg, q3Tint: f3.tint,\n      q4: this.mk('q4', Q4), q4Done: f4.done, q4Msg: f4.msg,\n      m1: this.mk('m1', M1), m2: this.mk('m2', M2),\n      trapCanvas: this.trapCanvas, labCanvas: this.labCanvas,\n      trapHits: this.trapHits, labHits: this.labHits, trapBar: this.trapBar, labBar: this.labBar,\n      trapLocked: !f2.done, trapBtn: S.trapRun ? 'Squash it back' : 'Slide the wall out',\n      runTrap: () => this.setState((s) => ({ trapRun: !s.trapRun })),\n      controls, ways,\n      pressureOpen: !!S.open.pressure, pressureShut: !S.open.pressure, flipPressure: () => this.toggle('pressure'),\n      collisionOpen: !!S.open.collision, collisionShut: !S.open.collision, flipCollision: () => this.toggle('collision'),\n      massOpen: !!S.open.mass, massBtn: S.open.mass ? 'Hide the answer' : 'Follow it through →', toggleMass: () => this.toggle('mass'),\n      ownOpen: !!S.open.own, ownBtn: S.open.own ? 'Hide the mark scheme' : 'Check your answer →', toggleOwn: () => this.toggle('own'),\n      aeroOpen: !!S.open.aero, aeroBtn: S.open.aero ? 'Hide the answer' : 'Check your answer →', toggleAero: () => this.toggle('aero'),\n      m3Open: !!S.open.m3, m3Btn: S.open.m3 ? 'Hide the mark scheme' : 'Mark your answer against this list →', toggleM3: () => this.toggle('m3'), m3Points: pts('m3', m3pts),\n      m4Open: !!S.open.m4, m4Btn: S.open.m4 ? 'Hide the mark scheme' : 'Mark your answer against this list →', toggleM4: () => this.toggle('m4'), m4Points: pts('m4', m4pts),\n      ladderCount, ladderPct: (ladderCount / 4 * 100) + '%', ladderDone: ladderCount === 4, ladderOpen: ladderCount < 4\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
