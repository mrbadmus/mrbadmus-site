<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/mrbadmusai-design-system-53dad5ae-951a-44a1-95e1-394b9762b2d1/tokens/src-styles-tokens.css">
<link rel="stylesheet" href="_ds/mrbadmusai-design-system-53dad5ae-951a-44a1-95e1-394b9762b2d1/tokens/shared-tokens.css">
<link rel="stylesheet" href="_ds/mrbadmusai-design-system-53dad5ae-951a-44a1-95e1-394b9762b2d1/tokens/shared-ks3.css">
<link rel="stylesheet" href="_ds/mrbadmusai-design-system-53dad5ae-951a-44a1-95e1-394b9762b2d1/fonts/fonts.css">
<link rel="stylesheet" href="_ds/mrbadmusai-design-system-53dad5ae-951a-44a1-95e1-394b9762b2d1/_ds_bundle.css">
<link rel="stylesheet" href="_ds/mrbadmusai-design-system-53dad5ae-951a-44a1-95e1-394b9762b2d1/styles.css">
<style>
body{margin:0;background:#FBF3E6}
a{color:#A93411;text-decoration:none}a:hover{color:#7F2408}
input,button{font:inherit}
input::placeholder{color:#9A8F86}
.pb-two{display:grid;gap:14px}
@media (min-width:760px){.pb-two{grid-template-columns:1fr 1fr;gap:20px}}
</style>
</helmet>
<div class="rd" data-mode="ks3" style="min-height:100vh;background:var(--ks3-ground);color:var(--ks3-ink);font-family:var(--ks3-font-body);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column">
  <header style="display:flex;align-items:center;gap:10px;padding:18px 24px;border-bottom:2px solid var(--ks3-ink)">
    <a href="Public Home.dc.html" style="display:flex;align-items:center;gap:10px;color:var(--ks3-ink)">
      <x-import component-from-global-scope="MrBadmusDS.BrandMark" from="./_ds/mrbadmusai-design-system-53dad5ae-951a-44a1-95e1-394b9762b2d1/_ds_bundle.js" size="{{ brandSize }}" hint-size="26px,26px"></x-import>
      <span style="font-family:var(--ks3-font-display);font-weight:800;font-size:22px;letter-spacing:-.02em">MrBadmus</span>
    </a>
  </header>
  <main style="flex:1;display:flex;flex-direction:column;justify-content:center;max-width:820px;width:100%;margin:0 auto;padding:40px 24px 64px;box-sizing:border-box">
    <sc-if value="{{ isChoose }}" hint-placeholder-val="{{ true }}">
      <h1 style="margin:0;font-family:var(--ks3-font-display);font-weight:800;font-size:clamp(38px,6vw,56px);line-height:.96;letter-spacing:-.035em">Who's signing in?</h1>
      <div class="pb-two" style="margin-top:28px">
        <a href="Child Login.dc.html" style="display:block;padding:26px;border:2px solid var(--ks3-ink);border-radius:var(--ks3-r-card);background:var(--ks3-card);color:var(--ks3-ink);box-shadow:var(--ks3-shadow-block)">
          <span style="display:grid;place-items:center;width:48px;height:48px;border-radius:14px;border:2px solid var(--ks3-ink);background:var(--ks3-accent);font-family:var(--ks3-font-display);font-weight:800;font-size:22px">A</span>
          <span style="display:block;margin-top:16px;font-family:var(--ks3-font-display);font-weight:800;font-size:28px;letter-spacing:-.03em;line-height:1">I'm doing the work</span>
          <span style="display:block;margin-top:8px;font-size:16px;color:var(--ks3-ink-body)">Sign in with the username you were given.</span>
        </a>
        <button onClick="{{ goParent }}" style="text-align:left;padding:26px;border:2px solid var(--ks3-ink);border-radius:var(--ks3-r-card);background:var(--ks3-card);color:var(--ks3-ink);box-shadow:var(--ks3-shadow-block);cursor:pointer">
          <span style="display:grid;place-items:center;width:48px;height:48px;border-radius:14px;border:2px solid var(--ks3-ink);background:var(--ks3-band);font-family:var(--ks3-font-display);font-weight:800;font-size:22px">P</span>
          <span style="display:block;margin-top:16px;font-family:var(--ks3-font-display);font-weight:800;font-size:28px;letter-spacing:-.03em;line-height:1">I'm the parent</span>
          <span style="display:block;margin-top:8px;font-size:16px;color:var(--ks3-ink-body)">Email and password, or Google.</span>
        </button>
      </div>
      <p style="margin:28px 0 0;font-size:16px;color:var(--ks3-ink-muted)">New here? <a href="Parent Signup.dc.html" style="font-weight:700">Start a free week</a>. Schools and tutors: <a href="Org Sign In.dc.html" style="font-weight:700">organisation sign in</a>.</p>
    </sc-if>

    <sc-if value="{{ isParent }}" hint-placeholder-val="{{ false }}">
      <div style="max-width:460px">
        <button onClick="{{ goChoose }}" style="display:inline-flex;align-items:center;gap:6px;padding:0;border:0;background:none;font-weight:700;font-size:15px;color:var(--ks3-accent-text);cursor:pointer"><svg class="ks3-mark" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M15 5l-7 7 7 7"/></svg>Back</button>
        <h1 style="margin:14px 0 0;font-family:var(--ks3-font-display);font-weight:800;font-size:clamp(36px,5vw,48px);line-height:.98;letter-spacing:-.035em">Sign in</h1>
        <button style="margin-top:24px;width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;gap:12px;border:2px solid var(--ks3-ink);border-radius:var(--ks3-r-control);background:var(--ks3-card);font-weight:700;font-size:17px;color:var(--ks3-ink);cursor:pointer">
          <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M45 24.5c0-1.6-.1-2.8-.4-4H24v7.6h12.1c-.3 2-1.6 5-4.6 7l7 5.4C42.7 36.6 45 31 45 24.5z"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.4l-7-5.4c-1.9 1.3-4.4 2.2-7.5 2.2-5.8 0-10.7-3.9-12.4-9.2l-7.2 5.6C8 41.3 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.6 28.2c-.4-1.3-.7-2.7-.7-4.2s.3-2.9.7-4.2l-7.2-5.6C3 17.1 2 20.4 2 24s1 6.9 2.4 9.8l7.2-5.6z"/><path fill="#EA4335" d="M24 10.6c3.3 0 5.5 1.4 6.8 2.6l6.2-6C33.3 3.7 28.9 2 24 2 15.4 2 8 6.7 4.4 14.2l7.2 5.6c1.7-5.3 6.6-9.2 12.4-9.2z"/></svg>Continue with Google
        </button>
        <div style="display:flex;align-items:center;gap:12px;margin:20px 0 16px;color:var(--ks3-ink-muted);font-size:14px"><span style="flex:1;height:2px;background:var(--ks3-rule)"></span>or<span style="flex:1;height:2px;background:var(--ks3-rule)"></span></div>
        <form onSubmit="{{ submit }}" style="display:flex;flex-direction:column;gap:14px">
          <label style="display:block;font-weight:700;font-size:15px;color:var(--ks3-ink-muted)">Email<input type="email" value="{{ email }}" onChange="{{ setEmail }}" autocomplete="email" style="margin-top:6px;display:block;width:100%;box-sizing:border-box;min-height:50px;padding:12px 14px;border:2px solid var(--ks3-option-border);border-radius:var(--ks3-r-control);background:var(--ks3-card);font-size:17px;color:var(--ks3-ink)"></label>
          <label style="display:block;font-weight:700;font-size:15px;color:var(--ks3-ink-muted)">Password<input type="password" value="{{ pass }}" onChange="{{ setPass }}" autocomplete="current-password" style="margin-top:6px;display:block;width:100%;box-sizing:border-box;min-height:50px;padding:12px 14px;border:2px solid var(--ks3-option-border);border-radius:var(--ks3-r-control);background:var(--ks3-card);font-size:17px;color:var(--ks3-ink)"></label>
          <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}"><p style="margin:0;font-size:15px;font-weight:700;color:var(--ks3-accent-text)">{{ error }}</p></sc-if>
          <button type="submit" style="margin-top:6px;width:100%;min-height:54px;border:2px solid var(--ks3-ink);border-radius:var(--ks3-r-control);background:var(--ks3-ink);color:var(--ks3-on-dark);font-weight:700;font-size:18px;cursor:pointer">Sign in</button>
        </form>
        <div style="margin-top:18px;display:flex;flex-direction:column;gap:8px;font-size:16px">
          <button onClick="{{ forgot }}" style="align-self:flex-start;padding:0;border:0;background:none;font-weight:700;color:var(--ks3-accent-text);cursor:pointer">{{ forgotLabel }}</button>
          <span style="color:var(--ks3-ink-muted)">No account? <a href="Parent Signup.dc.html" style="font-weight:700">Start a free week</a></span>
        </div>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { screen: 'choose', email: '', pass: '', error: '', sent: false };
  renderVals() {
    const s = this.state;
    return { brandSize: 26, isChoose: s.screen === 'choose', isParent: s.screen === 'parent', goParent: () => this.setState({ screen: 'parent' }), goChoose: () => this.setState({ screen: 'choose', error: '' }),
      email: s.email, pass: s.pass, setEmail: (e) => this.setState({ email: e.target.value, error: '' }), setPass: (e) => this.setState({ pass: e.target.value, error: '' }), error: s.error,
      submit: (e) => { e.preventDefault(); if (!s.email.includes('@') || s.pass.length < 1) return this.setState({ error: 'That email and password don\u2019t match. Try again or reset it.' }); window.location.href = 'Parent Dashboard.dc.html'; },
      forgot: () => this.setState({ sent: true }), forgotLabel: s.sent ? `Reset link sent${s.email ? ' to ' + s.email : ''}` : 'Forgotten your password?' };
  }
}
</script>
</body>
</html>
