<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#F7F1E5"/>
  <title>Today — Mr Badmus AI</title>
  <link rel="preload" href="/shared/fonts/fraunces-var-latin.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="/shared/fonts/plus-jakarta-sans-var-latin.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="stylesheet" href="/shared/tokens.css?v=bbfbe9e0"/>
  <!-- ⊕ MRB-306 Phase 2a — v3's design system, the same sheet the six
       GENERATED teacher screens load. It carries the --st-* tokens this
       page's chrome is drawn from. It also re-ships an older copy of
       tokens.css; every value in that copy is IDENTICAL to the live file
       (measured — it is a strict subset), so the order of these two links
       changes nothing, and its later @font-face block points at the same
       /shared/fonts/ URLs. -->
  <link rel="stylesheet" href="/shared/teacher-ds.css?v=fba5f719"/>
  <style>
    html { background: var(--st-ground); }
    :root {
      --darker: var(--st-ground);
      --dark:   var(--st-num-well);
      --card2:  var(--st-num-well);
      --shadow: none;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--st-ground);
      color: var(--st-ink);
      font: 400 18px/1.5 var(--st-ui);
      min-height: 100vh;
      /* ⊕ MRB-306 — the bar is STICKY now, not fixed, exactly as v3 draws it,
         so it takes its own space in the flow and the old 80px top pad that
         cleared a fixed bar would be 80px of empty cream. */
      padding: 0 0 60px;
      /* Hidden until the guard's onAllowed fires AND the admin-scope check
         answers. Fail-closed: if the guard bounces, the scope check refuses,
         or JS fails outright, the page never reveals school-wide staff data.
         The refusal state reveals the body too — see `notice()` — so a
         legitimate teacher who lands here gets a sentence, never a page that
         stays blank and looks broken. */
      display: none;
    }

    /* ── v3's top bar ────────────────────────────────────────────────────
       Values are Design's own, read out of the RENDERED topbar of
       teacher/classes-fixture.html rather than retyped from the template
       source. See the markup comment in <nav> for what is deliberately NOT
       carried across. */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 62px;
      padding: 0 22px;
      background: var(--st-paper);
      border-bottom: 1px solid var(--st-rule);
    }
    .tb-brand {
      flex: none;
      font: 600 23px/1 var(--st-display);
      letter-spacing: -0.025em;
      color: var(--st-ink);
      text-decoration: none;
      white-space: nowrap;
    }
    /* teacher-ds.css styles bare `a:hover` rust; the brand and the tabs are
       chrome and do not change colour on hover in Design's bar. */
    .tb-brand:hover { color: var(--st-ink); text-decoration: none; }
    .tb-seg {
      display: flex;
      gap: 3px;
      padding: 3px;
      flex: none;
      margin-right: auto;
      background: var(--st-seg-bg);
      border-radius: 10px;
    }
    .tb-tab {
      padding: 7px 15px;
      border-radius: 8px;
      font: 600 15.5px/1.2 var(--st-ui);
      color: var(--st-caption);
      background: transparent;
      text-decoration: none;
      white-space: nowrap;
    }
    .tb-tab:hover { color: var(--st-ink); text-decoration: none; }
    .tb-tab.is-on { background: var(--st-paper); color: var(--st-ink); }

    /* The environment badge. ⚠️ NOTHING ON THIS PAGE EVER REVEALS IT — no
       script here touches `#env-pill` (admin.html and import.html each have
       their own that does). Kept as it was found, hidden, and restyled so it
       is v3-shaped the day something wires it. */
    .pill {
      flex: none;
      padding: 5px 8px;
      border-radius: 6px;
      font: 500 12px/1.2 var(--st-mono);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--st-caption);
      background: var(--st-num-well);
    }
    .pill.env-test { color: var(--st-accent-text); }
    .pill.env-prod { color: var(--st-caption); }
    .signout {
      flex: none;
      height: 32px;
      padding: 0 12px;
      font: 600 15.5px/1.2 var(--st-ui);
      color: var(--st-muted);
      background: transparent;
      border: 1px solid var(--st-btn-border);
      border-radius: 9px;
      cursor: pointer;
    }
    .signout:hover { color: var(--st-ink); border-color: var(--st-edge); }
    /* The class Design's bar carries. It is defined in the six generated
       pages' own inline <style> and in NEITHER stylesheet, so without
       this line `noprint` on the <nav> above would do nothing at all. */
    @media print { .noprint { display: none !important; } }

    .container { max-width: 1460px; margin: 0 auto; padding: 24px 40px 40px; }
    .page-header { margin-bottom: 8px; }
    .page-header h1 {
      font: 600 52px/1 var(--st-display);
      letter-spacing: -0.035em;
      color: var(--st-ink);
      overflow-wrap: break-word;
    }
    .page-sub { font: 400 18px/1.5 var(--st-ui); color: var(--st-muted); margin-bottom: 28px; }
    .page-sub .sep { padding: 0 6px; opacity: 0.6; }

    .card {
      background: var(--st-paper);
      border: 1px solid var(--st-rule-soft);
      border-radius: var(--st-r-card);
      padding: 16px 18px;
      margin-bottom: 16px;
    }
    .card h2 {
      font: 500 13px/1.2 var(--st-mono);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--st-caption);
      margin-bottom: 14px;
    }

    /* At a glance */
    .stats { display: flex; flex-wrap: wrap; gap: 12px; }
    .stat {
      flex: 1 1 150px;
      background: var(--st-num-well);
      border: 1px solid var(--st-rule-soft);
      border-radius: 10px;
      padding: 14px 16px;
    }
    .stat .n { font: 500 28px/1.1 var(--st-mono); color: var(--st-ink); }
    .stat .l {
      font: 500 13px/1.2 var(--st-mono);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--st-caption);
      margin-top: 4px;
    }

    /* A row — used for both teachers and classes. Flex, not a table, so it
       reflows at 390px instead of scrolling sideways. */
    .row {
      display: flex;
      align-items: baseline;
      gap: 10px 14px;
      flex-wrap: wrap;
      padding: 12px 0;
      border-top: 1px solid var(--st-rule-fact);
    }
    .row:first-of-type { border-top: none; }
    .row .name { font: 600 17.5px/1.2 var(--st-ui); color: var(--st-ink); }
    .row .meta { color: var(--st-muted); font: 400 15.5px/1.4 var(--st-ui); }
    .row .right { margin-left: auto; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }

    /* Classes card: one heading per year group, each a fresh "table" of
       rows — the first row under a heading gets no top border of its own
       (`.row:first-of-type` is scoped per parent), so the heading is the
       only divider between one year and the next. */
    .year-heading {
      font: 500 13px/1.2 var(--st-mono);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--st-caption);
      margin-top: 22px;
      padding: 16px 0 8px;
      border-top: 1px solid var(--st-rule);
    }
    .year-group:first-child .year-heading { border-top: none; margin-top: 0; padding-top: 0; }

    .tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font: 500 12px/1.2 var(--st-mono);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: var(--st-num-well);
      color: var(--st-caption);
      border: 1px solid var(--st-rule-soft);
    }
    .tag.pending { background: var(--st-note-bg); color: var(--st-body); border-color: var(--st-note-border); }
    .tag.you     { background: var(--st-chip-tint); color: var(--st-accent-text); border-color: var(--st-chip-tint-border); }

    .classlist { color: var(--st-muted); font: 400 15.5px/1.4 var(--st-ui); }
    .count { font-family: var(--st-mono); font-variant-numeric: tabular-nums; }
    .muted { color: var(--st-muted); }
    .empty { color: var(--st-muted); font: 400 16px/1.5 var(--st-ui); }

    a.classlink { color: var(--st-ink); text-decoration: none; font-weight: 600; }
    a.classlink:hover { color: var(--st-accent-text); text-decoration: underline; }

    /* The refusal, and the honest-failure state. Plain words, no codes. */
    .notice { max-width: 620px; margin: 40px auto; text-align: center; }
    .notice h1 {
      font: 600 34px/1.1 var(--st-display);
      letter-spacing: -0.03em;
      color: var(--st-ink);
      margin-bottom: 10px;
    }
    .notice p { color: var(--st-muted); font: 400 18px/1.6 var(--st-ui); }
    .notice a { color: var(--st-accent-text); font-weight: 600; }

    /* ── ⊕ MRB-306 WS-2 — Today ──────────────────────────────────────────
       Today's own additions. Everything above is admin.html's, copied so the
       two hand-written staff pages cannot drift apart.
       ⊕ 2 Sep 2026 (MRB-306 Phase 2a) — that copy is now DIVERGED, and
       deliberately: this page and timetable.html took v3's chrome and type;
       admin.html and import.html did not, and are outside this unit. */

    /* ⊕ MRB-323, 5 Sep 2026 — `.lesson` IS NO LONGER THE LINK. It used to be
       one `<a>` wrapping the whole card. The name picker needs a second
       control on the same row, and a `<button>` inside an `<a>` is invalid
       HTML that the anchor eats the tap for — so the row became a plain
       `<div>` holding TWO explicit controls: `.lesson-go`, which is the
       anchor and carries everything the card used to say, and
       `.lesson-pick`, which is the picker.
       ⚠️ THE ROW SAYS EXACTLY WHAT IT SAID BEFORE. `today_drive.py` reads
       `innerText` and asserts "8r/Sc1", "Science", "1 of 3 in" and the rest
       case-sensitively; the picker control is a glyph with an `aria-label`
       and contributes no text at all. */
    .lesson {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 14px 0; border-bottom: 1px solid var(--st-rule-fact);
    }
    .lesson-go {
      display: flex; align-items: flex-start; gap: 16px;
      flex: 1; min-width: 0; text-decoration: none; color: inherit;
    }
    .lesson:last-child { border-bottom: none; }
    /* Scoped to the anchor, not the row: hovering the picker button must not
       tint the class code as though the link were under the cursor. */
    .lesson-go:hover .lesson-code { color: var(--st-accent-text); }
    /* Design's v3 outline button, at the 40px this unit's floor and her own
       class-screen action row both put it at. Icon only — see the note above
       about what this row is allowed to say. */
    .lesson-pick {
      flex: none; width: 40px; height: 40px; margin-top: 2px;
      display: flex; align-items: center; justify-content: center;
      background: var(--st-paper); border: 1px solid var(--st-btn-border);
      border-radius: 9px; cursor: pointer; color: var(--st-muted);
    }
    .lesson-pick:hover { border-color: var(--st-edge); color: var(--st-ink); }
    .lesson-pick[hidden] { display: none; }
    .lesson-period {
      flex: none; min-width: 96px;
      font: 500 13px/1.2 var(--st-mono); letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--st-caption); padding-top: 5px;
    }
    .lesson-body { flex: 1; min-width: 0; }
    /* ⚠️ NO `text-transform` ON ANY OF THESE THREE. `today_drive` reads
       `innerText`, which in Chrome reflects the RENDERED case, and asserts
       "8r/Sc1", "Science", "Physics", "1 of 3 in" and "No work set this week."
       case-sensitively. A restyle must not change what the page says. */
    .lesson-code {
      font: 600 20px/1.3 var(--st-display); letter-spacing: -0.02em;
      color: var(--st-ink);
    }
    .lesson-meta { color: var(--st-muted); font: 400 15.5px/1.4 var(--st-ui); margin-top: 2px; }
    .lesson-state { font: 400 15.5px/1.4 var(--st-ui); margin-top: 5px; }
    /* v3's own answer for this exact line — `weekSubFg` on the class card is
       `var(--st-accent-text)` when there is anyone to chase and
       `var(--st-muted)` when there is not. Not `--danger`: owing homework is
       not an error state. */
    .lesson-state.chase { color: var(--st-accent-text); font-weight: 600; }
    .lesson-state.clear { color: var(--st-muted); }

    .daybar { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 22px;
              padding: 3px; background: var(--st-seg-bg); border-radius: 10px;
              align-self: flex-start; width: max-content; max-width: 100%; }
    .daybar span {
      font: 500 13px/1.2 var(--st-mono); letter-spacing: 0.14em;
      text-transform: uppercase; padding: 7px 13px; border-radius: 8px;
      background: transparent; color: var(--st-caption);
    }
    .daybar span.on { background: var(--st-paper); color: var(--st-ink); }

    /* Skeletons: the class page's pattern — never a bare heading on empty
       ground while the reads are in flight. */
    .skel { background: var(--st-num-well); border-radius: 6px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
    .skel-row { display: flex; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--st-rule-fact); }
    .skel-row:last-child { border-bottom: none; }

    .prompt { padding: 4px 0 2px; }
    .prompt p { color: var(--st-muted); font: 400 17px/1.6 var(--st-ui); margin-bottom: 14px; max-width: 60ch; }
    /* v3's outline button. ⚠️ NO `height` — `Edit timetable` is sized by an
       inline `padding`/`font-size`/`min-height:0` from this page's own JS,
       which a fixed height would defeat. The JS is untouched by this unit. */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 11px 16px; min-height: 40px;
      border: 1px solid var(--st-btn-border); border-radius: var(--st-r-btn);
      background: var(--st-paper); color: var(--st-ink);
      font: 600 17px/1.2 var(--st-ui);
      cursor: pointer; text-decoration: none; white-space: nowrap;
    }
    .btn:hover { border-color: var(--st-edge); color: var(--st-ink); text-decoration: none; }
    .btn:disabled { opacity: 0.55; cursor: default; color: var(--st-muted); }
    .remind-row {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--st-rule-fact);
    }
    .remind-row .who { flex: 1; min-width: 200px; color: var(--st-muted); font: 400 16px/1.4 var(--st-ui); }

    /* ── ⊕ MRB-325 ruling 1 — the stat strip, the action row and the two
       side panels ─────────────────────────────────────────────────────────

       ⚑ LAYOUT CALL: MOBILE-FIRST SINGLE COLUMN, WIDENING TO TWO.
       The default is one stacked column — strip, lessons, students to chase,
       worth a reteach — and the second column is bought back at 1000px with
       ONE `grid-template-columns` line. Design's screenshot is the wide
       state and this reaches it; the narrow state is the same content in
       reading order rather than a second layout to maintain.
       ⚠️ Written this way round on purpose. `today_drive`'s "390px: no
       horizontal overflow" is a PUSH GATE on this page, and a desktop-first
       rule would make 390px the exception that has to be remembered. Here
       390px is what the file says with no media query at all: nothing below
       has a fixed width, and `minmax(0, …)` is on both tracks so a long
       stem in a reteach row cannot push the grid wider than its container. */
    .today-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 1000px) {
      .today-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 348px); }
    }
    .today-grid > * { min-width: 0; }
    .today-col { display: flex; flex-direction: column; }
    .today-col > .card:last-child { margin-bottom: 0; }

    /* One line of facts, and the controls that act on them. Wraps rather than
       shrinks: at 390px the buttons drop under the sentence. */
    .strip {
      display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .strip-line {
      flex: 1 1 260px; min-width: 0;
      font: 400 18px/1.5 var(--st-ui); color: var(--st-body);
    }
    .strip-line .sep { padding: 0 6px; opacity: 0.6; }
    .strip-line .n { font-family: var(--st-mono); font-variant-numeric: tabular-nums; color: var(--st-ink); font-weight: 500; }
    .strip-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    /* Design's action buttons at this page's own `.btn` size, one step down —
       they are secondary to the lessons, which are why a teacher is here. */
    .strip-actions .btn { padding: 8px 14px; min-height: 36px; font-size: 15.5px; }

    /* The two side panels. Same `.card` shell as the lessons, so nothing new
       is invented for them. */
    .panel-row {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 11px 0; border-bottom: 1px solid var(--st-rule-fact);
    }
    .panel-row:last-child { border-bottom: none; }
    .panel-body { flex: 1; min-width: 0; }
    /* ⚠️ NO `text-transform` ON ANY PANEL ROW — the same rule the lesson card
       above carries. `today_drive` reads `innerText`, which reflects the
       RENDERED case, so a restyle here must not change what the page says.
       (`.card h2` already uppercases the HEADINGS, and it did before this
       unit; the assertions are case-folded for exactly those.) */
    .panel-name { font: 600 16.5px/1.3 var(--st-ui); color: var(--st-ink); overflow-wrap: break-word; }
    .panel-meta { color: var(--st-muted); font: 400 14.5px/1.4 var(--st-ui); margin-top: 2px; overflow-wrap: break-word; }
    .panel-foot {
      padding-top: 12px; margin-top: 2px; border-top: 1px solid var(--st-rule-fact);
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .panel-foot .more { flex: 1 1 auto; color: var(--st-muted); font: 400 14.5px/1.4 var(--st-ui); }
    .panel-foot .btn { padding: 7px 12px; min-height: 34px; font-size: 15px; }

    /* Initials, not a photo. `avatar_url` is on the roster rows but a face on
       a chase list is a bigger claim than this panel needs, and the initials
       are the same ones every other teacher screen draws. */
    .avatar {
      flex: none; width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font: 600 13px/1 var(--st-ui); color: #FFFFFF; letter-spacing: 0.02em;
    }
    /* ⚠️ NO MONO AND NO TRACKING HERE, unlike `.lesson-period` beside it.
       A period label is a category; a class code is a NAME, and MRB-263 makes
       its exact shape meaningful — `8r/Sc1` letter-spaced in a mono face reads
       as "8 r / S c 1" and stops looking like the code the lesson card two
       inches away is showing. Same string, same reading. */
    .reteach-code {
      flex: none; min-width: 72px;
      font: 600 14.5px/1.4 var(--st-ui);
      color: var(--st-caption); padding-top: 1px;
    }
    .reteach-pct { flex: none; font-family: var(--st-mono); font-variant-numeric: tabular-nums; font-weight: 500; padding-top: 2px; }

    @media (max-width: 560px) {
      .container { padding: 18px 14px 40px; }
      .card { padding: 14px 14px; }
      .row .right { margin-left: 0; width: 100%; }
      .page-header h1 { font-size: 34px; letter-spacing: -0.02em; }
      /* ⚠️ THE BAR WRAPS RATHER THAN OVERFLOWING, and that is deliberate.
         v3's top bar has no @media rule at all and measures 953px wide inside
         a 390px viewport on all six generated pages. `today_drive`'s
         "390px: no horizontal overflow" check is a PUSH GATE on this page, and
         this page has always held that property (the rules below are the
         descendants of the ones that did). Importing the defect to match the
         six would be a regression on a live page, so the bar keeps its own
         narrow-viewport behaviour until the cross-screen responsive unit
         gives all eight pages one answer. */
      .topbar { height: auto; min-height: 62px; flex-wrap: wrap; padding: 10px 14px; gap: 8px; }
      .tb-brand { font-size: 19px; }
      .tb-seg { margin-right: 0; }
      .tb-tab { padding: 6px 11px; font-size: 14px; }
    }

    @media (max-width: 560px) {
      .lesson { gap: 12px; }
      .lesson-period { min-width: 68px; letter-spacing: 0.1em; }
    }
  </style>
</head>
<body>

<!-- ── ⊕ MRB-306 Phase 2a — v3's top bar, STATIC ────────────────────────
     These two pages are hand-written and carry no student-runtime, so the
     strip Design draws through `__MRB_TPL__` is reproduced here as plain
     markup using her own values, read out of the RENDERED topbar of
     teacher/classes-fixture.html rather than retyped from the template.

     ⚠️ `data-port-region="topbar"` is load-bearing, and the old
     `class="top-nav"` / `.signout-btn` pair is gone BECAUSE of it.
     `shared/teacher-admin-nav.js` has two hosts: "Host A" anchors on
     `nav.top-nav .signout-btn` and injects with the pre-v3 muted styling,
     "Host B" anchors on `[data-port-region="topbar"]` and injects with v3's.
     `inject()` runs Host A FIRST, so leaving either class in place would put
     the Admin link into a v3 bar wearing the old type.

     ⚠️ `data-mrb-today-nav` on the Today tab is that same module's OWN
     idempotence marker. Without it `injectTodayTopbar()` appends a SECOND
     "Today" control to this bar — which is exactly what it does today on the
     six generated pages, whose tab strip became a real navigation in Phase 1c
     while the injected link was never retired. Reported, not fixed here.

     NOT carried across, and each for a stated reason:
     · Design's "Find a student" search — no search is built on these two
       pages, and a dead control never ships.
     · Her Charts button — it is a navigation these pages have never had, and
       adding one is a behaviour change on a function-frozen page.
     · The crumb and the teacher's name — nothing here computes either. -->
<nav class="topbar noprint" data-port-region="topbar">
  <a class="tb-brand" href="/index.html">MrBadmusAI</a>
  <div class="tb-seg">
    <a class="tb-tab is-on" data-mrb-today-nav="1" href="/teacher/today.html">Today</a>
    <a class="tb-tab" href="/teacher/classes.html">My classes</a>
  </div>
  <span id="env-pill" class="pill env-prod" style="display:none;">TEST</span>
  <button class="signout" onclick="MrBadmusTeacherGuard.signOut()">Sign out</button>
</nav>

<div class="container" id="main" style="display:none;">
  <div class="page-header"><h1 id="greeting">Today</h1></div>
  <div class="page-sub" id="day-line">&hellip;</div>

  <div class="daybar" id="daybar"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<!-- ⚠️ NOT `defer`, AND IT MUST COME BEFORE `teacher-data.js` — CLAUDE.md's
     load-order rule (MRB-267). `teacher-data.js` delegates
     `workingAcademicYear` to `class-entry.js` and throws a named error if it
     is not already on the page, and this page's very first read needs it. -->

<!-- ⊕ MRB-323 — the name picker. Defines `window.MrBadmusPicker` and does
     nothing until a lesson row's picker button is pressed. It makes no
     request and touches no storage, so its position in this list carries no
     load-order rule of its own. -->
<script src="/shared/teacher-picker.js?v=8f2365b7"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════════
   MRB-306 — TODAY
   ══════════════════════════════════════════════════════════════════════════

   The teacher's day, built from `timetable_entries` (WS-1's seed) and the
   class reads `teacher-data.js` already owns.

   WHAT THIS PAGE WILL NOT DO
   · It will not invent a clock time. `school_period_times` is empty on
     purpose, so lessons are ordered by period NUMBER and labelled
     "Period 1 … 5". A wrong time in front of someone about to walk into a
     room is worse than no time at all.
   · It will not compose an assignment, or offer to. Composition happens in
     ONE place — the backend's `/api/class/current-assignment` — and no
     teacher surface calls it, so a teacher cannot cause it however the
     button is worded. Where there is no work set this page says so plainly
     rather than offering an action that would do nothing.
   · It will not read a deadline from the device clock. The weekday is
     interpreted in the school's timezone (`schoolWeekday`), and that decides
     only WHICH ROW of the grid to show — never whether something is late.
   ═══════════════════════════════════════════════════════════════════════ */

const DAY_NAMES = { 1:'Monday', 2:'Tuesday', 3:'Wednesday', 4:'Thursday', 5:'Friday', 6:'Saturday', 7:'Sunday' };
const DAY_SHORT = ['', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

function el(id) { return document.getElementById(id); }

function notice(title, bodyHtml) {
  el('main').style.display = 'none';
  el('notice-title').textContent = title;
  el('notice-body').innerHTML = bodyHtml;
  el('notice').style.display = 'block';
  document.body.style.display = 'block';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

/* MRB-325 ruling 2 — "09:15:00" (Postgres `time`) to "09:15". Never invents
   a time: called only where `school_period_times` already has a row. */
function formatTime(t) {
  const m = /^(\d{2}):(\d{2})/.exec(t || '');
  return m ? (m[1] + ':' + m[2]) : '';
}

/* Time-of-day greeting. From the clock, which is fine — being wished good
   afternoon at 11:59 is a cosmetic error, and nothing here is a deadline. */
function greetingFor(name) {
  const h = new Date().getHours();
  const part = h < 12 ? 'Good morning' : (h < 18 ? 'Good afternoon' : 'Good evening');
  return name ? (part + ', ' + name) : part;
}

/* The name students see. `display_name` is the "What name should students
   see" field; where a teacher has not set one, fall back the same way
   `class_teachers_for_viewer` does, so one person is never named two ways. */
function teacherName(profile) {
  if (!profile) { return ''; }
  const dn = (profile.display_name || '').trim();
  if (dn) { return dn; }
  const fl = ((profile.first_name || '') + ' ' + (profile.last_name || '')).trim();
  return fl || '';
}

/* KS3 /Sc → Science, KS4 /Sc → Combined Science, /Ph /Ch /Bi → the separate
   science. The subject comes from the CLASS CODE, never from tier or
   pathway, which are deliberately absent from every teacher surface. */
function subjectFromCode(code, keyStage) {
  const m = /\/([A-Za-z]{2})/.exec(code || '');
  if (!m) { return ''; }
  const s = m[1].toLowerCase();
  if (s === 'ph') { return 'Physics'; }
  if (s === 'ch') { return 'Chemistry'; }
  if (s === 'bi') { return 'Biology'; }
  if (s === 'sc') { return keyStage === 'KS4' ? 'Combined Science' : 'Science'; }
  return '';
}

/* The next teaching day at or after `from`, among the days this teacher
   actually teaches. Returns null when the timetable is empty. */
function nextTeachingDay(days, from) {
  if (!days.length) { return null; }
  for (let i = 0; i < 7; i++) {
    const d = ((from - 1 + i) % 7) + 1;
    if (days.indexOf(d) !== -1) { return d; }
  }
  return null;
}

MrBadmusTeacherGuard.requireTeacherRole({
  onDenied: function () { /* the guard redirects; nothing to draw */ },
  onAllowed: async function (ctx) {
    /* ⚠️ 'block', NEVER ''. The stylesheet says `body { display: none }` so a
       page reveals itself by SETTING a value; assigning '' removes the inline
       style and falls straight back to none — a page that passes every text
       assertion (the nodes are all there) and renders a blank screen. Caught
       by looking at the screenshot, not by the assertions. */
    document.body.style.display = 'block';
    const TD = window.MrBadmusTeacherData;

    let entries;
    try {
      entries = await TD.loadTimetable();
    } catch (e) {
      console.error('[today] loadTimetable failed', e);
      return notice('Today is unavailable',
        'Your timetable could not be loaded just now. Refresh in a moment, or open ' +
        '<a href="/teacher/classes.html">My classes</a>.');
    }

    /* MRB-325 ruling 2 — real clock times, once a school has them. Never
       fatal: a school with no rows yet (school_period_times empty) simply
       keeps labelling by period number, exactly as before. */
    let periodTimes = {};
    try {
      periodTimes = await TD.loadPeriodTimes();
    } catch (e) {
      console.warn('[today] loadPeriodTimes unavailable — labelling by period number', e);
    }

    /* ⊕ MRB-325 ruling 1 — the school's go-live hold. Fired here, and NOT
       awaited: nothing above the lessons needs it, and the panels that do are
       many hundreds of milliseconds behind it. Never fatal — a school with no
       row, or a read that fails, is treated as NOT held, which leaves the
       page saying exactly what it said before this ruling. Failing the other
       way would print "No assignment set yet" over a school that is running
       normally, which is the worse of the two wrong answers. */
    const holdPromise = (TD.loadSchoolHold ? TD.loadSchoolHold() : Promise.resolve({}))
      .catch(function (e) {
        console.warn('[today] loadSchoolHold unavailable — treating the school as open', e);
        return {};
      });

    const name = teacherName(ctx && ctx.profile);
    el('greeting').textContent = greetingFor(name);

    /* ── NO TIMETABLE AT ALL ────────────────────────────────────────────
       An honest prompt, and deliberately NOT a promise. Upload is not built
       yet, so this does not offer it; it says what the page needs and where
       the work already is. */
    if (!entries.length) {
      el('day-line').textContent = 'No timetable yet.';
      el('daybar').style.display = 'none';
      el('lessons-heading').textContent = 'Your lessons';
      el('lessons').innerHTML =
        '<div class="prompt">' +
        '<p>Today shows your lessons in order, each one telling you who still owes you ' +
        'this week&rsquo;s work before you walk in. It needs your timetable first, and ' +
        'there isn&rsquo;t one on your account yet.</p>' +
        /* ⊕ Now that the editor exists this offers it. It did NOT before —
           an action that led nowhere would have been worse than none. */
        '<a class="btn" href="/teacher/timetable.html">Set up my timetable</a>' +
        '</div>';
      el('main').style.display = 'block';
      return;
    }

    const todayWeekday = TD.schoolWeekday();
    const taughtDays = [];
    entries.forEach(function (e) {
      if (taughtDays.indexOf(e.weekday) === -1) { taughtDays.push(e.weekday); }
    });
    taughtDays.sort();

    /* Which day are we showing, and is it actually today? Weekend, or a
       weekday with no lessons, both fall through to the next teaching day —
       and the page SAYS which day it is showing rather than letting a
       Saturday quietly render Monday's lessons as "today". */
    let showDay = todayWeekday;
    let isToday = true;
    if (taughtDays.indexOf(todayWeekday) === -1) {
      showDay = nextTeachingDay(taughtDays, todayWeekday);
      isToday = false;
    }

    const dayEntries = entries.filter(function (e) { return e.weekday === showDay; })
                              .sort(function (a, b) { return a.period - b.period; });

    // The weekday rail, so a teacher can see the shape of their week.
    el('daybar').innerHTML = [1,2,3,4,5].map(function (d) {
      const on = d === showDay ? ' on' : '';
      const n = entries.filter(function (e) { return e.weekday === d; }).length;
      return '<span class="' + ('' + on).trim() + '">' + DAY_SHORT[d] + ' &middot; ' + n + '</span>';
    }).join('');

    if (isToday) {
      el('day-line').textContent = DAY_NAMES[showDay] + ' \u00B7 ' +
        dayEntries.length + (dayEntries.length === 1 ? ' lesson' : ' lessons');
      el('lessons-heading').textContent = 'Today\u2019s lessons';
    } else {
      /* Honest label. It is NOT today, and the heading says so. */
      const why = todayWeekday >= 6 ? 'No lessons at the weekend.' : 'No lessons today.';
      el('day-line').textContent = why + ' Showing your next teaching day.';
      el('lessons-heading').textContent = 'Next: ' + DAY_NAMES[showDay];
    }

    /* A standing way back to the editor once a timetable exists — a teacher's
       rooms and sets change, and finding the page should not require
       remembering the URL. */
    const edit = document.createElement('a');
    edit.className = 'btn';
    edit.href = '/teacher/timetable.html';
    edit.textContent = 'Edit timetable';
    edit.style.cssText = 'margin-left:auto;font-size:0.8rem;padding:7px 11px;min-height:0;';
    const h = el('lessons-heading');
    if (h && h.parentNode) {
      h.style.display = 'flex';
      h.style.alignItems = 'center';
      h.appendChild(edit);
    }

    if (!dayEntries.length) {
      el('lessons').innerHTML = '<div class="empty">Nothing timetabled.</div>';
      el('main').style.display = 'block';
      return;
    }

    /* Draw the lessons FIRST, from the timetable alone, then fill each one's
       state in as the class reads land. A teacher gets their room order
       immediately rather than waiting on the slowest class. */
    el('lessons').innerHTML = dayEntries.map(function (e) {
      const subj = subjectFromCode(e.className, e.keyStage);
      const meta = [e.keyStage, subj].filter(Boolean).join(' \u00B7 ');
      /* ⊕ MRB-323 — the picker button ships HIDDEN and is revealed below,
         only for a class whose roster actually came back with somebody on
         it. A control offered before its data has arrived is a control that
         does nothing when pressed, and one offered for a class this page
         could not read would be a picker over an empty room. Same rule the
         state line beside it already keeps: unknown is not zero. */
      const pt = periodTimes[e.period];
      const periodLabel = 'Period ' + e.period + (pt && pt.startsAt ? ' · ' + formatTime(pt.startsAt) : '');
      return '<div class="lesson">' +
             '<a class="lesson-go" href="/teacher/class-detail.html?class=' + encodeURIComponent(e.classId) + '">' +
             '<div class="lesson-period">' + esc(periodLabel) + '</div>' +
             '<div class="lesson-body">' +
             '<div class="lesson-code">' + esc(e.className || 'Class') + '</div>' +
             '<div class="lesson-meta">' + esc(meta) + '</div>' +
             '<div class="lesson-state clear" data-state-for="' + esc(e.classId) + '">' +
             '<span class="skel" style="display:inline-block;width:150px;height:11px;"></span>' +
             '</div>' +
             '</div></a>' +
             /* ⚠️ THE NAME TRAVELS ON THE BUTTON, and it is the name THIS ROW
                is displaying. The first version read `pack.class.name` out of
                the matrices in the handler, which is a second source for a
                string the card is already showing — and `today_drive` caught
                it doing exactly what a second source does: a pack without a
                `class` key put the word "Class" on the board in place of
                8r/Sc1. One row, one name, in one place. */
             '<button type="button" class="lesson-pick" hidden' +
             ' data-pick-for="' + esc(e.classId) + '"' +
             ' data-pick-name="' + esc(e.className || '') + '"' +
             ' aria-label="Pick a student from ' + esc(e.className || 'this class') + '">' +
             '<svg width="17" height="17" viewBox="0 0 17 17" fill="none" aria-hidden="true">' +
             '<circle cx="8.5" cy="5" r="2.6" stroke="currentColor" stroke-width="1.5"/>' +
             '<path d="M3 14c0-2.8 2.5-4.6 5.5-4.6S14 11.2 14 14" stroke="currentColor"' +
             ' stroke-width="1.5" stroke-linecap="round"/></svg>' +
             '</button>' +
             '</div>';
    }).join('');
    el('main').style.display = 'block';

    /* ⊕ MRB-325 ruling 1 — the strip and the panels are revealed HERE, past
       the no-timetable and nothing-timetabled returns, so neither of those
       states ever shows an "Upload timetable" button or an empty chase list.
       The lesson count is real immediately (it is the timetable, which has
       already landed); the other two facts are skeletons until their reads
       come back, because a strip that opened at "0 students to chase" would
       be a reassurance the page has not yet earned. */
    el('strip').style.display = 'flex';
    el('side').style.display = 'flex';
    const lessonWord = dayEntries.length === 1 ? ' lesson' : ' lessons';
    const stripHead = '<span class="n">' + dayEntries.length + '</span>' + lessonWord +
      (isToday ? ' today' : ' on ' + esc(DAY_NAMES[showDay]));
    function paintStrip(chaseHtml, reteachHtml) {
      el('strip-line').innerHTML = stripHead +
        '<span class="sep">·</span>' + chaseHtml +
        '<span class="sep">·</span>' + reteachHtml;
    }
    const stripSkel = '<span class="skel" style="display:inline-block;width:96px;height:12px;' +
                      'vertical-align:middle;"></span>';
    paintStrip(stripSkel, stripSkel);

    /* ── PER-CLASS STATE ────────────────────────────────────────────────
       One read for every class on the day, in parallel — not one wave per
       lesson (the MRB-292 lesson). Each cell is filled independently, so one
       slow or failing class cannot blank the others. */
    const classIds = [];
    dayEntries.forEach(function (e) {
      if (e.classId && classIds.indexOf(e.classId) === -1) { classIds.push(e.classId); }
    });

    let matrices = null;
    try {
      matrices = await TD.loadClassMatrices(classIds);
    } catch (err) {
      console.warn('[today] class state unavailable', err);
    }

    /* ⊕ MRB-325 ruling 1 — IS THE SCHOOL HELD? `assignments_open_from` set
       and STRICTLY in the future, against the school's own calendar day, is
       the same test the backend applies before it refuses to compose and
       answers `reason='assignments_not_open_yet'`. While it holds, every
       surface below says the ONE ruled sentence and says it once. */
    const hold = await holdPromise;
    const openFrom = hold && hold.assignmentsOpenFrom ? String(hold.assignmentsOpenFrom) : null;
    const HELD = !!(openFrom && openFrom > schoolDateISO());
    /* ⚖️ RULED WORDING. Short, once per surface, and with NO explanation of
       why — a teacher opening Today before term does not need the platform to
       narrate its own configuration at them, and the school already knows it
       set the date. Do not paraphrase this string. */
    const HELD_TEXT = 'No assignment set yet';

    classIds.forEach(function (cid) {
      const cells = document.querySelectorAll('[data-state-for="' + cid + '"]');
      if (!cells.length) { return; }

      /* ⚠️ UNKNOWN IS NOT ZERO. Where the read failed the line says nothing
         rather than "0 to chase", which would be a made-up reassurance about
         a class this page could not see. */
      if (!matrices) {
        cells.forEach(function (c) { c.innerHTML = ''; });
        return;
      }

      const pack = matrices[cid];
      /* The hold wins over `describeClass` here, and only here. It is not a
         claim about the class — it is a claim about the school, and it is
         true of every class on the page at once. "No work set this week."
         would be literally accurate and would still read as a fault. */
      const state = HELD ? { text: HELD_TEXT, chase: false } : describeClass(pack);
      cells.forEach(function (c) {
        c.className = 'lesson-state ' + (state.chase ? 'chase' : 'clear');
        c.textContent = state.text;
      });

      /* ⊕ MRB-323 — and NOW the picker is offered, because now there are
         names to pick from. `pack.members` is `loadClassMatrices`'s ACTIVE
         roster (`left_at IS NULL`, `deleted_at IS NULL`, RLS-scoped through
         its `class_teachers` driver) — the same rows the state line above is
         derived from and the same set the class screen shows. So this page
         adds NO query for the picker: the read it already makes for the day
         carries the roster with it. */
      const roster = (pack && pack.members) || [];
      if (!roster.length) { return; }
      document.querySelectorAll('[data-pick-for="' + cid + '"]').forEach(
        function (b) { b.hidden = false; });
    });

    /* ⚑ INLINE, NOT A TRIP THROUGH `class-detail.html`. The whole value of
       this control is that it is at hand in the thirty seconds between one
       lesson and the next; sending a teacher to another page — a navigation,
       a fresh mount and a fresh set of reads, on a phone at the classroom
       door — would be a slower way to do the thing they came here to do
       quickly, and would leave them on a screen they then have to come back
       from. The picker needs a class code and a list of names, and this page
       is already holding both.

       Delegated on the container rather than bound per card, because the
       lessons are redrawn whenever the day changes. */
    const lessonList = el('lessons');
    if (lessonList) {
      lessonList.addEventListener('click', function (ev) {
        const btn = ev.target && ev.target.closest
          ? ev.target.closest('[data-pick-for]') : null;
        if (!btn) { return; }
        ev.preventDefault();
        const cid = btn.getAttribute('data-pick-for');
        const pack = matrices && matrices[cid];
        if (!pack || !window.MrBadmusPicker) { return; }
        window.MrBadmusPicker.open({
          id: cid,
          code: btn.getAttribute('data-pick-name') || '',
          students: pack.members || []
        });
      });
    }

    /* ══════════════════════════════════════════════════════════════════════
       ⊕ MRB-325 ruling 1 — STUDENTS TO CHASE, AND WORTH A RETEACH
       ══════════════════════════════════════════════════════════════════════

       Both panels are scoped to TODAY'S classes only — the handful a teacher
       is about to walk into, not their whole roster. That is the whole point
       of the screen, and it is also what makes the reteach read affordable:
       one extra round trip over three or four papers, not over twelve.       */

    // The code a class shows on this page, so the panels name a class the
    // same way the lesson row above them does. One row, one name.
    const codeOf = {};
    dayEntries.forEach(function (e) {
      if (e.classId && !codeOf[e.classId]) { codeOf[e.classId] = e.className || ''; }
    });

    const chaseBox = el('chase');
    const reteachBox = el('reteach');

    /* ── THE HELD SCHOOL ──────────────────────────────────────────────── */
    if (HELD) {
      chaseBox.innerHTML = '<div class="empty">' + esc(HELD_TEXT) + '</div>';
      reteachBox.innerHTML = '<div class="empty">' + esc(HELD_TEXT) + '</div>';
      /* The strip says it ONCE too, in place of both counts, rather than
         printing "0 students to chase · 0 topics worth a reteach". Those
         zeroes would be arithmetically true and would read as a claim that
         the classes are all up to date, which is a different and untrue
         thing. The date is NOT shown: the ruling is short, once, and with no
         explanation of why. */
      el('strip-line').innerHTML = stripHead + '<span class="sep">·</span>' + esc(HELD_TEXT);
      return;
    }

    /* ⚠️ UNKNOWN IS NOT ZERO, in the panels as much as on the lesson rows.
       A failed matrices read means this page cannot see the classes at all,
       and "nobody to chase" would be an invented reassurance. */
    if (!matrices) {
      chaseBox.innerHTML = '<div class="empty">Couldn’t load your classes just now.</div>';
      reteachBox.innerHTML = '<div class="empty">Couldn’t load your classes just now.</div>';
      el('strip-line').innerHTML = stripHead;
      return;
    }

    const nowIso = new Date().toISOString();

    /* ── WHO OWES THIS WEEK'S WORK ────────────────────────────────────────
       From `weekState`, the SAME derivation the lesson line beside it just
       used, so the panel can never list a student the row above says is in.
       The per-student figures come from `termStats`, which is `buildRoster`'s
       two numbers on the rows this page already holds. */
    const chaseRows = [];
    const chaseSeen = {};
    const remindBy = {};   // classId -> { assignmentId, studentIds }
    classIds.forEach(function (cid) {
      const pack = matrices[cid];
      const st = weekState(pack);
      if (st.why !== 'ok' || !st.owing.length) { return; }
      const stats = termStats(pack, nowIso);
      remindBy[cid] = {
        assignmentId: st.paper.id,
        studentIds: st.owing.map(function (m) { return m.student_id; })
      };
      st.owing.forEach(function (m) {
        const s = stats[m.student_id] || { missed: 0, avg: null };
        /* Distinct STUDENTS, not distinct rows: a child taught twice in one
           day owes one piece of work per class but is one person to chase,
           and counting them twice would inflate the strip. The class they are
           kept under is the earlier lesson of the day, which is the one the
           teacher reaches first. */
        if (chaseSeen[m.student_id]) { return; }
        chaseSeen[m.student_id] = true;
        chaseRows.push({
          id: m.student_id,
          name: fullName(m.first_name, m.last_name) || 'Student',
          first: m.first_name, last: m.last_name,
          code: codeOf[cid] || '',
          missed: s.missed,
          avg: s.avg
        });
      });
    });

    /* Worst first: most marked papers never handed in, then the lowest
       average. A student with NO average sorts last within their tie rather
       than first — no marks is not evidence of weakness, and putting an
       unmarked child at the top of a chase list would be a claim the data
       does not support. */
    chaseRows.sort(function (a, b) {
      if (a.missed !== b.missed) { return b.missed - a.missed; }
      const av = a.avg == null ? 101 : a.avg;
      const bv = b.avg == null ? 101 : b.avg;
      if (av !== bv) { return av - bv; }
      return a.name.localeCompare(b.name);
    });

    const CHASE_SHOWN = 5;
    if (!chaseRows.length) {
      chaseBox.innerHTML = '<div class="empty">Nobody owes this week’s work.</div>';
    } else {
      const shown = chaseRows.slice(0, CHASE_SHOWN);
      let html = shown.map(function (r) {
        const meta = r.missed + (r.missed === 1 ? ' missed this term' : ' missed this term') +
          (r.avg == null ? '' : ' · avg ' + r.avg + '%');
        return '<div class="panel-row">' +
               '<div class="avatar" style="background:' + esc(hueFor(r.name)) + '" aria-hidden="true">' +
               esc(initialsOf(r.first, r.last)) + '</div>' +
               '<div class="panel-body">' +
               '<div class="panel-name">' + esc(r.name) + '</div>' +
               '<div class="panel-meta">' + esc(r.code) + '</div>' +
               '<div class="panel-meta">' + esc(meta) + '</div>' +
               '</div></div>';
      }).join('');
      const more = chaseRows.length - shown.length;
      html += '<div class="panel-foot">' +
        (more > 0
          /* "across today's classes", NOT "across your classes". This panel
             has only looked at the day's handful; the wider claim would be
             one the page has not made a single read to support. */
          ? '<span class="more">+' + more + ' more across today’s classes</span>'
          : '<span class="more"></span>') +
        '<button type="button" class="btn" id="remind-all">Send reminders</button>' +
        '</div>';
      chaseBox.innerHTML = html;

      /* ⚑ A REAL SEND, or it would not be here. `sendReminders` is the same
         write the class screen's "Remind all" uses — an in-platform
         `student_notifications` row, nothing leaves the site — and it is an
         UPSERT against the (student, assignment, sent_on) rate limit, so a
         second press adds nothing and errors nothing.

         One call per class is unavoidable and is NOT the N+1 this codebase
         argues against: each class owes a DIFFERENT assignment, so there is
         no one row-set to batch, and they go in parallel over the day's few
         classes rather than in a loop of awaits. What is reported is what was
         WRITTEN, not what was attempted — a child a colleague already nudged
         today is skipped by the index, and saying otherwise would overstate
         what the students actually got. */
      const remindBtn = el('remind-all');
      if (remindBtn) {
        remindBtn.addEventListener('click', async function () {
          const teacherId = ctx && ctx.user ? ctx.user.id : null;
          if (!teacherId) { return; }
          remindBtn.disabled = true;
          remindBtn.textContent = 'Sending…';
          try {
            const written = await Promise.all(Object.keys(remindBy).map(function (cid) {
              const r = remindBy[cid];
              return TD.sendReminders({
                classId: cid, assignmentId: r.assignmentId,
                studentIds: r.studentIds, teacherId: teacherId
              });
            }));
            const n = written.reduce(function (a, rows) { return a + (rows ? rows.length : 0); }, 0);
            remindBtn.textContent = n === 0
              ? 'Already reminded today'
              : (n === 1 ? 'Reminded 1 student' : 'Reminded ' + n + ' students');
          } catch (e) {
            console.warn('[today] sendReminders failed', e);
            remindBtn.textContent = 'Send reminders';
            remindBtn.disabled = false;
          }
        });
      }
    }

    paintStrip(
      '<span class="n">' + chaseRows.length + '</span> ' +
      (chaseRows.length === 1 ? 'student to chase' : 'students to chase'),
      stripSkel);

    /* ── WORTH A RETEACH ──────────────────────────────────────────────────
       ⚑ ONE BATCHED ROUND TRIP, not one per class. `loadPaperQuestions` takes
       an ARRAY and chunks it internally — the same batching
       `teacher-live.js`'s `grids(pairs)` exists to get, for the same reason
       (the insights chart wanted a dozen papers and would otherwise have made
       a dozen calls). Here it is at most one per lesson on the day. */
    const wanted = [];
    classIds.forEach(function (cid) {
      const paper = newestMarkedPaper(matrices[cid], nowIso);
      if (paper) { wanted.push({ cid: cid, paper: paper }); }
    });

    let qpacks = null;
    if (wanted.length) {
      try {
        qpacks = await TD.loadPaperQuestions(wanted.map(function (w) { return w.paper.id; }));
      } catch (e) {
        /* console.WARN, not error: a class whose marked paper cannot be read
           costs this page one panel, and is not a fault of the screen the
           teacher is standing in front of. */
        console.warn('[today] paper questions unavailable', e);
      }
    }

    const reteachRows = [];
    if (qpacks) {
      wanted.forEach(function (w) {
        const weak = weakestQuestion(matrices[w.cid], qpacks[w.paper.id]);
        if (!weak) { return; }
        reteachRows.push({
          code: codeOf[w.cid] || '',
          id: weak.id,
          text: weak.text,
          pct: weak.pct
        });
      });
    }
    reteachRows.sort(function (a, b) { return a.pct - b.pct; });

    const RETEACH_SHOWN = 3;
    if (!reteachRows.length) {
      /* Not "0%", and not an em-dash. A class whose closed papers nobody sat
         — or whose answers were all written rather than machine-marked — has
         nothing to reteach FROM, and the panel says so. */
      reteachBox.innerHTML = '<div class="empty">Nothing marked yet.</div>';
    } else {
      const shown = reteachRows.slice(0, RETEACH_SHOWN);
      let html = shown.map(function (r) {
        // Design's own colour rule for this number, carried from the class
        // screen: rust below half, muted above it. Not `--danger` — a hard
        // question is not an error state.
        const fg = r.pct < 50 ? 'var(--st-accent-text)' : 'var(--st-muted)';
        const line = r.id + (r.text ? ' · ' + r.text : '');
        return '<div class="panel-row">' +
               '<div class="reteach-code">' + esc(r.code) + '</div>' +
               '<div class="panel-body"><div class="panel-name">' + esc(line) + '</div></div>' +
               '<div class="reteach-pct" style="color:' + fg + '">' + r.pct + '%</div>' +
               '</div>';
      }).join('');
      const more = reteachRows.length - shown.length;
      if (more > 0) {
        html += '<div class="panel-foot"><span class="more">+' + more +
                ' more across today’s classes</span></div>';
      }
      reteachBox.innerHTML = html;
    }

    paintStrip(
      '<span class="n">' + chaseRows.length + '</span> ' +
      (chaseRows.length === 1 ? 'student to chase' : 'students to chase'),
      '<span class="n">' + reteachRows.length + '</span> ' +
      (reteachRows.length === 1 ? 'topic worth a reteach' : 'topics worth a reteach'));
  }
});

/* The doneness test, written ONCE.

   ⚠️ It is the UNION — completed_at, submitted_at, or status === 'complete' —
   the same one `teacher-live.js`'s cellOf() uses, so this page cannot
   disagree with the class screens ("one number, one source"), and it can
   never count a student as owing work when their own page reads Complete.
   The literal is 'complete', NOT 'completed'. */
function isDone(s) {
  if (!s) { return false; }
  return !!(s.completed_at || s.submitted_at) || s.status === 'complete';
}

/* ⊕ MRB-325 ruling 1 — THIS WEEK'S PAPER AND WHO OWES IT, in one place.
   `describeClass` used to compute this inline and was its only reader; the
   chase panel needs the very same set of students, and deriving it a second
   time is how the sentence on a lesson row and the names in the panel beside
   it come to disagree. The sentences below are UNCHANGED, byte for byte —
   only where their numbers come from moved. */
function weekState(pack) {
  if (!pack) { return { why: 'unknown', members: [] }; }
  const assignments = pack.assignments || [];
  const members = pack.members || [];
  if (!assignments.length) { return { why: 'no-work', members: members }; }
  if (!members.length) { return { why: 'no-students', members: members }; }

  // This week's work: the newest by due date, nulls first — the same order
  // buildPapers uses, where index 0 is the week the class opens parked on.
  const papers = assignments.slice().sort(function (a, b) {
    if (a.due_at == null && b.due_at == null) { return 0; }
    if (a.due_at == null) { return -1; }
    if (b.due_at == null) { return 1; }
    return a.due_at < b.due_at ? 1 : -1;
  });
  const paper = papers[0];
  if (!paper) { return { why: 'unknown', members: members }; }

  const doneBy = {};
  (pack.submissions || []).forEach(function (s) {
    if (s.assignment_id !== paper.id) { return; }
    if (isDone(s)) { doneBy[s.student_id] = true; }
  });

  const owing = members.filter(function (m) { return !doneBy[m.student_id]; });
  return {
    why: 'ok',
    paper: paper,
    members: members,
    total: members.length,
    inCount: members.length - owing.length,
    owing: owing
  };
}

/* What to say about one class, from its own submission rows. */
function describeClass(pack) {
  const st = weekState(pack);
  if (st.why === 'unknown') { return { text: '', chase: false }; }
  if (st.why === 'no-work') {
    /* No work set. Say so; do NOT offer to set it \u2014 nothing on a teacher
       surface can compose an assignment. */
    return { text: 'No work set this week.', chase: false };
  }
  if (st.why === 'no-students') {
    return { text: 'No students on this class yet.', chase: false };
  }

  const owing = st.owing.length;
  if (owing === 0) {
    return { text: st.inCount + ' of ' + st.total + ' in \u00B7 nothing to chase', chase: false };
  }
  return {
    text: st.inCount + ' of ' + st.total + ' in \u00B7 ' + owing +
          (owing === 1 ? ' still to hand in' : ' still to hand in'),
    chase: true
  };
}

/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
   \u2295 MRB-325 ruling 1 \u2014 THE TWO PANELS
   \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550

   \u2691 WHY THESE DERIVATIONS ARE RE-DERIVED HERE RATHER THAN IMPORTED.
   `shared/teacher-live.js` owns `buildRoster` (the "Keep an eye on" numbers)
   and `weakFor` (the class screen's "Reteach from the last set"), which are
   the two this page has to agree with. Neither can be called: teacher-live.js
   is a self-running IIFE that EXPORTS NOTHING \u2014 it ends in `run().catch(\u2026)`,
   its whole surface is closure-private, and it mounts itself against the
   generated pages' `__MRB_TPL__`, which this hand-written page does not have.
   Loading it here would start a second dashboard inside Today.

   So the numbers are re-derived from the SAME raw fields \u2014 `pack.members`,
   `pack.assignments`, `pack.submissions`, all already in hand for the lesson
   lines \u2014 using the same tests, and each one below is named against the
   function it has to match. This unit introduces NO new definition of
   "missed", "average" or "weakest"; if one of these ever drifts from its
   counterpart that is a defect, not a difference of opinion.               */

/* A class's CLOSED papers. `buildPapers` sets `when: open ? "upcoming" :
   "marked"` from `open = !a.due_at || a.due_at > now`, so a "marked" paper is
   exactly one whose deadline has passed. An assignment with no deadline never
   closes and is never counted here. */
function markedPapers(pack, nowIso) {
  return ((pack && pack.assignments) || []).filter(function (a) {
    return a.due_at && a.due_at <= nowIso;
  });
}

/* Per-student "missed this term" and "avg X%", matching `buildRoster`.

   \u00B7 MISSED \u2014 `buildRoster` computes `missingMarked`, a BOOLEAN over
     `mx.markedIdx`: "is there a marked paper this student never submitted".
     Design's row wants the COUNT of them: the same predicate over the same
     papers, counted rather than collapsed. Nothing else changes.

   \u00B7 AVG \u2014 `buildMatrix`'s `studentAvg`: sum(score) / sum(max) over the marked
     papers, per student, rounded. `null` \u2014 NEVER 0 \u2014 when nothing of theirs
     is graded, because 0% is a claim about how a child did and "nothing
     marked" is not that claim. Only a cell `cellOf` would have kept counts:
     handed in, with both a score and a max, and max > 0.

   \u26A0\uFE0F "THIS TERM" IS DESIGN'S WORD AND IT IS APPROXIMATE. The population is
   the class's own closed assignments \u2014 a class belongs to one academic year
   so it cannot reach across years \u2014 but `academic_years` records a start and
   an end and NOTHING about half terms, which is the same limitation
   `teacher-live.js`'s week bar already carries in writing. Not re-litigated
   here; recorded so the next reader knows what the words cover. */
function termStats(pack, nowIso) {
  const marked = markedPapers(pack, nowIso);
  const byStudent = {};
  ((pack && pack.submissions) || []).forEach(function (s) {
    if (!byStudent[s.student_id]) { byStudent[s.student_id] = {}; }
    byStudent[s.student_id][s.assignment_id] = s;
  });
  const out = {};
  ((pack && pack.members) || []).forEach(function (m) {
    const mine = byStudent[m.student_id] || {};
    let missed = 0, tot = 0, totMax = 0;
    marked.forEach(function (a) {
      const s = mine[a.id];
      if (!isDone(s)) { missed += 1; return; }
      if (s.score != null && s.max_score != null && s.max_score > 0) {
        tot += s.score; totMax += s.max_score;
      }
    });
    out[m.student_id] = {
      missed: missed,
      avg: totMax > 0 ? Math.round((tot / totMax) * 100) : null
    };
  });
  return out;
}

/* The newest MARKED paper \u2014 `newestMarkedIdx` over `buildPapers`' own
   newest-first order, which is due_at DESC. null for a class whose papers are
   all still open, which is the honest answer: a set nobody has been marked on
   cannot say what to reteach. */
function newestMarkedPaper(pack, nowIso) {
  const closed = markedPapers(pack, nowIso).slice().sort(function (a, b) {
    if (a.due_at !== b.due_at) { return a.due_at < b.due_at ? 1 : -1; }
    return (a.title || '').localeCompare(b.title || '');
  });
  return closed[0] || null;
}

/* The weakest question on one paper \u2014 `weakFor` as RULED in
   `teacher_rulings.py`, over `buildGrid`'s `qpct`. Three properties are
   carried across deliberately, because all three are what that ruling FIXED
   and dropping any one puts a wrong sentence in front of a teacher:

     \u00B7 THE DENOMINATOR IS THE ANSWERS THAT WERE MACHINE-MARKED, not everyone
       who handed the paper in. `is_correct` is nullable and NULL IS NOT
       FALSE \u2014 a self-marked or written answer records no correctness claim \u2014
       so a null counts towards neither half of the fraction.
     \u00B7 THE MINIMUM IS OVER NON-NULL ENTRIES ONLY. `Math.min` across an array
       holding nulls returns 0, which would name a question as the weakest in
       the school at 0% on no marks at all.
     \u00B7 A PAPER WITH NOTHING MARKED YIELDS NOTHING \u2014 null, rather than a bare
       em-dash under a "worth a reteach" heading.

   Ties go to the lowest question index, as `weakFor`'s strict `<` does. */
function weakestQuestion(pack, qpack) {
  if (!qpack) { return null; }
  const onRoll = {};
  ((pack && pack.members) || []).forEach(function (m) { onRoll[m.student_id] = true; });

  // `buildGrid` walks the ROSTER, so a departed student's answers are not in
  // the column. Same population here.
  const counted = {};
  (qpack.submissions || []).forEach(function (s) {
    if (onRoll[s.student_id] && isDone(s)) { counted[s.id] = true; }
  });

  const correct = {}, marked = {}, stem = {};
  (qpack.attempts || []).forEach(function (a) {
    if (!counted[a.submission_id]) { return; }
    const i = a.question_index;
    if (i == null) { return; }
    if (!stem[i] && a.question_text) { stem[i] = String(a.question_text); }
    if (a.is_correct === true) {
      correct[i] = (correct[i] || 0) + 1; marked[i] = (marked[i] || 0) + 1;
    } else if (a.is_correct === false) {
      marked[i] = (marked[i] || 0) + 1;
    }
  });

  let best = null;
  Object.keys(marked).map(Number).sort(function (a, b) { return a - b; })
    .forEach(function (i) {
      if (!marked[i]) { return; }
      const pct = Math.round(((correct[i] || 0) / marked[i]) * 100);
      if (best === null || pct < best.pct) {
        best = { idx: i, pct: pct, id: 'Q' + (i + 1), text: stem[i] || '' };
      }
    });
  return best;
}

/* Initials and the hue behind them \u2014 `initialsOf` and `hueFor` from
   `teacher-live.js`, palette included, so one child is not a different colour
   on Today than on their own class page. */
const AVATAR_HUE = ['#2F5CE0', '#A93411', '#0A6B36', '#5A31C0', '#7A5F00', '#2545A8'];
function initialsOf(first, last) {
  const f = (first || '').trim(), l = (last || '').trim();
  if (f && l) { return (f[0] + l[0]).toUpperCase(); }
  if (f) { return f.slice(0, 2).toUpperCase(); }
  if (l) { return l.slice(0, 2).toUpperCase(); }
  return '';
}
function hueFor(name) {
  let h = 2166136261;
  const s = String(name || '');
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
  return AVATAR_HUE[(h >>> 0) % AVATAR_HUE.length];
}
function fullName(first, last) {
  return ((first || '') + ' ' + (last || '')).trim();
}

/* The school's calendar day, as the DATABASE stamps one \u2014 the same
   `Europe/London` reading `teacher-live.js`'s `todayInSchoolTz` uses for the
   reminder rate limit. `assignments_open_from` is a `date`, and whether it is
   "strictly in the future" has to be decided against the SCHOOL's day: a
   teacher marking at home on a device in another timezone must see the same
   hold their colleague sees in the building. */
function schoolDateISO() {
  try {
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(new Date());
  } catch (e) {
    return new Date().toISOString().slice(0, 10);
  }
}
</script>
</body>
