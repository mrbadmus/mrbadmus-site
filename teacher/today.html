<script>
/* ══════════════════════════════════════════════════════════════════════════
   MRB-306 — TODAY
   ══════════════════════════════════════════════════════════════════════════

   The teacher's day, built from `timetable_entries` (WS-1's seed) and the
   class reads `teacher-data.js` already owns.

   WHAT THIS PAGE WILL NOT DO
   · It will not invent a clock time. `school_period_times` is empty on
     purpose, so lessons are ordered by period NUMBER and labelled
     "Period 1 … 5". A wrong time in front of someone about to walk into a
     room is worse than no time at all.
   · It will not compose an assignment, or offer to. Composition happens in
     ONE place — the backend's `/api/class/current-assignment` — and no
     teacher surface calls it, so a teacher cannot cause it however the
     button is worded. Where there is no work set this page says so plainly
     rather than offering an action that would do nothing.
   · It will not read a deadline from the device clock. The weekday is
     interpreted in the school's timezone (`schoolWeekday`), and that decides
     only WHICH ROW of the grid to show — never whether something is late.
   ═══════════════════════════════════════════════════════════════════════ */

const DAY_NAMES = { 1:'Monday', 2:'Tuesday', 3:'Wednesday', 4:'Thursday', 5:'Friday', 6:'Saturday', 7:'Sunday' };
const MONTHS = ['January','February','March','April','May','June','July',
                'August','September','October','November','December'];

/* ⊕ MRB-326 JOB 3 — `DAY_SHORT` DELETED. It existed only for the day-chip
   strip ("MON · 10  TUE · 7 …"), which Design does not draw and Mide's
   ruling 3 removes. */

function el(id) { return document.getElementById(id); }

function notice(title, bodyHtml) {
  el('main').style.display = 'none';
  el('notice-title').textContent = title;
  el('notice-body').innerHTML = bodyHtml;
  el('notice').style.display = 'block';
  document.body.style.display = 'block';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

/* MRB-325 ruling 2 — "09:15:00" (Postgres `time`) to "09:15". Never invents
   a time: called only where `school_period_times` already has a row. */
function formatTime(t) {
  const m = /^(\d{2}):(\d{2})/.exec(t || '');
  return m ? (m[1] + ':' + m[2]) : '';
}

/* Time-of-day greeting. From the clock, which is fine — being wished good
   afternoon at 11:59 is a cosmetic error, and nothing here is a deadline. */
function greetingFor(name) {
  const h = new Date().getHours();
  const part = h < 12 ? 'Good morning' : (h < 18 ? 'Good afternoon' : 'Good evening');
  return name ? (part + ', ' + name) : part;
}

/* The name students see. `display_name` is the "What name should students
   see" field; where a teacher has not set one, fall back the same way
   `class_teachers_for_viewer` does, so one person is never named two ways. */
function teacherName(profile) {
  if (!profile) { return ''; }
  const dn = (profile.display_name || '').trim();
  if (dn) { return dn; }
  const fl = ((profile.first_name || '') + ' ' + (profile.last_name || '')).trim();
  return fl || '';
}

/* ⊕ MRB-326 JOB 3 · RULING 8 — THE EYEBROW, FROM DATA AND NOTHING ELSE.
   "MONDAY 7 SEPTEMBER · AUTUMN TERM · 2026-27" — and every one of those three
   parts is dropped rather than guessed if it cannot be derived honestly.

   ⚠️ THE DATE IS TODAY'S, NOT THE DAY BEING SHOWN. It is a date line: on a
   Saturday it says Saturday, and the h2 over the list says whose lessons
   those are. Two different facts, each said once, neither pretending to be
   the other — which is what the deleted "No lessons at the weekend. Showing
   your next teaching day." sentence was trying to do in prose.

   ⚠️ READ IN THE SCHOOL'S TIMEZONE, like `schoolWeekday()`, so a teacher
   marking at home on a device set to another zone sees the day their
   colleague in the building sees.

   The TERM word is the only derived part, and the derivation is a calendar
   fact rather than a schema one: the English school year runs autumn
   Sep–Dec, spring Jan–Mar, summer Apr–Jul. AUGUST FALLS IN NO TERM and the
   word is simply omitted — a school does not sit in "summer term" on the
   20th of August, and nothing in `academic_years` records half terms or
   term boundaries to ask instead. */
const TERM_BY_MONTH = { 8:'Autumn term', 9:'Autumn term', 10:'Autumn term', 11:'Autumn term',
                        0:'Spring term', 1:'Spring term', 2:'Spring term',
                        3:'Summer term', 4:'Summer term', 5:'Summer term', 6:'Summer term' };

function schoolNowParts() {
  /* `en-GB` in Europe/London, split into parts so nothing has to be parsed
     back out of a formatted string. */
  try {
    const f = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Europe/London', weekday: 'long', day: 'numeric',
      month: 'numeric', year: 'numeric'
    });
    const got = {};
    f.formatToParts(new Date()).forEach(function (p) { got[p.type] = p.value; });
    /* ⚠️ `String(Number(...))` ON THE DAY, and it is not belt-and-braces.
       `en-GB` with `day: 'numeric'` renders "07", not "7", in this ICU — so
       the line read "MONDAY 07 SEPTEMBER" where Design's reads "MONDAY 31
       AUGUST". A zero-padded day in a display date is a machine talking. */
    return { weekday: got.weekday || '',
             day: got.day ? String(Number(got.day)) : '',
             monthIdx: got.month ? (Number(got.month) - 1) : null };
  } catch (e) {
    const d = new Date();
    return { weekday: DAY_NAMES[d.getDay() === 0 ? 7 : d.getDay()] || '',
             day: String(d.getDate()), monthIdx: d.getMonth() };
  }
}

function eyebrowLine(yearName) {
  const n = schoolNowParts();
  const bits = [];
  if (n.weekday && n.day && n.monthIdx != null) {
    bits.push(n.weekday + ' ' + n.day + ' ' + MONTHS[n.monthIdx]);
  }
  const term = n.monthIdx == null ? null : TERM_BY_MONTH[n.monthIdx];
  if (term) { bits.push(term); }
  if (yearName) { bits.push(yearName); }
  return bits.join(' · ');
}

/* ⊕ MRB-326 JOB 3 — `subjectFromCode` DELETED, and its deletion IS ruling 1.
   It existed to build the lesson row's meta line ("KS3 · Science"), which is
   gone. The subject is legible in the class code itself — MRB-263 makes
   `/Sc` `/Ph` `/Ch` `/Bi` the subject — and spelling it out beside the code
   was the page telling a teacher what the code they wrote already says. */

/* Design's `shortName`: "Hana Popescu" -> "Hana P". Her own implementation,
   which takes the FIRST TWO whitespace-separated parts and initialises the
   second — so a three-part name keeps its first two, exactly as hers does. */
function shortName(name) {
  const p = String(name || '').trim().split(/\s+/);
  return p[0] + (p[1] ? ' ' + p[1][0] : '');
}

/* The next teaching day at or after `from`, among the days this teacher
   actually teaches. Returns null when the timetable is empty. */
function nextTeachingDay(days, from) {
  if (!days.length) { return null; }
  for (let i = 0; i < 7; i++) {
    const d = ((from - 1 + i) % 7) + 1;
    if (days.indexOf(d) !== -1) { return d; }
  }
  return null;
}

/* ══════════════════════════════════════════════════════════════════════════
   ⊕ MRB-326 JOB 3 · THE SEARCH OVERLAY
   ══════════════════════════════════════════════════════════════════════════

   Ruling 9 puts "Find a student" in this bar because the six GENERATED
   teacher screens carry it. It could not be borrowed: the generated bar is a
   compiled `__MRB_TPL__` tree driven by `shared/teacher-live.js`, which is a
   self-running IIFE that exports nothing and mounts against a host this
   hand-written page does not have. So the control is rebuilt here, and the
   rule that governed it on those pages governs it here — a control that does
   nothing when pressed is worse than none.

   ⚑ IT READS THE WHOLE ROSTER, AND IT READS IT ONLY WHEN PRESSED.
   `buildSearchPool` on the generated pages is every student on every class
   the teacher holds this year, and the box says so — so the pool has to be
   the same population or the box is lying. That is a wider read than the rest
   of this page makes on purpose (Today reads the DAY's handful, which is what
   keeps the reteach round trip affordable), so it is fired by the FIRST PRESS
   and never on load. A teacher who never opens the sheet pays nothing, and
   the load MRB-292 shrank is unchanged.

   ⚑ NO NEW QUERY IS INVENTED. `loadAcademicYears` -> `loadTeacherClasses`
   -> `loadClassMatrices` are three helpers this page or its neighbours
   already call, RLS-scoped exactly as they are everywhere else, and
   `loadClassMatrices` chunks internally — so twelve classes is a handful of
   round trips, not twelve.                                                 */
/* ⊕ MRB-326 JOB 3 (coordinator correction 1) — THE PAGE'S OWN STUDENT POOL.
   Filled by the wide read below, which the CHASE PANEL now needs anyway. The
   search reads it when it is there and falls back to loading its own when it
   is not (the no-timetable page, or a failed wide read) — so the sheet is
   never dead and never duplicates a read the page has already made. */
const SEARCH_POOL = { rows: null };

function armSearch(TD) {
  const openBtn = el('search-open'), back = el('search-back'),
        input = el('search-input'), out = el('search-results');
  if (!openBtn || !back || !input || !out) { return; }

  let pool = null, loading = false, failed = false;

  function line(t) { return '<div class="empty">' + esc(t) + '</div>'; }

  function render() {
    if (loading) { out.innerHTML = line('Finding your students…'); return; }
    /* ⚠️ UNKNOWN IS NOT EMPTY, the same rule the panels below keep. A failed
       read must not render as "no students called that". */
    if (failed) { out.innerHTML = line('Couldn’t load your students just now.'); return; }
    if (!pool) { out.innerHTML = ''; return; }
    const q = input.value.trim().toLowerCase();
    if (!q) {
      out.innerHTML = line(pool.length === 1
        ? 'Type a name. 1 student on your classes.'
        : 'Type a name. ' + pool.length + ' students on your classes.');
      return;
    }
    const hits = pool.filter(function (r) { return r.name.toLowerCase().indexOf(q) !== -1; });
    if (!hits.length) { out.innerHTML = line('Nobody on your classes matches that.'); return; }
    out.innerHTML = hits.slice(0, 30).map(function (r) {
      return '<div class="panel-row" data-go-student="' + esc(r.id) + '"' +
             ' data-go-class="' + esc(r.classId) + '">' +
             '<div class="avatar" style="background:' + esc(hueFor(r.name)) + '" aria-hidden="true">' +
             esc(initialsOf(r.first, r.last)) + '</div>' +
             '<div class="panel-body"><div class="panel-head">' +
             '<span class="panel-name">' + esc(r.name) + '</span>' +
             '<span class="panel-code">' + esc(r.code) + '</span>' +
             '</div></div></div>';
    }).join('');
  }

  async function ensurePool() {
    if (pool || loading) { return; }
    /* The page has already built it, for the chase panel. */
    if (SEARCH_POOL.rows) { pool = SEARCH_POOL.rows; render(); return; }
    loading = true; failed = false; render();
    try {
      let yid = null;
      try {
        const y = await TD.loadAcademicYears();
        yid = y && y.working ? y.working.id : null;
      } catch (e) { yid = null; }
      const classes = await TD.loadTeacherClasses(yid, { metrics: false });
      const ids = (classes || []).map(function (k) { return k.id; }).filter(Boolean);
      const mx = ids.length ? await TD.loadClassMatrices(ids) : {};
      const rows = [];
      (classes || []).forEach(function (k) {
        const pack = mx ? mx[k.id] : null;
        ((pack && pack.members) || []).forEach(function (m) {
          rows.push({ id: m.student_id,
                      name: fullName(m.first_name, m.last_name) || 'Student',
                      first: m.first_name, last: m.last_name,
                      code: k.name || '', classId: k.id });
        });
      });
      rows.sort(function (a, b) {
        return a.name.localeCompare(b.name) || a.code.localeCompare(b.code);
      });
      pool = rows;
    } catch (e) {
      console.warn('[today] student search unavailable', e);
      failed = true;
    }
    loading = false; render();
  }

  function open() {
    back.hidden = false;
    input.value = '';
    render();
    input.focus();
    ensurePool();
  }
  function close() { back.hidden = true; }

  openBtn.addEventListener('click', open);
  input.addEventListener('input', render);
  back.addEventListener('click', function (ev) { if (ev.target === back) { close(); } });
  out.addEventListener('click', function (ev) {
    const row = ev.target && ev.target.closest ? ev.target.closest('[data-go-student]') : null;
    if (!row) { return; }
    // Keep the environment across the hop, exactly as teacher-admin-nav.js
    // does — a tester on TEST must not be dropped onto production data.
    const c = window.MrBadmusConfig;
    const env = c && c.environment === 'test' ? '&env=test' : '';
    window.location.href = '/teacher/student-detail.html?student=' +
      encodeURIComponent(row.getAttribute('data-go-student')) +
      '&class=' + encodeURIComponent(row.getAttribute('data-go-class')) + env;
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && !back.hidden) { close(); return; }
    if (ev.key !== '/' || !back.hidden) { return; }
    const t = ev.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (t && t.isContentEditable)) { return; }
    ev.preventDefault();
    open();
  });
}

MrBadmusTeacherGuard.requireTeacherRole({
  onDenied: function () { /* the guard redirects; nothing to draw */ },
  onAllowed: async function (ctx) {
    /* ⚠️ 'block', NEVER ''. The stylesheet says `body { display: none }` so a
       page reveals itself by SETTING a value; assigning '' removes the inline
       style and falls straight back to none — a page that passes every text
       assertion (the nodes are all there) and renders a blank screen. Caught
       by looking at the screenshot, not by the assertions. */
    document.body.style.display = 'block';
    const TD = window.MrBadmusTeacherData;

    const name = teacherName(ctx && ctx.profile);
    el('greeting').textContent = greetingFor(name);
    /* Design's bar names the teacher between the search and Sign out. This
       page has always held the string; it had nowhere to put it. */
    el('tb-name').textContent = name;

    /* Armed before anything is read. It makes no request until pressed. */
    armSearch(TD);

    /* ⚑ ONE `loadAcademicYears`, TWO READERS, AND IT IS FIRED FIRST.
       The eyebrow wants the year's NAME and the class list wants its ID, and
       `loadTimetable` below wants it too — `class-entry.js` holds the answer
       after the first ask, so this is one round trip whoever asks. */
    const yearsPromise = (TD.loadAcademicYears ? TD.loadAcademicYears()
                                               : Promise.resolve(null))
      .catch(function (e) {
        console.warn('[today] loadAcademicYears unavailable', e);
        return null;
      });

    /* ⊕ RULING 8 — the eyebrow. NOT awaited: it is a date line above the
       greeting and nothing below it waits on the academic year's NAME. Never
       fatal — a failed read costs the line its "2026-27" and keeps the date
       and the term, which are calendar facts this page can always derive. */
    yearsPromise.then(function (y) {
      const w = y && y.working;
      el('eyebrow').textContent = eyebrowLine(w && w.name ? w.name : '');
    });

    /* ⊕ COORDINATOR CORRECTION 1, 6 Sep 2026 — EVERY CLASS, NOT TODAY'S.
       ═══════════════════════════════════════════════════════════════════
       The chase panel and the reteach panel were scoped to the day's
       handful, and that was WRONG against Design on both counts. Her
       `chaseAll` and her `reteachRows` BOTH iterate `liveClasses` — every
       class the teacher holds, not the ones on the timetable today — her
       footer says "+51 MORE ACROSS YOUR CLASSES", and Mide's ruling 5 asks
       for "every chase-able student". A teacher chasing homework is not
       chasing only the children they happen to see before lunch.

       ⚑ FIRED HERE, BESIDE `loadTimetable`, AND NOT AFTER IT.
       This is the MRB-292 lesson and it is the whole reason this sits at the
       top of the function rather than next to the panel that consumes it: a
       wide read placed where it is READ is a wide read placed in series
       behind everything above it. The class list needs only the year, which
       is already in flight, so it overlaps the timetable read completely;
       the matrices read it feeds then overlaps the DAY's matrices read (see
       `widePromise` below). Nothing waits on anything it does not need. */
    const allClassesPromise = yearsPromise
      .then(function (y) {
        const yid = y && y.working ? y.working.id : null;
        return TD.loadTeacherClasses(yid, { metrics: false });
      })
      .catch(function (e) {
        /* ⚠️ null, NEVER []. An empty list would mean "this teacher has no
           classes" and would quietly narrow the chase panel back to the day
           while still captioning it "across your classes". null means "not
           known", and the panel says the narrower, TRUE thing instead. */
        console.warn('[today] loadTeacherClasses unavailable — the panels '
                     + 'fall back to the day’s classes', e);
        return null;
      });

    let entries;
    try {
      entries = await TD.loadTimetable();
    } catch (e) {
      console.error('[today] loadTimetable failed', e);
      return notice('Today is unavailable',
        'Your timetable could not be loaded just now. Refresh in a moment, or open ' +
        '<a href="/teacher/classes.html">My classes</a>.');
    }

    /* MRB-325 ruling 2 — real clock times, once a school has them. Never
       fatal: a school with no rows yet (school_period_times empty) simply
       keeps labelling by period number, exactly as before. */
    let periodTimes = {};
    try {
      periodTimes = await TD.loadPeriodTimes();
    } catch (e) {
      console.warn('[today] loadPeriodTimes unavailable — labelling by period number', e);
    }

    /* ⊕ MRB-325 ruling 1 — the school's go-live hold. Fired here, and NOT
       awaited: nothing above the lessons needs it, and the panels that do are
       many hundreds of milliseconds behind it. Never fatal — a school with no
       row, or a read that fails, is treated as NOT held, which leaves the
       page saying exactly what it said before this ruling. Failing the other
       way would print "No assignment set yet" over a school that is running
       normally, which is the worse of the two wrong answers. */
    const holdPromise = (TD.loadSchoolHold ? TD.loadSchoolHold() : Promise.resolve({}))
      .catch(function (e) {
        console.warn('[today] loadSchoolHold unavailable — treating the school as open', e);
        return {};
      });

    /* Design's summary sentence, and the ONLY place a count is said.
       ⊕ RULING 6 — Design draws the lesson count TWICE (here, and as
       `lessonCount` beside the h2). Mide's rule is once, and this is the
       once. `#lesson-count` does not exist in the markup at all. */
    function summary(parts) {
      el('summary').innerHTML = parts.join('<span class="sep">·</span>');
    }
    function num(n, one, many) {
      return '<span class="n">' + n + '</span> ' + (n === 1 ? one : many);
    }

    /* ── NO TIMETABLE AT ALL ────────────────────────────────────────────
       An honest prompt, and deliberately NOT a promise.
       ⊕ RULING 6 — the paragraph used to END with "and there isn't one on
       your account yet", which is the summary sentence directly above it,
       said twice on one screen. The summary keeps it; the paragraph now says
       only what the page is FOR. */
    if (!entries.length) {
      summary(['No timetable yet.']);
      el('lessons-heading').textContent = 'Your lessons';
      el('lessons').innerHTML =
        '<div class="prompt">' +
        '<p>Today shows your lessons in order, each one telling you who still owes you ' +
        'this week&rsquo;s work before you walk in.</p>' +
        '<a class="btn" href="/teacher/timetable.html">Set up my timetable</a>' +
        '</div>';
      el('main').style.display = 'block';
      return;
    }

    const todayWeekday = TD.schoolWeekday();
    const taughtDays = [];
    entries.forEach(function (e) {
      if (taughtDays.indexOf(e.weekday) === -1) { taughtDays.push(e.weekday); }
    });
    taughtDays.sort();

    /* Which day are we showing, and is it actually today? Weekend, or a
       weekday with no lessons, both fall through to the next teaching day.

       ⊕ RULING 2 — AND THE PAGE NO LONGER EXPLAINS ITSELF ABOUT IT.
       "No lessons at the weekend. Showing your next teaching day." is gone.
       The eyebrow already says what day it is; the h2 below says whose
       lessons these are. Two facts, each said once. The sentence was the
       page narrating the arithmetic between them. */
    let showDay = todayWeekday;
    let isToday = true;
    if (taughtDays.indexOf(todayWeekday) === -1) {
      showDay = nextTeachingDay(taughtDays, todayWeekday);
      isToday = false;
    }

    const dayEntries = entries.filter(function (e) { return e.weekday === showDay; })
                              .sort(function (a, b) { return a.period - b.period; });

    /* ⊕ RULING 2 — ONE WORD, NOT A SENTENCE. Design's h2 is "Today's
       lessons"; when the day shown is not today it names the day instead. */
    el('lessons-heading').textContent = isToday
      ? 'Today’s lessons'
      : DAY_NAMES[showDay] + '’s lessons';
    /* Design's underline link, standing beside the h2 once there is a
       timetable to edit. */
    el('edit-timetable').style.display = '';

    if (!dayEntries.length) {
      summary(['Nothing timetabled.']);
      el('lessons').innerHTML = '<div class="empty">Nothing timetabled.</div>';
      el('main').style.display = 'block';
      return;
    }

    /* Draw the lessons FIRST, from the timetable alone, then fill each one's
       state in as the class reads land. A teacher gets their room order
       immediately rather than waiting on the slowest class.

       ⊕ RULING 1 — A ROW IS PERIOD, TIME, CODE, STATUS. Design's meta line
       ("LAB 2 · 29 STUDENTS · SCIENCE") is not drawn: the subject is legible
       in the code beside it (MRB-263), the student count is the denominator
       of the status line under it, and there is no room in this schema. */
    el('lessons').innerHTML = dayEntries.map(function (e) {
      const pt = periodTimes[e.period];
      const clock = pt && pt.startsAt ? formatTime(pt.startsAt) : '';
      /* ⊕ MRB-323 — the picker button ships HIDDEN and is revealed below,
         only for a class whose roster actually came back with somebody on
         it. A control offered before its data has arrived is a control that
         does nothing when pressed, and one offered for a class this page
         could not read would be a picker over an empty room. Same rule the
         state line beside it already keeps: unknown is not zero. */
      return '<div class="lesson">' +
             '<a class="lesson-go" href="/teacher/class-detail.html?class=' + encodeURIComponent(e.classId) + '">' +
             '<div>' +
             '<div class="lesson-p">P' + esc(e.period) + '</div>' +
             (clock ? '<div class="lesson-time">' + esc(clock) + '</div>' : '') +
             '</div>' +
             '<div>' +
             '<div class="lesson-code">' + esc(e.className || 'Class') + '</div>' +
             '<div class="lesson-state clear" data-state-for="' + esc(e.classId) + '">' +
             '<span class="skel" style="display:inline-block;width:150px;height:11px;"></span>' +
             '</div>' +
             '</div>' +
             '<span class="lesson-chev">' +
             '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">' +
             '<path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="1.6"' +
             ' stroke-linecap="round" stroke-linejoin="round"/></svg></span>' +
             '</a>' +
             /* ⚠️ THE NAME TRAVELS ON THE BUTTON, and it is the name THIS ROW
                is displaying. The first version read `pack.class.name` out of
                the matrices in the handler, which is a second source for a
                string the card is already showing — and `today_drive` caught
                it doing exactly what a second source does: a pack without a
                `class` key put the word "Class" on the board in place of
                8r/Sc1. One row, one name, in one place. */
             '<button type="button" class="lesson-pick" hidden' +
             ' data-pick-for="' + esc(e.classId) + '"' +
             ' data-pick-name="' + esc(e.className || '') + '"' +
             ' aria-label="Pick a student from ' + esc(e.className || 'this class') + '">' +
             '<svg width="17" height="17" viewBox="0 0 17 17" fill="none" aria-hidden="true">' +
             '<circle cx="8.5" cy="5" r="2.6" stroke="currentColor" stroke-width="1.5"/>' +
             '<path d="M3 14c0-2.8 2.5-4.6 5.5-4.6S14 11.2 14 14" stroke="currentColor"' +
             ' stroke-width="1.5" stroke-linecap="round"/></svg>' +
             '</button>' +
             '</div>';
    }).join('');
    el('main').style.display = 'block';

    /* ⊕ MRB-325 ruling 1 — the actions and the panels are revealed HERE, past
       the no-timetable and nothing-timetabled returns, so neither of those
       states ever shows an "Upload timetable" button or an empty chase list. */
    el('head-actions').style.display = 'flex';
    el('side').style.display = 'flex';

    const lessonWord = dayEntries.length === 1 ? 'lesson' : 'lessons';
    const stripHead = '<span class="n">' + dayEntries.length + '</span> ' + lessonWord +
      (isToday ? ' today' : ' on ' + esc(DAY_NAMES[showDay]));
    /* The lesson count is real immediately (it is the timetable, which has
       already landed); the other two facts are skeletons until their reads
       come back, because a summary that opened at "0 students to chase" would
       be a reassurance the page has not yet earned. */
    const stripSkel = '<span class="skel" style="display:inline-block;width:96px;height:12px;' +
                      'vertical-align:middle;"></span>';
    summary([stripHead, stripSkel, stripSkel]);

    /* ── PER-CLASS STATE ────────────────────────────────────────────────
       One read for every class on the day, in parallel — not one wave per
       lesson (the MRB-292 lesson). Each cell is filled independently, so one
       slow or failing class cannot blank the others. */
    const classIds = [];
    dayEntries.forEach(function (e) {
      if (e.classId && classIds.indexOf(e.classId) === -1) { classIds.push(e.classId); }
    });

    /* ⚑ TWO READS, ISSUED IN THE SAME MICROTASK, NOT ONE AFTER THE OTHER.
       ⊕ COORDINATOR CORRECTION 1.

       The DAY's classes are read on their own and awaited first, because the
       lesson rows are why a teacher is on this screen and they must not wait
       on the twelfth class. The REST are read beside them, off the class list
       that has been in flight since the top of this function — so by the time
       the day's read resolves the wide one is already most of the way home.

       The two sets are DISJOINT: the wide read asks only for the classes the
       day does not already cover, so no class's matrices are fetched twice.
       `loadClassMatrices` chunks internally, so "the rest" is a couple of
       round trips over a dozen classes, not a dozen. */
    const todayMxPromise = TD.loadClassMatrices(classIds);

    const widePromise = allClassesPromise.then(function (classes) {
      if (!classes) { return null; }
      const others = classes.filter(function (k) {
        return k.id && classIds.indexOf(k.id) === -1;
      });
      if (!others.length) { return { classes: classes, mx: {} }; }
      return TD.loadClassMatrices(others.map(function (k) { return k.id; }))
        .then(function (mx) { return { classes: classes, mx: mx || {} }; });
    }).catch(function (e) {
      console.warn('[today] the wider class read failed — the panels fall '
                   + 'back to the day’s classes', e);
      return null;
    });

    let matrices = null;
    try {
      matrices = await todayMxPromise;
    } catch (err) {
      console.warn('[today] class state unavailable', err);
    }

    /* ⊕ MRB-325 ruling 1 — IS THE SCHOOL HELD? `assignments_open_from` set
       and STRICTLY in the future, against the school's own calendar day, is
       the same test the backend applies before it refuses to compose and
       answers `reason='assignments_not_open_yet'`. */
    const hold = await holdPromise;
    const openFrom = hold && hold.assignmentsOpenFrom ? String(hold.assignmentsOpenFrom) : null;
    const HELD = !!(openFrom && openFrom > schoolDateISO());
    /* ⚖️ RULED WORDING. Short, once per PAGE — ⊕ MRB-326 ruling 6 hardens
       MRB-325's "once per surface" to once, full stop. It used to be printed
       on every lesson row AND in both panels AND in the summary: on the
       drive's own fixture that was FIVE copies of one sentence on one
       screen. It is now said in the summary and nowhere else; the rows carry
       no status line at all, the chase panel shows a count of 0 with no rows,
       and the reteach panel is not rendered. Do not paraphrase this string,
       and do not add a second copy of it. */
    const HELD_TEXT = 'No assignment set yet';

    classIds.forEach(function (cid) {
      const cells = document.querySelectorAll('[data-state-for="' + cid + '"]');
      if (!cells.length) { return; }

      /* ⚠️ UNKNOWN IS NOT ZERO. Where the read failed the line says nothing
         rather than "0 to chase", which would be a made-up reassurance about
         a class this page could not see. The held school gets the same
         silence, for the opposite reason: the sentence is true, and it is
         already said once above. */
      if (!matrices || HELD) {
        cells.forEach(function (c) { c.className = 'lesson-state clear'; c.textContent = ''; });
        return;
      }

      const state = describeClass(matrices[cid]);
      cells.forEach(function (c) {
        c.className = 'lesson-state ' + state.tone;
        c.textContent = state.text;
      });

      /* ⊕ MRB-323 — and NOW the picker is offered, because now there are
         names to pick from. `pack.members` is `loadClassMatrices`'s ACTIVE
         roster (`left_at IS NULL`, `deleted_at IS NULL`, RLS-scoped through
         its `class_teachers` driver) — the same rows the state line above is
         derived from and the same set the class screen shows. So this page
         adds NO query for the picker: the read it already makes for the day
         carries the roster with it. */
      const roster = (matrices[cid] && matrices[cid].members) || [];
      if (!roster.length) { return; }
      document.querySelectorAll('[data-pick-for="' + cid + '"]').forEach(
        function (b) { b.hidden = false; });
    });

    /* ⚑ INLINE, NOT A TRIP THROUGH `class-detail.html`. The whole value of
       this control is that it is at hand in the thirty seconds between one
       lesson and the next; sending a teacher to another page — a navigation,
       a fresh mount and a fresh set of reads, on a phone at the classroom
       door — would be a slower way to do the thing they came here to do
       quickly, and would leave them on a screen they then have to come back
       from.

       Delegated on the container rather than bound per card, because the
       lessons are redrawn whenever the day changes. */
    const lessonList = el('lessons');
    if (lessonList) {
      lessonList.addEventListener('click', function (ev) {
        const btn = ev.target && ev.target.closest
          ? ev.target.closest('[data-pick-for]') : null;
        if (!btn) { return; }
        ev.preventDefault();
        const cid = btn.getAttribute('data-pick-for');
        const pack = matrices && matrices[cid];
        if (!pack || !window.MrBadmusPicker) { return; }
        window.MrBadmusPicker.open({
          id: cid,
          code: btn.getAttribute('data-pick-name') || '',
          students: pack.members || []
        });
      });
    }

    /* ══════════════════════════════════════════════════════════════════════
       STUDENTS TO CHASE, AND WORTH A RETEACH
       ══════════════════════════════════════════════════════════════════════

       ⊕ COORDINATOR CORRECTION 1 — BOTH PANELS ARE ACROSS EVERY CLASS.
       This used to read "both panels are scoped to TODAY'S classes only",
       and that was wrong against Design on both counts. Her `chaseAll` and
       her `reteachRows` each iterate `liveClasses` — every class the teacher
       holds this year. Checked in her source before changing either.

       The LESSON ROWS stay day-scoped, because a lesson row is about a
       lesson. The panels are about the teacher's week.                     */

    const wide = await widePromise;          // already in flight since the top
    const WIDE_OK = !!wide;

    /* Every class in one map, and every class's code in another. The DAY's
       reads win where the two overlap — same rows either way, but one row,
       one name, and the day's name is the one the lesson row is showing. */
    const allMx = {};
    if (WIDE_OK) {
      Object.keys(wide.mx).forEach(function (k) { allMx[k] = wide.mx[k]; });
    }
    if (matrices) {
      Object.keys(matrices).forEach(function (k) { allMx[k] = matrices[k]; });
    }

    // The code a class shows on this page, so the panels name a class the
    // same way the lesson row above them does. One row, one name.
    const codeOf = {};
    dayEntries.forEach(function (e) {
      if (e.classId && !codeOf[e.classId]) { codeOf[e.classId] = e.className || ''; }
    });
    if (WIDE_OK) {
      wide.classes.forEach(function (k) {
        if (k.id && !codeOf[k.id]) { codeOf[k.id] = k.name || ''; }
      });
    }

    /* ⚑ THE ORDER THE PANELS WALK, AND IT IS NOT ARBITRARY.
       Today's classes first, in the order they are taught — the teacher's
       next hour is the part of this list they can still do something about —
       then every other class by code, naturally ordered so 9A precedes 10A.
       It is also the DEDUP order: a child taught twice keeps the earlier
       entry, so a student on today's timetable is filed under today's class
       rather than under whichever other set the alphabet reached first. */
    const panelIds = classIds.slice();
    if (WIDE_OK) {
      wide.classes.slice()
        .sort(function (a, b) {
          return String(a.name || '').localeCompare(String(b.name || ''),
                                                    undefined, { numeric: true });
        })
        .forEach(function (k) {
          if (k.id && panelIds.indexOf(k.id) === -1) { panelIds.push(k.id); }
        });
    }

    /* ⊕ And the search sheet gets its pool for free — it is the same
       population, and the page has just paid for it. */
    if (WIDE_OK) {
      const searchRows = [];
      panelIds.forEach(function (cid) {
        ((allMx[cid] && allMx[cid].members) || []).forEach(function (m) {
          searchRows.push({ id: m.student_id,
                            name: fullName(m.first_name, m.last_name) || 'Student',
                            first: m.first_name, last: m.last_name,
                            code: codeOf[cid] || '', classId: cid });
        });
      });
      searchRows.sort(function (a, b) {
        return a.name.localeCompare(b.name) || a.code.localeCompare(b.code);
      });
      SEARCH_POOL.rows = searchRows;
    }

    const chaseBox = el('chase');
    const reteachHost = el('reteach-host');

    /* ── THE HELD SCHOOL ────────────────────────────────────────────────
       ⊕ RULING 6. The count is 0 and it is honest — nothing is owed because
       nothing has been set. No rows, no "Send reminders" (there is nobody to
       remind and nothing to remind them about), and no reteach panel, which
       is Design's own `hasReteach: false`. The sentence itself is said ONCE,
       in the summary. */
    if (HELD) {
      el('chase-count').textContent = '0';
      chaseBox.innerHTML = '';
      reteachHost.innerHTML = '';
      summary([stripHead, HELD_TEXT]);
      return;
    }

    /* ⚠️ UNKNOWN IS NOT ZERO, in the panels as much as on the lesson rows.
       A failed matrices read means this page cannot see the classes at all,
       and "nobody to chase" would be an invented reassurance. Said ONCE —
       it used to be printed in both panels and it is one fact. */
    if (!matrices) {
      el('chase-count').textContent = '';
      chaseBox.innerHTML = '<div class="empty">Couldn’t load your classes just now.</div>';
      reteachHost.innerHTML = '';
      summary([stripHead]);
      return;
    }

    const nowIso = new Date().toISOString();

    /* ── WHO OWES THIS WEEK'S WORK ────────────────────────────────────────
       From `weekState`, the SAME derivation the lesson line beside it just
       used, so the panel can never list a student the row above says is in.
       The per-student figures come from `termStats`, which is `buildRoster`'s
       two numbers on the rows this page already holds. */
    const chaseRows = [];
    const chaseSeen = {};
    const remindBy = {};   // classId -> { assignmentId, studentIds }
    /* ⊕ CORRECTION 1 — `panelIds` and `allMx`, not `classIds` and
       `matrices`: every class the teacher holds, today's first. */
    panelIds.forEach(function (cid) {
      const pack = allMx[cid];
      const st = weekState(pack);
      if (st.why !== 'ok' || !st.owing.length) { return; }
      const stats = termStats(pack, nowIso);
      remindBy[cid] = {
        assignmentId: st.paper.id,
        studentIds: st.owing.map(function (m) { return m.student_id; })
      };
      st.owing.forEach(function (m) {
        const s = stats[m.student_id] || { missed: 0, avg: null };
        /* Distinct STUDENTS, not distinct rows — and `panelIds` order is
           what decides which class a twice-taught child is filed under. */
        if (chaseSeen[m.student_id]) { return; }
        chaseSeen[m.student_id] = true;
        chaseRows.push({
          id: m.student_id,
          name: fullName(m.first_name, m.last_name) || 'Student',
          first: m.first_name, last: m.last_name,
          classId: cid,
          code: codeOf[cid] || '',
          missed: s.missed,
          avg: s.avg
        });
      });
    });

    /* Worst first: most marked papers never handed in, then the lowest
       average. A student with NO average sorts last within their tie rather
       than first — no marks is not evidence of weakness, and putting an
       unmarked child at the top of a chase list would be a claim the data
       does not support. */
    chaseRows.sort(function (a, b) {
      if (a.missed !== b.missed) { return b.missed - a.missed; }
      const av = a.avg == null ? 101 : a.avg;
      const bv = b.avg == null ? 101 : b.avg;
      if (av !== bv) { return av - bv; }
      return a.name.localeCompare(b.name);
    });

    /* Design shows six. */
    const CHASE_SHOWN = 6;
    el('chase-count').textContent = String(chaseRows.length);

    function chaseRowHtml(r, withCode) {
      return '<div class="panel-row" data-chase-student="' + esc(r.id) + '"' +
             ' data-chase-class="' + esc(r.classId) + '">' +
             '<div class="avatar" style="background:' + esc(hueFor(r.name)) + '" aria-hidden="true">' +
             esc(initialsOf(r.first, r.last)) + '</div>' +
             '<div class="panel-body">' +
             '<div class="panel-head"><span class="panel-name">' + esc(r.name) + '</span>' +
             (withCode ? '<span class="panel-code">' + esc(r.code) + '</span>' : '') +
             '</div>' +
             '<div class="panel-reason">' + esc(reasonFor(r.missed, r.avg)) + '</div>' +
             '</div></div>';
    }

    /* ⊕ MIDE'S RULING 5 — "+N MORE ACROSS TODAY'S CLASSES" IS A DOOR, NOT A
       NUMBER. It used to be a caption: the page told a teacher that fifty-one
       other children owed them work and then gave them no way to see who.

       Pressing it redraws this panel IN PLACE as the full list, grouped by
       class, with the same row anatomy — and grouping is what lets the rows
       drop their own class code, because the heading above them has just
       said it. "Show fewer" puts it back. Nothing is fetched either way:
       `chaseRows` is already the whole list, and always was.

       ⚠️ `remindState` LIVES OUTSIDE `paintChase`. Expanding the panel
       rebuilds the footer, and a "Reminded 12 students" that reverted to
       "Send reminders" on the next press would invite a teacher to send
       again — harmless at the database (the write is an upsert against the
       per-day rate limit) and misleading on the screen, which is the part
       that matters. */
    const remindState = { label: 'Send reminders', disabled: false };
    let expanded = false;

    function paintChase() {
      if (!chaseRows.length) {
        chaseBox.innerHTML = '<div class="empty">Nobody owes this week’s work.</div>';
        return;
      }
      let html;
      if (!expanded) {
        html = chaseRows.slice(0, CHASE_SHOWN).map(function (r) {
          return chaseRowHtml(r, true);
        }).join('');
      } else {
        // Grouped, in the order the classes appear on the day.
        const groups = [];
        panelIds.forEach(function (cid) {
          const mine = chaseRows.filter(function (r) { return r.classId === cid; });
          if (mine.length) { groups.push({ code: codeOf[cid] || '', rows: mine }); }
        });
        html = '<div class="chase-list">' + groups.map(function (g) {
          return '<div class="chase-group">' + esc(g.code) + '</div>' +
                 g.rows.map(function (r) { return chaseRowHtml(r, false); }).join('');
        }).join('') + '</div>';
      }

      const more = chaseRows.length - CHASE_SHOWN;
      let foot = '';
      if (expanded) {
        foot = '<button type="button" class="chase-more" id="chase-more">Show fewer</button>';
      } else if (more > 0) {
        /* ⊕ CORRECTION 1 — DESIGN'S EXACT WORDS, "+51 more across your
           classes", because the panel has now actually read your classes.
           ⚠️ AND THE NARROWER SENTENCE SURVIVES, for the one case in which it
           is the true one: where the wider read failed, this panel really has
           only looked at the day, and captioning that "across your classes"
           would be the page claiming a read it did not manage to make. */
        foot = '<button type="button" class="chase-more" id="chase-more">+' + more +
               (WIDE_OK ? ' more across your classes' : ' more across today’s classes') +
               '</button>';
      }
      /* ⊕ COORDINATOR CORRECTION 2 — `.panel-link`, NOT `.btn`. Design draws
         "Send reminders" as an underline link in her accent, the same
         treatment "Edit timetable" gets beside the h2; it shipped as a
         bordered outline button. Its "Reminded N students" state keeps the
         same treatment — it is the same control, having done its job. */
      html += '<div class="panel-foot">' + foot +
        '<button type="button" class="panel-link" id="remind-all"' +
        (remindState.disabled ? ' disabled' : '') + '>' +
        esc(remindState.label) + '</button></div>';
      chaseBox.innerHTML = html;

      const moreBtn = el('chase-more');
      if (moreBtn) {
        moreBtn.addEventListener('click', function () { expanded = !expanded; paintChase(); });
      }

      /* ⚑ A REAL SEND, or it would not be here. `sendReminders` is the same
         write the class screen's "Remind all" uses — an in-platform
         `student_notifications` row, nothing leaves the site — and it is an
         UPSERT against the (student, assignment, sent_on) rate limit, so a
         second press adds nothing and errors nothing.

         One call per class is unavoidable and is NOT the N+1 this codebase
         argues against: each class owes a DIFFERENT assignment, so there is
         no one row-set to batch, and they go in parallel over the day's few
         classes rather than in a loop of awaits. What is reported is what was
         WRITTEN, not what was attempted — a child a colleague already nudged
         today is skipped by the index, and saying otherwise would overstate
         what the students actually got. */
      const remindBtn = el('remind-all');
      if (remindBtn) {
        remindBtn.addEventListener('click', async function () {
          const teacherId = ctx && ctx.user ? ctx.user.id : null;
          if (!teacherId) { return; }
          remindState.disabled = true;
          remindState.label = 'Sending…';
          remindBtn.disabled = true;
          remindBtn.textContent = remindState.label;
          try {
            const written = await Promise.all(Object.keys(remindBy).map(function (cid) {
              const r = remindBy[cid];
              return TD.sendReminders({
                classId: cid, assignmentId: r.assignmentId,
                studentIds: r.studentIds, teacherId: teacherId
              });
            }));
            const n = written.reduce(function (a, rows) { return a + (rows ? rows.length : 0); }, 0);
            remindState.label = n === 0
              ? 'Already reminded today'
              : (n === 1 ? 'Reminded 1 student' : 'Reminded ' + n + ' students');
          } catch (e) {
            console.warn('[today] sendReminders failed', e);
            remindState.label = 'Send reminders';
            remindState.disabled = false;
          }
          remindBtn.disabled = remindState.disabled;
          remindBtn.textContent = remindState.label;
        });
      }
    }
    paintChase();

    /* A chase row opens that child's page, which is Design's `c.open`. */
    chaseBox.addEventListener('click', function (ev) {
      const row = ev.target && ev.target.closest ? ev.target.closest('[data-chase-student]') : null;
      if (!row) { return; }
      const c = window.MrBadmusConfig;
      const env = c && c.environment === 'test' ? '&env=test' : '';
      window.location.href = '/teacher/student-detail.html?student=' +
        encodeURIComponent(row.getAttribute('data-chase-student')) +
        '&class=' + encodeURIComponent(row.getAttribute('data-chase-class')) + env;
    });

    summary([stripHead,
             num(chaseRows.length, 'student to chase', 'students to chase'),
             stripSkel]);

    /* ── WORTH A RETEACH ──────────────────────────────────────────────────
       ⚑ ONE BATCHED ROUND TRIP, not one per class. `loadPaperQuestions` takes
       an ARRAY and chunks it internally — the same batching
       `teacher-live.js`'s `grids(pairs)` exists to get, for the same reason
       (the insights chart wanted a dozen papers and would otherwise have made
       a dozen calls). Here it is at most one per lesson on the day. */
    const wanted = [];
    /* ⊕ CORRECTION 1 — EVERY CLASS, which is Design's own rule here: her
       `reteachRows` maps `liveClasses`, not the day's lessons. Checked in her
       source rather than assumed, because the two panels could honestly have
       had different scopes and this one had the better excuse for being
       narrow. It does not need it: `loadPaperQuestions` takes an ARRAY and
       chunks internally, so a dozen classes' newest marked papers is a couple
       of round trips, and this fires AFTER the chase panel has painted. */
    panelIds.forEach(function (cid) {
      const paper = newestMarkedPaper(allMx[cid], nowIso);
      if (paper) { wanted.push({ cid: cid, paper: paper }); }
    });

    let qpacks = null;
    if (wanted.length) {
      try {
        qpacks = await TD.loadPaperQuestions(wanted.map(function (w) { return w.paper.id; }));
      } catch (e) {
        /* console.WARN, not error: a class whose marked paper cannot be read
           costs this page one panel, and is not a fault of the screen the
           teacher is standing in front of. */
        console.warn('[today] paper questions unavailable', e);
      }
    }

    const reteachRows = [];
    if (qpacks) {
      wanted.forEach(function (w) {
        const weak = weakestQuestion(allMx[w.cid], qpacks[w.paper.id]);
        /* ⊕ MRB-326 JOB 3 — DESIGN'S OWN THRESHOLD, `w.min < 55`, ADOPTED.
           Without it the panel headed "worth a reteach" listed each class's
           weakest question however well the class did it, and a question
           answered correctly by 92% of a set is not worth a reteach. The
           threshold is also what makes the panel's absence meaningful, which
           is Design's `hasReteach`. */
        if (!weak || weak.pct >= 55) { return; }
        reteachRows.push({
          code: codeOf[w.cid] || '',
          id: weak.id,
          text: weak.text,
          pct: weak.pct
        });
      });
    }
    reteachRows.sort(function (a, b) { return a.pct - b.pct; });
    /* Design shows three, and does NOT offer a "+N more": there are at most
       one per lesson on the day, and the three lowest across four classes is
       the whole point of the panel rather than a truncation of it. */
    const shownReteach = reteachRows.slice(0, 3);

    /* ⊕ RULING 6 / Design's `hasReteach` — THE PANEL IS NOT RENDERED WHEN
       THERE IS NOTHING TO RETEACH. It used to print "Nothing marked yet." in
       a headed card, which is a card whose heading and whose body disagree.
       A class with nothing marked has nothing to say here, so nothing is
       said. The summary sentence still carries the count, including zero. */
    if (shownReteach.length) {
      reteachHost.innerHTML =
        '<div class="card">' +
        '<div class="card-head"><h2>Worth a reteach</h2></div>' +
        shownReteach.map(function (r) {
          // Design's own colour rule for this number, carried from the class
          // screen: rust below half, muted above it. Not `--danger` — a hard
          // question is not an error state.
          const fg = r.pct < 50 ? 'var(--st-accent-text)' : 'var(--st-muted)';
          const line = r.id + (r.text ? ' · ' + r.text : '');
          return '<div class="panel-row">' +
                 '<div class="reteach-code">' + esc(r.code) + '</div>' +
                 '<div class="reteach-q">' + esc(line) + '</div>' +
                 '<div class="reteach-pct" style="color:' + fg + '">' + r.pct + '%</div>' +
                 '</div>';
        }).join('') +
        '<div class="panel-caption">Lowest-scoring question on each class’s last marked set</div>' +
        '</div>';
    } else {
      reteachHost.innerHTML = '';
    }

    summary([stripHead,
             num(chaseRows.length, 'student to chase', 'students to chase'),
             num(shownReteach.length, 'topic worth a reteach', 'topics worth a reteach')]);
  }
});

/* The doneness test, written ONCE.

   ⚠️ It is the UNION — completed_at, submitted_at, or status === 'complete' —
   the same one `teacher-live.js`'s cellOf() uses, so this page cannot
   disagree with the class screens ("one number, one source"), and it can
   never count a student as owing work when their own page reads Complete.
   The literal is 'complete', NOT 'completed'. */
function isDone(s) {
  if (!s) { return false; }
  return !!(s.completed_at || s.submitted_at) || s.status === 'complete';
}

/* ⊕ MRB-325 ruling 1 — THIS WEEK'S PAPER AND WHO OWES IT, in one place.
   `describeClass` used to compute this inline and was its only reader; the
   chase panel needs the very same set of students, and deriving it a second
   time is how the sentence on a lesson row and the names in the panel beside
   it come to disagree. The sentences below are UNCHANGED, byte for byte —
   only where their numbers come from moved. */
function weekState(pack) {
  if (!pack) { return { why: 'unknown', members: [] }; }
  const assignments = pack.assignments || [];
  const members = pack.members || [];
  if (!assignments.length) { return { why: 'no-work', members: members }; }
  if (!members.length) { return { why: 'no-students', members: members }; }

  // This week's work: the newest by due date, nulls first — the same order
  // buildPapers uses, where index 0 is the week the class opens parked on.
  const papers = assignments.slice().sort(function (a, b) {
    if (a.due_at == null && b.due_at == null) { return 0; }
    if (a.due_at == null) { return -1; }
    if (b.due_at == null) { return 1; }
    return a.due_at < b.due_at ? 1 : -1;
  });
  const paper = papers[0];
  if (!paper) { return { why: 'unknown', members: members }; }

  const doneBy = {};
  (pack.submissions || []).forEach(function (s) {
    if (s.assignment_id !== paper.id) { return; }
    if (isDone(s)) { doneBy[s.student_id] = true; }
  });

  const owing = members.filter(function (m) { return !doneBy[m.student_id]; });
  return {
    why: 'ok',
    paper: paper,
    members: members,
    total: members.length,
    inCount: members.length - owing.length,
    owing: owing
  };
}

/* What to say about one class, from its own submission rows.

   ⊕ MRB-326 JOB 3 · RULING 7 — THE NUMERIC FORM, AND DESIGN'S NAMES.

   · CHASE. Design's own string, adopted whole: "11 of 29 in — chase Hana P,
     Idris B +16 more". It replaces "11 of 29 in · 18 still to hand in", which
     said the same arithmetic twice — 29 minus 11 IS 18 — and named nobody.
     Two names is Design's `slice(0, 2)`.
   · ALL IN. "29/29 in", replacing "All 29 homeworks in — nothing to chase".
     "Nothing to chase" is the absence of the chase clause and does not need
     saying, and the summary sentence above already counts the whole day's
     chase list.
   · The empty-roster and no-work states keep their ONE honest sentence each.

   ⚠️ NO STATUS LINE DUPLICATES THE SUMMARY. The summary counts PEOPLE across
   the day; these count HANDINS for one class. */
function describeClass(pack) {
  const st = weekState(pack);
  if (st.why === 'unknown') { return { text: '', tone: 'clear' }; }
  if (st.why === 'no-work') {
    /* No work set. Say so; do NOT offer to set it — nothing on a teacher
       surface can compose an assignment. */
    return { text: 'No work set this week.', tone: 'clear' };
  }
  if (st.why === 'no-students') {
    return { text: 'No students on this class yet.', tone: 'clear' };
  }

  const owing = st.owing;
  if (!owing.length) {
    /* Design's `readyFg` for this state is her KS3 "ok" green, not muted —
       a class that is all in is good news, and it reads as good news. */
    return { text: st.total + '/' + st.total + ' in', tone: 'done' };
  }
  const named = owing.slice(0, 2).map(function (m) {
    return shortName(fullName(m.first_name, m.last_name) || 'Student');
  }).join(', ');
  return {
    text: st.inCount + ' of ' + st.total + ' in — chase ' + named +
          (owing.length > 2 ? ' +' + (owing.length - 2) + ' more' : ''),
    tone: 'chase'
  };
}

/* Why this child is on the chase list — Design's `reasonFor`, branch for
   branch.

   ⚠️ THE AVERAGE IS ONLY SHOWN WHEN IT IS PART OF THE REASON. This page used
   to append "· avg 78%" to every row, which is not a reason to chase anybody
   and pushed the number that IS one off the end of a narrow panel. Design's
   rule: the average appears only under 50%, and where there is neither a
   miss nor a low average the honest line is that this week's work is not in
   — which is why the row is there at all. */
function reasonFor(missed, avg) {
  if (missed && avg != null && avg < 50) { return missed + ' missed this term · avg ' + avg + '%'; }
  if (missed) { return missed + ' missed this term'; }
  if (avg != null && avg < 50) { return 'Averaging ' + avg + '%'; }
  return 'Nothing in this week';
}

/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
   \u2295 MRB-325 ruling 1 \u2014 THE TWO PANELS
   \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550

   \u2691 WHY THESE DERIVATIONS ARE RE-DERIVED HERE RATHER THAN IMPORTED.
   `shared/teacher-live.js` owns `buildRoster` (the "Keep an eye on" numbers)
   and `weakFor` (the class screen's "Reteach from the last set"), which are
   the two this page has to agree with. Neither can be called: teacher-live.js
   is a self-running IIFE that EXPORTS NOTHING \u2014 it ends in `run().catch(\u2026)`,
   its whole surface is closure-private, and it mounts itself against the
   generated pages' `__MRB_TPL__`, which this hand-written page does not have.
   Loading it here would start a second dashboard inside Today.

   So the numbers are re-derived from the SAME raw fields \u2014 `pack.members`,
   `pack.assignments`, `pack.submissions`, all already in hand for the lesson
   lines \u2014 using the same tests, and each one below is named against the
   function it has to match. This unit introduces NO new definition of
   "missed", "average" or "weakest"; if one of these ever drifts from its
   counterpart that is a defect, not a difference of opinion.               */

/* A class's CLOSED papers. `buildPapers` sets `when: open ? "upcoming" :
   "marked"` from `open = !a.due_at || a.due_at > now`, so a "marked" paper is
   exactly one whose deadline has passed. An assignment with no deadline never
   closes and is never counted here. */
function markedPapers(pack, nowIso) {
  return ((pack && pack.assignments) || []).filter(function (a) {
    return a.due_at && a.due_at <= nowIso;
  });
}

/* Per-student "missed this term" and "avg X%", matching `buildRoster`.

   \u00B7 MISSED \u2014 `buildRoster` computes `missingMarked`, a BOOLEAN over
     `mx.markedIdx`: "is there a marked paper this student never submitted".
     Design's row wants the COUNT of them: the same predicate over the same
     papers, counted rather than collapsed. Nothing else changes.

   \u00B7 AVG \u2014 `buildMatrix`'s `studentAvg`: sum(score) / sum(max) over the marked
     papers, per student, rounded. `null` \u2014 NEVER 0 \u2014 when nothing of theirs
     is graded, because 0% is a claim about how a child did and "nothing
     marked" is not that claim. Only a cell `cellOf` would have kept counts:
     handed in, with both a score and a max, and max > 0.

   \u26A0\uFE0F "THIS TERM" IS DESIGN'S WORD AND IT IS APPROXIMATE. The population is
   the class's own closed assignments \u2014 a class belongs to one academic year
   so it cannot reach across years \u2014 but `academic_years` records a start and
   an end and NOTHING about half terms, which is the same limitation
   `teacher-live.js`'s week bar already carries in writing. Not re-litigated
   here; recorded so the next reader knows what the words cover. */
function termStats(pack, nowIso) {
  const marked = markedPapers(pack, nowIso);
  const byStudent = {};
  ((pack && pack.submissions) || []).forEach(function (s) {
    if (!byStudent[s.student_id]) { byStudent[s.student_id] = {}; }
    byStudent[s.student_id][s.assignment_id] = s;
  });
  const out = {};
  ((pack && pack.members) || []).forEach(function (m) {
    const mine = byStudent[m.student_id] || {};
    let missed = 0, tot = 0, totMax = 0;
    marked.forEach(function (a) {
      const s = mine[a.id];
      if (!isDone(s)) { missed += 1; return; }
      if (s.score != null && s.max_score != null && s.max_score > 0) {
        tot += s.score; totMax += s.max_score;
      }
    });
    out[m.student_id] = {
      missed: missed,
      avg: totMax > 0 ? Math.round((tot / totMax) * 100) : null
    };
  });
  return out;
}

/* The newest MARKED paper \u2014 `newestMarkedIdx` over `buildPapers`' own
   newest-first order, which is due_at DESC. null for a class whose papers are
   all still open, which is the honest answer: a set nobody has been marked on
   cannot say what to reteach. */
function newestMarkedPaper(pack, nowIso) {
  const closed = markedPapers(pack, nowIso).slice().sort(function (a, b) {
    if (a.due_at !== b.due_at) { return a.due_at < b.due_at ? 1 : -1; }
    return (a.title || '').localeCompare(b.title || '');
  });
  return closed[0] || null;
}

/* The weakest question on one paper \u2014 `weakFor` as RULED in
   `teacher_rulings.py`, over `buildGrid`'s `qpct`. Three properties are
   carried across deliberately, because all three are what that ruling FIXED
   and dropping any one puts a wrong sentence in front of a teacher:

     \u00B7 THE DENOMINATOR IS THE ANSWERS THAT WERE MACHINE-MARKED, not everyone
       who handed the paper in. `is_correct` is nullable and NULL IS NOT
       FALSE \u2014 a self-marked or written answer records no correctness claim \u2014
       so a null counts towards neither half of the fraction.
     \u00B7 THE MINIMUM IS OVER NON-NULL ENTRIES ONLY. `Math.min` across an array
       holding nulls returns 0, which would name a question as the weakest in
       the school at 0% on no marks at all.
     \u00B7 A PAPER WITH NOTHING MARKED YIELDS NOTHING \u2014 null, rather than a bare
       em-dash under a "worth a reteach" heading.

   Ties go to the lowest question index, as `weakFor`'s strict `<` does. */
function weakestQuestion(pack, qpack) {
  if (!qpack) { return null; }
  const onRoll = {};
  ((pack && pack.members) || []).forEach(function (m) { onRoll[m.student_id] = true; });

  // `buildGrid` walks the ROSTER, so a departed student's answers are not in
  // the column. Same population here.
  const counted = {};
  (qpack.submissions || []).forEach(function (s) {
    if (onRoll[s.student_id] && isDone(s)) { counted[s.id] = true; }
  });

  const correct = {}, marked = {}, stem = {};
  (qpack.attempts || []).forEach(function (a) {
    if (!counted[a.submission_id]) { return; }
    const i = a.question_index;
    if (i == null) { return; }
    if (!stem[i] && a.question_text) { stem[i] = String(a.question_text); }
    if (a.is_correct === true) {
      correct[i] = (correct[i] || 0) + 1; marked[i] = (marked[i] || 0) + 1;
    } else if (a.is_correct === false) {
      marked[i] = (marked[i] || 0) + 1;
    }
  });

  let best = null;
  Object.keys(marked).map(Number).sort(function (a, b) { return a - b; })
    .forEach(function (i) {
      if (!marked[i]) { return; }
      const pct = Math.round(((correct[i] || 0) / marked[i]) * 100);
      if (best === null || pct < best.pct) {
        best = { idx: i, pct: pct, id: 'Q' + (i + 1), text: stem[i] || '' };
      }
    });
  return best;
}

/* Initials and the hue behind them \u2014 `initialsOf` and `hueFor` from
   `teacher-live.js`, palette included, so one child is not a different colour
   on Today than on their own class page. */
const AVATAR_HUE = ['#2F5CE0', '#A93411', '#0A6B36', '#5A31C0', '#7A5F00', '#2545A8'];
function initialsOf(first, last) {
  const f = (first || '').trim(), l = (last || '').trim();
  if (f && l) { return (f[0] + l[0]).toUpperCase(); }
  if (f) { return f.slice(0, 2).toUpperCase(); }
  if (l) { return l.slice(0, 2).toUpperCase(); }
  return '';
}
function hueFor(name) {
  let h = 2166136261;
  const s = String(name || '');
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
  return AVATAR_HUE[(h >>> 0) % AVATAR_HUE.length];
}
function fullName(first, last) {
  return ((first || '') + ' ' + (last || '')).trim();
}

/* The school's calendar day, as the DATABASE stamps one \u2014 the same
   `Europe/London` reading `teacher-live.js`'s `todayInSchoolTz` uses for the
   reminder rate limit. `assignments_open_from` is a `date`, and whether it is
   "strictly in the future" has to be decided against the SCHOOL's day: a
   teacher marking at home on a device in another timezone must see the same
   hold their colleague sees in the building. */
function schoolDateISO() {
  try {
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(new Date());
  } catch (e) {
    return new Date().toISOString().slice(0, 10);
  }
}
