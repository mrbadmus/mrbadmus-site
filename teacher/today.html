<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#F7F1E5"/>
  <title>Today — Mr Badmus AI</title>
  <link rel="preload" href="/shared/fonts/fraunces-var-latin.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="/shared/fonts/plus-jakarta-sans-var-latin.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="stylesheet" href="/shared/tokens.css?v=bbfbe9e0"/>
  <!-- ⊕ MRB-306 Phase 2a — v3's design system, the same sheet the six
       GENERATED teacher screens load. It carries the --st-* tokens this
       page's chrome is drawn from. It also re-ships an older copy of
       tokens.css; every value in that copy is IDENTICAL to the live file
       (measured — it is a strict subset), so the order of these two links
       changes nothing, and its later @font-face block points at the same
       /shared/fonts/ URLs. -->
  <link rel="stylesheet" href="/shared/teacher-ds.css?v=fba5f719"/>
  <style>
    html { background: var(--st-ground); }
    :root {
      --darker: var(--st-ground);
      --dark:   var(--st-num-well);
      --card2:  var(--st-num-well);
      --shadow: none;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--st-ground);
      color: var(--st-ink);
      font: 400 18px/1.5 var(--st-ui);
      min-height: 100vh;
      /* ⊕ MRB-306 — the bar is STICKY now, not fixed, exactly as v3 draws it,
         so it takes its own space in the flow and the old 80px top pad that
         cleared a fixed bar would be 80px of empty cream. */
      padding: 0 0 60px;
      /* Hidden until the guard's onAllowed fires AND the admin-scope check
         answers. Fail-closed: if the guard bounces, the scope check refuses,
         or JS fails outright, the page never reveals school-wide staff data.
         The refusal state reveals the body too — see `notice()` — so a
         legitimate teacher who lands here gets a sentence, never a page that
         stays blank and looks broken. */
      display: none;
    }

    /* ── v3's top bar ────────────────────────────────────────────────────
       Values are Design's own, read out of the RENDERED topbar of
       teacher/classes-fixture.html rather than retyped from the template
       source. See the markup comment in <nav> for what is deliberately NOT
       carried across. */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 62px;
      padding: 0 22px;
      background: var(--st-paper);
      border-bottom: 1px solid var(--st-rule);
    }
    .tb-brand {
      flex: none;
      font: 600 23px/1 var(--st-display);
      letter-spacing: -0.025em;
      color: var(--st-ink);
      text-decoration: none;
      white-space: nowrap;
    }
    /* teacher-ds.css styles bare `a:hover` rust; the brand and the tabs are
       chrome and do not change colour on hover in Design's bar. */
    .tb-brand:hover { color: var(--st-ink); text-decoration: none; }
    .tb-seg {
      display: flex;
      gap: 3px;
      padding: 3px;
      flex: none;
      margin-right: auto;
      background: var(--st-seg-bg);
      border-radius: 10px;
    }
    .tb-tab {
      padding: 7px 15px;
      border-radius: 8px;
      font: 600 15.5px/1.2 var(--st-ui);
      color: var(--st-caption);
      background: transparent;
      text-decoration: none;
      white-space: nowrap;
    }
    .tb-tab:hover { color: var(--st-ink); text-decoration: none; }
    .tb-tab.is-on { background: var(--st-paper); color: var(--st-ink); }

    /* The environment badge. ⚠️ NOTHING ON THIS PAGE EVER REVEALS IT — no
       script here touches `#env-pill` (admin.html and import.html each have
       their own that does). Kept as it was found, hidden, and restyled so it
       is v3-shaped the day something wires it. */
    .pill {
      flex: none;
      padding: 5px 8px;
      border-radius: 6px;
      font: 500 12px/1.2 var(--st-mono);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--st-caption);
      background: var(--st-num-well);
    }
    .pill.env-test { color: var(--st-accent-text); }
    .pill.env-prod { color: var(--st-caption); }
    .signout {
      flex: none;
      height: 32px;
      padding: 0 12px;
      font: 600 15.5px/1.2 var(--st-ui);
      color: var(--st-muted);
      background: transparent;
      border: 1px solid var(--st-btn-border);
      border-radius: 9px;
      cursor: pointer;
    }
    .signout:hover { color: var(--st-ink); border-color: var(--st-edge); }
    /* The class Design's bar carries. It is defined in the six generated
       pages' own inline <style> and in NEITHER stylesheet, so without
       this line `noprint` on the <nav> above would do nothing at all. */
    @media print { .noprint { display: none !important; } }

    .container { max-width: 1460px; margin: 0 auto; padding: 24px 40px 40px; }
    /* ⊕ MRB-326 JOB 3 — no bottom margin: Design's gap under the h1 is the
       summary sentence's own `margin-top: 8px`, and carrying both stacked
       them to sixteen. */
    .page-header { margin-top: 8px; }
    .page-header h1 {
      font: 600 52px/1 var(--st-display);
      letter-spacing: -0.035em;
      color: var(--st-ink);
      overflow-wrap: break-word;
    }
    /* ⊕ MRB-326 JOB 3 — `.page-sub` DELETED with the sentence it styled.
       Design's line under the greeting is `.summary`, defined below. */

    .card {
      background: var(--st-paper);
      border: 1px solid var(--st-rule-soft);
      border-radius: var(--st-r-card);
      padding: 16px 18px;
      margin-bottom: 16px;
    }
    .card h2 {
      font: 500 13px/1.2 var(--st-mono);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--st-caption);
      margin-bottom: 14px;
    }

    /* ⊕ MRB-326 · JOB 3 — SEVENTY LINES OF DEAD CSS DELETED HERE.
       `.stats`, `.stat`, `.row` (+ `.name` / `.meta` / `.right`),
       `.year-heading`, `.year-group`, `.tag`, `.classlist`, `.count`,
       `.muted` and `a.classlink` were inherited from admin.html when this
       page was first written "so the two hand-written staff pages cannot
       drift apart". They diverged on purpose in Phase 2a, and NOT ONE of
       those selectors has ever matched a node on Today — measured, by
       collecting every class token this file emits. Mide's redundancy
       ruling for this run covers the stylesheet as much as the copy.
       `.empty` is the one keeper: it is used seven times. */
    .empty { color: var(--st-muted); font: 400 16px/1.5 var(--st-ui); }
    /* The refusal, and the honest-failure state. Plain words, no codes. */
    .notice { max-width: 620px; margin: 40px auto; text-align: center; }
    .notice h1 {
      font: 600 34px/1.1 var(--st-display);
      letter-spacing: -0.03em;
      color: var(--st-ink);
      margin-bottom: 10px;
    }
    .notice p { color: var(--st-muted); font: 400 18px/1.6 var(--st-ui); }
    .notice a { color: var(--st-accent-text); font-weight: 600; }

    /* ── ⊕ MRB-306 WS-2 — Today ──────────────────────────────────────────
       Today's own additions. Everything above is admin.html's, copied so the
       two hand-written staff pages cannot drift apart.
       ⊕ 2 Sep 2026 (MRB-306 Phase 2a) — that copy is now DIVERGED, and
       deliberately: this page and timetable.html took v3's chrome and type;
       admin.html and import.html did not, and are outside this unit.
       ⊕ MRB-326 JOB 3, 6 Sep 2026 — and the page's own body is now DESIGN'S,
       section for section. See docs/mrb326/today-reconciliation.md. */

    /* Design's eyebrow date line — 13px mono, uppercase, .18em. */
    .eyebrow {
      font: 500 13px/1.2 var(--st-mono);
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--st-caption);
    }
    /* Design's summary sentence, directly under the greeting. It is the ONLY
       place the lesson count, the chase count, the reteach count and the
       hold sentence are said — see the redundancy ruling in the reconciliation. */
    .summary { margin-top: 8px; font: 400 18px/1.5 var(--st-ui); color: var(--st-muted); }
    .summary .sep { padding: 0 6px; opacity: 0.6; }
    .summary .n { font-family: var(--st-mono); font-variant-numeric: tabular-nums;
                  color: var(--st-ink); font-weight: 500; }

    /* Design's head row: greeting block left, action buttons right, wrapping
       under it when there is no room. */
    .head {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 24px; flex-wrap: wrap; margin-bottom: 24px;
    }
    .head-actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }

    /* Design's h2 row: "Today's lessons" left, "Edit timetable" right.
       ⛔ NO `lessonCount` BESIDE IT. Design draws "4 LESSONS" here and the
       summary sentence above already says "4 lessons today". Mide's ruling:
       once. The summary keeps it. */
    .lessons-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; margin-bottom: 12px;
    }
    .lessons-head h2 {
      margin: 0; font: 600 29px/1 var(--st-display);
      letter-spacing: -0.03em; color: var(--st-ink);
    }
    /* Design's underline link, not a button-shaped control. */
    .editlink {
      flex: none; font: 600 15px/1.2 var(--st-ui); color: var(--st-accent-text);
      background: none; border: none; padding: 0; cursor: pointer;
      text-decoration: underline; text-underline-offset: 3px;
    }
    .editlink:hover { color: var(--st-accent-hover); }

    /* ── DESIGN'S LESSON ROW ──────────────────────────────────────────────
       ⊕ MRB-326 JOB 3 — the row is now Design's 92px / 1fr / min-content
       grid: the period and its clock time stacked in the first column, the
       class code and its status line in the second, a chevron in the third.

       ⛔ THERE IS NO META LINE, AND ITS ABSENCE IS MIDE'S RULING 1.
       Design draws "LAB 2 · 29 STUDENTS · SCIENCE" beside the code. Every
       part of it is already elsewhere or is not ours to say: the SUBJECT is
       read off the class code two millimetres to its left (MRB-263 makes
       `/Sc` `/Ph` `/Ch` `/Bi` the subject), the STUDENT COUNT is the
       denominator of the status line directly under it, and there is no
       room in this schema at all. A row is period, time, code, status.

       ⚠️ `.lesson` IS NOT THE LINK (MRB-323). `.lesson-go` is the anchor and
       `.lesson-pick` is the name picker; a `<button>` cannot live inside an
       `<a>`. */
    .lesson {
      display: flex; align-items: center; gap: 12px;
      padding: 17px 0; border-top: 1px solid var(--st-rule-fact);
    }
    .lesson:first-child { border-top: none; }
    .lesson-go {
      display: grid; grid-template-columns: 92px minmax(0, 1fr) min-content;
      align-items: center; gap: 16px;
      flex: 1; min-width: 0; text-decoration: none; color: inherit;
    }
    /* Scoped to the anchor, not the row: hovering the picker button must not
       tint the class code as though the link were under the cursor. */
    .lesson-go:hover .lesson-code { color: var(--st-accent-text); }
    .lesson-pick {
      flex: none; width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      background: var(--st-paper); border: 1px solid var(--st-btn-border);
      border-radius: 9px; cursor: pointer; color: var(--st-muted);
    }
    .lesson-pick:hover { border-color: var(--st-edge); color: var(--st-ink); }
    .lesson-pick[hidden] { display: none; }
    /* ⚠️ NO `text-transform` ON ANY OF THESE. `today_drive` reads
       `innerText`, which in Chrome reflects the RENDERED case, and asserts
       "P1", "8r/Sc1" and "1 of 3 in" case-sensitively. A restyle must not
       change what the page says. */
    .lesson-p {
      font: 600 21px/1 var(--st-display); letter-spacing: -0.02em;
      color: var(--st-ink);
    }
    .lesson-time { margin-top: 7px; font: 500 13.5px/1 var(--st-mono); color: var(--st-caption); }
    .lesson-code {
      font: 600 25px/1 var(--st-display); letter-spacing: -0.02em;
      color: var(--st-ink); overflow-wrap: break-word;
    }
    .lesson-state { margin-top: 8px; font: 500 16.5px/1.4 var(--st-ui); }
    /* Design's own `readyFg`: rust when there is somebody to chase, her
       KS3 "ok" green when a class is all in, muted otherwise. Not `--danger`:
       owing homework is not an error state. */
    .lesson-state.chase { color: var(--st-accent-text); }
    .lesson-state.done  { color: var(--ks3-ok-text); }
    .lesson-state.clear { color: var(--st-muted); }
    .lesson-state:empty { display: none; }
    .lesson-chev { color: var(--st-rule-strong); display: flex; }
    /* Skeletons: the class page's pattern — never a bare heading on empty
       ground while the reads are in flight. */
    .skel { background: var(--st-num-well); border-radius: 6px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
    .skel-row { display: flex; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--st-rule-fact); }
    .skel-row:last-child { border-bottom: none; }

    .prompt { padding: 4px 0 2px; }
    .prompt p { color: var(--st-muted); font: 400 17px/1.6 var(--st-ui); margin-bottom: 14px; max-width: 60ch; }
    /* v3's outline button. ⚠️ NO `height` — `Edit timetable` is sized by an
       inline `padding`/`font-size`/`min-height:0` from this page's own JS,
       which a fixed height would defeat. The JS is untouched by this unit. */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 11px 16px; min-height: 40px;
      border: 1px solid var(--st-btn-border); border-radius: var(--st-r-btn);
      background: var(--st-paper); color: var(--st-ink);
      font: 600 17px/1.2 var(--st-ui);
      cursor: pointer; text-decoration: none; white-space: nowrap;
    }
    .btn:hover { border-color: var(--st-edge); color: var(--st-ink); text-decoration: none; }
    .btn:disabled { opacity: 0.55; cursor: default; color: var(--st-muted); }
    .remind-row {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--st-rule-fact);
    }
    .remind-row .who { flex: 1; min-width: 200px; color: var(--st-muted); font: 400 16px/1.4 var(--st-ui); }

    /* ── ⊕ MRB-325 ruling 1 — the stat strip, the action row and the two
       side panels ─────────────────────────────────────────────────────────

       ⚑ LAYOUT CALL: MOBILE-FIRST SINGLE COLUMN, WIDENING TO TWO.
       The default is one stacked column — strip, lessons, students to chase,
       worth a reteach — and the second column is bought back at 1000px with
       ONE `grid-template-columns` line. Design's screenshot is the wide
       state and this reaches it; the narrow state is the same content in
       reading order rather than a second layout to maintain.
       ⚠️ Written this way round on purpose. `today_drive`'s "390px: no
       horizontal overflow" is a PUSH GATE on this page, and a desktop-first
       rule would make 390px the exception that has to be remembered. Here
       390px is what the file says with no media query at all: nothing below
       has a fixed width, and `minmax(0, …)` is on both tracks so a long
       stem in a reteach row cannot push the grid wider than its container. */
    .today-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    /* ⊕ MRB-326 JOB 3 — DESIGN'S OWN RATIO, `1.35fr 1fr`. It was a fixed
       348px sidebar, which is a good deal narrower than she draws and made
       the chase panel's footer wrap its caption onto a line of its own — the
       "+N more" control and "Send reminders" belong on one row. `minmax(0, …)`
       stays on both tracks: it is what stops a long question stem in a
       reteach row from pushing the grid wider than its container. */
    @media (min-width: 1000px) {
      .today-grid { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
    }
    .today-grid > * { min-width: 0; }
    .today-col { display: flex; flex-direction: column; }
    .today-col > .card:last-child { margin-bottom: 0; }

    /* ⊕ MRB-326 JOB 3 — THE STAT STRIP IS GONE, AND SO IS ITS CSS.
       `.strip` / `.strip-line` / `.strip-actions` held a sentence and two
       buttons in a band of their own BELOW the greeting. Design puts the
       sentence directly under the h1 (`.summary`) and the buttons on the
       greeting's own row (`.head-actions`), which is one band fewer for the
       same two facts. The `.btn` size the strip set is kept, on the actions
       row that replaced it. */
    .head-actions .btn { padding: 8px 14px; min-height: 36px; font-size: 15.5px; }

    /* ── DESIGN'S TWO SIDE PANELS ─────────────────────────────────────────
       Same `.card` shell as the lessons, so nothing new is invented for them.
       ⊕ MRB-326 JOB 3 — the chase row is Design's anatomy now: avatar, then
       the NAME with the class CODE on the same baseline beside it, then the
       reason under both. It used to put the code on a line of its own. */
    .card-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 12px;
    }
    /* Design's panel headings: the chase one is rust, the reteach one muted. */
    .card-head h2 { margin: 0; }
    .card-head h2.hot { color: var(--st-accent-text); }
    .card-count { font: 500 15px/1.2 var(--st-mono); font-variant-numeric: tabular-nums; color: var(--st-ink); }

    .panel-row {
      display: flex; align-items: center; gap: 11px;
      padding: 11px 0; border-top: 1px solid var(--st-rule-fact);
    }
    .panel-row:first-child { border-top: none; }
    .panel-body { flex: 1; min-width: 0; }
    /* ⚠️ NO `text-transform` ON ANY PANEL ROW — the same rule the lesson row
       above carries. `today_drive` reads `innerText`, which reflects the
       RENDERED case, so a restyle here must not change what the page says.
       (`.card h2` already uppercases the HEADINGS, and it did before this
       unit; the assertions are case-folded for exactly those.) */
    .panel-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .panel-name { font: 600 17px/1.2 var(--st-ui); color: var(--st-ink); overflow-wrap: break-word; }
    /* Design's code chip beside the name — 12.5px mono, .08em, ghost. */
    .panel-code {
      flex: none; font: 500 12.5px/1.2 var(--st-mono); letter-spacing: 0.08em;
      color: var(--st-ghost);
    }
    .panel-reason { margin-top: 3px; font: 400 14.5px/1.3 var(--st-ui); color: var(--st-accent-text); }
    /* ⚠️ `margin-left:auto` ON THE BUTTON, NOT `justify-content:space-between`
       ON THE ROW. Design's footer always has a caption on the left, so both
       reach the same picture; but this footer's left-hand control DISAPPEARS
       when there is no overflow to open, and `space-between` would then pull
       "Send reminders" over to the left edge on exactly the classes that are
       nearly all in. */
    .panel-foot {
      padding-top: 12px; margin-top: 2px; border-top: 1px solid var(--st-rule-soft);
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    /* ⊕ CORRECTION 2 — Design's footer control: an underline link in her
       accent, not a bordered button. Her own values, from the `remindAll`
       node of the `isToday` block. `:disabled` only dims it — a control
       mid-send must not change shape under the cursor. */
    .panel-link {
      margin-left: auto; flex: none;
      font: 600 15.5px/1.2 var(--st-ui); color: var(--st-accent-text);
      background: none; border: none; padding: 0; cursor: pointer;
      text-decoration: underline; text-underline-offset: 3px;
    }
    .panel-link:hover { color: var(--st-accent-hover); }
    .panel-link:disabled { opacity: 0.55; cursor: default; }
    /* Design's footer caption typography, on a control rather than a caption.
       ⊕ MIDE'S RULING 5: "+51 more across today's classes" was a DEAD COUNT.
       It is now the opener for the full list, so it is a `<button>` that
       looks like the caption Design drew and behaves like the control the
       ruling asks for. */
    .chase-more {
      flex: 1 1 auto; text-align: left;
      font: 400 13px/1.3 var(--st-mono); letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--st-caption);
      background: none; border: none; padding: 0; cursor: pointer;
      text-decoration: underline; text-underline-offset: 3px;
    }
    .chase-more:hover { color: var(--st-accent-text); }
    /* Design's own reteach footer caption. A caption, not a control — there
       is nothing to open. */
    .panel-caption {
      padding-top: 11px; margin-top: 2px; border-top: 1px solid var(--st-rule-soft);
      font: 400 13px/1.4 var(--st-mono); letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--st-caption);
    }
    /* The expanded chase list's per-class heading. ⊕ RULING 5 + THE
       REDUNDANCY RULE: once a group is headed "8r/Sc1", the rows inside it
       drop their own `.panel-code` — the heading has already said it. */
    .chase-group {
      margin-top: 14px; padding: 14px 0 6px;
      border-top: 1px solid var(--st-rule);
      font: 500 13px/1.2 var(--st-mono); letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--st-caption);
    }
    .chase-list > .chase-group:first-child { margin-top: 0; padding-top: 0; border-top: none; }

    /* Initials, not a photo. `avatar_url` is on the roster rows but a face on
       a chase list is a bigger claim than this panel needs, and the initials
       are the same ones every other teacher screen draws. Design's own size
       for this row is 28px. */
    .avatar {
      flex: none; width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font: 600 12px/1 var(--st-mono); color: #FFFFFF; letter-spacing: 0.02em;
    }
    /* ⚠️ NO MONO AND NO TRACKING HERE, unlike the eyebrow beside it.
       A period label is a category; a class code is a NAME, and MRB-263 makes
       its exact shape meaningful — `8r/Sc1` letter-spaced in a mono face reads
       as "8 r / S c 1" and stops looking like the code the lesson row two
       inches away is showing. Same string, same reading. */
    .reteach-code {
      flex: none; min-width: 62px;
      font: 600 17px/1.2 var(--st-display); letter-spacing: -0.02em;
      color: var(--st-ink);
    }
    .reteach-q {
      flex: 1; min-width: 0; font: 400 15.5px/1.35 var(--st-ui);
      color: var(--st-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .reteach-pct { flex: none; font-family: var(--st-mono); font-variant-numeric: tabular-nums; font-weight: 500; padding-top: 2px; }

    /* ── ⊕ MRB-326 JOB 3 · THE SEARCH OVERLAY ─────────────────────────────
       Design's top bar carries "Find a student" on all six generated pages,
       and Mide's ruling 9 puts the same control in the same place here. It is
       REAL, and it is LAZY: nothing is read until it is pressed, so the load
       this page spent MRB-292 shrinking is unchanged. See the JS for what it
       reads and why that is the whole roster rather than the day's handful. */
    .tb-search {
