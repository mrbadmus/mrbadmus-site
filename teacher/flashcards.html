<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <!-- ⊕ Theme run, 27 Sep 2026 (Mide's ruling: light by default, a
       Light/Dark/System control on every page). THEME_HEAD, byte-identical
       to theme_head.THEME_HEAD — theme_wiring_check.py checks for an exact
       match, so if this ever needs to change, change theme_head.py and
       copy its output here rather than hand-editing this line. Before any
       stylesheet, so <html> carries data-theme before first paint. -->
  <script>(function(){var p='system';try{p=localStorage.getItem('mrb-theme')||'system'}catch(e){}if(p!=='dark'&&p!=='light')p='system';var d=p==='dark'||(p==='system'&&!!window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches),r=document.documentElement;r.setAttribute('data-theme',d?'dark':'light');r.setAttribute('data-theme-pref',p);r.style.colorScheme=d?'dark':'light'})()</script>
  <script src="/shared/theme.js?v=83dd2451" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#F7F1E5"/>
  <title>Flashcards — MrBadmus</title>
  <!--mrb:brand-head--><link rel="icon" type="image/svg+xml" href="/shared/brand/mrbadmus-favicon.svg?v=414f7a61"><link rel="apple-touch-icon" href="/shared/brand/mrbadmus-icon-light-512.png?v=cffd3cc4"><link rel="stylesheet" href="/shared/brand/brand.css?v=9c818614"><!--/mrb:brand-head-->
  <!-- ⊕ MRB-351 §5 — one flashcard set's progress, for the teacher who set
       it. HAND-WRITTEN, like today.html and timetable.html: it is not one of
       the six screens build_teacher_port.py generates. The page's logic is
       shared/flashcard-progress.js; this file is the shell. -->
  <link rel="stylesheet" href="/shared/tokens.css?v=b111271e"/>
  <link rel="stylesheet" href="/shared/teacher-ds.css?v=4c461633"/>
  <link rel="stylesheet" href="/shared/set-work.css?v=1f99af80"/>
  <link rel="stylesheet" href="/shared/flashcard-progress.css?v=5f4c4f21"/>
  <link rel="stylesheet" href="/shared/breakdown.css?v=87c6fa1b"/>
  <style>
    html { background: var(--st-ground); }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--st-ground); color: var(--st-ink);
      font: 400 18px/1.5 var(--st-ui); min-height: 100vh;
      /* Revealed by the guard's onAllowed, never before. */
      display: none;
    }
    /* ── the top bar: today.html's, value for value ─────────────────────── */
    .topbar {
      position: sticky; top: 0; z-index: 40; display: flex; align-items: center;
      gap: 12px; height: 62px; padding: 0 22px;
      background: var(--st-paper); border-bottom: 1px solid var(--st-rule);
    }
    .tb-seg {
      display: flex; gap: 3px; padding: 3px; flex: none; margin-right: auto;
      background: var(--st-seg-bg); border-radius: 10px;
    }
    .tb-tab {
      padding: 7px 15px; border-radius: 8px; font: 600 15.5px/1.2 var(--st-ui);
      color: var(--st-caption); background: transparent; text-decoration: none; white-space: nowrap;
    }
    .tb-tab:hover { color: var(--st-ink); text-decoration: none; }
    .signout {
      flex: none; height: 32px; padding: 0 12px; font: 600 15.5px/1.2 var(--st-ui);
      color: var(--st-muted); background: transparent; border: 1px solid var(--st-btn-border);
      border-radius: 9px; cursor: pointer;
    }
    .signout:hover { color: var(--st-ink); border-color: var(--st-edge); }
    .fp-bar-crumb {
      flex: 0 1 auto; min-width: 0; padding-left: 12px; margin-right: auto;
      border-left: 1px solid var(--st-rule-soft); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; text-decoration: none;
      font: 500 13px/1.2 var(--st-mono); letter-spacing: .16em; text-transform: uppercase;
      color: var(--st-ink);
    }
    .fp-bar-crumb:hover { color: var(--st-accent-text); }
    .fp-bar-crumb[hidden] { display: none; }
    .tb-seg:has(+ .fp-bar-crumb:not([hidden])) { margin-right: 0; }
    @media (max-width: 560px) { .fp-bar-crumb { display: none; } }
    @media print { .noprint { display: none !important; } }
  </style>
  <!-- ⊕ phone-teacher run — AFTER the page's own <style>, so the phone
       bar's one-row rules win. -->
  <link rel="stylesheet" href="/shared/teacher-topbar.css?v=e4a3d0a7">
  <script src="/shared/teacher-topbar.js?v=466ea5b0" defer></script>
</head>
<!-- `.rd[data-mode="ks3"]` is the scope the six generated teacher screens
     draw inside; it is what defines the --ks3-ok* greens (Done). -->
<body class="rd" data-mode="ks3">

<!-- today.html's bar. `data-port-region="topbar"` is where
     teacher-admin-nav.js puts the Admin link, and Sign out must stay the
     LAST button in it (that module inserts before the last button). -->
<nav class="topbar noprint" data-port-region="topbar">
  <!--mrb:brand--><a class="mrb-brand" href="/" aria-label="MrBadmus home"><svg class="mrb-brand__mark" data-mrb-mark viewBox="0 0 22 22" aria-hidden="true" focusable="false"><path d="M3.5 3.5 L11 11 L3.5 18.5" stroke="#E4572E" stroke-opacity="0.34" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path d="M12 3.5 L19.5 11 L12 18.5" stroke="#E4572E" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg><span class="mrb-brand__word">MrBadmus</span></a><!--/mrb:brand-->
  <div class="tb-seg">
    <a class="tb-tab" data-mrb-today-nav="1" href="/teacher/today.html">Today</a>
    <a class="tb-tab" href="/teacher/classes.html">My classes</a>
  </div>
  <!-- ⊕ Sharpen C6 (T46) — the parent class, as the generated pages' crumb. -->
  <a class="mrb-crumb fp-bar-crumb" id="fp-bar-crumb" hidden></a>
  <!-- ⊕ phone-teacher run, 28 Sep 2026 — the phone menu. Invisible above
       560px; below it the bar is ONE row (brand, segment, this) and the
       rest of the bar is reached through it. shared/teacher-topbar.js.
       ⚠️ A <button>, and never the LAST one: teacher-admin-nav.js inserts
       before the bar's last button, which must stay Sign out. -->
  <button type="button" class="tb-menu" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  <button class="signout" onclick="MrBadmusTeacherGuard.signOut()">Sign out</button>
  <span class="mrb-theme-slot" data-mrb-theme></span>
</nav>

<main class="fp-wrap" id="fp-main">
  <div id="fp-skel">
    <div class="fp-skel" style="width:180px;height:13px;"></div>
    <div class="fp-skel" style="width:min(420px,80%);height:40px;margin-top:14px;"></div>
    <div class="fp-skel" style="width:100%;height:260px;margin-top:28px;border-radius:11px;"></div>
  </div>

  <div id="fp-body" hidden>
    <header class="fp-head" id="fp-head"></header>
    <section class="fp-strip" id="fp-strip" aria-label="Class"></section>
    <!-- ⊕ Design port A, 30 Sep 2026, five-state follow-up same day — ONE
         legend above the table, for the Secured column's per-card strip
         (ruled: "ONE legend above the table").
         ⊕ MRB-354, 2 Oct 2026 — FOUR states now, not five: "Got it" is
         gone from every pupil/teacher surface (a card secures on one
         rating, so there is no separate "got it but not yet secured"
         bucket to show). Static, not built from data — the four cell
         shapes it names never change; see stripCounts()/securedCell() in
         flashcard-progress.js for where the real per-card counts come
         from. -->
    <div class="fp-tablehead">
      <h2>Pupils</h2>
      <div class="legend" aria-hidden="true">
        <span><i class="k-sec"></i>Secured</span>
        <span><i class="k-near"></i>Nearly</span>
        <span><i class="k-no"></i>Not yet</span>
        <span><i class="k-un"></i>Not seen</span>
      </div>
    </div>
    <div class="fp-scroll" id="fp-scroll">
      <table class="fp-table" id="fp-table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="fp-notice" id="fp-notice" hidden>
    <h1 id="fp-notice-title"></h1>
    <a href="/teacher/classes.html">My classes</a>
  </div>
</main>

<!-- ⊕ Sharpen B3, 29 Sep 2026 — the right-hand pupil drawer is gone. A
     row opens shared/flashcard-breakdown.js, the centred per-pupil panel
     (breakdown.css's shell), which mounts itself on <body>. -->

<!-- Edit: set-work.css's own overlay and sheet. -->
<div class="sw-overlay fp-edit noprint" id="fp-edit-back" hidden>
  <div class="sw-sheet" role="dialog" aria-modal="true" aria-labelledby="fp-ed-head" style="width:560px;">
    <div class="sw-head">
      <div class="sw-step" id="fp-ed-head">Edit</div>
      <button type="button" class="sw-btn" id="fp-ed-cancel">Cancel</button>
      <button type="button" class="sw-btn sw-btn-primary" id="fp-ed-save">Save</button>
    </div>
    <div class="sw-body">
      <label class="sw-label" for="fp-ed-title">Title</label>
      <div class="sw-fields"><input class="sw-input" id="fp-ed-title" type="text" maxlength="120" autocomplete="off"/></div>
      <div id="fp-ed-rel-wrap" hidden>
        <label class="sw-label" for="fp-ed-rel-date">Opens</label>
        <div class="sw-fields">
          <input class="sw-input" id="fp-ed-rel-date" type="date" aria-label="Opens date"/>
          <input class="sw-input" id="fp-ed-rel-time" type="time" aria-label="Opens time"/>
        </div>
      </div>
      <label class="sw-label" for="fp-ed-due-date">Due</label>
      <div class="sw-fields">
        <input class="sw-input" id="fp-ed-due-date" type="date" aria-label="Due date"/>
        <input class="sw-input" id="fp-ed-due-time" type="time" aria-label="Due time"/>
      </div>
      <label class="sw-label" for="fp-ed-note">Note</label>
      <div class="sw-fields"><textarea class="sw-input" id="fp-ed-note" maxlength="300" rows="3"></textarea></div>
      <div class="fp-ed-err" id="fp-ed-err" role="alert"></div>
    </div>
  </div>
</div>

<div class="fp-toast" id="fp-toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<!-- class-entry.js BEFORE teacher-data.js — CLAUDE.md's load-order rule. -->
<script src="/shared/class-entry.js?v=f09195e5"></script>
<script src="/shared/teacher-guard.js?v=15472a6c"></script>
<script src="/shared/teacher-data.js?v=0773ab62"></script>
<script src="/shared/teacher-admin-nav.js?v=d48cc15e"></script>
<script src="/shared/formulae.js?v=e4bfb091"></script>
<script src="/shared/flashcard-breakdown.js?v=baf47828"></script>
<!-- For its London clock helpers (londonToUtcIso / utcToLondonParts): the
     one conversion every Set work surface uses. It builds nothing until
     opened. -->
<script src="/shared/set-work.js?v=359e2ac4"></script>
<!-- Flashcards round 3: the pure fold of the understanding rows (node-tested). -->
<script src="/shared/flashcard-truth.js?v=7c0cba87"></script>

<script>
MrBadmusTeacherGuard.requireTeacherRole({
  onDenied: function () { /* the guard redirects */ },
  onAllowed: function () {
    document.body.style.display = 'block';
    window.MRBFlashcardProgress.start();
  }
});
</script>
</body>
</html>
