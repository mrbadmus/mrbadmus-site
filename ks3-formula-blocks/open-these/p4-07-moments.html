nd); border-bottom: 2px solid var(--ks3-rule); padding: 9px 16px 10px;\">\n    <div style=\"display: flex; align-items: center; gap: 12px; max-width: 60rem; margin: 0 auto;\">\n      <span style=\"font-family: var(--ks3-font-mono); font-size: 15px; font-weight: 500; color: var(--ks3-ink-muted); flex: 0 0 auto;\">{{ railCountLabel }}<\u002Fspan>\n      <span style=\"font-size: 16px; font-weight: 700; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\">{{ railCurrentLabel }}<\u002Fspan>\n      <span style=\"flex: 0 0 96px; height: 8px; border-radius: 99px; background: var(--ks3-band); border: 2px solid var(--ks3-ink); overflow: hidden;\"><span style=\"{{ railBarStyle }}\"><\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <nav data-rail=\"side\" aria-label=\"Lesson progress\" style=\"position: fixed; top: 150px; left: calc(50% - 632px); width: 104px; z-index: 20;\">\n    <ol style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center;\">\n      <sc-for list=\"{{ rail }}\" as=\"node\" hint-placeholder-count=\"4\">\n        <li style=\"display: flex; flex-direction: column; align-items: center;\">\n          <a href=\"{{ node.href }}\" style=\"{{ node.linkStyle }}\">\n            <span aria-hidden=\"true\" style=\"{{ node.chipStyle }}\">\n              <sc-if value=\"{{ node.done }}\"><svg class=\"ks3-mark\" sc-camel-view-box=\"0 0 24 24\" style=\"width: 16px; height: 16px;\"><path d=\"M5 12.5l4.6 4.5L19 7\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n              <sc-if value=\"{{ node.showNum }}\" hint-placeholder-val=\"{{ true }}\">{{ node.num }}<\u002Fsc-if>\n            <\u002Fspan>\n            <span style=\"{{ node.textStyle }}\">{{ node.label }}<\u002Fspan>\n          <\u002Fa>\n          <sc-if value=\"{{ node.hasLine }}\" hint-placeholder-val=\"{{ true }}\"><span aria-hidden=\"true\" style=\"{{ node.lineStyle }}\"><\u002Fspan><\u002Fsc-if>\n        <\u002Fli>\n      <\u002Fsc-for>\n    <\u002Fol>\n  <\u002Fnav>\n\n  <main class=\"ks3-main\">\n    <div class=\"ks3-lesson\">\n      <header class=\"ks3-lesson-head\">\n        <p class=\"ks3-eyebrow\">Forces · Quantitative<\u002Fp>\n        <h1>Moments: the turning effect<\u002Fh1>\n        <p class=\"ks3-bigq\">Push a door open at the handle and it swings. Push just as hard right beside the hinge and it hardly moves. Same door, same push, different result.<\u002Fp>\n        <sc-if value=\"{{ draftVisible }}\" hint-placeholder-val=\"{{ true }}\">\n          <p class=\"ks3-review-flag\">Draft — not yet science-reviewed.<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fheader>\n\n      <section id=\"s-hook\" class=\"ks3-block ks3-dark ks3-hook\" style=\"scroll-margin-top: 92px;\">\n        <p class=\"ks3-eyebrow\">Start here<\u002Fp>\n        <h2>The same push, ten centimetres from the hinge.<\u002Fh2>\n        <p class=\"ks3-hook-prompt\">Try it on the next door you go through. Push at the handle with one finger and it opens easily. Then push with the same finger a hand's width from the hinge, and lean.<\u002Fp>\n        <div class=\"ks3-hook-commit\">\n          <p class=\"ks3-commit\">Why is the same force so much less use near the hinge?<\u002Fp>\n          <ul class=\"ks3-options\">\n            <sc-for list=\"{{ hookOptions }}\" as=\"opt\" hint-placeholder-count=\"4\">\n              <li>\n                <button type=\"button\" class=\"ks3-option\" aria-pressed=\"{{ opt.pressed }}\" sc-camel-on-click=\"{{ opt.onClick }}\">\n                  <span class=\"ks3-opt-mark\" aria-hidden=\"true\">{{ opt.letter }}<\u002Fspan>\n                  <span class=\"ks3-opt-label\">{{ opt.text }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fli>\n            <\u002Fsc-for>\n          <\u002Ful>\n          <sc-if value=\"{{ hookRevealed }}\">\n            <div class=\"ks3-reveal\" data-arrive=\"1\">\n              <p style=\"margin: 0;\">Turning is not decided by the force alone. It is decided by the force <em>and<\u002Fem> how far from the pivot the force acts — and those two multiply together. The hinge is the pivot. Ten centimetres out you have a tenth of the distance, so a tenth of the turning effect. That product has a name: the <strong>moment<\u002Fstrong>.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section class=\"ks3-explainer\">\n        <p>A <strong>pivot<\u002Fstrong> is the fixed point something turns about — a hinge, a nut, a bolt through a seesaw. The <strong>moment<\u002Fstrong> of a force is its turning effect about that pivot, and it depends on two things: the size of the force, and its distance from the pivot. Moments are measured in <strong>newton metres, N m<\u002Fstrong>.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"s-bench\" class=\"ks3-block ks3-dark ks3-practical\" style=\"scroll-margin-top: 92px;\">\n        <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap;\">\n          <div>\n            <p class=\"ks3-eyebrow\">At the bench · spanner and a tight nut<\u002Fp>\n            <h2 style=\"margin: 0; font-size: 34px; line-height: 1.12; letter-spacing: -.03em; color: var(--ks3-on-dark);\">One nut. Two ways to shift it.<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"margin: 0; font-family: var(--ks3-font-mono); font-size: 15px; font-weight: 500; color: var(--ks3-on-dark-muted);\">{{ benchProgress }}<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"margin: 14px 0 0; font-size: 19px; line-height: 1.65; color: var(--ks3-on-dark-body); max-width: 58ch;\">This nut is done up tight: it needs a moment of {{ needLabel }} before it will move at all. Choose a spanner. Choose how hard you pull, at right angles to the handle.<\u002Fp>\n\n        <sc-if value=\"{{ gateOpen }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-top: 20px;\">\n            <p class=\"ks3-commit\" style=\"margin: 0 0 4px;\">Commit first. You swap a 0.10 m spanner for a 0.20 m one and pull just as hard. What happens to the turning effect?<\u002Fp>\n            <ul class=\"ks3-options\">\n              <sc-for list=\"{{ gateOptions }}\" as=\"opt\" hint-placeholder-count=\"4\">\n                <li>\n                  <button type=\"button\" class=\"ks3-option\" aria-pressed=\"{{ opt.pressed }}\" sc-camel-on-click=\"{{ opt.onClick }}\">\n                    <span class=\"ks3-opt-mark\" aria-hidden=\"true\">{{ opt.letter }}<\u002Fspan>\n                    <span class=\"ks3-opt-label\">{{ opt.text }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ benchOpen }}\">\n          <div data-arrive=\"1\" style=\"margin-top: 22px;\">\n            <div style=\"display: flex; flex-wrap: wrap; gap: 20px 30px; align-items: flex-end;\">\n              <div style=\"flex: 1 1 340px;\">\n                <p style=\"margin: 0 0 9px; font-family: var(--ks3-font-mono); font-size: 14px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--ks3-on-dark-muted);\">Distance from the pivot<\u002Fp>\n                <div style=\"display: flex; gap: 9px; flex-wrap: wrap;\">\n                  <sc-for list=\"{{ armTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ t.onClick }}\" aria-pressed=\"{{ t.pressed }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex: 1 1 280px; min-width: 240px;\">\n                <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px;\">\n                  <label for=\"p4force\" style=\"margin: 0 0 9px; font-family: var(--ks3-font-mono); font-size: 14px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--ks3-on-dark-muted);\">Your pull<\u002Flabel>\n                  <p style=\"margin: 0; font-family: var(--ks3-font-mono); font-size: 17px; font-weight: 500; color: var(--ks3-blue-light);\">{{ forceLabel }}<\u002Fp>\n                <\u002Fdiv>\n                <input class=\"p4-slider\" type=\"range\" id=\"p4force\" min=\"10\" max=\"100\" step=\"10\" value=\"{{ forceValue }}\" sc-camel-on-change=\"{{ onForce }}\" sc-camel-on-input=\"{{ onForce }}\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"margin-top: 18px; border-radius: var(--ks3-r-card); background: var(--ks3-dark-panel); padding: 18px;\">\n              <div style=\"position: relative;\">\n              <svg sc-camel-view-box=\"0 0 1000 420\" role=\"img\" aria-label=\"{{ benchAlt }}\" style=\"display: block; width: 100%; height: auto;\">\n                <path d=\"M250 196 H{{ endX }}\" style=\"fill: none; stroke: #5C554D; stroke-width: 2; stroke-dasharray: 7 7;\"><\u002Fpath>\n                <path d=\"M250 176 V216 M{{ endX }} 176 V216\" style=\"fill: none; stroke: #5C554D; stroke-width: 3;\"><\u002Fpath>\n\n                <rect x=\"250\" y=\"278\" width=\"{{ handleW }}\" height=\"30\" rx=\"14\" style=\"fill: #C6B9A7;\"><\u002Frect>\n                <rect x=\"{{ gripX }}\" y=\"272\" width=\"46\" height=\"42\" rx=\"12\" style=\"fill: #8C8177;\"><\u002Frect>\n                <path d=\"M250 250 L286 271 L286 315 L250 336 L214 315 L214 271 Z\" style=\"fill: #15110C; stroke: #C6B9A7; stroke-width: 5;\"><\u002Fpath>\n                <circle cx=\"250\" cy=\"293\" r=\"13\" style=\"fill: #C6B9A7;\"><\u002Fcircle>\n                <text x=\"250\" y=\"378\" text-anchor=\"middle\" style=\"font-family: var(--ks3-font-mono); font-weight: 500; font-size: 16px; letter-spacing: .08em; fill: #C6B9A7;\">PIVOT<\u002Ftext>\n\n                <path d=\"{{ forceShaft }}\" style=\"fill: none; stroke: #8FB7FF; stroke-width: 9; stroke-linecap: round;\"><\u002Fpath>\n                <path d=\"{{ forceHead }}\" style=\"fill: #8FB7FF;\"><\u002Fpath>\n\n                <sc-if value=\"{{ turns }}\">\n                  <path d=\"M250 224 A69 69 0 0 1 319 293\" style=\"fill: none; stroke: #8FB7FF; stroke-width: 7;\"><\u002Fpath>\n                  <path d=\"M319 316 L336 288 L300 288 Z\" style=\"fill: #8FB7FF;\"><\u002Fpath>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ stuck }}\">\n                  <path d=\"M250 224 A69 69 0 0 1 319 293\" style=\"fill: none; stroke: #5C554D; stroke-width: 6; stroke-dasharray: 9 9;\"><\u002Fpath>\n                <\u002Fsc-if>\n              <\u002Fsvg>\n                <span style=\"{{ distLabelStyle }}\">{{ armLabel }} from the pivot<\u002Fspan>\n                <span style=\"{{ forceLabelStyle }}\">{{ forceLabel }}<\u002Fspan>\n                <span style=\"position: absolute; left: 36%; top: 12%; font-family: var(--ks3-font-display); font-weight: 800; font-size: clamp(13px, 2.1vw, 26px); color: #FBF3E6; white-space: nowrap; pointer-events: none;\">{{ momentLabel }}<\u002Fspan>\n                <span style=\"position: absolute; left: 36%; top: 22%; font-family: var(--ks3-font-mono); font-weight: 500; font-size: clamp(10px, 1.4vw, 17px); letter-spacing: .08em; text-transform: uppercase; color: #C6B9A7; white-space: nowrap; pointer-events: none;\">{{ turnWord }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px;\">\n              <div style=\"padding: 15px 17px; border-radius: var(--ks3-r-panel); background: var(--ks3-dark-panel);\">\n                <p style=\"margin: 0; font-family: var(--ks3-font-mono); font-size: 13px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--ks3-on-dark-muted);\">Your pull<\u002Fp>\n                <p style=\"margin: 5px 0 0; font-family: var(--ks3-font-mono); font-size: 24px; font-weight: 500; color: var(--ks3-on-dark);\">{{ forceLabel }}<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"padding: 15px 17px; border-radius: var(--ks3-r-panel); background: var(--ks3-dark-panel);\">\n                <p style=\"margin: 0; font-family: var(--ks3-font-mono); font-size: 13px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--ks3-on-dark-muted);\">Distance from pivot<\u002Fp>\n                <p style=\"margin: 5px 0 0; font-family: var(--ks3-font-mono); font-size: 24px; font-weight: 500; color: var(--ks3-on-dark);\">{{ armLabel }}<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"padding: 15px 17px; border-radius: var(--ks3-r-panel); background: var(--ks3-dark-panel);\">\n                <p style=\"margin: 0; font-family: var(--ks3-font-mono); font-size: 13px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--ks3-on-dark-muted);\">Moment<\u002Fp>\n                <p style=\"margin: 5px 0 0; font-family: var(--ks3-font-mono); font-size: 24px; font-weight: 500; color: var(--ks3-on-dark);\">{{ momentLabel }}<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"padding: 15px 17px; border-radius: var(--ks3-r-panel); background: var(--ks3-dark-panel);\">\n                <p style=\"margin: 0; font-family: var(--ks3-font-mono); font-size: 13px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--ks3-on-dark-muted);\">The nut<\u002Fp>\n                <p style=\"margin: 5px 0 0; font-size: 20px; font-weight: 700; color: var(--ks3-on-dark);\">{{ verdictWord }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <p style=\"margin: 16px 0 0; padding: 16px 18px; border-radius: var(--ks3-r-panel); background: var(--ks3-dark-panel); font-size: 18px; line-height: 1.55; color: var(--ks3-on-dark-body);\">{{ benchNote }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n\n      <section id=\"s-formula\" style=\"margin: 28px 0 0; scroll-margin-top: 92px; background: var(--ks3-band); border: 3px solid var(--ks3-ink); border-radius: var(--ks3-r-block); padding: 34px 32px;\">\n        <div style=\"padding: 20px 24px; border-radius: var(--ks3-r-card); background: var(--ks3-card); border: 3px solid var(--ks3-ink);\">\n          <p style=\"margin: 0; font-family: var(--ks3-font-display); font-weight: 800; font-size: clamp(24px, 3.2vw, 36px); line-height: 1.14; letter-spacing: -.03em; text-align: center;\">Moment = force × distance from the pivot<\u002Fp>\n        <\u002Fdiv>\n        <p class=\"ks3-eyebrow\" style=\"margin: 24px 0 0; color: var(--ks3-accent-text);\">The triangle<\u002Fp>\n        <h2 style=\"margin: 6px 0 0; font-family: var(--ks3-font-display); font-weight: 800; font-size: 32px; line-height: 1.1; letter-spacing: -.03em;\">Cover the one you want<\u002Fh2>\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 30px 48px; margin-top: 22px;\">\n          <svg sc-camel-view-box=\"0 0 300 214\" role=\"img\" aria-label=\"A formula triangle. Moment M sits above a dividing line; force F and distance d sit below it, multiplied together. Covering one letter leaves the way to work it out.\" style=\"width: 260px; height: auto; flex: 0 0 auto;\">\n            <path d=\"M150 8L290 200H10Z\" style=\"fill: var(--ks3-blue-tint); stroke: var(--ks3-ink); stroke-width: 5; stroke-linejoin: round;\"><\u002Fpath>\n            <line x1=\"66\" y1=\"120\" x2=\"234\" y2=\"120\" style=\"stroke: var(--ks3-ink); stroke-width: 5; stroke-linecap: round;\"><\u002Fline>\n            <text x=\"150\" y=\"100\" text-anchor=\"middle\" style=\"font-family: var(--ks3-font-display); font-weight: 800; font-size: 62px; fill: var(--ks3-ink);\">M<\u002Ftext>\n            <text x=\"106\" y=\"182\" text-anchor=\"middle\" style=\"font-family: var(--ks3-font-display); font-weight: 800; font-size: 58px; fill: var(--ks3-ink);\">F<\u002Ftext>\n            <text x=\"150\" y=\"178\" text-anchor=\"middle\" style=\"font-family: var(--ks3-font-body); font-weight: 600; font-size: 26px; fill: var(--ks3-ink-muted);\">×<\u002Ftext>\n            <text x=\"196\" y=\"182\" text-anchor=\"middle\" style=\"font-family: var(--ks3-font-display); font-weight: 800; font-size: 58px; fill: var(--ks3-ink);\">d<\u002Ftext>\n            <sc-if value=\"{{ coverTop }}\">\n              <rect x=\"84\" y=\"50\" width=\"132\" height=\"60\" rx=\"13\" style=\"fill: var(--ks3-ink);\"><\u002Frect>\n              <text x=\"150\" y=\"94\" text-anchor=\"middle\" style=\"font-family: var(--ks3-font-display); font-weight: 800; font-size: 44px; fill: var(--ks3-ink-ghost);\">M<\u002Ftext>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ coverLeft }}\">\n              <rect x=\"60\" y=\"132\" width=\"94\" height=\"58\" rx=\"13\" style=\"fill: var(--ks3-ink);\"><\u002Frect>\n              <text x=\"107\" y=\"176\" text-anchor=\"middle\" style=\"font-family: var(--ks3-font-display); font-weight: 800; font-size: 44px; fill: var(--ks3-ink-ghost);\">F<\u002Ftext>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ coverRight }}\">\n              <rect x=\"150\" y=\"132\" width=\"94\" height=\"58\" rx=\"13\" style=\"fill: var(--ks3-ink);\"><\u002Frect>\n              <text x=\"197\" y=\"176\" text-anchor=\"middle\" style=\"font-family: var(--ks3-font-display); font-weight: 800; font-size: 44px; fill: var(--ks3-ink-ghost);\">d<\u002Ftext>\n            <\u002Fsc-if>\n          <\u002Fsvg>\n          <div style=\"flex: 1 1 340px; min-width: 280px;\">\n            <div style=\"display: flex; gap: 9px; flex-wrap: wrap;\">\n              <sc-for list=\"{{ coverTabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n                <button type=\"button\" sc-camel-on-click=\"{{ t.onClick }}\" aria-pressed=\"{{ t.pressed }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <p style=\"margin: 20px 0 0; font-family: var(--ks3-font-display); font-weight: 800; font-size: clamp(30px, 3.8vw, 40px); line-height: 1.14; letter-spacing: -.02em;\">{{ coverResult }}<\u002Fp>\n            <p style=\"margin: 12px 0 0; font-size: 18px; line-height: 1.5; color: var(--ks3-ink-body);\">Two things side by side means multiply. One thing over another means divide.<\u002Fp>\n            <div style=\"margin-top: 20px; display: flex; flex-direction: column; gap: 9px;\">\n              <div style=\"display: flex; align-items: center; gap: 14px;\">\n                <span aria-hidden=\"true\" style=\"flex: 0 0 46px; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; background: var(--ks3-blue-tint); border: 2px solid var(--ks3-ink); font-family: var(--ks3-font-display); font-weight: 800; font-size: 25px; line-height: 1; color: var(--ks3-ink);\">M<\u002Fspan>\n                <span style=\"flex: 1 1 auto; font-size: 19px; font-weight: 600; line-height: 1.35;\">moment<\u002Fspan>\n                <span style=\"flex: 0 0 auto; min-width: 4.6rem; padding: 5px 16px; border-radius: 99px; background: var(--ks3-accent-text); color: var(--ks3-ground); font-family: var(--ks3-font-mono); font-size: 18px; font-weight: 500; white-space: nowrap; text-align: center;\">N m<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 14px;\">\n                <span aria-hidden=\"true\" style=\"flex: 0 0 46px; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; background: var(--ks3-blue-tint); border: 2px solid var(--ks3-ink); font-family: var(--ks3-font-display); font-weight: 800; font-size: 25px; line-height: 1; color: var(--ks3-ink);\">F<\u002Fspan>\n                <span style=\"flex: 1 1 auto; font-size: 19px; font-weight: 600; line-height: 1.35;\">force, at right angles to the handle<\u002Fspan>\n                <span style=\"flex: 0 0 auto; min-width: 4.6rem; padding: 5px 16px; border-radius: 99px; background: var(--ks3-accent-text); color: var(--ks3-ground); font-family: var(--ks3-font-mono); font-size: 18px; font-weight: 500; white-space: nowrap; text-align: center;\">N<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 14px;\">\n                <span aria-hidden=\"true\" style=\"flex: 0 0 46px; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; background: var(--ks3-blue-tint); border: 2px solid var(--ks3-ink); font-family: var(--ks3-font-display); font-weight: 800; font-size: 25px; line-height: 1; color: var(--ks3-ink);\">d<\u002Fspan>\n                <span style=\"flex: 1 1 auto; font-size: 19px; font-weight: 600; line-height: 1.35;\">distance from the pivot<\u002Fspan>\n                <span style=\"flex: 0 0 auto; min-width: 4.6rem; padding: 5px 16px; border-radius: 99px; background: var(--ks3-accent-text); color: var(--ks3-ground); font-family: var(--ks3-font-mono); font-size: 18px; font-weight: 500; white-space: nowrap; text-align: center;\">m<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"ks3-block ks3-worked\" style=\"margin-top: 22px;\">\n          <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap;\">\n            <div>\n              <p class=\"ks3-eyebrow\">Worked example · one step at a time<\u002Fp>\n              <h2 style=\"margin: 6px 0 0;\">A spanner is gripped 0.25 m from the nut and pulled with 40 N. What is the moment?<\u002Fh2>\n            <\u002Fdiv>\n            <p style=\"margin: 0; font-family: var(--ks3-font-mono); font-size: 15px; font-weight: 500; color: var(--ks3-ink-muted);\">{{ workedProgress }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"margin-top: 20px; display: flex; flex-direction: column; gap: 12px;\">\n            <sc-for list=\"{{ workedSteps }}\" as=\"st\" hint-placeholder-count=\"1\">\n              <div style=\"display: flex; gap: 16px; align-items: flex-start; padding: 20px 22px; border-radius: var(--ks3-r-panel); background: var(--ks3-inset); border: 2px solid var(--ks3-option-border);\">\n                <span aria-hidden=\"true\" style=\"flex: 0 0 38px; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; background: var(--ks3-accent-text); color: var(--ks3-ground); font-family: var(--ks3-font-display); font-weight: 800; font-size: 20px;\">{{ st.letter }}<\u002Fspan>\n                <div style=\"flex: 1 1 auto; min-width: 0;\">\n                  <p style=\"margin: 0; font-family: var(--ks3-font-mono); font-size: 13px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: var(--ks3-ink-muted);\">{{ st.label }}<\u002Fp>\n                  <p style=\"margin: 5px 0 0; font-family: var(--ks3-font-display); font-weight: 800; font-size: 26px; line-height: 1.25; letter-spacing: -.02em; color: var(--ks3-ink);\">{{ st.line }}<\u002Fp>\n                  <p style=\"margin: 6px 0 0; font-size: 18px; line-height: 1.55; color: var(--ks3-ink-body);\">{{ st.note }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top: 18px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;\">\n            <button type=\"button\" class=\"ks3-reveal-btn\" sc-camel-on-click=\"{{ onWorked }}\" disabled=\"{{ workedDone }}\" style=\"{{ workedBtnStyle }}\">{{ workedBtnLabel }}<\u002Fbutton>\n            <sc-if value=\"{{ workedDone }}\"><span style=\"font-size: 18px; font-weight: 700; color: var(--ks3-ink-body);\">Now the same four steps on your own spanner.<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top: 22px; padding: 26px 24px; border-radius: var(--ks3-r-card); background: var(--ks3-inset); border: 2px solid var(--ks3-ink);\">\n          <p class=\"ks3-eyebrow\" style=\"color: var(--ks3-accent-text);\">Your turn · the same four steps<\u002Fp>\n          <h2 style=\"margin: 6px 0 14px; font-family: var(--ks3-font-display); font-weight: 800; font-size: 28px; line-height: 1.15; letter-spacing: -.02em;\">{{ buildHead }}<\u002Fh2>\n\n          <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n            <div style=\"padding: 20px 22px; border-radius: var(--ks3-r-panel); background: var(--ks3-card); border: 2px solid var(--ks3-option-border);\">\n              <p style=\"margin: 0 0 10px; font-family: var(--ks3-font-mono); font-size: 13px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: var(--ks3-ink-muted);\">Step 1 · Formula<\u002Fp>\n              <p style=\"margin: 0 0 12px; font-size: 19px; font-weight: 600;\">Which line will give you the moment?<\u002Fp>\n              <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n                <sc-for list=\"{{ formPicks }}\" as=\"p\" hint-placeholder-count=\"3\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ p.onClick }}\" aria-pressed=\"{{ p.pressed }}\" disabled=\"{{ p.disabled }}\" style=\"{{ p.style }}\">{{ p.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding: 20px 22px; border-radius: var(--ks3-r-panel); background: var(--ks3-card); border: 2px solid var(--ks3-option-border);\">\n              <p style=\"margin: 0 0 10px; font-family: var(--ks3-font-mono); font-size: 13px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: var(--ks3-ink-muted);\">Step 2 · Insert<\u002Fp>\n              <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n                <sc-for list=\"{{ insertPicks }}\" as=\"p\" hint-placeholder-count=\"3\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ p.onClick }}\" aria-pressed=\"{{ p.pressed }}\" disabled=\"{{ p.disabled }}\" style=\"{{ p.style }}\">{{ p.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding: 20px 22px; border-radius: var(--ks3-r-panel); background: var(--ks3-card); border: 2px solid var(--ks3-option-border);\">\n              <p style=\"margin: 0 0 10px; font-family: var(--ks3-font-mono); font-size: 13px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: var(--ks3-ink-muted);\">Steps 3 and 4 · Fine-tune, then answer<\u002Fp>\n              <p style=\"margin: 0 0 12px; font-size: 19px; font-weight: 600;\">Give the moment your spanner is making, with its unit.<\u002Fp>\n              <div style=\"display: flex; gap: 12px; flex-wrap: wrap; align-items: center;\">\n                <label for=\"p4ans\" style=\"position: absolute; left: -9999px;\">Your answer as a number<\u002Flabel>\n                <input type=\"text\" sc-camel-input-mode=\"decimal\" id=\"p4ans\" value=\"{{ ansValue }}\" sc-camel-on-change=\"{{ onAns }}\" sc-camel-on-input=\"{{ onAns }}\" disabled=\"{{ buildLocked }}\" placeholder=\"0\" style=\"font: inherit; font-family: var(--ks3-font-mono); font-size: 22px; font-weight: 500; width: 7rem; padding: 12px 14px; min-height: 44px; border-radius: var(--ks3-r-option); border: 2px solid var(--ks3-option-border); background: var(--ks3-ground); color: var(--ks3-ink);\">\n                <label for=\"p4unit\" style=\"position: absolute; left: -9999px;\">Unit<\u002Flabel>\n                <sc-raw-select id=\"p4unit\" class=\"ks3-sim-units\" value=\"{{ unitValue }}\" sc-camel-on-change=\"{{ onUnit }}\" disabled=\"{{ buildLocked }}\" style=\"font-size: 18px;\">\n                  <option value=\"\">choose a unit<\u002Foption>\n                  <option value=\"N m\">N m<\u002Foption>\n                  <option value=\"N\">N<\u002Foption>\n                  <option value=\"m\">m<\u002Foption>\n                  <option value=\"N/m\">N/m<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top: 18px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;\">\n            <button type=\"button\" class=\"ks3-reveal-btn\" sc-camel-on-click=\"{{ onBuild }}\" disabled=\"{{ buildBtnLocked }}\" style=\"{{ buildBtnStyle }}\">Show the four steps<\u002Fbutton>\n            <span style=\"font-family: var(--ks3-font-mono); font-size: 15px; font-weight: 500; color: var(--ks3-ink-muted);\">{{ buildProgress }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ buildOpen }}\">\n            <div data-arrive=\"1\" style=\"margin-top: 18px; padding: 26px; border-radius: var(--ks3-r-panel); background: var(--ks3-ink); color: var(--ks3-on-dark);\">\n              <p style=\"margin: 0 0 16px; font-family: var(--ks3-font-mono); font-size: 14px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ks3-alert);\">Your spanner, four lines<\u002Fp>\n              <sc-for list=\"{{ buildSteps }}\" as=\"st\" hint-placeholder-count=\"4\">\n                <div style=\"{{ st.style }}\">\n                  <span aria-hidden=\"true\" style=\"flex: 0 0 34px; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--ks3-alert); color: var(--ks3-ink); font-family: var(--ks3-font-display); font-weight: 800; font-size: 18px;\">{{ st.letter }}<\u002Fspan>\n                  <div style=\"flex: 1 1 auto; min-width: 0;\">\n                    <p style=\"margin: 0; font-family: var(--ks3-font-mono); font-size: 13px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ks3-on-dark-muted);\">{{ st.label }}<\u002Fp>\n                    <p style=\"margin: 5px 0 0; font-family: var(--ks3-font-display); font-weight: 800; font-size: 25px; line-height: 1.25; letter-spacing: -.02em; color: var(--ks3-on-dark);\">{{ st.line }}<\u002Fp>\n                    <p style=\"margin: 6px 0 0; font-size: 18px; line-height: 1.55; color: var(--ks3-on-dark-body);\">{{ st.note }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <p style=\"margin: 18px 0 0; font-size: 19px; line-height: 1.6; color: var(--ks3-on-dark-body);\">{{ buildClose }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div data-key-fact=\"1\" style=\"margin: 24px 0 0; padding: 18px 22px; border-radius: var(--ks3-r-panel); background: var(--ks3-card); border: 2px solid var(--ks3-ink); box-shadow: 5px 5px 0 var(--ks3-accent);\">\n          <p style=\"margin: 0; font-family: var(--ks3-font-mono); font-size: 13px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: var(--ks3-accent-text);\">Key fact<\u002Fp>\n          <p style=\"margin: 7px 0 0; font-family: var(--ks3-font-display); font-weight: 700; font-size: 22px; line-height: 1.35; letter-spacing: -.015em; color: var(--ks3-ink);\">The moment of a force is its turning effect about a pivot, and it is the force in newtons multiplied by the distance from the pivot in metres. Double the distance and you double the turning effect for exactly the same pull.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"s-think\" class=\"ks3-block ks3-misconception\" style=\"scroll-margin-top: 92px;\">\n        <div class=\"ks3-mis-head\">\n          <span class=\"ks3-mis-badge\" aria-hidden=\"true\">!<\u002Fspan>\n          <p class=\"ks3-eyebrow\">Think again<\u002Fp>\n        <\u002Fdiv>\n        <p class=\"ks3-mis-quote\">“A longer spanner means you are pulling harder.”<\u002Fp>\n        <p>It does not, and the spring balance proves it: put one on the handle and the reading is the same 50 N whether the handle is short or long. What changes is what those 50 N achieve. A moment is not a force and is not measured in newtons — it is a force multiplied by a distance, measured in newton metres, and a long handle buys you turning effect without buying you strength. This is why the answer to a seized bolt is never simply <em>pull harder<\u002Fem>: put a length of pipe over the spanner and the same arm shifts it.<\u002Fp>\n\n        <div style=\"margin-top: 22px; padding-top: 20px; border-top: 2px solid var(--ks3-alert-border);\">\n          <p class=\"ks3-mis-quote\" style=\"margin-top: 0;\">“Measure the distance from where you are standing.”<\u002Fp>\n          <p>The distance in the formula is measured from the <em>pivot<\u002Fem>, and nowhere else. Not from the middle of the object, not from your feet, not along your arm. On the bench above, the pivot is the centre of the nut, so a 0.20 m spanner means the pull acts 0.20 m from that centre. Get the pivot wrong and every answer that follows is wrong, which is why identifying it is the first thing to do in any turning problem — hinge, nut, bolt, axle, or in the human body, the joint.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"s-ladder\" class=\"ks3-ladder\" style=\"scroll-margin-top: 92px;\">\n        <div class=\"ks3-ladder-head\">\n          <div>\n            <h2>Mastery ladder<\u002Fh2>\n            <p class=\"ks3-ladder-sub\">Four rungs. Two the page marks, two you mark.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"ks3-ladder-score\" aria-live=\"polite\">\n            <p class=\"ks3-score\">{{ scoreLine }}<\u002Fp>\n            <p class=\"ks3-score-note\">{{ scoreNote }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"ks3-rungs\">\n          <sc-for list=\"{{ markedRungs }}\" as=\"rung\" hint-placeholder-count=\"2\">\n            <section class=\"ks3-rung\">\n              <h3>{{ rung.title }}<\u002Fh3>\n              <p class=\"ks3-rung-q\">{{ rung.question }}<\u002Fp>\n              <ul class=\"ks3-options\">\n                <sc-for list=\"{{ rung.options }}\" as=\"opt\" hint-placeholder-count=\"4\">\n                  <li>\n                    <button type=\"button\" class=\"{{ opt.className }}\" sc-camel-on-click=\"{{ opt.onClick }}\" disabled=\"{{ opt.disabled }}\">\n                      <span class=\"ks3-opt-mark\" aria-hidden=\"true\">\n                        <sc-if value=\"{{ opt.isCorrect }}\"><svg class=\"ks3-mark\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M5 12.5l4.6 4.5L19 7\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                        <sc-if value=\"{{ opt.isWrong }}\"><svg class=\"ks3-mark\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M6.5 6.5l11 11M17.5 6.5l-11 11\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                        <sc-if value=\"{{ opt.showLetter }}\" hint-placeholder-val=\"{{ true }}\">{{ opt.letter }}<\u002Fsc-if>\n                      <\u002Fspan>\n                      <span class=\"ks3-opt-label\">{{ opt.text }}<\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fli>\n                <\u002Fsc-for>\n              <\u002Ful>\n              <sc-if value=\"{{ rung.answered }}\">\n                <p class=\"{{ rung.feedbackClass }}\" role=\"status\">\n                  <span class=\"ks3-feedback-word\">\n                    <sc-if value=\"{{ rung.isRight }}\"><svg class=\"ks3-mark\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.6 4.5L19 7\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                    <sc-if value=\"{{ rung.isWrong }}\"><svg class=\"ks3-mark\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6.5 6.5l11 11M17.5 6.5l-11 11\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                    {{ rung.feedbackWord }}<\u002Fspan> {{ rung.feedbackText }}\n                <\u002Fp>\n              <\u002Fsc-if>\n            <\u002Fsection>\n          <\u002Fsc-for>\n\n          <sc-for list=\"{{ selfRungs }}\" as=\"rung\" hint-placeholder-count=\"2\">\n            <section class=\"ks3-rung ks3-rung-self\">\n              <h3>{{ rung.title }}<\u002Fh3>\n              <p class=\"ks3-rung-q\">{{ rung.question }}<\u002Fp>\n              <label class=\"ks3-answer-label\" for=\"{{ rung.fieldId }}\">{{ rung.fieldLabel }}<\u002Flabel>\n              <textarea class=\"ks3-answer\" id=\"{{ rung.fieldId }}\" value=\"{{ rung.value }}\" sc-camel-on-change=\"{{ rung.onChange }}\" placeholder=\"{{ rung.placeholder }}\"><\u002Ftextarea>\n              <button type=\"button\" class=\"ks3-check-btn\" sc-camel-on-click=\"{{ rung.onCheck }}\">Check my answer<\u002Fbutton>\n              <sc-if value=\"{{ rung.checked }}\">\n                <ul class=\"ks3-ticks\">\n                  <sc-for list=\"{{ rung.criteria }}\" as=\"crit\" hint-placeholder-count=\"5\">\n                    <li class=\"ks3-tick\">\n                      <input type=\"checkbox\" id=\"{{ crit.id }}\" checked=\"{{ crit.checked }}\" sc-camel-on-change=\"{{ crit.onToggle }}\">\n                      <label for=\"{{ crit.id }}\"><span class=\"ks3-tick-num\">{{ crit.num }}<\u002Fspan> {{ crit.text }}<\u002Flabel>\n                    <\u002Fli>\n                  <\u002Fsc-for>\n                <\u002Ful>\n                <p class=\"{{ rung.tallyClass }}\" role=\"status\">{{ rung.tallyText }}<\u002Fp>\n              <\u002Fsc-if>\n            <\u002Fsection>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div class=\"ks3-retry-wrap\">\n          <button type=\"button\" class=\"ks3-retry\" sc-camel-on-click=\"{{ onRetry }}\">Retry my misses<\u002Fbutton>\n          <p class=\"ks3-retry-note\">Clears the ticks on rungs 3 and 4 and keeps what you wrote.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"s-keynote\" class=\"ks3-block ks3-dark ks3-keynote\" style=\"scroll-margin-top: 92px;\">\n        <p class=\"ks3-eyebrow\">Key note<\u002Fp>\n        <p>A moment is the turning effect of a force about a pivot, and it equals the force in newtons multiplied by its distance from the pivot in metres, giving newton metres. The same force gives a bigger moment further out, which is why handles, levers and spanners are long. A moment is not a force, and the distance is always measured from the pivot.<\u002Fp>\n      <\u002Fsection>\n\n      <section class=\"ks3-layer\">\n        <div class=\"ks3-layer-head\">\n          <p class=\"ks3-eyebrow\">Going further<\u002Fp>\n          <span class=\"ks3-layer-rule\" aria-hidden=\"true\"><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"ks3-layer-body\">\n          <p>Once you can work out a moment, you can work out a balance. On a seesaw there are two moments about the same pivot, one turning it clockwise and one anticlockwise, and it balances when the two are equal — not when the two weights are equal. That is why a child of 300 N sitting 2 m out balances an adult of 600 N sitting 1 m out: both make 600 N m, and the seesaw does not care which is which. The same arithmetic decides whether a crane tips over, how far along a plank a builder can walk, and where the counterweight goes on a tower crane, which is a lump of concrete whose whole job is to make a moment on the other side.<\u002Fp>\n          <p>Levers are this idea used deliberately: put the pivot near the load and you can lift something with far less force than its weight, as long as you accept moving your end much further. A crowbar, a wheelbarrow, a bottle opener and a pair of scissors are all the same machine in different clothes. Your own body is full of them too, though it usually trades the other way — many muscles pull very close to the joint, so they need a large force to lift a small load, and buy speed and range of movement with it instead. The <a href=\"b2-04-biomechanics-forces-in-the-body.html\">biomechanics lesson in the skeleton unit<\u002Fa> works through the turning effect at a joint, and is the same relationship you have just met here.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <div class=\"ks3-endmatter\">\n        <section>\n          <h2>Before this lesson<\u002Fh2>\n          <ul>\n            <li><a href=\"p4-06-air-and-water-resistance.html\">Air and water resistance<svg class=\"ks3-mark ks3-mark-arrow\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12h15M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa><\u002Fli>\n          <\u002Ful>\n        <\u002Fsection>\n        <section>\n          <h2>Connects to<\u002Fh2>\n          <ul>\n            <li><a href=\"p4-08-springs-and-hookes-law.html\">Springs and Hooke's law<svg class=\"ks3-mark ks3-mark-arrow\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12h15M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa><\u002Fli>\n            <li><a href=\"b2-04-biomechanics-forces-in-the-body.html\">Biomechanics: forces in the body<svg class=\"ks3-mark ks3-mark-arrow\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 12h15M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa><\u002Fli>\n          <\u002Ful>\n        <\u002Fsection>\n        <section>\n          <h2>At GCSE this becomes<\u002Fh2>\n          <p>Moments, the principle of moments for a balanced beam, levers as force multipliers, and gears.<\u002Fp>\n        <\u002Fsection>\n        <section class=\"ks3-tutor\">\n          <h2>Ask Mr Badmus AI<\u002Fh2>\n          <p>Got a turning problem of your own — a door, a spanner, a seesaw?<\u002Fp>\n          <a class=\"ks3-tutor-cta\" href=\"#s-bench\">Ask about this lesson<\u002Fa>\n        <\u002Fsection>\n      <\u002Fdiv>\n\n      <p class=\"ks3-legal\">The spanner bench is a teaching model. The nut is given a fixed loosening moment of 12 N m so that failure is something you can reach; a real fitting depends on how it was tightened, on corrosion and on whether it has ever been undone. The pull is taken as acting at right angles to the handle, which is the only case handled at this stage, and the handle is drawn to scale while the force arrow uses a separate scale.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <footer class=\"ks3-footer\">\n    <p>MrBadmusAI · Key Stage 3 Science<\u002Fp>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280},&quot;showDraft&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Lesson state&quot;}}\">\nconst RAIL = [\n  { id: 's-hook', label: 'The door and the hinge', short: 'HOOK' },\n  { id: 's-bench', label: 'Spanner and nut', short: 'NUT' },\n  { id: 's-formula', label: 'Triangle and four steps', short: 'FIFA' },\n  { id: 's-ladder', label: 'Mastery ladder', short: 'LADDER' }\n];\n\nconst NEED = 12;        // N m, the modelled loosening moment\nconst ARM_SCALE = 1400; // px per metre of handle\nconst F_SCALE = 0.9;    // px per newton of pull\n\nconst ARMS = [0.05, 0.10, 0.20, 0.30];\n\nconst WORKED = [\n  { letter: 'F', label: 'Formula', line: 'moment = force × distance from the pivot',\n    note: 'Two quantities multiplied, which is what a triangle means.' },\n  { letter: 'I', label: 'Insert', line: 'moment = 40 N × 0.25 m',\n    note: 'The 0.25 m is measured from the nut, not along your arm.' },\n  { letter: 'F', label: 'Fine-tune', line: '40 × 0.25 = 10',\n    note: 'Newtons times metres leaves newton metres.' },\n  { letter: 'A', label: 'Answer', line: 'moment = 10 N m',\n    note: 'Ten newton metres, turning the nut about the pivot.' }\n];\n\nconst COVERS = {\n  M: 'M = F × d',\n  F: 'F = M ÷ d',\n  d: 'd = M ÷ F'\n};\n\nconst RUNGS = [\n  { id: 'r1', title: 'Rung 1 · Calculate',\n    question: 'A spanner is gripped 0.40 m from a bolt and pulled with 30 N at right angles. What is the moment?',\n    options: [\n      { text: '12 N m', correct: true },\n      { text: '75 N m — divide the force by the distance', correction: 'Dividing is what you do to find a distance or a force from a known moment. To find the moment itself, the two multiply.' },\n      { text: '12 N — a turning effect is a force, so it is in newtons', correction: 'The arithmetic is right and the unit is wrong. A moment is a force multiplied by a distance, so its unit is the newton metre.' },\n      { text: '30 N m — the moment is the force, and the distance only sets which way it turns', correction: 'The distance changes the size of the turning effect, not just its direction. At 0.80 m the same 30 N would give twice as much.' }\n    ] },\n  { id: 'r2', title: 'Rung 2 · The one that catches people',\n    question: 'Two people pull with exactly 50 N on the same stiff bolt. One uses a 0.10 m spanner, the other a 0.40 m spanner. Which statement is right?',\n    options: [\n      { text: 'The long spanner gives 20 N m against 5 N m — four times the turning effect for the same pull.', correct: true },\n      { text: 'They give the same moment, because the force is the same.', correction: 'The moment is force × distance. Same force, four times the distance, four times the moment.' },\n      { text: 'The short spanner gives more, because the force acts closer to the bolt.', correction: 'Closer to the pivot is weaker, not stronger — that is the door-hinge test at the top of this lesson.' },\n      { text: 'The long spanner gives more, because a longer spanner weighs more.', correction: 'The verdict is right and the reason is wrong. It would still be four times the moment if the long spanner were made of something lighter.' }\n    ] }\n];\n\nconst SELF_RUNGS = [\n  { id: 'r3', title: 'Rung 3 · Explain',\n    question: 'Door handles are always fitted at the edge furthest from the hinges. Explain why, using the word pivot and the word moment.',\n    fieldLabel: 'Your explanation',\n    placeholder: 'The hinges are the\\u2026',\n    criteria: [\n      'Says the hinge line is the pivot.',\n      'Says the moment is the force multiplied by the distance from that pivot.',\n      'Says the handle edge is the furthest point from the hinges.',\n      'Says the same push therefore gives the largest possible moment.',\n      'Says a handle near the hinges would need a much bigger force to open the same door.'\n    ] },\n  { id: 'r4', title: 'Rung 4 · Take it somewhere new',\n    question: 'A wheel nut on a car must be tightened to a moment of 110 N m. A driver can pull with about 250 N. Work out the shortest spanner that would do the job, and explain why the manufacturer supplies a long one rather than one of exactly that length.',\n    fieldLabel: 'Your answer',\n    placeholder: 'Rearranging the formula gives\\u2026',\n    criteria: [\n      'Rearranges to distance = moment ÷ force.',\n      'Works out 110 ÷ 250 = 0.44 m, and gives the unit as metres.',\n      'Says a shorter spanner than that would need a bigger pull than 250 N.',\n      'Says a longer spanner reaches the same 110 N m with a smaller force.',\n      'Says something sensible about why that matters — most people cannot pull 250 N, or it is safer and more accurate than straining.'\n    ] }\n];\n\nclass Component extends DCLogic {\n  state = {\n    hookChoice: null,\n    gate: null,\n    cover: 'M',\n    arm: 0.10,\n    force: 50,\n    touched: {},\n    workedStep: 0,\n    formPick: null,\n    insertPick: null,\n    ansText: '',\n    ansUnit: '',\n    buildOpen: false,\n    answers: { r1: null, r2: null },\n    text: { r3: '', r4: '' },\n    checked: { r3: false, r4: false },\n    ticks: { r3: [], r4: [] },\n    active: 0\n  };\n\n  componentDidMount() {\n    this.io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (!e.isIntersecting) return;\n        const i = RAIL.findIndex((r) => r.id === e.target.id);\n        if (i >= 0) this.setState({ active: i });\n      });\n    }, { rootMargin: '-45% 0px -50% 0px' });\n    RAIL.forEach((r) => {\n      const el = document.getElementById(r.id);\n      if (el) this.io.observe(el);\n    });\n  }\n\n  componentWillUnmount() { if (this.io) this.io.disconnect(); }\n\n  seg(on, dark, dis) {\n    const base = 'font:inherit;font-size:16px;font-weight:700;padding:11px 16px;min-height:44px;border-radius:var(--ks3-r-control);cursor:' + (dis ? 'default' : 'pointer') + ';';\n    if (dark) {\n      return base + 'border:2px solid ' + (on ? 'var(--ks3-blue-light)' : 'var(--ks3-on-dark-muted)') +\n        ';background:' + (on ? 'var(--ks3-blue-light)' : 'transparent') +\n        ';color:' + (on ? 'var(--ks3-ink)' : 'var(--ks3-on-dark)') + ';';\n    }\n    return base + 'border:2px solid ' + (on ? 'var(--ks3-accent)' : 'var(--ks3-option-border)') +\n      ';background:' + (on ? 'var(--ks3-accent-tint)' : 'var(--ks3-ground)') + ';color:var(--ks3-ink);' + (dis && !on ? 'opacity:.5;' : '');\n  }\n\n  moment() { return Math.round(this.state.force * this.state.arm * 100) / 100; }\n  arm2() { return this.state.arm.toFixed(2); }\n  turns() { return this.moment() >= NEED; }\n\n  benchNote() {\n    const s = this.state;\n    const M = this.moment();\n    const arm = this.arm2();\n    if (M >= NEED) {\n      const needF = Math.ceil(NEED / s.arm);\n      return 'That is ' + M + ' N m, and the nut needs ' + NEED + ' N m, so it moves. Notice what would also have worked: the same ' + s.force +\n        ' N further out, or as little as ' + needF + ' N at this distance. Both routes reach the same ' + NEED + ' N m, because it is the product that matters.';\n    }\n    const needF = Math.ceil(NEED / s.arm);\n    const needArm = Math.round((NEED / s.force) * 100) / 100;\n    return s.force + ' N at ' + arm + ' m gives ' + M + ' N m, which is short of the ' + NEED +\n      ' N m this nut needs, so nothing happens at all. Two ways out: pull with ' + needF + ' N at this distance, or keep your ' + s.force +\n      ' N and get ' + needArm + ' m from the pivot' + (needArm > 0.3 ? ' — further than any spanner here, which is what a length of pipe over the handle is for.' : '.');\n  }\n\n  railVals() {\n    const s = this.state;\n    return {\n      rail: RAIL.map((r, i) => {\n        const done = (function (id) {\n          if (id === 's-hook') return s.hookChoice !== null;\n          if (id === 's-bench') return s.gate !== null && Object.keys(s.touched).length >= 1;\n          if (id === 's-formula') return s.buildOpen;\n          if (id === 's-ladder') return s.answers.r1 !== null && s.answers.r2 !== null && s.checked.r3 && s.checked.r4;\n          return false;\n        })(r.id);\n        const cur = i === s.active;\n        return {\n          href: '#' + r.id, label: r.short, num: String(i + 1),\n          done: done, showNum: !done,\n          hasLine: i < RAIL.length - 1,\n          linkStyle: 'display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:inherit;padding:2px 0;',\n          chipStyle: 'display:grid;place-items:center;width:32px;height:32px;border-radius:10px;font-family:var(--ks3-font-display);font-weight:800;font-size:16px;background:' +\n            (done ? 'var(--ks3-accent)' : 'var(--ks3-card)') + ';border:2px solid ' +\n            (done || cur ? 'var(--ks3-ink)' : 'var(--ks3-rule-strong)') + ';color:' +\n            (done ? 'var(--ks3-on-dark)' : cur ? 'var(--ks3-ink)' : 'var(--ks3-ink-ghost)') +\n            ';box-shadow:' + (cur ? '0 0 0 4px var(--ks3-accent-tint)' : 'none') + ';',\n          textStyle: 'font-family:var(--ks3-font-mono);font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;text-align:center;line-height:1.2;color:' +\n            (cur ? 'var(--ks3-ink)' : done ? 'var(--ks3-ink-muted)' : 'var(--ks3-ink-ghost)') + ';',\n          lineStyle: 'display:block;width:2px;height:20px;margin:7px 0;background:' + (done ? 'var(--ks3-accent)' : 'var(--ks3-rule)') + ';'\n        };\n      }),\n      railCountLabel: (s.active + 1) + ' / ' + RAIL.length,\n      railCurrentLabel: RAIL[s.active] ? RAIL[s.active].label : RAIL[0].label,\n      railBarStyle: 'display:block;height:100%;width:' + (((s.active + 1) / RAIL.length) * 100) + '%;background:var(--ks3-accent);'\n    };\n  }\n\n  ladderVals() {\n    const s = this.state;\n    let score = 0;\n    RUNGS.forEach((r) => { if (s.answers[r.id] === r.options.findIndex((x) => x.correct)) score += 1; });\n    SELF_RUNGS.forEach((r) => {\n      const t = s.ticks[r.id] || [];\n      if (s.checked[r.id] && t.filter(Boolean).length === r.criteria.length) score += 1;\n    });\n    return {\n      markedRungs: RUNGS.map((r) => {\n        const chosen = s.answers[r.id];\n        const done = chosen !== null && chosen !== undefined;\n        const correctIndex = r.options.findIndex((x) => x.correct);\n        return {\n          title: r.title, question: r.question,\n          answered: done,\n          isRight: done && chosen === correctIndex,\n          isWrong: done && chosen !== correctIndex,\n          feedbackClass: 'ks3-feedback ' + (chosen === correctIndex ? 'is-correct' : 'is-wrong'),\n          feedbackWord: chosen === correctIndex ? 'Correct.' : 'Not this one.',\n          feedbackText: chosen === correctIndex ? '' : (done ? r.options[chosen].correction : ''),\n          options: r.options.map((op, i) => {\n            const isCorrect = done && i === correctIndex;\n            const isWrong = done && i === chosen && i !== correctIndex;\n            let cls = 'ks3-option';\n            if (done) cls += isCorrect ? ' is-correct' : (isWrong ? ' is-wrong' : ' is-spent');\n            return {\n              text: op.text, className: cls, letter: String.fromCharCode(65 + i),\n              isCorrect: isCorrect, isWrong: isWrong, showLetter: !isCorrect && !isWrong,\n              disabled: done,\n              onClick: () => this.setState((st) => {\n                if (st.answers[r.id] !== null && st.answers[r.id] !== undefined) return null;\n                return { answers: Object.assign({}, st.answers, { [r.id]: i }) };\n              })\n            };\n          })\n        };\n      }),\n      selfRungs: SELF_RUNGS.map((r) => {\n        const ticks = s.ticks[r.id] || [];\n        const met = ticks.filter(Boolean).length;\n        const all = met === r.criteria.length;\n        return {\n          title: r.title, question: r.question,\n          fieldId: 'ans-' + r.id, fieldLabel: r.fieldLabel, placeholder: r.placeholder,\n          value: s.text[r.id] || '', checked: !!s.checked[r.id],\n          onChange: (e) => this.setState((st) => ({ text: Object.assign({}, st.text, { [r.id]: e.target.value }) })),\n          onCheck: () => this.setState((st) => ({ checked: Object.assign({}, st.checked, { [r.id]: true }) })),\n          criteria: r.criteria.map((cr, i) => ({\n            id: r.id + '-c' + i, num: String(i + 1), text: cr, checked: !!ticks[i],\n            onToggle: () => this.setState((st) => {\n              const next = (st.ticks[r.id] || []).slice();\n              next[i] = !next[i];\n              return { ticks: Object.assign({}, st.ticks, { [r.id]: next }) };\n            })\n          })),\n          tallyClass: 'ks3-tally' + (all ? ' is-met' : ''),\n          tallyText: all ? 'All ' + r.criteria.length + ' ticked — rung met.' : met + ' of ' + r.criteria.length + ' ticked — not yet.'\n        };\n      }),\n      scoreLine: 'You got ' + score + ' of 4.',\n      scoreNote: 'You marked rungs 3 and 4 yourself.',\n      onRetry: () => this.setState({\n        answers: { r1: null, r2: null },\n        checked: { r3: false, r4: false },\n        ticks: { r3: [], r4: [] }\n      })\n    };\n  }\n\n  coverVals() {\n    const s = this.state;\n    return {\n      coverResult: COVERS[s.cover],\n      coverTop: s.cover === 'M',\n      coverLeft: s.cover === 'F',\n      coverRight: s.cover === 'd',\n      coverTabs: [\n    { id: 'M', label: 'Cover M' },\n    { id: 'F', label: 'Cover F' },\n    { id: 'd', label: 'Cover d' }\n  ].map((c) => ({\n    label: c.label, pressed: s.cover === c.id,\n    style: 'cursor:pointer;font:inherit;font-size:17px;font-weight:700;padding:11px 18px;min-height:44px;border-radius:var(--ks3-r-control);border:2px solid var(--ks3-ink);background:' +\n      (s.cover === c.id ? 'var(--ks3-ink)' : 'var(--ks3-card)') + ';color:' + (s.cover === c.id ? 'var(--ks3-on-dark)' : 'var(--ks3-ink)') + ';',\n    onClick: () => this.setState({ cover: c.id })\n  }))\n    };\n  }\n\n  benchVals() {\n    const s = this.state;\n    const handleW = Math.round(s.arm * ARM_SCALE);\n    const endX = 250 + handleW;\n    const fLen = Math.round(s.force * F_SCALE);\n    const fx = endX - 4;\n    return {\n      needLabel: NEED + ' N m',\n      benchProgress: Object.keys(s.touched).length ? 'Both controls live' : 'Change a control to begin',\n      gateOpen: s.gate === null,\n      gateOptions: [\n        { letter: 'A', text: 'It doubles — twice the distance from the pivot' },\n        { letter: 'B', text: 'It stays the same — you are pulling just as hard' },\n        { letter: 'C', text: 'It halves — the pull is spread over a longer handle' },\n        { letter: 'D', text: 'It quadruples — distance counts twice over' }\n      ].map((op, i) => ({\n        letter: op.letter, text: op.text,\n        pressed: s.gate === i,\n        onClick: () => this.setState({ gate: i })\n      })),\n      benchOpen: s.gate !== null,\n      armTabs: ARMS.map((a) => ({\n        label: a.toFixed(2) + ' m', pressed: s.arm === a,\n        style: this.seg(s.arm === a, true, false),\n        onClick: () => this.setState((st) => ({ arm: a, touched: Object.assign({}, st.touched, { arm: true }) }))\n      })),\n      forceValue: s.force,\n      onForce: (e) => this.setState((st) => ({ force: Number(e.target.value), touched: Object.assign({}, st.touched, { force: true }) })),\n      endX: endX,\n      handleW: handleW,\n      gripX: endX - 46,\n      forceShaft: 'M' + fx + ' 314 V' + (314 + Math.max(4, fLen - 22)),\n      forceHead: 'M' + fx + ' ' + (314 + fLen) + ' L' + (fx - 17) + ' ' + (314 + fLen - 24) + ' L' + (fx + 17) + ' ' + (314 + fLen - 24) + ' Z',\n      forceLabelStyle: 'position:absolute;left:' + (((fx + 22) / 1000) * 100).toFixed(2) + '%;top:' +\n        (((314 + fLen - 10) / 420) * 100).toFixed(2) +\n        '%;transform:translate(0,-50%);font-family:var(--ks3-font-mono);font-weight:500;font-size:clamp(10px,1.6vw,20px);color:#8FB7FF;white-space:nowrap;pointer-events:none;',\n      distLabelStyle: 'position:absolute;left:' + (((250 + handleW / 2) / 1000) * 100).toFixed(2) +\n        '%;top:40%;transform:translate(-50%,-50%);font-family:var(--ks3-font-mono);font-weight:500;font-size:clamp(10px,1.5vw,19px);color:#C6B9A7;white-space:nowrap;pointer-events:none;',\n      armLabel: this.arm2() + ' m',\n      forceLabel: s.force + ' N',\n      momentLabel: this.moment() + ' N m',\n      turns: this.turns(),\n      stuck: !this.turns(),\n      turnWord: this.turns() ? 'ENOUGH — IT TURNS' : 'NOT ENOUGH — IT HOLDS',\n      verdictWord: this.turns() ? 'Moves' : 'Does not budge',\n      benchAlt: 'A spanner drawn to scale with its handle ' + this.arm2() + ' metres from the centre of the nut, pulled at right angles with ' +\n        s.force + ' newtons, giving a moment of ' + this.moment() + ' newton metres' +\n        (this.turns() ? ', which is enough to turn the nut.' : ', which is not enough to turn the nut.'),\n      benchNote: this.benchNote()\n    };\n  }\n\n  buildVals() {\n    const s = this.state;\n    const M = this.moment();\n    const arm = this.arm2();\n    const committed = (s.formPick !== null ? 1 : 0) + (s.insertPick !== null ? 1 : 0) + (s.ansText.trim() && s.ansUnit ? 1 : 0);\n    const locked = s.buildOpen || committed < 3;\n    return {\n      workedProgress: 'Step ' + s.workedStep + ' of 4',\n      workedSteps: WORKED.slice(0, s.workedStep),\n      workedDone: s.workedStep >= 4,\n      workedBtnLabel: s.workedStep === 0 ? 'Show the first step' : (s.workedStep >= 4 ? 'All four shown' : 'Show the next step'),\n      workedBtnStyle: s.workedStep >= 4 ? 'opacity:.45;cursor:default;' : '',\n      onWorked: () => this.setState((st) => ({ workedStep: Math.min(4, st.workedStep + 1) })),\n\n      buildHead: 'Your spanner: ' + s.force + ' N at ' + arm + ' m from the pivot.',\n      formPicks: [\n        'moment = force × distance from the pivot',\n        'moment = force ÷ distance from the pivot',\n        'moment = force + distance from the pivot'\n      ].map((lab, i) => ({\n        label: lab, pressed: s.formPick === i, disabled: s.buildOpen,\n        style: this.seg(s.formPick === i, false, s.buildOpen) + 'font-family:var(--ks3-font-mono);font-weight:500;text-align:left;',\n        onClick: () => { if (!this.state.buildOpen) this.setState({ formPick: i }); }\n      })),\n      insertPicks: [\n        'moment = ' + s.force + ' N × ' + arm + ' m',\n        'moment = ' + s.force + ' N ÷ ' + arm + ' m',\n        'moment = ' + arm + ' m ÷ ' + s.force + ' N'\n      ].map((lab, i) => ({\n        label: lab, pressed: s.insertPick === i, disabled: s.buildOpen,\n        style: this.seg(s.insertPick === i, false, s.buildOpen) + 'font-family:var(--ks3-font-mono);font-weight:500;text-align:left;',\n        onClick: () => { if (!this.state.buildOpen) this.setState({ insertPick: i }); }\n      })),\n      ansValue: s.ansText,\n      onAns: (e) => this.setState({ ansText: e.target.value }),\n      unitValue: s.ansUnit,\n      onUnit: (e) => this.setState({ ansUnit: e.target.value }),\n      buildLocked: s.buildOpen,\n      buildBtnLocked: locked,\n      buildBtnStyle: locked ? 'opacity:.45;cursor:default;' : '',\n      buildProgress: s.buildOpen ? 'Opened' : committed + ' of 3 lines committed',\n      onBuild: () => this.setState({ buildOpen: true }),\n      buildOpen: s.buildOpen,\n      buildSteps: [\n        { letter: 'F', label: 'Formula', line: 'moment = force × distance from the pivot',\n          note: 'A product, so the triangle applies.' },\n        { letter: 'I', label: 'Insert', line: 'moment = ' + s.force + ' N × ' + arm + ' m',\n          note: 'Both values come straight off the bench above.' },\n
