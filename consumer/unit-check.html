<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#FBF3E6"/>
  <title>Unit check — MrBadmus</title>
  <link rel="preload" href="/shared/fonts/bricolage-grotesque-var-latin.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="/shared/fonts/instrument-sans-var-latin.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="stylesheet" href="/shared/tokens.css?v=bbfbe9e0"/>
  <link rel="stylesheet" href="/shared/ks3.css?v=a3a854bf"/>
  <link rel="stylesheet" href="/consumer/consumer.css"/>
  <style>
  /* ── consumer/unit-check.html — Design's `Child Unit Check.dc.html`, live —
     Her inline styles transcribed; repeated ones lifted with a `uc-` prefix.
     The options are the estate's own `.ks3-option` / `.ks3-options` /
     `.ks3-opt-mark` markup out of /shared/ks3.css — the same buttons a KS3
     lesson uses, which is the point: the child has been pressing them all
     term. Single column at every width. */

  body { padding: 0; margin: 0; background: #FBF3E6; }

  /* ⚠️ LOAD-BEARING, and it looks redundant. An AUTHOR `display` beats the UA
     stylesheet's `[hidden] { display: none }` regardless of specificity — the
     same trap shared/ks3.css documents at `.ks3-ticks[hidden]`. Every screen
     switch on this page is `el.hidden = …` over a class that sets its own
     `display` (flex/grid), so without this line the hidden screen renders
     anyway: found by screenshotting it, 2 Sep 2026. */
  [hidden] { display: none !important; }

  .uc-root {
    min-height: 100vh;
    background: var(--ks3-ground);
    color: var(--ks3-ink);
    font-family: var(--ks3-font-body);
    font-size: 19px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .uc-head {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 20px 14px; border-bottom: 2px solid var(--ks3-ink);
  }
  .uc-back {
    display: grid; place-items: center; width: 40px; height: 40px;
    margin-left: -8px; border-radius: 12px; color: var(--ks3-ink);
    text-decoration: none;
  }
  .uc-back .ks3-mark { width: 22px; height: 22px; }
  /* ⊕ Night 4: `min-width:0` so the title yields width to the clock and the
     sign-out control at 390px instead of overflowing the row. */
  .uc-title {
    flex: 1; min-width: 0;
    font-family: var(--ks3-font-display); font-weight: 800;
    font-size: 20px; letter-spacing: -.02em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .uc-timer {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    border-radius: 99px; border: 2px solid var(--ks3-ink);
    background: var(--ks3-card); color: var(--ks3-ink);
    font-family: var(--ks3-font-mono); font-size: 15px; font-weight: 500;
  }
  .uc-timer.is-low {
    border-color: var(--ks3-accent); background: var(--ks3-accent-tint);
    color: var(--ks3-accent-text);
  }
  .uc-timer .ks3-mark { width: 16px; height: 16px; }

  .uc-main { max-width: 600px; margin: 0 auto; padding: 26px 20px 80px; }

  .uc-eyebrow {
    margin: 0; font-family: var(--ks3-font-mono); font-size: 13px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--ks3-ink-muted);
  }
  .uc-h1 {
    margin: 10px 0 0; font-family: var(--ks3-font-display); font-weight: 800;
    font-size: 42px; line-height: .98; letter-spacing: -.035em;
  }

  .uc-facts { margin-top: 22px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .uc-fact {
    padding: 14px; border: 2px solid var(--ks3-ink); border-radius: 16px;
    background: var(--ks3-card); text-align: center;
  }
  .uc-fact-n {
    font-family: var(--ks3-font-display); font-weight: 800;
    font-size: 28px; letter-spacing: -.02em; line-height: 1;
  }
  .uc-fact-l { margin-top: 4px; font-size: 14px; color: var(--ks3-ink-muted); }

  .uc-prev {
    margin-top: 22px; padding: 20px;
    border: 2px solid var(--ks3-ink); border-radius: var(--ks3-r-card);
    background: var(--ks3-card); box-shadow: var(--ks3-shadow-block);
  }
  .uc-prev-when {
    margin: 0; font-family: var(--ks3-font-mono); font-size: 13px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--ks3-ink-muted);
  }
  .uc-prev-pct {
    margin: 6px 0 0; font-family: var(--ks3-font-display); font-weight: 800;
    font-size: 40px; letter-spacing: -.03em; line-height: 1;
  }
  .uc-prev p:last-child { margin: 8px 0 0; font-size: 16px; color: var(--ks3-ink-body); }

  .uc-rules {
    margin-top: 22px; padding: 20px 22px; border-radius: var(--ks3-r-dark);
    background: var(--ks3-ink); color: var(--ks3-on-dark);
    box-shadow: 6px 6px 0 var(--ks3-accent);
  }
  .uc-rules-label {
    margin: 0; font-family: var(--ks3-font-mono); font-size: 12px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--ks3-alert);
  }
  .uc-rules ul {
    margin: 10px 0 0; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 8px;
    font-size: 17px; color: var(--ks3-on-dark-body);
  }
  .uc-rules li { display: flex; gap: 10px; }
  .uc-rules li b { color: var(--ks3-alert); font-weight: 500; }

  .uc-go {
    margin-top: 22px; width: 100%; min-height: 58px;
    border: 2px solid var(--ks3-ink); border-radius: var(--ks3-r-control);
    background: var(--ks3-ink); color: var(--ks3-on-dark);
    font: inherit; font-weight: 700; font-size: 20px; cursor: pointer;
  }
  .uc-go[disabled] { opacity: var(--ks3-dim-spent); cursor: default; }

  /* ── run ── */
  .uc-progress { display: flex; gap: 5px; }
  .uc-progress button {
    flex: 1; height: 8px; border: 0; border-radius: 4px;
    background: var(--ks3-rule); cursor: pointer; padding: 0;
  }
  .uc-progress button.is-here { background: var(--ks3-accent); }
  .uc-progress button.is-done { background: var(--ks3-ink); }
  .uc-run-eyebrow {
    margin: 18px 0 0; font-family: var(--ks3-font-mono); font-size: 13px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--ks3-ink-muted);
  }
  .uc-q {
    margin: 10px 0 0; font-family: var(--ks3-font-display); font-weight: 800;
    font-size: 28px; line-height: 1.2; letter-spacing: -.03em;
  }
  .uc-short {
    margin-top: 20px; display: block; width: 100%; box-sizing: border-box;
    min-height: 56px; padding: 12px 16px;
    border: 2px solid var(--ks3-option-border); border-radius: var(--ks3-r-control);
    background: var(--ks3-card); font: inherit; font-size: 20px; color: var(--ks3-ink);
  }
  .uc-short-hint { margin: 8px 0 0; font-size: 15px; color: var(--ks3-ink-muted); }
  .uc-nav { margin-top: 26px; display: flex; gap: 10px; }
  .uc-nav button {
    min-height: 52px; border: 2px solid var(--ks3-ink);
    border-radius: var(--ks3-r-control); background: var(--ks3-card);
    color: var(--ks3-ink); font: inherit; font-weight: 700; font-size: 16px;
    cursor: pointer; padding: 0 18px;
  }
  .uc-nav .uc-next {
    flex: 1; background: var(--ks3-ink); color: var(--ks3-on-dark); font-size: 17px;
  }
  .uc-nav .uc-finish {
    flex: 1; border-color: var(--ks3-accent-text); background: var(--ks3-accent-text);
    color: #fff; font-size: 17px;
  }
  .uc-nav button[disabled] { opacity: .4; cursor: default; }
  .uc-skipped {
    margin: 14px 0 0; font-size: 15px; color: var(--ks3-ink-muted); text-align: center;
  }

  /* ── result ── */
  .uc-ladder { margin-top: 12px; padding: 26px 24px; }
  .uc-score-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .uc-score-label {
    margin: 0; font-family: var(--ks3-font-mono); font-size: 13px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--ks3-ink-muted);
  }
  .uc-pct {
    margin: 4px 0 0; font-family: var(--ks3-font-display); font-weight: 800;
    font-size: 64px; line-height: .95; letter-spacing: -.04em;
  }
  .uc-score-line { margin: 6px 0 0; font-size: 16px; color: var(--ks3-ink-muted); }
  .uc-best {
    padding: 8px 14px; border-radius: 99px;
    border: 2px solid var(--ks3-ok); background: var(--ks3-ok-tint);
    font-weight: 700; font-size: 14px; color: var(--ks3-ok-text); white-space: nowrap;
  }
  .uc-bars { margin-top: 22px; display: flex; flex-direction: column; gap: 12px; }
  .uc-bar-top { display: flex; justify-content: space-between; font-size: 16px; font-weight: 600; }
  .uc-bar-frac { font-family: var(--ks3-font-mono); font-weight: 500; color: var(--ks3-ink-muted); }
  .uc-bar-track {
    margin-top: 6px; height: 12px; border: 2px solid var(--ks3-ink);
    border-radius: 99px; background: var(--ks3-card); overflow: hidden;
  }
  .uc-bar-fill { height: 100%; }
  .uc-weak {
    margin-top: 18px; padding: 20px;
    border: 2px solid var(--ks3-ink); border-radius: var(--ks3-r-card);
    background: var(--ks3-alert-tint);
  }
  .uc-weak-label {
    margin: 0; font-family: var(--ks3-font-mono); font-size: 12px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--ks3-alert-text);
  }
  .uc-weak h3 {
    margin: 8px 0 0; font-family: var(--ks3-font-display); font-weight: 800;
    font-size: 24px; letter-spacing: -.02em; line-height: 1.15;
  }
  .uc-weak p { margin: 8px 0 0; font-size: 16px; color: var(--ks3-ink-body); }
  .uc-h2 {
    margin: 28px 0 0; font-family: var(--ks3-font-display); font-weight: 800;
    font-size: 24px; letter-spacing: -.025em;
  }
  .uc-review {
    margin: 12px 0 0; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 10px;
  }
  .uc-review li {
    display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px;
    border: 2px solid var(--ks3-ink); border-radius: 16px; background: var(--ks3-card);
  }
  .uc-review-n {
    display: grid; place-items: center; flex: 0 0 28px; height: 28px;
    border-radius: 9px; border: 2px solid var(--ks3-ink);
    background: var(--ks3-band); color: var(--ks3-ink-muted);
    font-family: var(--ks3-font-mono); font-size: 12px;
  }
  .uc-review-text { display: block; font-size: 16px; font-weight: 600; line-height: 1.35; }
  .uc-review-line { display: block; margin-top: 4px; font-size: 14px; color: var(--ks3-ink-muted); }
  /* ── Night 4: past attempts ──────────────────────────────────────────
     Design's own controls. `.uc-see` is her "See the breakdown" button, her
     inline style lifted verbatim; the review tick/cross block is her result
     screen's `r.border` / `r.bg` / `r.markBg` / `r.markFg` written as two
     classes instead of four interpolated colours. */
  .uc-see {
    margin-top: 12px; border: 0; background: none; padding: 0;
    font: inherit; font-weight: 700; font-size: 16px;
    color: var(--ks3-accent-text); cursor: pointer;
  }
  .uc-see[disabled] { opacity: var(--ks3-dim-spent); cursor: default; }

  .uc-review li.is-ok   { border-color: var(--ks3-ok); background: var(--ks3-ok-tint); }
  .uc-review li.is-miss { border-color: var(--ks3-ink); background: var(--ks3-card); }
  .uc-review-mark { flex: 0 0 28px; }
  .uc-review-mark .ks3-mark { width: 14px; height: 14px; }
  .uc-review li.is-ok   .uc-review-mark { background: var(--ks3-ok); color: #fff; }
  .uc-review li.is-miss .uc-review-mark { background: var(--ks3-ink); color: var(--ks3-on-dark); }

  .uc-practice-note {
    margin: 14px 0 0; font-size: 16px; color: var(--ks3-ink-muted);
  }

  .uc-others {
    margin: 12px 0 0; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 8px;
  }
  .uc-others button {
    width: 100%; box-sizing: border-box;
    display: flex; align-items: center; gap: 12px;
    min-height: var(--ks3-tap); padding: 12px 14px;
    border: 2px solid var(--ks3-rule-strong); border-radius: 14px;
    background: var(--ks3-card); color: var(--ks3-ink);
    font: inherit; font-size: 16px; text-align: left; cursor: pointer;
  }
  .uc-others button.is-on { border-color: var(--ks3-ink); background: var(--ks3-band); }
  .uc-other-name { flex: 1; min-width: 0; font-weight: 700; }
  .uc-other-when {
    font-family: var(--ks3-font-mono); font-size: 12px; color: var(--ks3-ink-muted);
    white-space: nowrap;
  }
  .uc-other-pct {
    flex: 0 0 auto; font-family: var(--ks3-font-display); font-weight: 800; font-size: 17px;
  }

  .uc-pair { margin-top: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .uc-pair button, .uc-pair a {
    display: flex; align-items: center; justify-content: center; min-height: 50px;
    border: 2px solid var(--ks3-ink); border-radius: var(--ks3-r-control);
    background: var(--ks3-card); color: var(--ks3-ink);
    font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; text-decoration: none;
  }
  .uc-pair .uc-solid { background: var(--ks3-ink); color: var(--ks3-on-dark); }

  .uc-oops {
    margin-top: 18px; padding: 18px 20px;
    border: 2px solid var(--ks3-ink); border-radius: var(--ks3-r-card);
    background: var(--ks3-alert-tint); font-size: 17px;
  }
  .uc-oops p { margin: 0; }
  .uc-oops p + p { margin-top: 6px; font-size: 16px; color: var(--ks3-ink-body); }
  </style>
</head>
<body>

<div class="rd uc-root" data-mode="ks3" id="c-main">
  <header class="uc-head">
    <a class="uc-back" id="uc-back" href="/consumer/today.html" aria-label="Back to today">
      <svg class="ks3-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <span class="uc-title">Unit check</span>
    <span class="uc-timer" id="uc-timer" hidden>
      <svg class="ks3-mark" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M10 3h4"/></svg>
      <span id="uc-clock">15:00</span>
    </span>
    <!-- Night 4, MRB-317 ruling 3. Hidden while the clock is running, for
         exactly the reason the back arrow is: there is no way out of a
         running check but handing in. -->
    <span id="uc-signout"></span>
  </header>

  <main class="uc-main" id="uc-main"></main>
</div>

<script src="/shared/config.js?v=d1fecb43"></script>
<script src="/consumer/consumer-common.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   consumer/unit-check.html — ten questions, fifteen minutes, one unit.
   MRB-317 Night 3. Design's `Child Unit Check.dc.html`, on the Night 2
   `/child/unit-check` routes.

   ── THE ANSWERS ARE NOT ON THIS PAGE, AND THAT IS THE DESIGN ───────────
   `/unit-check/start` returns stems and four bare option strings and
   nothing else — no correct index, no scheme. The marking happens on
   `/submit`. A child with DevTools open finds nothing in the payload worth
   finding, which is the only version of "don't cheat" that is actually
   true. Do not add a client-side score for responsiveness; it would
   require the answers.

   ── OPTIONS RENDER IN THE ORDER THE SERVER SENT THEM ───────────────────
   ⚠️ MRB-278. No sort, no shuffle, no "put the short one first". The
   backend seeds the option order from the attempt id, deterministically,
   and `verify_answer_positions.py` is the gate. A client that reorders
   would break a property the server went to trouble to guarantee.

   ── THE CLOCK IS A DEADLINE, NOT A DISPLAY ─────────────────────────────
   It counts from the moment the first question appears, and at zero it
   SUBMITS with whatever has been chosen so far. A timer that expires and
   then waits politely for a click is not a time limit, and a child who
   steps away mid-check must not come back to an attempt that silently
   never counted.

   ⚠️ `elapsed_s` is the wall-clock difference since start, NOT
   `limit - remaining`: the two disagree whenever the tab is backgrounded
   and the browser throttles setInterval. The backend is the authority on
   whether that elapsed time was legitimate, and it clamps.

   ── WHAT THE SUBMIT RESPONSE DOES NOT CARRY ────────────────────────────
   Design's "Question by question" list marks each question right or wrong
   and prints the correct answer. `/unit-check/submit` returns a per-TOPIC
   breakdown and nothing per question (API-CONTRACT §8), so the tick, the
   cross and the "Answer: …" line have no source. Rather than invent them
   from `chosen` — which this page cannot mark — the review renders what is
   true: the question, numbered, and what the child put. Reported as a gap.
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
  var C = window.MrBadmusConsumer;

  var params   = new URLSearchParams(window.location.search);
  var unitCode = params.get('unit');
  var workItem = params.get('work');
  /* Night 4 (MRB-317 ruling 4): `?view=history` opens the child's OWN past
     attempts instead of the start screen. With `unit` it is that unit's
     history; without one it is everything, newest first — which is also
     what makes this page answerable from Today, where no unit is known. */
  var wantHistory = params.get('view') === 'history';

  C.boot({ requireSession: true, signInPath: C.childLoginUrl, run: function (ctx) {
    var main  = document.getElementById('uc-main');
    var timer = document.getElementById('uc-timer');
    var clock = document.getElementById('uc-clock');
    var back  = document.getElementById('uc-back');
    back.href = C.href('/consumer/today.html');

    /* Night 4 (MRB-317 ruling 3). The two ways off this page — the back
       arrow and signing out — appear and disappear together, because they
       are the same rule: while the clock is running there is no exit but
       handing in, and a sign-out button mid-check would be a way to lose
       fifteen minutes of work by mis-tapping the top-right corner. */
    var signoutHost = document.getElementById('uc-signout');
    C.signOutControl(signoutHost, { sb: ctx.sb });
    function showExits(on) { back.hidden = !on; signoutHost.hidden = !on; }

    var unit = {}, previous = null, writable = false;
    var attempt = null;      // { attempt_id, time_limit_s, qs: [] }
    var chosen = {};         // question id → option index (or typed string)
    var at = 0;
    var startedAt = 0;
    var ticker = null;
    var submitting = false;
    var practiceRun = false; // this sitting is a retake
    var result = null, autoSubmitted = false;

    function esc(s) { return C.escapeHtml(s); }

    function clockText(s) {
      var m = Math.floor(s / 60), r = s % 60;
      return m + ':' + (r < 10 ? '0' : '') + r;
    }

    /* `?view=history` needs no unit: without one it is every check the child
       has finished, newest first, which is exactly what Today's "See how you
       did" can ask for. So the which-unit refusal below is skipped for it. */
    if (!unitCode && !wantHistory) {
      /* Design has no state for this — she is always opened with a unit.
         Written in her voice rather than left as a blank screen. */
      main.innerHTML =
        '<h1 class="uc-h1">Which unit?</h1>' +
        '<div class="uc-oops"><p>This page needs to know which unit to check.</p>' +
        '<p>Open it from your Today page and it will bring the unit with it.</p></div>' +
        '<div class="uc-pair" style="grid-template-columns:1fr"><a class="uc-solid" href="' +
        esc(C.href('/consumer/today.html')) + '">Back to today</a></div>';
      return;
    }

    /* ── start ─────────────────────────────────────────────────────────── */
    function loadStart() {
      return C.api('/api/consumer/child/unit-check?unit=' + encodeURIComponent(unitCode),
                   { token: ctx.token }).then(function (d) {
        d = d || {};
        unit = d.unit || {};
        previous = d.previous || null;
        practiceRun = !!previous;
        writable = C.guard(d.access, 'child').writable;
        document.title = (unit.name || 'Unit check') + ' — MrBadmus';
        paintStart();
      });
    }

    function paintStart() {
      timer.hidden = true;
      showExits(true);

      main.innerHTML =
        '<p class="uc-eyebrow">' +
          esc([unit.subject || null, unit.year != null ? ('Year ' + unit.year) : null]
              .filter(Boolean).join(' · ')) + '</p>' +
        '<h1 class="uc-h1">' + esc(unit.name || 'Unit check') + '</h1>' +

        '<div class="uc-facts">' +
          '<div class="uc-fact"><div class="uc-fact-n">' +
            esc(unit.count == null ? '—' : unit.count) +
            '</div><div class="uc-fact-l">questions</div></div>' +
          '<div class="uc-fact"><div class="uc-fact-n">' +
            esc(unit.minutes == null ? '—' : unit.minutes) +
            '</div><div class="uc-fact-l">minutes</div></div>' +
          '<div class="uc-fact"><div class="uc-fact-n">' +
            esc(unit.lessons == null ? '—' : unit.lessons) +
            '</div><div class="uc-fact-l">lessons covered</div></div>' +
        '</div>' +

        (previous
          ? ('<div class="uc-prev">' +
             '<p class="uc-prev-when">You took this on ' + esc(previous.date || '') + '</p>' +
             '<p class="uc-prev-pct">' + esc(previous.pct || '—') + '</p>' +
             '<p>That score is in your record and your personal best. A second go ' +
             'is practice: it shows in your own history, not in the record.</p>' +
             /* ⊕ Night 4 (MRB-317 ruling 4). Design drew this button and
                Night 3 dropped it: the only route that could answer it was
                guardian-only, so a child could not see their own marking.
                Her element, her copy, her styling — restored verbatim. */
             '<button class="uc-see" id="uc-see" type="button">See the breakdown</button>' +
             '</div>')
          : '') +

        '<div class="uc-rules">' +
          '<p class="uc-rules-label">Before you start</p>' +
          '<ul>' +
            '<li><b>1</b>The clock runs from the first question and doesn’t pause.</li>' +
            '<li><b>2</b>You can go back and change answers until you hand in.</li>' +
            '<li><b>3</b>No notes. It’s checking what stuck, not what you can find.</li>' +
          '</ul>' +
        '</div>' +

        (writable ? '' :
          '<div class="uc-oops"><p>You can’t start a check just now. Your finished ' +
          'work is still here. Ask your grown-up.</p></div>') +

        '<button class="uc-go" id="uc-start" type="button" data-write>' +
          (previous ? 'Practice run' : 'Start the clock') + '</button>' +
        '<div id="uc-error"></div>';

      C.applyWritable(main, writable);
      document.getElementById('uc-start').addEventListener('click', function () {
        begin(this);
      });
      var see = document.getElementById('uc-see');
      if (see) {
        see.addEventListener('click', function () {
          C.setBusy(see, true, 'Getting it…');
          loadHistory(unitCode).catch(function (e) {
            C.setBusy(see, false);
            showError(e.message);
          });
        });
      }
    }

    /* ── the run ───────────────────────────────────────────────────────── */
    function begin(btn) {
      C.setBusy(btn, true, 'Getting ready…');
      var body = { unit_code: unitCode };
      if (workItem) { body.work_item_id = workItem; }

      C.api('/api/consumer/child/unit-check/start',
            { method: 'POST', token: ctx.token, body: body })
        .then(function (d) {
          attempt = d || {};
          if (!attempt.qs || !attempt.qs.length) {
            C.setBusy(btn, false);
            return showError('There are no questions ready for this unit yet. ' +
                             'Try again tomorrow.');
          }
          chosen = {}; at = 0;
          autoSubmitted = false;
          startedAt = Date.now();
          showExits(false);            // no way out of a running clock but handing in
          paintRun();
          startClock();
        })
        .catch(function (e) {
          C.setBusy(btn, false);
          showError((e.code === 'org_locked' || e.status === 423)
            ? 'You can’t start a check just now. Ask your grown-up.'
            : e.message);
        });
    }

    function showError(msg) {
      var host = document.getElementById('uc-error');
      if (host) { host.innerHTML = '<div class="uc-oops"><p>' + esc(msg) + '</p></div>'; }
    }

    function remaining() {
      var limit = Number(attempt.time_limit_s || 900);
      return Math.max(0, limit - Math.floor((Date.now() - startedAt) / 1000));
    }

    function paintClock() {
      var s = remaining();
      clock.textContent = clockText(s);
      timer.className = 'uc-timer' + (s <= 60 ? ' is-low' : '');
      timer.hidden = false;
      return s;
    }

    function startClock() {
      if (ticker) { clearInterval(ticker); }
      paintClock();
      ticker = setInterval(function () {
        if (paintClock() <= 0) {
          clearInterval(ticker); ticker = null;
          submit(true);
        }
      }, 1000);
    }

    function answered(q) {
      var v = chosen[q.id];
      return v != null && v !== '';
    }

    function paintRun() {
      var q = attempt.qs[at];
      var picked = chosen[q.id];
      var total = attempt.qs.length;
      var isShort = q.short === true || !q.options || !q.options.length;
      var skipped = attempt.qs.filter(function (x) { return !answered(x); }).length;

      /* ⚠️ `.map` over `q.options` AS RECEIVED. See MRB-278 in the header. */
      var body = isShort
        /* Design's short-answer path. The KS3 assignment bank is MCQ-only,
           so nothing reaches it today; it is kept present and correct so
           that the day a short item is added, the page already renders it
           rather than showing a question with no way to answer. */
        ? ('<input class="uc-short" id="uc-typed" type="text" autocomplete="off" ' +
           'placeholder="Type your answer" value="' +
           esc(typeof picked === 'string' ? picked : '') + '"/>' +
           (q.unit ? ('<p class="uc-short-hint">Give your answer in ' +
                      esc(q.unit) + '.</p>') : ''))
        : ('<ul class="ks3-options" id="uc-options">' +
           q.options.map(function (opt, i) {
             return '<li><button class="ks3-option" type="button" data-opt="' + i +
               '" aria-pressed="' + (picked === i) + '">' +
               '<span class="ks3-opt-mark">' + 'ABCDEFGH'.charAt(i) + '</span>' +
               '<span class="ks3-opt-label">' + esc(opt) + '</span></button></li>';
           }).join('') + '</ul>');

      main.innerHTML =
        '<div class="uc-progress" id="uc-progress">' +
          attempt.qs.map(function (x, i) {
            var cls = i === at ? ' is-here' : (answered(x) ? ' is-done' : '');
            return '<button type="button" class="' + cls.trim() + '" data-jump="' + i +
              '" aria-label="Question ' + (i + 1) + '"></button>';
          }).join('') +
        '</div>' +
        '<p class="uc-run-eyebrow">Question ' + (at + 1) + ' of ' + total +
          (q.topic ? (' · ' + esc(q.topic)) : '') + '</p>' +
        '<h1 class="uc-q">' + esc(q.text || '') + '</h1>' +
        body +
        '<div class="uc-nav">' +
          '<button type="button" id="uc-prev"' + (at === 0 ? ' disabled' : '') + '>Back</button>' +
          (at < total - 1
            ? ('<button type="button" class="uc-next" id="uc-next">' +
               (answered(q) ? 'Next' : 'Skip for now') + '</button>')
            : '<button type="button" class="uc-finish" id="uc-finish">Hand in</button>') +
        '</div>' +
        (skipped > 0 && at === total - 1
          ? ('<p class="uc-skipped">' + skipped + ' unanswered. ' +
             'Tap a bar above to go back to one.</p>')
          : '');

      var opts = document.getElementById('uc-options');
      if (opts) {
        opts.addEventListener('click', function (e) {
          var b = e.target.closest ? e.target.closest('button[data-opt]') : null;
          if (!b) { return; }
          chosen[q.id] = Number(b.getAttribute('data-opt'));
          paintRun();
        });
      }
      var typed = document.getElementById('uc-typed');
      if (typed) {
        typed.addEventListener('input', function () { chosen[q.id] = typed.value; });
      }
      document.getElementById('uc-progress').addEventListener('click', function (e) {
        var b = e.target.closest ? e.target.closest('button[data-jump]') : null;
        if (!b) { return; }
        at = Number(b.getAttribute('data-jump'));
        paintRun();
      });
      document.getElementById('uc-prev').addEventListener('click', function () {
        at = Math.max(0, at - 1); paintRun();
      });
      var next = document.getElementById('uc-next');
      if (next) {
        next.addEventListener('click', function () {
          at = Math.min(total - 1, at + 1); paintRun();
        });
      }
      var fin = document.getElementById('uc-finish');
      if (fin) { fin.addEventListener('click', function () { submit(false); }); }
    }

    /* ── submit ────────────────────────────────────────────────────────── */
    function submit(auto) {
      if (submitting) { return; }          // the clock and a click can race
      submitting = true;
      autoSubmitted = !!auto;
      if (ticker) { clearInterval(ticker); ticker = null; }
      timer.hidden = true;

      var answers = attempt.qs.map(function (q) {
        // The option INDEX (or the typed string for a short item).
        return { id: q.id, chosen: (chosen[q.id] != null ? chosen[q.id] : null) };
      });
      var elapsed = Math.floor((Date.now() - startedAt) / 1000);

      main.innerHTML = '<p class="uc-eyebrow">' +
        (auto ? 'Time’s up' : 'Handing in') + '</p>' +
        '<h1 class="uc-h1">' + (auto ? 'Handing it in…' : 'Marking…') + '</h1>';

      C.api('/api/consumer/child/unit-check/submit', {
        method: 'POST', token: ctx.token,
        body: { attempt_id: attempt.attempt_id, answers: answers, elapsed_s: elapsed }
      }).then(function (d) {
        submitting = false;
        result = d || {};
        paintResult();
      }).catch(function (e) {
        submitting = false;
        /* The attempt is not lost — the backend has it. Say so, and give the
           button back, rather than leaving them on a dead screen wondering
           whether fifteen minutes just evaporated. */
        main.innerHTML =
          '<div class="uc-oops"><p>' + esc(e.message) + '</p>' +
          '<p>Your answers are still here. Press the button to hand them in again.</p>' +
          '</div>' +
          '<button class="uc-go" id="uc-retry" type="button">Try again</button>';
        document.getElementById('uc-retry').addEventListener('click', function () {
          submit(auto);
        });
      });
    }

    function paintResult() {
      showExits(true);
      var d = result || {};
      var breakdown = d.breakdown || [];
      var isBest = d.is_record === true;

      var spare = Math.max(0, Number(attempt.time_limit_s || 900) -
                              Number(d.elapsed_s != null ? d.elapsed_s : 0));
      var when = autoSubmitted ? 'Time ran out'
                               : ('Finished with ' + clockText(spare) + ' to spare');

      var bars = breakdown.map(function (b) {
        var of = Number(b.of || 0), got = Number(b.got || 0);
        var ratio = of ? (got / of) : 0;
        var colour = ratio === 1 ? 'var(--ks3-ok)'
                   : (ratio >= 0.5 ? 'var(--ks3-accent)' : 'var(--ks3-alert)');
        return '<div>' +
          '<div class="uc-bar-top"><span>' + esc(b.topic || '') + '</span>' +
          '<span class="uc-bar-frac">' + got + '/' + of + '</span></div>' +
          '<div class="uc-bar-track"><div class="uc-bar-fill" style="width:' +
            Math.round(ratio * 100) + '%;background:' + colour + '"></div></div>' +
        '</div>';
      }).join('');

      /* See the header: the submit response carries no per-question
         correctness, so this list numbers the questions and says what the
         child put. No tick, no cross, no invented "Answer: …". */
      var review = attempt.qs.map(function (q, i) {
        var v = chosen[q.id];
        var line;
        if (v == null || v === '') { line = 'No answer'; }
        else if (typeof v === 'number' && q.options && q.options[v] != null) {
          line = 'You chose ' + q.options[v];
        } else { line = 'You wrote “' + v + '”'; }
        return '<li><span class="uc-review-n">' + (i + 1) + '</span>' +
          '<span><span class="uc-review-text">' + esc(q.text || '') + '</span>' +
          '<span class="uc-review-line">' + esc(line) + '</span></span></li>';
      }).join('');

      main.innerHTML =
        '<p class="uc-eyebrow">' + esc(unit.name || '') + ' · ' + esc(when) + '</p>' +

        '<div class="ks3-ladder uc-ladder">' +
          '<div class="uc-score-row">' +
            '<div>' +
              '<p class="uc-score-label">Your score</p>' +
              '<p class="uc-pct">' + esc(d.pct == null ? '—' : (d.pct + '%')) + '</p>' +
              '<p class="uc-score-line">' + esc(d.score == null ? '' :
                 (d.score + ' of ' + d.max + ' correct')) + '</p>' +
            '</div>' +
            /* A practice run is never a record, and the server is the one
               that says so — `is_record` is false on every retake because
               the FIRST completed sitting is the record. This never
               second-guesses it in either direction. */
            (isBest ? '<span class="uc-best">Personal best</span>' : '') +
          '</div>' +
          (bars ? ('<div class="uc-bars">' + bars + '</div>') : '') +
        '</div>' +

        (d.weakest
          ? ('<div class="uc-weak"><p class="uc-weak-label">Work on next</p>' +
             '<h3>' + esc(d.weakest) + '</h3>' +
             (d.weak_note ? ('<p>' + esc(d.weak_note) + '</p>') : '') + '</div>')
          : '') +

        '<h2 class="uc-h2">Question by question</h2>' +
        '<ul class="uc-review">' + review + '</ul>' +

        '<div class="uc-pair">' +
          '<button type="button" id="uc-again" data-write>Practice again</button>' +
          '<a class="uc-solid" href="' + esc(C.href('/consumer/today.html')) +
            '">Back to today</a>' +
        '</div>';

      C.applyWritable(main, writable);
      document.getElementById('uc-again').addEventListener('click', function () {
        /* Straight back to her start screen, re-read so `previous` now
           carries THIS sitting and the button reads "Practice run". */
        result = null; attempt = null;
        loadStart().catch(function (e) {
          main.innerHTML = '<div class="uc-oops"><p>' + esc(e.message) + '</p></div>';
        });
      });
      window.scrollTo(0, 0);
    }

    /* ══ PAST ATTEMPTS — "See how you did" (Night 4, MRB-317 ruling 4) ═══

       Design drew a "See the breakdown" button on the already-taken card and
       a full result screen behind it. Night 3 shipped neither, for one
       reason: the only route that could answer it, `/children/:id/unit-checks`,
       is guardian-only, so the child who SAT the check was the one person on
       the estate who could not look at it. `/child/unit-checks` is that same
       read with the child as the caller.

       ── ONE RENDERER, HERS ───────────────────────────────────────────────
       This is `paintResult()`'s screen, not a second design: the same score
       ladder, the same topic bars, the same "Work on next", the same
       question-by-question list. What a HISTORY row can do that a
       just-submitted one cannot is mark each question right or wrong —
       `paintResult()` deliberately shows no tick and no cross because
       `/unit-check/submit` sends no per-question correctness, and this route
       does. So the ticks and crosses appear here, as Design drew them, and
       nothing is invented on either screen.

       ── THE SHAPE IS READ DEFENSIVELY, ON PURPOSE ────────────────────────
       ⚠️ Two routes now return an attempt and they do NOT agree about names.
       The guardian route sends `unit` = the unit NAME with `unit_code`
       beside it, a `date` already in words, `max`, `pct`, `is_record`, and
       breakdown rows of `{ topic, got, of }`. The child route was specified
       with `unit` = the CODE and `unit_title` = the name, `taken_at` as an
       ISO instant, `max_score`, `percent`, `is_best`, and breakdown rows of
       `{ subtopic, correct, total }`. `normalise()` reads both and this page
       holds an opinion about neither — the same reason `schemePoint()` in
       consumer-common.js reads two shapes of a mark-scheme point. If a third
       arrives, it is one function to widen. */

    var history = null;      // normalised attempts, newest first
    var historyAt = 0;

    function normalise(a) {
      a = a || {};
      /* `unit_title` present means `unit` is the CODE; absent means `unit`
         is already the name. Nothing else can tell the two apart. */
      var name = a.unit_title || a.unit_name || (a.unit_title === undefined && a.unit) || null;
      if (a.unit_title) { name = a.unit_title; }
      var code = a.unit_code || (a.unit_title ? a.unit : null) || null;

      var pct = a.pct;
      if (pct == null && a.percent != null) { pct = a.percent + '%'; }
      var max = a.max != null ? a.max : a.max_score;
      if (pct == null && max) { pct = Math.round((Number(a.score) / Number(max)) * 100) + '%'; }

      var when = a.date || null;
      var iso = a.taken_at || a.completed_at || null;
      if (!when && iso) { when = C.fmtDate(iso, ''); }

      return {
        id: a.id,
        name: name || code || 'Unit check',
        code: code,
        subject: a.subject || '',
        when: when || '',
        score: a.score,
        max: max,
        pct: pct,
        isBest: a.is_record === true || a.is_best === true,
        isPractice: a.is_practice === true,
        minutes: a.minutes,
        weakest: a.weakest || null,
        weakNote: a.weak_note || null,
        breakdown: (a.breakdown || []).map(function (b) {
          return {
            topic: b.topic || b.subtopic || '',
            got: b.got != null ? b.got : b.correct,
            of: b.of != null ? b.of : b.total
          };
        }),
        questions: (a.questions || []).map(function (q) {
          return {
            text: q.stem || q.text || q.ref || '',
            chosen: q.chosen,
            correct: q.correct,
            ok: q.is_correct === true
          };
        })
      };
    }

    function loadHistory(code) {
      var path = '/api/consumer/child/unit-checks' +
                 (code ? ('?unit=' + encodeURIComponent(code)) : '');
      return C.api(path, { token: ctx.token }).then(function (d) {
        var rows = (d && (d.attempts || d.checks || d.unit_checks)) || [];
        history = rows.map(normalise);
        historyAt = 0;
        if (!history.length) { return paintNoHistory(code); }
        paintHistory();
      });
    }

    function paintNoHistory(code) {
      showExits(true);
      timer.hidden = true;
      main.innerHTML =
        '<h1 class="uc-h1">Nothing to look at yet</h1>' +
        '<div class="uc-oops"><p>You haven’t finished a unit check ' +
        (code ? 'for this unit ' : '') + 'yet. Once you have, your score and ' +
        'the question-by-question breakdown live here.</p></div>' +
        '<div class="uc-pair"><button type="button" id="uc-hist-back">Back</button>' +
        '<a class="uc-solid" href="' + esc(C.href('/consumer/today.html')) +
        '">Back to today</a></div>';
      document.getElementById('uc-hist-back').addEventListener('click', backFromHistory);
    }

    function backFromHistory() {
      if (unitCode) {
        return loadStart().catch(function (e) {
          main.innerHTML = '<div class="uc-oops"><p>' + esc(e.message) + '</p></div>';
        });
      }
      window.location.href = C.href('/consumer/today.html');
    }

    /* Design's review line, exactly: what the child put, and — only when
       they got it wrong — what the answer was. A right answer is never
       followed by "Answer: …", because it would be the same sentence twice. */
    function reviewLine(q) {
      var given;
      if (q.chosen == null || q.chosen === '') { given = 'No answer'; }
      else if (typeof q.chosen === 'number') { given = 'You chose ' + 'ABCDEFGH'.charAt(q.chosen); }
      else { given = 'You chose ' + q.chosen; }
      if (q.ok) { return given; }
      return q.correct ? (given + '. Answer: ' + q.correct + '.') : given;
    }

    function paintHistory() {
      showExits(true);
      timer.hidden = true;
      var a = history[historyAt];
      document.title = (a.name || 'Unit check') + ' — MrBadmus';

      var bars = a.breakdown.map(function (b) {
        var of = Number(b.of || 0), got = Number(b.got || 0);
        var ratio = of ? (got / of) : 0;
        var colour = ratio === 1 ? 'var(--ks3-ok)'
                   : (ratio >= 0.5 ? 'var(--ks3-accent)' : 'var(--ks3-alert)');
        return '<div>' +
          '<div class="uc-bar-top"><span>' + esc(b.topic) + '</span>' +
          '<span class="uc-bar-frac">' + got + '/' + of + '</span></div>' +
          '<div class="uc-bar-track"><div class="uc-bar-fill" style="width:' +
            Math.round(ratio * 100) + '%;background:' + colour + '"></div></div>' +
        '</div>';
      }).join('');

      var review = a.questions.map(function (q, i) {
        var ok = q.ok;
        var mark = ok
          ? '<svg class="ks3-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'
          : '<svg class="ks3-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
        return '<li class="' + (ok ? 'is-ok' : 'is-miss') + '">' +
          '<span class="uc-review-n uc-review-mark">' + mark + '</span>' +
          '<span><span class="uc-review-text">' + esc(q.text) + '</span>' +
          '<span class="uc-review-line">' + esc(reviewLine(q)) + '</span></span></li>';
      }).join('');

      /* The other goes. Only rendered when there is more than one, so a
         child with a single check never reads a list of one. */
      var others = history.length > 1
        ? ('<h2 class="uc-h2">Your other goes</h2><ul class="uc-others">' +
           history.map(function (h, i) {
             return '<li><button type="button" data-go="' + i + '"' +
               (i === historyAt ? ' class="is-on" aria-current="true"' : '') + '>' +
               '<span class="uc-other-name">' + esc(h.name) + '</span>' +
               '<span class="uc-other-when">' + esc(h.when || '') + '</span>' +
               '<span class="uc-other-pct">' + esc(h.pct || '—') + '</span>' +
               '</button></li>';
           }).join('') + '</ul>')
        : '';

      main.innerHTML =
        '<p class="uc-eyebrow">' +
          esc([a.name, a.when].filter(Boolean).join(' · ')) + '</p>' +

        '<div class="ks3-ladder uc-ladder">' +
          '<div class="uc-score-row">' +
            '<div>' +
              '<p class="uc-score-label">Your score</p>' +
              '<p class="uc-pct">' + esc(a.pct == null ? '—' : a.pct) + '</p>' +
              '<p class="uc-score-line">' + esc(a.score == null ? '' :
                 (a.score + ' of ' + a.max + ' correct')) + '</p>' +
            '</div>' +
            (a.isBest ? '<span class="uc-best">Personal best</span>' : '') +
          '</div>' +
          (bars ? ('<div class="uc-bars">' + bars + '</div>') : '') +
        '</div>' +

        (a.isPractice
          ? '<p class="uc-practice-note">This one was a practice run. It shows in ' +
            'your own history, not in the record.</p>'
          : '') +

        (a.weakest
          ? ('<div class="uc-weak"><p class="uc-weak-label">Work on next</p>' +
             '<h3>' + esc(a.weakest) + '</h3>' +
             (a.weakNote ? ('<p>' + esc(a.weakNote) + '</p>') : '') + '</div>')
          : '') +

        (review
          ? ('<h2 class="uc-h2">Question by question</h2>' +
             '<ul class="uc-review">' + review + '</ul>')
          : '') +

        others +

        '<div class="uc-pair">' +
          '<button type="button" id="uc-hist-back">' +
            (unitCode ? 'Take it again' : 'Back') + '</button>' +
          '<a class="uc-solid" href="' + esc(C.href('/consumer/today.html')) +
            '">Back to today</a>' +
        '</div>';

      document.getElementById('uc-hist-back').addEventListener('click', backFromHistory);
      var list = main.querySelector('.uc-others');
      if (list) {
        list.addEventListener('click', function (e) {
          var b = e.target.closest ? e.target.closest('button[data-go]') : null;
          if (!b) { return; }
          historyAt = Number(b.getAttribute('data-go'));
          paintHistory();
        });
      }
      window.scrollTo(0, 0);
    }

    window.addEventListener('beforeunload', function () {
      if (ticker) { clearInterval(ticker); }
    });

    var first = wantHistory ? loadHistory(unitCode) : loadStart();
    return first.catch(function (e) {
      main.innerHTML = '<div class="uc-oops"><p>' + esc(e.message) + '</p>' +
        '<p>Try again in a moment, or go back to your Today page.</p></div>';
    });
  }});
})();
</script>
</body>
</html>
