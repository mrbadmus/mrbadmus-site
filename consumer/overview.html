  function renderChatList() {
    var host = document.getElementById('dk-chatlist');
    if (!host) { return; }
    var k = child();
    if (!k) { return; }
    if (S.msgs && S.msgs.error) {
      C.fail(host, S.msgs.error, 'Messages may not be switched on for this environment yet.');
      return;
    }
    var msgs = Array.isArray(S.msgs) ? S.msgs : null;
    if (msgs === null) {
      host.innerHTML = '<p style="font-size:15px;color:var(--ks3-ink-muted)">Loading…</p>';
      return;
    }
    if (!msgs.length && !S.writable) {
      host.innerHTML = '<p style="margin:auto 0;font-size:15px;color:var(--ks3-ink-muted);' +
        'text-align:center">No messages yet.</p>';
      return;
    }
    if (!msgs.length) {
      host.innerHTML = '<div class="dk-dashed" style="margin:auto 0">' +
        '<p style="margin:0;font-family:var(--ks3-font-display);font-weight:800;font-size:22px;' +
          'letter-spacing:-.02em">Nothing here yet</p>' +
        '<p style="margin:8px 0 0;font-size:15px;color:var(--ks3-ink-body)">A short message lands on ' +
          esc(k.first_name) + '’s Today screen the next time they open it.</p>' +
        '<div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center">' +
        CHAT_STARTERS.map(function (t) {
          return '<button data-act="starter" data-text="' + esc(t) + '" style="padding:8px 14px;' +
            'border:2px solid var(--ks3-rule-strong);border-radius:99px;background:var(--ks3-card);' +
            'font-size:14px;font-weight:600;color:var(--ks3-ink);cursor:pointer">' + esc(t) + '</button>';
        }).join('') + '</div></div>';
      return;
    }
    host.innerHTML = msgs.map(function (m) {
      var mine = m.who === 'you' || m.mine === true;
      return '<div style="display:flex;flex-direction:column;align-items:' +
          (mine ? 'flex-end' : 'flex-start') + '">' +
        '<div style="max-width:82%;padding:12px 16px;border:2px solid var(--ks3-ink);border-radius:18px;' +
          'background:' + (mine ? 'var(--ks3-ink)' : 'var(--ks3-card)') + ';color:' +
          (mine ? 'var(--ks3-on-dark)' : 'var(--ks3-ink)') +
          ';font-size:16px;line-height:1.45;white-space:pre-wrap;word-break:break-word">' +
          esc(m.text || '') + '</div>' +
        '<span style="margin-top:4px;font-family:var(--ks3-font-mono);font-size:11px;' +
          'color:var(--ks3-ink-muted)">' + esc(mine ? 'You' : k.first_name) + ' · ' +
          esc(m.time || C.fmtTime(m.created_at)) + '</span></div>';
    }).join('');
    var wrap = document.getElementById('c-main');
    if (wrap) { window.scrollTo(0, document.body.scrollHeight); }
  }

  function viewAnswers() {
    var k = child();
    if (!k) { return noChild(); }
    if (S.answers && S.answers.error) {
      return '<div class="dk-narrow" style="max-width:720px"><div id="dk-answers-fail"></div></div>';
    }
    var list = Array.isArray(S.answers) ? S.answers : null;

    if (S.answerId && list) {
      var a = null;
      for (var i = 0; i < list.length; i++) { if (String(list[i].id) === String(S.answerId)) { a = list[i]; } }
      if (a) { return answerDetail(k, a); }
    }

    var head = '<p class="dk-kicker dk-kicker-page">' + esc(k.first_name) + ' · exam answers</p>' +
      '<h1 class="dk-h1">Marked answers</h1>' +
      '<p style="margin:12px 0 0;font-size:16px;color:var(--ks3-ink-body)">Every answer is marked ' +
        'instantly against the mark scheme. ' + esc(k.first_name) + ' can send two a month to ' +
        'Mr Badmus for a human mark.' +
        (k.humanLeft != null
          ? (' <strong style="color:var(--ks3-ink)">' + esc(String(k.humanLeft)) + ' left this month.</strong>')
          : '') + '</p>';

    if (list === null) {
      return '<div class="dk-narrow" style="max-width:720px">' + head +
        '<p style="margin-top:20px;font-size:15px;color:var(--ks3-ink-muted)">Loading…</p></div>';
    }
    if (!list.length) {
      return '<div class="dk-narrow" style="max-width:720px">' + head +
        '<div class="dk-dashed" style="margin-top:22px">' +
        '<p style="margin:0;font-family:var(--ks3-font-display);font-weight:800;font-size:22px;' +
          'letter-spacing:-.02em">No exam answers yet</p>' +
        '<p style="margin:8px 0 0;font-size:15px;color:var(--ks3-ink-body)">They appear here as soon ' +
          'as ' + esc(k.first_name) + ' writes one.' +
          (S.writable ? ' You could set a 4-marker from “Set work”.' : '') + '</p>' +
        '</div></div>';
    }

    return '<div class="dk-narrow" style="max-width:720px">' + head +
      '<div style="margin-top:20px;display:flex;flex-direction:column;gap:12px">' +
      list.map(function (a) {
        var status = a.human ? 'Marked by Mr Badmus' : (a.waiting ? 'With Mr Badmus' : 'Instant mark');
        var border = a.human ? 'var(--ks3-ink)' : 'var(--ks3-rule-strong)';
        var bg = a.human ? 'var(--ks3-ink)' : 'var(--ks3-band)';
        var fg = a.human ? 'var(--ks3-on-dark)' : 'var(--ks3-ink-muted)';
        var score = a.human ? ((a.humanScore || '') + ' · Mr Badmus') : (a.aiScore || '');
        return '<button data-act="open-answer" data-id="' + esc(a.id) + '" ' +
          'style="text-align:left;display:block;width:100%;padding:16px 18px;' +
          'border:2px solid var(--ks3-ink);border-radius:var(--ks3-r-card);background:var(--ks3-card);' +
          'box-shadow:var(--ks3-shadow-card);color:var(--ks3-ink);cursor:pointer">' +
          '<div style="display:flex;align-items:center;gap:10px">' +
            '<span style="font-family:var(--ks3-font-mono);font-size:12px;letter-spacing:.08em;' +
              'text-transform:uppercase;color:var(--ks3-ink-muted)">' + esc(shortDate(a.date)) +
              (a.marks != null ? (' · ' + esc(String(a.marks)) + '-marker') : '') + '</span>' +
            '<span style="margin-left:auto;padding:4px 10px;border-radius:99px;border:2px solid ' +
              border + ';background:' + bg + ';font-size:12px;font-weight:700;color:' + fg + '">' +
              esc(status) + '</span></div>' +
          '<p style="margin:8px 0 0;font-size:17px;font-weight:600;line-height:1.35">' +
            esc(a.question || '') + '</p>' +
          '<p style="margin:8px 0 0;font-family:var(--ks3-font-display);font-weight:800;font-size:24px;' +
            'letter-spacing:-.02em">' + esc(score) + '</p></button>';
      }).join('') + '</div></div>';
  }

  function answerDetail(k, a) {
    var points = (a.points || []).map(function (p) {
      var border = p.ok ? 'var(--ks3-ok)' : 'var(--ks3-rule-strong)';
      var bg = p.ok ? 'var(--ks3-ok-tint)' : 'var(--ks3-card)';
      var fg = p.ok ? 'var(--ks3-ok-text)' : 'var(--ks3-ink-muted)';
      return '<li style="display:flex;gap:10px;align-items:baseline;font-size:15px;' +
        'color:var(--ks3-ink-body)">' +
        '<span style="display:grid;place-items:center;flex:0 0 22px;height:22px;border-radius:7px;' +
          'border:2px solid ' + border + ';background:' + bg + ';color:' + fg + ';' +
          'font-family:var(--ks3-font-mono);font-size:11px">' + esc(String(p.n)) + '</span>' +
        '<span>' + esc(p.text || C.schemePoint(p)) + '</span></li>';
    }).join('');

    return '<div class="dk-narrow" style="max-width:720px">' +
      '<p class="dk-kicker dk-kicker-page">' +
        esc([shortDate(a.date), a.marks != null ? (a.marks + ' marks') : null, a.topic]
            .filter(Boolean).join(' · ')) + '</p>' +
      '<h1 style="margin:8px 0 0;font-family:var(--ks3-font-display);font-weight:800;font-size:26px;' +
        'line-height:1.15;letter-spacing:-.03em">' + esc(a.question || '') + '</h1>' +
      '<div style="margin-top:18px;padding:18px;border:2px solid var(--ks3-option-border);' +
        'border-radius:var(--ks3-r-panel);background:var(--ks3-card)">' +
        '<p class="dk-kicker" style="font-size:12px">' + esc(k.first_name) + ' wrote</p>' +
        '<p style="margin:8px 0 0;font-size:17px;line-height:1.6;color:var(--ks3-ink-body);' +
          'white-space:pre-wrap">' + esc(a.answer || '') + '</p></div>' +
      '<div style="margin-top:14px;padding:18px;border:2px solid var(--ks3-ink);' +
        'border-radius:var(--ks3-r-panel);background:var(--ks3-inset)">' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">' +
          '<p class="dk-kicker" style="font-size:12px">Instant mark · against the mark scheme</p>' +
          '<span style="font-family:var(--ks3-font-display);font-weight:800;font-size:26px;' +
            'letter-spacing:-.02em">' + esc(a.aiScore || '') + '</span></div>' +
        (points ? ('<ul style="margin:12px 0 0;padding:0;list-style:none;display:flex;' +
                   'flex-direction:column;gap:8px">' + points + '</ul>') : '') +
        (a.aiFeedback ? ('<p style="margin:14px 0 0;font-size:16px;line-height:1.55;' +
          'color:var(--ks3-ink-body)">' + esc(a.aiFeedback) + '</p>') : '') + '</div>' +
      (a.human
        ? ('<div class="dk-dark" style="margin-top:14px">' +
           '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">' +
           '<p style="margin:0;font-family:var(--ks3-font-mono);font-size:12px;letter-spacing:.12em;' +
             'text-transform:uppercase;color:var(--ks3-alert)">Mr Badmus marked this' +
             (a.humanDate ? (' · ' + esc(shortDate(a.humanDate))) : '') + '</p>' +
           '<span style="font-family:var(--ks3-font-display);font-weight:800;font-size:26px;' +
             'letter-spacing:-.02em">' + esc(a.humanScore || '') + '</span></div>' +
           '<p style="margin:12px 0 0;font-size:17px;line-height:1.55;color:var(--ks3-on-dark-body)">' +
             esc(a.humanFeedback || '') + '</p></div>')
        : '') +
      (a.waiting
        ? ('<div style="margin-top:14px;padding:16px 18px;border:2px dashed var(--ks3-rule-strong);' +
           'border-radius:var(--ks3-r-panel);background:var(--ks3-inset);font-size:15px;' +
           'color:var(--ks3-ink-body)"><strong style="color:var(--ks3-ink)">Sent to Mr Badmus.</strong> ' +
           'He marks within three school days. You’ll get an email when it lands.</div>')
        : '') + '</div>';
  }

  function viewManage() {
    var k = child();
    if (!k) { return noChild(); }
    var e = S.edit || {
      first_name: k.first_name, year_group: Number(k.year_group),
      exam_board: k.exam_board || null, tier: k.tier || null,
      pathway: k.pathway || null, mode: k.mode, intensity: k.intensity
    };
    S.edit = e;
    var gcse = Number(e.year_group) >= 10;

    function optRow(items, val, act, cols, size) {
      return '<div style="display:grid;grid-template-columns:repeat(' + cols + ',1fr);gap:8px">' +
        items.map(function (o) {
          return '<button class="ks3-option" aria-pressed="' +
            (String(o.value) === String(val) ? 'true' : 'false') + '" data-act="' + act +
            '" data-id="' + esc(String(o.value)) + '" ' +
            'style="justify-content:center;padding:10px 4px;font-size:' + (size || 15) + 'px">' +
            esc(o.label) + '</button>';
        }).join('') + '</div>';
    }

    var html = '<div class="dk-narrow">' +
      '<h1 style="margin:0;font-family:var(--ks3-font-display);font-weight:800;font-size:34px;' +
        'line-height:1.02;letter-spacing:-.035em">' + esc(k.first_name) + '’s settings</h1>' +
      '<div id="dk-msg"></div>' +

      '<section class="dk-card-flat" style="margin-top:22px">' +
        '<p class="dk-kicker">How much work</p>' +
        '<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">' +
        Object.keys(INTENSITY).map(function (key) {
          return '<button class="ks3-option" aria-pressed="' +
            (e.intensity === key ? 'true' : 'false') + '" data-act="pick-intensity" data-id="' + key +
            '" style="padding:12px 14px">' +
            '<span style="flex:1">' + esc(INTENSITY[key].label) + '</span>' +
            '<span style="font-family:var(--ks3-font-mono);font-size:13px;color:var(--ks3-ink-muted)">' +
              esc(INTENSITY[key].per) + '</span></button>';
        }).join('') + '</div>' +
        '<p style="margin:12px 0 0;font-size:14px;color:var(--ks3-ink-muted)">Changes from next ' +
          'Sunday. This week’s work stays as set.</p></section>' +

      '<section class="dk-card-flat" style="margin-top:16px">' +
        '<p class="dk-kicker">Details</p>' +
        '<label style="display:block;margin-top:12px;font-weight:700;font-size:15px;' +
          'color:var(--ks3-ink-muted)">First name' +
          '<input id="dk-name" class="dk-field" value="' + esc(e.first_name || '') + '" ' +
            'maxlength="60"></label>' +
        '<p style="margin:14px 0 6px;font-weight:700;font-size:15px;color:var(--ks3-ink-muted)">' +
          'Year group</p>' +
        optRow(YEARS.map(function (y) { return { value: y, label: 'Y' + y }; }),
               e.year_group, 'pick-year', 5, 16);

    if (gcse) {
      html += '<p style="margin:14px 0 6px;font-weight:700;font-size:15px;color:var(--ks3-ink-muted)">Board</p>' +
        optRow(BOARDS.map(function (b) { return { value: b, label: b }; }), e.exam_board, 'pick-board', 3) +
        '<p style="margin:14px 0 6px;font-weight:700;font-size:15px;color:var(--ks3-ink-muted)">Route</p>' +
        optRow(ROUTES.map(function (r) { return { value: r.toLowerCase(), label: r }; }),
               e.pathway, 'pick-route', 2) +
        '<p style="margin:14px 0 6px;font-weight:700;font-size:15px;color:var(--ks3-ink-muted)">Tier</p>' +
        optRow(TIERS.map(function (t) {
          return { value: t === 'Not decided' ? '' : t.toLowerCase(), label: t };
        }), e.tier || '', 'pick-tier', 3);
    }

    html += '<p style="margin:14px 0 6px;font-weight:700;font-size:15px;color:var(--ks3-ink-muted)">Mode</p>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
      [{ id: 'alongside_school', label: 'Alongside school' },
       { id: 'home_education', label: 'Home education' }].map(function (m) {
        return '<button class="ks3-option" aria-pressed="' + (e.mode === m.id ? 'true' : 'false') +
          '" data-act="pick-mode" data-id="' + m.id + '" ' +
          'style="justify-content:center;padding:12px 6px;font-size:15px">' + esc(m.label) + '</button>';
      }).join('') + '</div>' +
      '<p style="margin:12px 0 0;font-size:14px;color:var(--ks3-ink-muted)">Changing year or mode ' +
        're-plans next week’s work. Nothing already done is lost.</p></section>' +

      '<section class="dk-card-flat" style="margin-top:16px">' +
        '<p class="dk-kicker">Login</p>' +
        '<div class="dk-row-band" style="margin-top:12px"><span>Username</span>' +
          '<span class="dk-mono">' + esc(k.username || '—') + '</span></div>' +
        (S.newPass
          ? ('<div style="margin-top:12px;padding:14px 16px;border:2px solid var(--ks3-ok);' +
             'border-radius:var(--ks3-r-panel);background:var(--ks3-ok-tint)">' +
             '<p style="margin:0;font-size:14px;font-weight:700;color:var(--ks3-ok-text)">' +
               'New password · write it down now</p>' +
             '<p style="margin:6px 0 0;font-family:var(--ks3-font-mono);font-size:24px;font-weight:500;' +
               'letter-spacing:.02em" id="dk-newpass">' + esc(S.newPass) + '</p>' +
             '<p style="margin:6px 0 0;font-size:14px;color:var(--ks3-ink-body)">It won’t be shown ' +
               'again. ' + esc(k.first_name) + ' can change it after logging in.</p></div>')
          : ('<button data-act="reset-pass" style="margin-top:12px;width:100%;' +
             'min-height:48px;border:2px solid var(--ks3-ink);border-radius:var(--ks3-r-control);' +
             'background:var(--ks3-band);font-weight:700;font-size:16px;color:var(--ks3-ink);' +
             'cursor:pointer">Reset password</button>' +
             '<p style="margin:8px 0 0;font-size:14px;color:var(--ks3-ink-muted)">Makes a new one and ' +
             'shows it here once. The old one stops working straight away.</p>')) +
      '</section>' +

      '<button data-act="save-manage" class="dk-btn-ink" style="margin-top:22px">' +
        'Save changes</button>' +

      '<section style="margin-top:34px;padding-top:20px;border-top:2px solid var(--ks3-rule)">' +
      (S.confirmRemove
        ? ('<div style="padding:18px;border:2px solid var(--ks3-ink);border-radius:var(--ks3-r-panel);' +
           'background:var(--ks3-alert-tint)">' +
           '<p style="margin:0;font-weight:700;font-size:17px">Remove ' + esc(k.first_name) + '?</p>' +
           '<p style="margin:8px 0 0;font-size:15px;color:var(--ks3-ink-body)">Their login stops ' +
             'working today. ' + esc(removeBilling()) + ' Their reports and marked answers stay in ' +
             'your account for a year.</p>' +
           '<div style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
             '<button data-act="cancel-remove" style="min-height:46px;border:2px solid var(--ks3-ink);' +
               'border-radius:var(--ks3-r-control);background:var(--ks3-card);font-weight:700;' +
               'font-size:15px;color:var(--ks3-ink);cursor:pointer">Keep ' + esc(k.first_name) + '</button>' +
             '<button data-act="do-remove" style="min-height:46px;' +
               'border:2px solid var(--ks3-ink);border-radius:var(--ks3-r-control);background:var(--ks3-ink);' +
               'color:var(--ks3-on-dark);font-weight:700;font-size:15px;cursor:pointer">Remove</button>' +
           '</div></div>')
        : ('<button class="dk-btn-quiet" data-act="ask-remove">Remove ' + esc(k.first_name) +
           ' from the account</button>')) +
      '</section></div>';
    return html;
  }

  function removeBilling() {
    if (S.kids.length > 1) {
      var t = tier(S.billing.interval);
      return t ? ('Your next bill drops by ' + money(t.rest) + '.') : 'Your next bill goes down.';
    }
    return 'With no children left, the subscription is cancelled at the end of this period.';
  }

  function noChild() {
    return '<div class="dk-narrow"><p class="dk-kicker dk-kicker-page">Nothing to show</p>' +
      '<h1 class="dk-h1">No child selected</h1>' +
      '<p style="margin:12px 0 0;font-size:16px;color:var(--ks3-ink-body)">Go back to your family ' +
      'and choose one.</p></div>';
  }

  /* ═══ render ══════════════════════════════════════════════════════════ */
  function render() {
    /* Set work cannot be used by a family that cannot write, so its screen
       is not reachable either — a bookmarked ?view=setwork lands on the
       child it was for. */
    if (!S.writable && S.view === 'setwork') { S.view = 'child'; }
    renderShell();
    var host = document.getElementById('c-main');
    if (S.view === 'child')          { host.innerHTML = viewChild(); }
    else if (S.view === 'setwork')   { host.innerHTML = viewSetWork(); }
    else if (S.view === 'chat')      { host.innerHTML = viewChat(); renderChatList(); }
    else if (S.view === 'answers')   { host.innerHTML = viewAnswers(); }
    else if (S.view === 'manage')    { host.innerHTML = viewManage(); }
    else                             { host.innerHTML = viewOverview(); }

    if (S.view === 'answers' && S.answers && S.answers.error) {
      C.fail(document.getElementById('dk-answers-fail'), S.answers.error,
             'Exam marking may not be switched on for this environment yet.');
    }
    bindInputs();
    mountTopic();
  }

  function mountTopic() {
    var host = document.getElementById('dk-topic');
    var k = child();
    if (!host || !k || !curriculum || !Array.isArray(S.picker)) { return; }
    window.MrBadmusTopicPicker.mount(host, {
      index: curriculum, units: S.picker, state: S.tp,
      child: { year: k.year_group, pathway: k.pathway, tier: k.tier },
      listLabel: 'Topics for ' + k.first_name,
      onChange: function (sel) { S.topic = sel; }
    });
  }

  /* Inputs keep their value in state so a re-render never loses a half-typed
     message, and they do NOT re-render on every keystroke — a page that
     rebuilds itself per character loses the caret. */
  function bindInputs() {
    var d = document.getElementById('dk-draft');
    if (d) {
      d.addEventListener('input', function () { S.draft = d.value; });
      d.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); send(); }
      });
    }
    var n = document.getElementById('dk-note');
    if (n) { n.addEventListener('input', function () { S.note = n.value; }); }
    var nm = document.getElementById('dk-name');
    if (nm) { nm.addEventListener('input', function () { S.edit.first_name = nm.value; }); }
  }

  function msg(text, kind) {
    var el = document.getElementById('dk-msg');
    if (!el) { return; }
    if (!text) { el.innerHTML = ''; return; }
    var alert = kind === 'error';
    el.innerHTML = '<div style="margin-top:16px;padding:12px 15px;border:2px solid ' +
      (alert ? 'var(--ks3-alert-border)' : 'var(--ks3-ok)') + ';border-radius:var(--ks3-r-panel);' +
      'background:' + (alert ? 'var(--ks3-alert-tint)' : 'var(--ks3-ok-tint)') + ';color:' +
      (alert ? 'var(--ks3-alert-text)' : 'var(--ks3-ok-text)') + ';font-size:15px">' +
      esc(text) + '</div>';
  }

  /* ═══ actions ═════════════════════════════════════════════════════════ */
  function childPath(suffix) {
    return '/api/consumer/children/' + encodeURIComponent(child().id) + suffix;
  }

  function reloadFamily() {
    return loadFamily().then(function () { render(); });
  }

  function send() {
    var k = child();
    var text = (S.draft || '').trim();
    if (!text) { return; }
    S.draft = '';
    var input = document.getElementById('dk-draft');
    if (input) { input.value = ''; }
    C.api('/api/consumer/chat/send', {
      method: 'POST', token: ctx.token, body: { to: k.id, text: text }
    }).then(function () { return loadChat(k, true); })
      .catch(function (e) { S.draft = text; if (input) { input.value = text; } msg(e.message, 'error'); });
  }

  function addChildHref() { return C.href('/consumer/signup.html', { step: 'child' }); }

  /* The one checkout path (consumer-common.js, ruling 1). The failure line
     lands in the gate banner's own slot, under the row. */
  function checkout(el) {
    return C.startCheckout(el, {
      token: ctx.token,
      interval: S.billing.interval === 'year' ? 'year' : 'month',
      addChildHref: addChildHref(),
      msgHost: document.getElementById('dk-gate-msg') || undefined
    });
  }

  var ACTS = {
    'tab-home': function () { go('overview'); },
    'tab-chat': function () { S.readMarkedFor = null; go('chat', { fromChild: false }); },
    'back': function () {
      if (S.view === 'answers' && S.answerId) { S.answerId = null; return render(); }
      if (S.view === 'child' || (S.view === 'chat' && !S.fromChild)) { return go('overview'); }
      go('child');
    },
    'open-child': function (el) { S.childId = el.getAttribute('data-id'); go('child'); },
    'open-chat': function () { S.readMarkedFor = null; go('chat', { fromChild: true }); },
    'open-setwork': function () { go('setwork'); },
    'open-answers': function () { go('answers'); },
    'open-manage': function () { S.edit = null; S.newPass = ''; S.confirmRemove = false; go('manage'); },
    'open-answer': function (el) { S.answerId = el.getAttribute('data-id'); render(); window.scrollTo(0, 0); },
    'starter': function (el) {
      S.draft = el.getAttribute('data-text');
      var d = document.getElementById('dk-draft');
      if (d) { d.value = S.draft; d.focus(); }
    },
    'send': function () { send(); },
    'checkout': function (el) { checkout(el); },

    'pick-kind': function (el) { S.workKind = el.getAttribute('data-id'); render(); },
    'pick-due':  function (el) { S.due = el.getAttribute('data-id'); render(); },

    'pick-intensity': function (el) { S.edit.intensity = el.getAttribute('data-id'); render(); },
    'pick-year':  function (el) { S.edit.year_group = Number(el.getAttribute('data-id')); render(); },
    'pick-board': function (el) { S.edit.exam_board = el.getAttribute('data-id'); render(); },
    'pick-route': function (el) { S.edit.pathway = el.getAttribute('data-id'); render(); },
    'pick-tier':  function (el) { S.edit.tier = el.getAttribute('data-id') || null; render(); },
    'pick-mode':  function (el) { S.edit.mode = el.getAttribute('data-id'); render(); },

    'ask-remove':    function () { S.confirmRemove = true; render(); },
    'cancel-remove': function () { S.confirmRemove = false; render(); },

    'pause': function (el) {
      var k = child(), want = !k.paused;
      C.setBusy(el, true, 'Saving…');
      C.api(childPath('/pause'), { method: 'POST', token: ctx.token, body: { paused: want } })
        .then(function () { return reloadFamily(); })
        .then(function () {
          msg(want
            ? (child().first_name + '’s plan is paused. Nothing new will be set until you start it again.')
            : (child().first_name + '’s plan is running again.'), 'ok');
        })
        .catch(function (e) { C.setBusy(el, false); msg(e.message, 'error'); });
    },

    'remove-work': function (el) {
      var id = el.getAttribute('data-id');
      C.setBusy(el, true, '…');
      C.api(childPath('/work/' + encodeURIComponent(id)), { method: 'DELETE', token: ctx.token })
        .then(function () { return reloadFamily(); })
        .then(function () { msg('Taken off their week.', 'ok'); })
        .catch(function (e) {
          C.setBusy(el, false);
          /* The contract's 409: a done item is a record and is never
             removable. Say that, not the code. */
          msg(e.code === 'not_removable'
            ? 'That one is already done, so it stays on the record.'
            : e.message, 'error');
        });
    },

    'submit-work': function (el) {
      var k = child();
      var t = S.topic;
      if (S.workKind !== 'exam' && !t) { return msg('Choose a topic first.', 'error'); }
      var body = { kind: S.workKind, scheduled_for: dueDate(S.due) };
      if (S.workKind !== 'exam') {
        if (t.level === 'lesson' && t.slug) { body.lesson_slug = t.slug; }
        else { body.unit_code = t.unitCode || t.unitName; }
      }
      if (S.note) { body.note = S.note; }
      C.setBusy(el, true, 'Setting…');
      C.api(childPath('/work'), { method: 'POST', token: ctx.token, body: body })
        .then(function () { S.note = ''; return reloadFamily(); })
        .then(function () {
          go('child');
          msg('Set. ' + k.first_name + ' will see it with your name on it.', 'ok');
        })
        .catch(function (e) { C.setBusy(el, false); msg(e.message, 'error'); });
    },

    'reset-pass': function (el) {
      /* `{}` asks the backend to generate one and hand it back ONCE
         (night3-api §C6). It is never stored here and never emailed. */
      C.setBusy(el, true, 'Making one…');
      C.api(childPath('/password'), { method: 'POST', token: ctx.token, body: {} })
        .then(function (d) {
          if (d && d.password) { S.newPass = d.password; render(); return; }
          C.setBusy(el, false);
          msg('The new password wasn’t returned, so there is nothing to show you. ' +
              'Please try again.', 'error');
        })
        .catch(function (e) { C.setBusy(el, false); msg(e.message, 'error'); });
    },

    'save-manage': function (el) {
      var k = child(), e = S.edit;
      var body = {
        first_name: e.first_name, year_group: e.year_group, mode: e.mode,
        intensity: e.intensity
      };
      if (Number(e.year_group) >= 10) {
        body.exam_board = e.exam_board;
        body.tier = e.tier;
        body.pathway = e.pathway;
      }
      var replan = String(e.year_group) !== String(k.year_group) || e.mode !== k.mode;
      var cursors = (k.position && k.position.cursors) || null;
      C.setBusy(el, true, 'Saving…');
      C.api('/api/consumer/children/' + encodeURIComponent(k.id), {
        method: 'PATCH', token: ctx.token, body: body
      }).then(function () {
        /* Year and mode change which scheme of work the child is on, so the
           cursors have to be re-anchored against the new one. Sending the
           cursors back is what does that: the route clamps each to the new
           scheme's length and returns fresh labels. Nothing already done is
           touched. */
        if (replan && cursors && Object.keys(cursors).length) {
          return C.api(childPath('/position'), {
            method: 'POST', token: ctx.token, body: { cursors: cursors }
          }).catch(function (err) { console.error('[dash/position]', err); });
        }
      }).then(function () {
        S.edit = null;
        return reloadFamily();
      }).then(function () {
        go('child');
        msg('Saved.', 'ok');
      }).catch(function (err) { C.setBusy(el, false); msg(err.message, 'error'); });
    },

    'do-remove': function (el) {
      var k = child();
      C.setBusy(el, true, 'Removing…');
      C.api('/api/consumer/children/' + encodeURIComponent(k.id), {
        method: 'DELETE', token: ctx.token
      }).then(function () {
        S.childId = null;
        S.confirmRemove = false;
        S.edit = null;
        return loadFamily();
      }).then(function () {
        go('overview');
        msg(k.first_name + ' has been removed.', 'ok');
      }).catch(function (e) { C.setBusy(el, false); msg(e.message, 'error'); });
    }
  };

  /* The four due-day labels Design drew, resolved to the next real date each
     one names. On a Wednesday "Thu" is tomorrow; on a Friday it is next
     Thursday. Never a date in the past — work set for yesterday is work
     nobody will see. */
  function dueDate(label) {
    var want = DUE_DOW[label];
    var d = new Date();
    d.setHours(12, 0, 0, 0);
    var add = (want - d.getDay() + 7) % 7;
    d.setDate(d.getDate() + add);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  document.getElementById('dk-root').addEventListener('click', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!el) { return; }
    var act = ACTS[el.getAttribute('data-act')];
    if (!act) { return; }
    ev.preventDefault();
    /* ⊕ B2C repair (ruling 3). Every new action starts with a clean slate:
       a message belongs to the press that caused it, and one left over from
       an earlier press (a stale "Add a child first") reads as the answer to
       this one. */
    msg('');
    var gm = document.getElementById('dk-gate-msg');
    if (gm && el.getAttribute('data-act') !== 'checkout') { gm.innerHTML = ''; }
    act(el);
  });

  /* ═══ boot ════════════════════════════════════════════════════════════ */
  C.boot({ requireSession: true, run: function (context) {
    ctx = context;
    if (VIEWS.indexOf(S.view) === -1) { S.view = 'overview'; }

    /* ONE binding, `event: '*'`. Two bindings on one channel subscribe
       cleanly and deliver nothing — see subscribeMessages(). */
    var rt = C.subscribeMessages(ctx.sb, function (row) {
      if (!row) { return; }
      var k = child();
      var forOpenChild = k && (String(row.sender_id) === String(k.id) ||
                               String(row.recipient_id) === String(k.id));
      if (forOpenChild && S.view === 'chat') { loadChat(k, true); return; }
      /* Not the open thread: the badge counts still have to move, and the
         family read is what owns them. */
      loadFamily().then(renderShell).catch(function () {});
    });
    window.addEventListener('beforeunload', function () { rt.unsubscribe(); });

    /* ⊕ B2C repair (ruling 4, B7). A parent who comes BACK to this tab —
       from Stripe with the Back button (the page is restored from the
       back/forward cache, frozen as it was), or from another tab where they
       added a child — used to see the family as it was when they left.
       Re-read it on both. Not while they are typing: then only the shell
       (banners, badges) is redrawn, so a half-written message keeps its
       caret. */
    var lastLoad = Date.now();
    function refresh() {
      if (Date.now() - lastLoad < 2000) { return; }
      lastLoad = Date.now();
      loadFamily().then(function () {
        var a = document.activeElement;
        if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { renderShell(); }
        else { render(); afterNav(); }
      }).catch(function (e) { console.error('[dash/refresh]', e); });
    }
    window.addEventListener('pageshow', function (ev) {
      if (ev.persisted) { lastLoad = 0; refresh(); }
    });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') { refresh(); }
    });

    return Promise.all([loadFamily(), loadPrices()])
      .then(function () {
        lastLoad = Date.now();
        render();
        afterNav();
        return loadThreads().then(function () { if (S.view === 'child') { render(); } });
      })
      .catch(function (e) {
        C.fail(document.getElementById('c-main'), e.message,
               'Refresh in a moment. If it keeps happening, email support@mrbadmus.com.');
      });
  } });
})();
</script>
