  /* ═══════════════════════════════════════════════════════════════════════
     consumer/overview.html — the parent dashboard. MRB-317 Night 3.

     Claude Design's `Parent Dashboard.dc.html`, compiled onto the Night 1–2
     plumbing. Her per-element inline styles ARE the design; the ones that
     repeat across screens are lifted here under her own `dk-` prefix and the
     one-offs stay inline exactly as she wrote them. No new tokens: every
     colour, radius and shadow below is a `--ks3-*` out of /shared/ks3.css.

     ⚠️ consumer.css puts 84px of padding on `body` (the Night 1 scaffold
     nav was fixed). Design's page owns the whole viewport, so that padding
     is removed here — but `display:none` is NOT touched. It is the flag
     gate, and only `boot()` may reveal the page.
     ═══════════════════════════════════════════════════════════════════════ */
  body {
    margin: 0;
    padding: 0;
    background: #FBF3E6;
    font-size: 17px;
  }
  a { color: #A93411; text-decoration: none; }
  a:hover { color: #7F2408; text-decoration: underline; }
  /* ⊕ B2C repair (3 Oct 2026, ruling 7): the two literals above are the
     LIGHT accent pair and do not flip — 2.35:1 on the dark band, 2.62:1 on
     the dark card. In dark, links take the theme's own accent text. */
  /* `:where()` keeps this at the bare `a` rule's own weight, so a link
     that styles itself with a class (a tile, a filled CTA) still wins —
     exactly as it does over the light rule above. */
  :where(html[data-theme="dark"] .rd) a { color: var(--ks3-accent-text); }
  :where(html[data-theme="dark"] .rd) a:hover { color: var(--ks3-accent-hover); }
  input, select, textarea, button { font: inherit; }
  input::placeholder, textarea::placeholder { color: #9A8F86; }
  /* ⊕ B2C onboarding repair: #9A8F86 is 3.08:1 on the light card (Set work's
     note box and topic search). Inside the token scope, the theme's muted ink. */
  .rd input::placeholder, .rd textarea::placeholder { color: var(--ks3-ink-muted); }

  .dk-root {
    /* Text ON the accent-text fill (the CTAs, the unread pill). White in
       light; in dark the fill is a light peach and white on it is 2.02:1. */
    --dk-on-accent: #FFFFFF;
    min-height: 100vh;
    background: var(--ks3-ground);
    color: var(--ks3-ink);
    font-family: var(--ks3-font-body);
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 84px;
  }
  .dk-side { display: none; }

  /* ── the repeated pieces ─────────────────────────────────────────────── */

    font-family: var(--ks3-font-mono);

  /* ⊕ B2C repair (ruling 2). The ONE line a family that cannot write sees —
     not started, ended, or read-only — with its one action. Unlike

  .dk-gate {

  .dk-gate-btn {

    padding: 0 18px;

  }
  .dk-gate-link { font-weight: 700; white-space: nowrap; }
  .dk-gate .c-checkout-msg { max-width: 560px; }
  .dk-banner-alert {
    background: var(--ks3-alert-tint);
    border-bottom-color: var(--ks3-alert-border);
    color: var(--ks3-alert-text);
  }
  .dk-mobilehead {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px 14px;
    border-bottom: 2px solid var(--ks3-ink);
  }
  /* ⊕ One mark (Mide, 13 Sep 2026): `.dk-brandword` retired — the brand is
     the one lockup (`C.brandLockup`), styled by shared/brand/brand.css. */
  .dk-main { max-width: 560px; margin: 0 auto; padding: 24px 20px 40px; }
  .dk-cta {
    margin-top: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 50px;
    padding: 0 22px;
    border: 2px solid var(--ks3-ink);
    border-radius: var(--ks3-r-control);
    background: var(--ks3-ink);
    color: var(--ks3-on-dark);
    font-weight: 700;
    font-size: 17px;
    text-decoration: none;
  }
  .dk-cta:hover { color: var(--ks3-on-dark); text-decoration: none; }
  .dk-tabbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;

    flex-direction: column;

  /* ── Design's desktop layout, at her own 960 breakpoint ──────────────── */
  @media (min-width: 960px) {
    .dk-root { display: grid; grid-template-columns: 272px 1fr; padding-bottom: 0; }
    .dk-side {
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      box-sizing: border-box;
      border-right: 2px solid #221E1B;
      background: #FFFCF5;
      padding: 22px 20px 24px;
      overflow-y: auto;
    }
    .dk-mobilehead, .dk-tabbar, .dk-banner { display: none !important; }
    /* The action sits right after the sentence, not at the far edge where
       the fixed theme switcher covers it. */
    .dk-gate { padding: 14px 48px; }
    .dk-gate-row > span { flex: 0 1 auto; }
    .dk-main { max-width: 1080px; padding: 44px 48px 80px; }
    .dk-cols { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 24px; align-items: start; }
    .dk-cards { display: grid !important; grid-template-columns: 1fr 1fr; flex-direction: unset !important; }
    .dk-narrow { max-width: 640px; }
    .dk-chat { min-height: calc(100vh - 200px) !important; }
    .dk-composer { position: static !important; }
    .dk-work { margin-top: 0 !important; }
  }

  /* ⊕ B2C repair (3 Oct 2026, ruling 7). Dark mode. The sidebar was a
     literal cream (#FFFCF5) under a wordmark and nav that follow the theme,
     so in dark the brand read 1.08:1 and every nav label 1.15:1. And
     Design's ink "nudge" card is filled with --ks3-ink, which dark turns
     cream — the same flip KS3 handles for its own ink panels in
     ks3-theme.css, so the same remap is applied here, page-locally. */
  html[data-theme="dark"] .dk-root { --dk-on-accent: #16120E; }
  @media (min-width: 960px) {
    html[data-theme="dark"] .dk-side {
      border-right-color: var(--ks3-ink);
      background: var(--ks3-card);
    }
  }
  html[data-theme="dark"] .rd .dk-dark {
    --ks3-on-dark-body: #2E2419;
    --ks3-on-dark-muted: #4A3C2E;
    --ks3-alert: #5A430A;
  }

  /* MRB-327 a11y (WCAG 2.4.7 Focus Visible). #dk-draft carried
     `outline:none` in its inline style, so the message composer was the one
     control on the parent dashboard a keyboard user could focus with no
     indication whatsoever. The ring is drawn INSIDE the field
     (outline-offset:-2px) so it reads as part of Design's bordered composer
     rather than a second box around it. */
  #dk-draft:focus-visible {
    outline: 2px solid var(--ks3-ink);
    outline-offset: -2px;
    border-radius: 8px;
  }
  </style>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   consumer/overview.html — six screens, one page. MRB-317, Night 3.

   Design drew overview / child / set work / chat / marked answers (+ detail)
   / settings as one component with a `screen` in its state, a bottom tab bar
   on a phone and a left sidebar from 960px up. This is that component, with
   every `const` in her file replaced by a real read.

   ── WHY ONE PAGE AND NOT SIX ───────────────────────────────────────────
   Because `GET /api/consumer/family` answers five of the six screens in one
   call. A parent tapping from the overview into a child, into their week,
   into a message, is moving inside data that is already in memory; six
   documents would refetch the family six times and lose the chat draft on
   every hop. The URL still carries the position — `?child=…&view=…` with
   `history.pushState` — so a screen is linkable, the browser Back button
   works, and a reload lands where the parent was.

   ── WHAT IS NOT INVENTED ───────────────────────────────────────────────
   Design's mock computes several sentences from numbers she made up: "20
   minutes on task" as `done × 15`, "usually logs in around 7.30pm",
   "Personal best on the last one", "Unit check next Friday", "£5.99". Every
   one of those is either computed from a real field here or DROPPED. A
   sentence on a page about somebody's child that nobody can trace to a
   source is worse than a shorter page. Each drop is listed in the run
   report; the shape and the voice of her copy are kept exactly.

   Prices come from `GET /api/consumer/pricing` (or the shared `pricing()`
   helper when the public lane's addition has landed). There is no price
   constant in this file.

   ── ACCESS vs BILLING ──────────────────────────────────────────────────
   `billing.state` chooses the banner Design drew. `billing.access` decides
   whether anything may be written, through `guard()`. They are different
   words for different questions and a card that failed yesterday is
   `past_due` (billing) and still `full` (access).

   ⊕ B2C repair (3 Oct 2026, Mide's ruling 2). A family that cannot write
   used to get every `[data-write]` control greyed with a bare `disabled`
   and no reason — including Reset password, Remove, Edit and Pause, which
   the backend allows in every state. Now: the controls the backend REFUSES
   when access is not `full` (Set work, the message box and Send — the only
   parent routes behind requireWritable/writableHere) are not drawn at all,
   one line at the top says why (`gateHtml()`), and everything else works.
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
  var C = window.MrBadmusConsumer;
  var esc = C.escapeHtml;

  /* ── Design's constants, kept as she wrote them ─────────────────────── */
  var YEARS  = [7, 8, 9, 10, 11];
  var BOARDS = ['AQA', 'Edexcel', 'OCR'];
  var TIERS  = ['Foundation', 'Higher', 'Not decided'];
  var ROUTES = ['Combined', 'Triple'];
  /* Her three intensities, keyed on the API's words. "Standard" is her
     label for what the backend calls `steady`; the label is hers and the
     key is the contract's, so neither has to bend. */
  var INTENSITY = {
    light:  { label: 'Light',    per: '2 a week' },
    steady: { label: 'Standard', per: '3 a week' },
    full:   { label: 'Full',     per: '4–5 a week' }
  };
  /* Her three kinds. Her second id was `retrieval`; the contract's word for
     the same thing is `practice`, so the id below is the contract's and the
     label and description are hers, verbatim. */
  var WORK_KINDS = [
    { id: 'lesson',   label: 'A lesson',        desc: 'A full 20-minute lesson on a topic.' },
    { id: 'practice', label: 'Quick questions', desc: 'Eight short recall questions, 10 minutes.' },
    { id: 'exam',     label: 'An exam question', desc: 'One 4- or 6-marker, marked instantly.' }
  ];
  var CHAT_STARTERS = ['How did today go?', 'Proud of you for keeping the streak.',
                       'Anything you want help with?'];
  var DAY_LABELS = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  var DUE_DAYS = ['Thu', 'Fri', 'Sat', 'Sun'];
  var DUE_DOW  = { Thu: 4, Fri: 5, Sat: 6, Sun: 0 };

  var MODE_TO_API = { school: 'alongside_school', home: 'home_education' };
  var MODE_FROM_API = { alongside_school: 'school', home_education: 'home' };

  var MARK = {
    tick:  '<path d="M5 12.5l4.5 4.5L19 7"/>',
    cross: '<path d="M6 6l12 12M18 6L6 18"/>',
    back:  '<path d="M15 5l-7 7 7 7"/>',
    home:  '<path d="M4 11l8-7 8 7v9H4z"/>',
    chat:  '<path d="M4 5h16v11H9l-5 4z"/>',
    user:  '<circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
    plus:  '<path d="M12 5v14M5 12h14"/>',
    send:  '<path d="M5 12h14M13 6l6 6-6 6"/>'
  };
  function svg(d, size) {
    return '<svg class="ks3-mark" viewBox="0 0 24 24" aria-hidden="true"' +
      (size ? (' style="width:' + size + 'px;height:' + size + 'px"') : '') + '>' + d + '</svg>';
  }

  /* ── formatting ─────────────────────────────────────────────────────── */
  var MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
                     'August', 'September', 'October', 'November', 'December'];
  /* Design's dates are en-GB "4 September". `toLocaleDateString` would give
     that too, but only on a machine whose locale agrees — and this is the
     date a parent reads as "when am I charged". Spelled out here so it is
     the same everywhere. Unparseable in, null out: a caller decides what an
     absent date is allowed to say, and nothing here guesses. */
  function dayMonth(iso) {
    if (!iso) { return null; }
    var d = new Date(iso);
    if (isNaN(d.getTime())) { return null; }
    return d.getDate() + ' ' + MONTHS_LONG[d.getMonth()];
  }
  function plusDaysISO(iso, n) {
    if (!iso) { return null; }
    var d = new Date(iso);
    if (isNaN(d.getTime())) { return null; }
    d.setDate(d.getDate() + n);
    return d.toISOString();
  }
  /* "yesterday, 7.40pm" — Design's shape for `lastActive`. */
  function whenLabel(iso) {
    if (!iso) { return null; }
    var d = new Date(iso);
    if (isNaN(d.getTime())) { return null; }
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var that = new Date(d); that.setHours(0, 0, 0, 0);
    var days = Math.round((today - that) / 86400000);
    var h = d.getHours(), m = d.getMinutes();
    var suffix = h < 12 ? 'am' : 'pm';
    h = h % 12; if (h === 0) { h = 12; }
    var time = h + '.' + (m < 10 ? '0' : '') + m + suffix;
    if (days === 0) { return 'today, ' + time; }
    if (days === 1) { return 'yesterday, ' + time; }
    if (days < 7) { return days + ' days ago, ' + time; }
    return dayMonth(iso) + ', ' + time;
  }
  function money(pence) { return C.money(pence); }

  /* Design's answer dates read "12 Sep". ⊕ FOUND BY DRIVING IT, 2 Sep 2026:
     `/children/:id/answers` sends `date` as a full ISO timestamp
     (`2026-09-02T06:00:04.169502+00:00`), not the short label the contract's
     example shows — and a raw timestamp on a parent's screen is not a date,
     it is a log line. So a value that parses as a date is SHOWN as one; a
     value that does not parse is passed straight through, because the
     backend may well start sending "12 Sep" and that is already right.
     Reported to the backend lane rather than papered over silently. */
  var MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                      'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function shortDate(v) {
    if (v == null || v === '') { return ''; }
    var s = String(v);
    if (!/^\d{4}-\d{2}-\d{2}/.test(s)) { return s; }
    var d = new Date(s);
    if (isNaN(d.getTime())) { return s; }
    return d.getDate() + ' ' + MONTHS_SHORT[d.getMonth()];
  }

  /* ── state ──────────────────────────────────────────────────────────── */
  var qs = new URLSearchParams(window.location.search);
  var S = {
    fam: null, parent: {}, billing: {}, kids: [],
    childId: qs.get('child') || null,
    view: qs.get('view') || 'overview',
    fromChild: false,
    answerId: null,
    answers: null, answersFor: null,
    picker: null, pickerFor: null,
    msgs: null, msgsFor: null, threads: null,
    readMarkedFor: null,
    workKind: 'practice', topic: null, tp: {}, due: 'Sat', note: '', draft: '',
    edit: null, newPass: '', confirmRemove: false,
    prices: null,
    writable: false,
    busy: ''
  };
  var ctx = null;
  var VIEWS = ['overview', 'child', 'setwork', 'chat', 'answers', 'manage'];

  function child() {
    if (!S.kids.length) { return null; }
    for (var i = 0; i < S.kids.length; i++) {
      if (String(S.kids[i].id) === String(S.childId)) { return S.kids[i]; }
    }
    return S.kids[0];
  }

  /* ── the URL is the position ────────────────────────────────────────── */
  function url() {
    var extra = {};
    var c = child();
    if (c) { extra.child = c.id; }
    if (S.view !== 'overview') { extra.view = S.view; }
    return C.href('/consumer/overview.html', extra);
  }
  function go(view, extra) {
    S.view = view;
    S.answerId = null;
    if (extra) { Object.keys(extra).forEach(function (k) { S[k] = extra[k]; }); }
    window.history.pushState({ view: S.view, child: S.childId }, '', url());
    window.scrollTo(0, 0);
    render();
    afterNav();
  }
  window.addEventListener('popstate', function () {
    var q2 = new URLSearchParams(window.location.search);
    var v = q2.get('view') || 'overview';
    S.view = VIEWS.indexOf(v) === -1 ? 'overview' : v;
    S.childId = q2.get('child') || S.childId;
    S.answerId = null;
    render();
    afterNav();
  });

  /* Each screen loads only what it needs, once. `C.section` never rejects,
     so a panel whose endpoint is down says so inside itself. */
  function afterNav() {
    var c = child();
    if (!c) { return; }
    if (S.view === 'setwork') { loadPicker(c); }
    if (S.view === 'chat')    { loadChat(c); }
    if (S.view === 'answers') { loadAnswers(c); }
  }

  /* ═══ loads ═══════════════════════════════════════════════════════════ */
  function loadFamily() {
    return C.api('/api/consumer/family', { token: ctx.token }).then(function (d) {
      d = d || {};
      S.fam = d.family || {};
      S.sub = d.subscription || null;
      S.parent = d.parent || {};
      S.billing = d.billing || {};
      S.kids = d.children || [];
      S.prefs = d.prefs || {};
      S.deletion = d.deletion || null;
      var g = C.guard(S.billing.access != null ? S.billing.access : S.billing, 'parent');
      S.writable = g.writable;
      if (!S.childId && S.kids.length) { S.childId = S.kids[0].id; }
      return d;
    });
  }

  /* Prices: the shared helper when the public lane's addition has landed,
     the route itself otherwise. Either way this file holds no price. */
  function loadPrices() {
    if (S.prices) { return Promise.resolve(S.prices); }
    var p = (C.pricing ? C.pricing() : C.api('/api/consumer/pricing'));
    return Promise.resolve(p).then(function (d) { S.prices = d || null; return S.prices; })
      .catch(function () { S.prices = null; return null; });
  }
  function tier(interval) {
    var t = S.prices && S.prices.tiers;
    if (!t) { return null; }
    return t[interval === 'year' ? 'year' : 'month'] || null;
  }

  function loadThreads() {
    return C.api('/api/consumer/chat/threads', { token: ctx.token })
      .then(function (d) { S.threads = (d && d.threads) || []; })
      .catch(function () { S.threads = null; });
  }
  function threadFor(id) {
    if (!S.threads) { return null; }
    for (var i = 0; i < S.threads.length; i++) {
      if (S.threads[i].with && String(S.threads[i].with.id) === String(id)) { return S.threads[i]; }
    }
    return null;
  }

  /* ⊕ B2C onboarding repair (V6). The topic chips were this child's units
     only, keyed by `unit_code` — which KS4 does not have, so a GCSE child's
     chips all carried "null" and Set work could not set anything for them.
     The shared topic picker (consumer/topic-picker.js) replaces them: the
     whole curriculum, this child's plan choosable, the rest greyed with the
     year it is taught in. Its data is the child's picker plus the
     curriculum index, loaded together. */
  var curriculum = null;
  function loadPicker(c) {
    if (S.pickerFor === c.id) { return Promise.resolve(); }
    S.pickerFor = c.id;
    S.picker = null; S.topic = null; S.tp = {};
    return Promise.all([
      C.api('/api/consumer/children/' + encodeURIComponent(c.id) + '/picker', { token: ctx.token }),
      curriculum ? Promise.resolve(curriculum) : window.MrBadmusTopicPicker.loadIndex()
    ])
      .then(function (out) {
        curriculum = out[1];
        S.picker = (out[0] && out[0].units) || [];
        if (S.view === 'setwork') { render(); }
      })
      .catch(function (e) {
        S.picker = { error: e.message };
        if (S.view === 'setwork') { render(); }
      });
  }

  function loadAnswers(c) {
    if (S.answersFor === c.id && S.answers) { return Promise.resolve(); }
    S.answersFor = c.id;
    S.answers = null;
    return C.api('/api/consumer/children/' + encodeURIComponent(c.id) + '/answers',
                 { token: ctx.token })
      .then(function (d) {
        S.answers = (d && d.answers) || [];
        if (S.view === 'answers') { render(); }
      })
      .catch(function (e) {
        S.answers = { error: e.message };
        if (S.view === 'answers') { render(); }
      });
  }

  function loadChat(c, force) {
    if (!force && S.msgsFor === c.id && S.msgs) { return Promise.resolve(); }
    S.msgsFor = c.id;
    return C.api('/api/consumer/chat/messages?with=' + encodeURIComponent(c.id) + '&limit=50',
                 { token: ctx.token })
      .then(function (d) {
        S.msgs = (d && d.messages) || [];
        if (S.view === 'chat') { renderChatList(); markRead(c); }
      })
      .catch(function (e) {
        S.msgs = { error: e.message };
        if (S.view === 'chat') { renderChatList(); }
      });
  }

  /* Once, on open. Firing it on every poll would keep marking read the
     messages that arrived while the parent was on another tab — which is
     exactly how a parent misses one. */
  function markRead(c) {
    if (S.readMarkedFor === c.id) { return; }
    S.readMarkedFor = c.id;
    C.api('/api/consumer/chat/read', { method: 'POST', token: ctx.token, body: { with: c.id } })
      .then(function () {
        c.unread = 0;
        renderShell();
      })
      .catch(function (e) { console.error('[dash/chat-read]', e); });
  }

  /* ═══ derived values — Design's `renderVals`, over real fields ════════ */
  function modeLabel(m) {
    return m === 'home_education' || m === 'home' ? 'Home education' : 'Alongside school';
  }
  function workOf(k) { return Array.isArray(k.work) ? k.work : []; }
  function doneOf(k) { return workOf(k).filter(function (w) { return w.done; }).length; }

  function cardHeadline(k) {
    var w = workOf(k), done = doneOf(k), n = w.length;
    if (k.status === 'quiet') {
      var left = n - done;
      /* Design wrote "Two sessions due by Sunday"; the number is real here. */
      return 'Nothing done yet this week. ' + left +
             (left === 1 ? ' session' : ' sessions') + ' due by Sunday.';
    }
    if (n && done >= n) {
      /* Her sentence ended "Unit check next Friday." Next week's plan is not
         in this payload, so the claim is dropped rather than guessed. */
      return 'Week complete.';
    }
    var next = null;
    for (var i = 0; i < w.length; i++) { if (!w[i].done) { next = w[i]; break; } }
    return done + ' of ' + n + ' done. Next: ' + (next && next.title ? next.title : '—') + '.';
  }

  function scoresOf(k) { return Array.isArray(k.scores) ? k.scores : []; }

  function betterSummary(k) {
    var sc = scoresOf(k);
    if (!sc.length) { return ''; }
    var first = sc[0].pct, last = sc[sc.length - 1].pct;
    var best = sc.reduce(function (m, s) { return Math.max(m, s.pct); }, -1);
    var verb = last > first ? 'have climbed' : 'have gone';
    var line = 'Unit checks ' + verb + ' from ' + first + '% to ' + last + '% over the term.';
    if (sc.length > 1 && last >= best) { line += ' Personal best on the last one.'; }
    return line;
  }

  function doingSummary(k) {
    var w = workOf(k), done = doneOf(k);
    var mins = w.reduce(function (t, it) {
      return t + (it.done && it.mins != null && !isNaN(Number(it.mins)) ? Number(it.mins) : 0);
    }, 0);
    /* Design's third sentence was "Usually logs in around 7.30pm" — a habit
       nothing records. The slot keeps a fact we do hold. */
    var line = done + ' of ' + w.length + ' sessions done so far this week, ' +
               mins + ' minutes on task.';
    var last = whenLabel(k.lastActive);
    if (last) { line += ' Last active ' + last + '.'; }
    return line;
  }

  function nudgeLine(k) {
    if (k.status === 'never') {
      return k.first_name + ' hasn’t started. A message from you is the first thing ' +
             'they’ll see when they log in.';
    }
    if (k.status === 'quiet') {
      return 'Quiet week so far. A short message from you usually does more than a ' +
             'reminder from us.';
    }
    var t = threadFor(k.id);
    /* Her "last replied Tuesday evening" is real when the thread has an
       inbound message; when it does not, the clause is dropped. */
    if (t && t.last && t.last.mine === false && t.last.time) {
      return k.first_name + ' last replied ' + t.last.time + '. Messages land on their ' +
             'Today screen.';
    }
    return 'Messages land on ' + k.first_name + '’s Today screen.';
  }

  function metaLine(k) {
    var bits = ['Year ' + k.year_group];
    if (k.exam_board) { bits.push(k.exam_board); }
    if (k.pathway) { bits.push(k.pathway.charAt(0).toUpperCase() + k.pathway.slice(1)); }
    bits.push(modeLabel(k.mode));
    if (k.username) { bits.push('@' + k.username); }
    return bits.join(' · ');
  }

  /* ═══ shell: sidebar, header, banners, tab bar ════════════════════════ */
  var TITLES = { overview: '', child: '', setwork: 'Set work', chat: '', answers: 'Marked answers', manage: 'Settings' };
  function screenTitle() {
    var c = child();
    if (S.view === 'chat') { return c ? ('Chat with ' + c.first_name) : 'Messages'; }
    return TITLES[S.view] || '';
  }

  function totalUnread() {
    return S.kids.reduce(function (n, k) { return n + (k.unread || 0); }, 0);
  }

  /* ⊕ B2C repair (ruling 2). The one line for a family that cannot write,
     and its one action. `access` decides (see guard()); `state` only picks
     the words. With no children there is nothing to start yet — the
     overview's own "Add a child" is the action — so no line is drawn. */
  function gateHtml() {
    var b = S.billing;
    var access = String(b.access || '').toLowerCase();
    var st = String(b.state || '').toLowerCase();
    if (S.writable) { return ''; }
    if (access === 'none' || (!access && st === 'none')) {
      if (!S.kids.length) { return ''; }
      return gateRow('Your family hasn’t started yet.',
        b.can_checkout === false ? '' :
        '<button type="button" class="dk-gate-btn" data-act="checkout">Start your free week</button>');
    }
    if (access === 'locked' || st === 'locked') {
      return gateRow('Your subscription has ended. New work and messages are off.',
        b.can_checkout === false ? '' :
        '<button type="button" class="dk-gate-btn" data-act="checkout">Restart</button>');
    }
    return '';
  }
  function gateRow(text, action, alert) {
    return '<div class="dk-gate' + (alert ? ' dk-gate-alert' : '') + '"><div class="dk-gate-row">' +
      '<span>' + text + '</span>' + action + '</div>' +
      '<div class="c-checkout-msg" id="dk-gate-msg" role="alert"></div></div>';
  }

  function bannerHtml() {
    var b = S.billing, st = String(b.state || '').toLowerCase();
    var account = esc(C.href('/consumer/account.html'));
    var gate = gateHtml();
    if (gate) { return gate; }
    if (st === 'trialing') {
      var end = dayMonth(b.trial_end);
      var days = b.days_left;
      return '<div class="dk-banner"><span style="flex:1"><strong>Free week:</strong> ' +
        (days != null ? (esc(String(days)) + (days === 1 ? ' day' : ' days') + ' left.') : 'in progress.') +
        (end ? (' First payment ' + esc(end) + '.') : '') +
        '</span><a href="' + account + '" style="font-weight:700;white-space:nowrap">Billing</a></div>';
    }
    if (st === 'past_due') {
      /* ⚠️ MIDE'S RULING, MRB-317. Design's banner counted days of grace
         ("{{graceDays}} more days"). A countdown on a page about somebody's
         card is the one number a parent will misremember; the DATES are what
         they can act on, and they are what the failed-payment email says
         too. So: retry date and the date access turns read-only, never a
         day count. `retry_at` is Stripe's own next attempt; the grace end is
         `current_period_end + 7 days`, which is where `org_access_state()`
         drops the family to read_only. */
      var retry = dayMonth(b.retry_at);
      var grace = dayMonth(plusDaysISO(S.sub && S.sub.current_period_end, 7));
      /* ⊕ MRB-327. THE GRACE IS SPENDABLE, AND THIS BRANCH USED TO ASSUME IT
         never was. `past_due` is two situations wearing one billing word:
         inside the seven days access is still `full` and work really is
         carrying on; after them `org_access_state()` has dropped the family to
         `read_only` and it has stopped. Only `access` separates them —
         `billing.state` reads `past_due` on both sides — and the cancelled
         branch immediately below already reads `access` for exactly this
         reason.

         Without this, a parent whose grace ran out three days ago opened the
         one screen they went to for an answer and was told "Work carries on
         until 3 September" — a date already in the past, and a promise that
         was false when it was rendered. */
      var inGrace = String(b.access || '') === 'full';
      var mid = '';
      if (retry) { mid += ' We try again on ' + esc(retry) + '.'; }
      if (inGrace) {
        if (grace) { mid += ' Work carries on until ' + esc(grace) + ' while you update the card.'; }
      } else {
        mid += ' New work, marking and messages are paused until the payment goes through.';
      }
      if (!inGrace) {
        return gateRow('<strong>Payment didn’t go through.</strong>' + mid,
          '<a class="dk-gate-link" href="' + account + '">Fix card</a>', true);
      }
      return '<div class="dk-banner dk-banner-alert"><span style="flex:1">' +
        '<strong>Payment didn’t go through.</strong>' + mid +
        '</span><a href="' + account + '" style="font-weight:700;white-space:nowrap">Fix card</a></div>';
    }
    if (st === 'cancelled') {
      /* ⊕ TWO CANCELLED STATES, AND ONLY `access` TELLS THEM APART.
         The real Stripe path is cancel-at-period-end: the subscription stays
         `active` with `cancel_at_period_end: true`, and the family keeps FULL
         access — new work, marking, messages — until the period ends. Only
         when Stripe actually cancels does the row become `canceled` and the
         access drop to read_only. `billingFor` presents both as
         `state: 'cancelled'`, so the billing word cannot separate them and
         branching on it would tell a family who has paid to the end of the
         month that their work has already stopped.
         So: `access` decides the sentence. Design's original wording is the
         `full` branch — it was right for the case she was drawing. */
      var ae = dayMonth(b.access_end);
      var body = String(b.access || '') === 'full'
        ? ('<strong>Cancelled.</strong> ' +
           (ae ? ('Everything works until ' + esc(ae) + '. ') : '') +
           'Reports stay downloadable after that.')
        : ('<strong>Cancelled.</strong> You can read everything' +
           (ae ? (' until ' + esc(ae)) : '') +
           ', but new work and messages are paused. Reports stay downloadable after that.');
      if (String(b.access || '') !== 'full') {
        return gateRow(body, '<a class="dk-gate-link" href="' + account + '">Resume</a>');
      }
      return '<div class="dk-banner"><span style="flex:1">' + body + '</span>' +
        '<a href="' + account + '" style="font-weight:700;white-space:nowrap">Resume</a></div>';
    }
    return '';
  }

    var account = esc(C.href('/consumer/account.html'));
    var addChild = esc(addChildHref());
    var onChat = S.view === 'chat';

    /* ── sidebar (≥960) ───────────────────────────────────────────────── */
    var side =
      '<div style="display:flex;align-items:center;gap:10px;padding:0 4px">' +

      '<nav style="margin-top:28px;display:flex;flex-direction:column;gap:4px">' +

        '<button data-act="tab-chat" style="display:flex;align-items:center;gap:12px;min-height:46px;' +
          'padding:0 12px;border:2px solid ' + (onChat ? 'var(--ks3-ink)' : 'transparent') + ';' +
          'border-radius:14px;background:' + (onChat ? 'var(--ks3-band)' : 'transparent') + ';' +
          'font-weight:700;font-size:16px;color:var(--ks3-ink);cursor:pointer;text-align:left">' +
          svg(MARK.chat, 20) + '<span style="flex:1">Messages</span>' +
          (any ? ('<span style="display:grid;place-items:center;min-width:24px;height:24px;padding:0 6px;' +
                  'border-radius:99px;background:var(--ks3-accent-text);color:var(--dk-on-accent);' +
                  'font-family:var(--ks3-font-mono);font-size:12px">' + esc(String(totalUnread())) +
                  '</span>') : '') +
        '</button>' +
        '<a href="' + account + '" style="display:flex;align-items:center;gap:12px;min-height:46px;' +
          'padding:0 12px;border:2px solid transparent;border-radius:14px;font-weight:700;' +
          'font-size:16px;color:var(--ks3-ink)">' + svg(MARK.user, 20) + 'Account</a>' +
      '</nav>';

    if (S.kids.length) {
      side += '<p style="margin:28px 0 8px;padding:0 12px;font-family:var(--ks3-font-mono);' +
        'font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ks3-ink-muted)">Children</p>' +
        '<div style="display:flex;flex-direction:column;gap:4px">' +
        S.kids.map(function (k) {
          var on = S.view !== 'overview' && c && String(k.id) === String(c.id);
          return '<button data-act="open-child" data-id="' + esc(k.id) + '" ' +
            'style="display:flex;align-items:center;gap:10px;min-height:48px;padding:0 10px;' +
            'border:2px solid ' + (on ? 'var(--ks3-ink)' : 'transparent') + ';border-radius:14px;' +
            'background:' + (on ? 'var(--ks3-card)' : 'transparent') + ';color:var(--ks3-ink);' +
            'cursor:pointer;text-align:left">' +
            '<span class="dk-avatar" style="width:30px;height:30px;border-radius:9px;font-size:14px">' +
              esc((k.first_name || '?').charAt(0)) + '</span>' +
            '<span style="flex:1;min-width:0">' +
              '<span style="display:block;font-weight:700;font-size:15px">' + esc(k.first_name) + '</span>' +
              '<span style="display:block;font-size:12px;color:var(--ks3-ink-muted)">Year ' +
                esc(String(k.year_group)) + '</span></span>' +
            (k.unread ? '<span style="width:10px;height:10px;border-radius:99px;background:var(--ks3-accent)"></span>' : '') +
          '</button>';
        }).join('') +
        '</div>' +
        '<a href="' + addChild + '" style="margin-top:8px;display:flex;align-items:center;gap:10px;' +
          'min-height:44px;padding:0 12px;border:2px dashed var(--ks3-rule-strong);border-radius:14px;' +
          'font-weight:700;font-size:14px;color:var(--ks3-accent-text)">' + svg(MARK.plus, 16) +
          'Add a child</a>';
    }

    var sideNote = '';
    var bst = String(S.billing.state || '').toLowerCase();
    /* Not repeated beside a gate line: one screen, one sentence. */
    if (!S.writable) { bst = ''; }
    if (bst === 'trialing') {
      sideNote = '<div style="padding:12px 14px;border:2px solid var(--ks3-ink);border-radius:14px;' +
        'background:var(--ks3-band);font-size:14px"><strong>Free week:</strong> ' +
        (S.billing.days_left != null ? (esc(String(S.billing.days_left)) + ' days left.') : 'in progress.') +
        '<br><a href="' + account + '" style="font-weight:700">Billing</a></div>';
    } else if (bst === 'past_due') {
      var r = dayMonth(S.billing.retry_at);
      sideNote = '<div style="padding:12px 14px;border:2px solid var(--ks3-alert-border);border-radius:14px;' +
        'background:var(--ks3-alert-tint);font-size:14px;color:var(--ks3-alert-text)">' +
        '<strong>Payment failed.</strong>' + (r ? (' We try again on ' + esc(r) + '.') : '') +
        '<br><a href="' + account + '" style="font-weight:700">Fix card</a></div>';
    } else if (bst === 'cancelled') {
      var a2 = dayMonth(S.billing.access_end);
      sideNote = '<div style="padding:12px 14px;border:2px solid var(--ks3-ink);border-radius:14px;' +
        'background:var(--ks3-band);font-size:14px"><strong>Cancelled.</strong>' +
        (String(S.billing.access || '') === 'full'
          ? (a2 ? (' Works until ' + esc(a2) + '.') : '')
          : (a2 ? (' Read only until ' + esc(a2) + '.') : ' Read only.')) +
        '<br><a href="' + account + '" style="font-weight:700">Resume</a></div>';
    }

    side += '<div style="margin-top:auto;padding-top:20px">' + sideNote +
      '<div style="margin-top:12px;display:flex;align-items:center;gap:10px;padding:0 4px;' +
        'font-size:14px;color:var(--ks3-ink-muted)">' +
        '<span style="display:grid;place-items:center;width:32px;height:32px;border:2px solid var(--ks3-ink);' +
          'border-radius:10px;background:var(--ks3-band);font-family:var(--ks3-font-display);' +
          'font-weight:800;font-size:14px;color:var(--ks3-ink)">' +
          esc(parentInitial()) + '</span>' + esc(parentName()) + '</div></div>';

    document.getElementById('dk-side').innerHTML = side;

    /* ── mobile header ────────────────────────────────────────────────── */
    var head = '';
    if (S.view !== 'overview') {
      head += '<button data-act="back" aria-label="Back" style="display:grid;place-items:center;' +
        'width:40px;height:40px;margin-left:-8px;border:0;border-radius:12px;background:none;' +
        'color:var(--ks3-ink);cursor:pointer">' + svg(MARK.back, 22) + '</button>';
    } else {
      head += C.brandLockup('/consumer/overview.html');
    }
    head += '<span style="flex:1;font-family:var(--ks3-font-display);font-weight:800;font-size:20px;' +
      'letter-spacing:-.02em">' + esc(screenTitle()) + '</span>' +
      '<a href="' + account + '" aria-label="Account" style="display:grid;place-items:center;width:40px;' +
      'height:40px;border:2px solid var(--ks3-ink);border-radius:12px;background:var(--ks3-band);' +
      'font-family:var(--ks3-font-display);font-weight:800;font-size:16px;color:var(--ks3-ink);' +
      'text-decoration:none">' + esc(parentInitial()) + '</a>';
    document.getElementById('dk-head').innerHTML = head;

    document.getElementById('dk-banners').innerHTML = bannerHtml();

    /* ── tab bar (phone) ──────────────────────────────────────────────── */
    document.getElementById('dk-tabbar').innerHTML =
      '<button class="dk-tab" data-act="tab-home" style="color:' +
        (onChat ? 'var(--ks3-ink-muted)' : 'var(--ks3-accent-text)') + '">' +
        svg(MARK.home, 22) + 'Home</button>' +
      '<button class="dk-tab" data-act="tab-chat" style="position:relative;color:' +
        (onChat ? 'var(--ks3-accent-text)' : 'var(--ks3-ink-muted)') + '">' +
        svg(MARK.chat, 22) + 'Messages' +
        (any ? '<span style="position:absolute;top:8px;left:calc(50% + 6px);width:10px;height:10px;' +
               'border-radius:99px;background:var(--ks3-accent);border:2px solid var(--ks3-card)"></span>' : '') +
      '</button>' +
      '<a class="dk-tab" href="' + account + '" style="color:var(--ks3-ink-muted)">' +
        svg(MARK.user, 22) + 'Account</a>';
  }

  function parentName() { return S.parent.name || 'You'; }
  function parentInitial() { return (S.parent.name || 'Y').charAt(0); }

  /* ═══ screens ═════════════════════════════════════════════════════════ */

  /* ⊕ B2C repair (ruling 2). `viewLocked()` — Design's locked screen,
     which REPLACED the overview for a family that had not started or had
     ended — is gone. It told a family with no children that "your children
     can sign in", offered checkout as the only action, and hid the
     children a parent had already set up. The overview now renders in every
     state, and the one line in `gateHtml()` carries the state and its
     action. */

  function viewOverview() {
    var hour = new Date().getHours();
    var greeting = (hour < 12 ? 'Morning' : hour < 18 ? 'Afternoon' : 'Evening') + ', ' + parentName();
    var todayLabel = new Date().toLocaleDateString('en-GB',
      { weekday: 'long', day: 'numeric', month: 'long' });

    /* #dk-msg here too: "X has been removed" lands on this screen, and
       without a host it was written nowhere (found by the B2C repair drive). */
    var html = '<p class="dk-kicker dk-kicker-page">' + esc(todayLabel) + '</p>' +
      '<h1 class="dk-h1">' + esc(greeting) + '</h1><div id="dk-msg"></div>';

    if (!S.kids.length) {
      html += '<div class="dk-dashed" style="margin-top:24px">' +
        '<p style="margin:0;font-family:var(--ks3-font-display);font-weight:800;font-size:24px;' +
          'letter-spacing:-.02em">No children yet</p>' +
        (S.writable
          ? '<p style="margin:8px 0 0;font-size:16px;color:var(--ks3-ink-body)">Add a child and their ' +
            'first week’s work is set tonight.</p>'
          : '') +
        '<a class="dk-cta" href="' + esc(addChildHref()) + '">Add a child</a>' +
        '</div>';
      return html;
    }

    html += '<div class="dk-cards" style="margin-top:22px;display:flex;flex-direction:column;gap:16px">' +
      S.kids.map(function (k) {
        var sc = scoresOf(k);
        var last = sc.length ? (sc[sc.length - 1].pct + '%') : '–';
        var trend = sc.length > 1
          ? (sc[sc.length - 1].pct >= sc[sc.length - 2].pct ? 'up' : 'down')
          : 'no checks yet';
        var never = k.status === 'never';
        var body = '';
        if (never) {
          body = '<div style="margin-top:16px;padding:14px 16px;border:2px dashed var(--ks3-rule-strong);' +
            'border-radius:var(--ks3-r-panel);background:var(--ks3-inset);font-size:15px;' +
            'color:var(--ks3-ink-body)"><strong style="color:var(--ks3-ink)">Hasn’t logged in yet.</strong> ' +
            'Username <span style="font-family:var(--ks3-font-mono)">' + esc(k.username || '—') +
            '</span> at mrbadmus.com/go.' + (S.writable ? ' First week’s work is waiting.' : '') + '</div>';
        } else {
          body = '<div style="margin-top:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">' +
            '<div class="dk-mini"><div class="dk-mini-l">This week</div>' +
              '<div class="dk-mini-n">' + esc(doneOf(k) + '/' + workOf(k).length) + '</div>' +
              '<div class="dk-mini-s">sessions</div></div>' +
            '<div class="dk-mini"><div class="dk-mini-l">Last check</div>' +
              '<div class="dk-mini-n">' + esc(last) + '</div>' +
              '<div class="dk-mini-s">' + esc(trend) + '</div></div>' +
            '<div class="dk-mini"><div class="dk-mini-l">Streak</div>' +
              '<div class="dk-mini-n">' + esc(String(k.streak != null ? k.streak : 0)) + '</div>' +
              /* ⊕ MRB-327. This said "weeks", and the number is DAYS.
                 `streakFor()` counts consecutive London days with a completed
                 work item — so a five-day-old account showed its parent
                 "STREAK 5 weeks", while the child's own Today screen showed
                 "5 day streak" off the very same field. One number, two
                 labels, and the one the parent saw was wrong by a factor of
                 seven. */
              '<div class="dk-mini-s">' + (k.streak === 1 ? 'day' : 'days') + '</div></div>' +
            '</div>' +
            '<p style="margin:14px 0 0;font-size:15px;color:var(--ks3-ink-body)">' +
              esc(cardHeadline(k)) + '</p>';
        }
        return '<button data-act="open-child" data-id="' + esc(k.id) + '" ' +
          'style="text-align:left;padding:20px;border:2px solid var(--ks3-ink);' +
          'border-radius:var(--ks3-r-card);background:var(--ks3-card);box-shadow:var(--ks3-shadow-block);' +
          'color:var(--ks3-ink);cursor:pointer;display:block;width:100%">' +
          '<div style="display:flex;align-items:center;gap:12px">' +
            '<span class="dk-avatar" style="width:44px;height:44px;font-size:20px">' +
              esc((k.first_name || '?').charAt(0)) + '</span>' +
            '<span style="flex:1;min-width:0">' +
              '<span style="display:block;font-family:var(--ks3-font-display);font-weight:800;' +
                'font-size:22px;letter-spacing:-.02em">' + esc(k.first_name) + '</span>' +
              '<span style="display:block;font-size:14px;color:var(--ks3-ink-muted)">Year ' +
                esc(String(k.year_group)) + ' · ' + esc(modeLabel(k.mode)) + '</span></span>' +
            (k.unread ? ('<span class="dk-pill">' + esc(String(k.unread)) + '</span>') : '') +
            (k.status === 'paused' ? '<span style="padding:5px 10px;border-radius:99px;' +
              'border:2px solid var(--ks3-rule-strong);background:var(--ks3-band);font-size:13px;' +
              'font-weight:700;color:var(--ks3-ink-muted)">Paused</span>' : '') +
          '</div>' + body + '</button>';
      }).join('') + '</div>';

    var firstKid = S.kids[0];
    var t = tier('month');
    html += '<div class="dk-narrow" style="margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
      '<a class="dk-tile" href="' + esc(C.href('/consumer/report.html', { child: firstKid.id })) + '">' +
        '<span style="font-weight:700">Termly report</span>' +
        '<span class="dk-tile-sub">Prints cleanly</span></a>' +
      '<a href="' + esc(addChildHref()) + '" style="display:flex;flex-direction:column;' +
        'gap:4px;padding:16px;border:2px dashed var(--ks3-rule-strong);border-radius:var(--ks3-r-card);' +
        'background:none;color:var(--ks3-accent-text);text-decoration:none">' +
        '<span style="font-weight:700">Add a child</span>' +
        '<span class="dk-tile-sub">' + (t ? (esc(money(t.rest)) + ' a month extra') : 'One price per child') +
        '</span></a>' +
    '</div>';
    return html;
  }

  function viewChild() {
    var k = child();
    if (!k) { return noChild(); }
    var sc = scoresOf(k);
    var w = workOf(k);
    var todayIdx = (new Date().getDay() + 6) % 7;   // Monday = 0

    var days = (Array.isArray(k.days) ? k.days : []).map(function (v, i) {
      /* Design's bg rule was index-based on her mock ("i < 4"), which on a
         real Monday would shade Tuesday–Thursday as though they had gone.
         The intent — past days are banded, days still to come are not — is
         kept, against today's actual weekday. */
      var done = v === 1;
      return '<div style="flex:1;text-align:center">' +
        '<div style="height:36px;border-radius:10px;border:2px solid var(--ks3-ink);background:' +
          (done ? 'var(--ks3-ok)' : (i < todayIdx ? 'var(--ks3-band)' : 'var(--ks3-card)')) +
          ';display:grid;place-items:center;color:#fff">' +
          (done ? svg(MARK.tick) : '') + '</div>' +
        '<div style="margin-top:4px;font-family:var(--ks3-font-mono);font-size:11px;' +
          'color:var(--ks3-ink-muted)">' + DAY_LABELS[i] + '</div></div>';
    }).join('');

    var doing = '<section class="dk-card"><p class="dk-kicker">Are they doing the work?</p>';
    if (k.status === 'never') {
      doing += '<p style="margin:10px 0 0;font-size:17px;color:var(--ks3-ink-body)">Not yet. ' +
        esc(k.first_name) + ' hasn’t logged in.' +
        (S.writable ? ' The first week is set and waiting.' : '') + '</p>' +
        '<div class="dk-row-band" style="margin-top:12px"><span>Username</span>' +
        '<span class="dk-mono">' + esc(k.username || '—') + '</span></div>';
    } else if (k.status === 'quiet') {
      var la = whenLabel(k.lastActive);
      doing += '<p style="margin:10px 0 0;font-size:17px;color:var(--ks3-ink-body)">' +
        '<strong style="color:var(--ks3-ink)">Nothing done this week yet.</strong> ' +
        esc(String(w.length)) + ' sessions are set.' +
        (la ? (' Last activity ' + esc(la) + '.') : '') + '</p>';
    } else {
      doing += (days ? ('<div style="margin-top:12px;display:flex;gap:6px">' + days + '</div>') : '') +
        '<p style="margin:12px 0 0;font-size:16px;color:var(--ks3-ink-body)">' +
        esc(doingSummary(k)) + '</p>';
    }
    doing += '</section>';

    var better = '';
    if (sc.length) {
      better = '<section class="dk-card" style="margin-top:16px">' +
        '<p class="dk-kicker">Are they getting better?</p>' +
        '<div style="margin-top:14px;display:flex;align-items:flex-end;gap:8px;height:96px;' +
          'padding-bottom:2px;border-bottom:2px solid var(--ks3-ink)">' +
        sc.map(function (s, i) {
          var h = Math.max(6, Math.round(s.pct * 0.7));
          return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;' +
            'justify-content:flex-end;height:100%">' +
            '<span style="font-family:var(--ks3-font-mono);font-size:12px;color:var(--ks3-ink-muted)">' +
              esc(s.pct + '%') + '</span>' +
            '<div style="width:100%;margin-top:4px;border:2px solid var(--ks3-ink);' +
              'border-radius:8px 8px 0 0;background:' +
              (i === sc.length - 1 ? 'var(--ks3-accent)' : 'var(--ks3-band)') +
              ';height:' + h + 'px"></div></div>';
        }).join('') + '</div>' +
        '<div style="display:flex;gap:8px;margin-top:6px">' +
        sc.map(function (s) {
          return '<div style="flex:1;text-align:center;font-size:11px;color:var(--ks3-ink-muted);' +
            'line-height:1.2">' + esc(s.label) + '</div>';
        }).join('') + '</div>' +
        '<p style="margin:14px 0 0;font-size:16px;color:var(--ks3-ink-body)">' +
          esc(betterSummary(k)) + '</p>' +
        (k.weak ? ('<div style="margin-top:12px;padding:12px 14px;border-radius:12px;' +
          'background:var(--ks3-alert-tint);border:2px solid var(--ks3-alert-border);font-size:15px;' +
          'color:var(--ks3-alert-text)"><strong>Weak spot:</strong> ' + esc(k.weak) + '</div>') : '') +
        '</section>';
    }

    /* Message and Set work both need a writable family (the backend answers
       423 otherwise), so the whole card is drawn only then. Reading old
       messages stays one tap away in the Messages tab. */
    var nudge = !S.writable ? '' : '<section class="dk-dark" style="margin-top:16px">' +
      '<p style="margin:0;font-family:var(--ks3-font-mono);font-size:13px;letter-spacing:.12em;' +
        'text-transform:uppercase;color:var(--ks3-alert)">Can I nudge them?</p>' +
      '<p style="margin:10px 0 0;font-size:17px;color:var(--ks3-on-dark-body)">' +
        esc(nudgeLine(k)) + '</p>' +
      '<div style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
        '<button data-act="open-chat" style="min-height:48px;border:2px solid var(--ks3-on-dark);' +
          'border-radius:var(--ks3-r-control);background:var(--ks3-on-dark);color:var(--ks3-ink);' +
          'font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;' +
          'justify-content:center;gap:8px">Message' +
          (k.unread ? ('<span style="display:grid;place-items:center;min-width:24px;height:24px;' +
            'padding:0 6px;border-radius:99px;background:var(--ks3-accent-text);color:var(--dk-on-accent);' +
            'font-family:var(--ks3-font-mono);font-size:12px">' + esc(String(k.unread)) + '</span>') : '') +
        '</button>' +
        '<button data-act="open-setwork" data-write style="min-height:48px;' +
          'border:2px solid var(--ks3-on-dark-muted);border-radius:var(--ks3-r-control);background:none;' +
          'color:var(--ks3-on-dark);font-weight:700;font-size:16px;cursor:pointer">Set work</button>' +
      '</div></section>';

    var workList = w.length
      ? w.map(function (it) {
          return '<li style="display:flex;align-items:center;gap:12px;padding:14px 16px;' +
            'border-bottom:1px solid var(--ks3-rule)">' +
            '<span style="display:grid;place-items:center;width:28px;height:28px;border-radius:9px;' +
              'border:2px solid var(--ks3-ink);background:' +
              (it.done ? 'var(--ks3-ok)' : 'var(--ks3-band)') + ';color:#fff;flex:0 0 auto">' +
              (it.done ? svg(MARK.tick)
                       : ('<span style="font-family:var(--ks3-font-mono);font-size:11px;' +
                          'color:var(--ks3-ink-muted)">' + esc(it.day || '') + '</span>')) +
            '</span>' +
            '<span style="flex:1;min-width:0">' +
              '<span style="display:block;font-size:16px;font-weight:600">' +
                esc(it.title || 'Work') + '</span>' +
              '<span style="display:block;font-size:13px;color:var(--ks3-ink-muted)">' +
                esc([it.source, it.mins != null ? (it.mins + ' min') : null]
                    .filter(Boolean).join(' · ')) + '</span></span>' +
            /* A DONE item is a record of what a child did and the contract
               refuses to remove one (409). So the button is not rendered
               rather than rendered-and-disabled: a greyed Remove beside a
               finished lesson invites the parent to wonder what they did
               wrong. */
            (it.byParent && !it.done
              ? ('<button data-act="remove-work" data-id="' + esc(it.id) + '" ' +
                 'aria-label="Remove" style="display:grid;place-items:center;width:32px;height:32px;' +
                 'border:0;border-radius:8px;background:var(--ks3-band);color:var(--ks3-ink-muted);' +
                 'cursor:pointer">' + svg(MARK.cross) + '</button>')
              : '') +
          '</li>';
        }).join('')
      : '<li style="padding:16px;font-size:15px;color:var(--ks3-ink-muted)">' +
        (S.writable ? 'Nothing set for this week yet. Work is set on Sunday evening.' : 'Nothing set yet.') +
        '</li>';

    var work = '<section class="dk-work" style="margin-top:24px">' +
      '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">' +
        '<h2 style="margin:0;font-family:var(--ks3-font-display);font-weight:800;font-size:24px;' +
          'letter-spacing:-.025em">This week’s work</h2>' +
        '<button data-act="open-manage" style="border:0;background:none;padding:0;font-weight:700;' +
          'font-size:15px;color:var(--ks3-accent-text);cursor:pointer">' +
          esc(intensityLabel(k)) + '</button></div>' +
      '<ul style="margin:12px 0 0;padding:0;list-style:none;border:2px solid var(--ks3-ink);' +
        'border-radius:var(--ks3-r-card);background:var(--ks3-card);overflow:hidden">' + workList + '</ul>' +
      (k.paused ? '' :
        '<button data-act="pause" style="margin-top:12px;min-height:44px;padding:0 4px;' +
        'border:0;background:none;font-weight:700;font-size:15px;color:var(--ks3-accent-text);' +
        'cursor:pointer">Pause work for ' + esc(k.first_name) + '</button>') +
      '</section>';

    var links = '<section style="margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
      '<button class="dk-tile" data-act="open-answers">' +
        '<span style="font-weight:700">Marked answers</span>' +
        '<span class="dk-tile-sub">' + esc(answersMeta(k)) + '</span></button>' +
      '<a class="dk-tile" href="' + esc(C.href('/consumer/report.html', { child: k.id })) + '">' +
        '<span style="font-weight:700">Termly report</span>' +
        '<span class="dk-tile-sub">Ready to print</span></a></section>';

    var pausedBar = k.paused
      ? '<div style="margin-top:18px;display:flex;align-items:center;gap:12px;padding:14px 16px;' +
        'border:2px solid var(--ks3-ink);border-radius:var(--ks3-r-panel);background:var(--ks3-band);' +
        'font-size:15px"><span style="flex:1"><strong>Paused.</strong> Nothing new is set. ' +
        'Streak is frozen, not lost.</span><button data-act="pause" ' +
        'style="min-height:40px;padding:0 14px;border:2px solid var(--ks3-ink);border-radius:10px;' +
        'background:var(--ks3-ink);color:var(--ks3-on-dark);font-weight:700;font-size:14px;' +
        'cursor:pointer">Resume</button></div>'
      : '';

    return '<div style="display:flex;align-items:center;gap:14px">' +
        '<span class="dk-avatar" style="width:52px;height:52px;border-radius:16px;font-size:24px">' +
          esc((k.first_name || '?').charAt(0)) + '</span>' +
        '<div style="flex:1;min-width:0">' +
          '<h1 style="margin:0;font-family:var(--ks3-font-display);font-weight:800;font-size:32px;' +
            'line-height:1;letter-spacing:-.035em">' + esc(k.first_name) + '</h1>' +
          '<p style="margin:4px 0 0;font-size:14px;color:var(--ks3-ink-muted)">' +
            esc(metaLine(k)) + '</p></div>' +
        '<button data-act="open-manage" style="min-height:40px;padding:0 12px;' +
          'border:2px solid var(--ks3-rule-strong);border-radius:10px;background:var(--ks3-band);' +
          'font-weight:700;font-size:14px;color:var(--ks3-ink);cursor:pointer">Edit</button></div>' +
      pausedBar +
      '<div id="dk-msg"></div>' +
      '<div class="dk-cols" style="margin-top:22px"><div>' + doing + better + nudge + '</div>' +
      '<div>' + work + links + '</div></div>';
  }

  function intensityLabel(k) {
    var i = INTENSITY[k.intensity] || null;
    return i ? (i.label + ' · ' + i.per) : 'How much a week';
  }
  function answersMeta(k) {
    var n = (S.answersFor === k.id && Array.isArray(S.answers)) ? S.answers.length : null;
    var left = k.humanLeft;
    if (n === 0) { return 'None yet'; }
    var bits = [];
    /* Design said "N this term"; the endpoint returns the 100 most recent
       and is not term-scoped, so the word "term" is not claimed. */
    if (n != null) { bits.push(n + (n === 1 ? ' answer' : ' answers')); }
    if (left != null) { bits.push(left + ' human mark' + (left === 1 ? '' : 's') + ' left'); }
    return bits.length ? bits.join(' · ') : 'Marked against the mark scheme';
  }

  function viewSetWork() {
    var k = child();
    if (!k) { return noChild(); }
    var pickerErr = S.picker && S.picker.error ? S.picker.error : null;

    /* An exam question is picked by the server from where the child is up
       to (`setWorkFor` ignores a topic for it), so no topic is asked. */
    var topics = S.workKind === 'exam'
      ? '<p style="margin:0;font-size:15px;color:var(--ks3-ink-muted)">Mr Badmus picks the question from where ' +
          esc(k.first_name) + ' is up to.</p>'
      : pickerErr
        ? '<p style="font-size:15px;color:var(--ks3-ink-muted)">' + esc(pickerErr) + '</p>'
        : (Array.isArray(S.picker) && curriculum
            ? '<div id="dk-topic"></div>'
            : '<p style="font-size:15px;color:var(--ks3-ink-muted)">Loading…</p>');

      '<p style="margin:12px 0 0;font-size:16px;color:var(--ks3-ink-body)">Goes on top of what ' +

      '<div id="dk-msg"></div>' +
      '<p style="margin:22px 0 8px;font-weight:700;font-size:15px;color:var(--ks3-ink-muted)">What kind</p>' +
      '<div style="display:flex;flex-direction:column;gap:8px">' +
        WORK_KINDS.map(function (kind) {
          return '<button class="ks3-option" aria-pressed="' +
            (S.workKind === kind.id ? 'true' : 'false') + '" data-act="pick-kind" data-id="' +

      '<p style="margin:22px 0 8px;font-weight:700;font-size:15px;color:var(--ks3-ink-muted)">Topic</p>' +

      '<p style="margin:22px 0 8px;font-weight:700;font-size:15px;color:var(--ks3-ink-muted)">Due</p>' +
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">' +
        DUE_DAYS.map(function (d) {
          return '<button class="ks3-option" aria-pressed="' + (S.due === d ? 'true' : 'false') +
            '" data-act="pick-due" data-id="' + d + '" ' +
            'style="justify-content:center;padding:12px 6px;font-size:15px">' + d + '</button>';
        }).join('') + '</div>' +
      '<label style="display:block;margin-top:22px;font-weight:700;font-size:15px;' +

        '<input id="dk-note" value="' + esc(S.note) + '" maxlength="200" ' +
          'placeholder="e.g. Before Friday’s test" class="dk-field" style="min-height:50px;' +
          'padding:12px 14px" data-write></label>' +
      '<button data-act="submit-work" data-write class="dk-btn-ink" style="margin-top:24px">Set for ' +
        esc(S.due) + '</button></div>';

  function viewChat() {
    var k = child();
    if (!k) { return noChild(); }
    return '<div class="dk-chat dk-narrow" style="display:flex;flex-direction:column;' +
        'min-height:calc(100vh - 220px);max-width:720px">' +
      /* MRB-327 a11y: the only view with no <h1>. Visually hidden — the
         visible title is already in #dk-head, and Design's chat opens on
         her "Only you and X can see this" line, which is not a heading. */
      '<h1 class="ks3-sr-only">Chat with ' + esc(k.first_name) + '</h1>' +
      '<p style="margin:0 0 14px;font-size:14px;color:var(--ks3-ink-muted);text-align:center">' +
        'Only you and ' + esc(k.first_name) + ' can see this.</p>' +
      '<div id="dk-msg"></div>' +
      '<div id="dk-chatlist" style="flex:1;display:flex;flex-direction:column;gap:10px"></div>' +
      (!S.writable ? '</div>' :
      '<div class="dk-composer" style="position:sticky;bottom:84px;margin-top:16px;display:flex;' +
        'gap:8px;padding:10px;border:2px solid var(--ks3-ink);border-radius:var(--ks3-r-card);' +
        'background:var(--ks3-card)">' +
        '<input id="dk-draft" value="' + esc(S.draft) + '" maxlength="1000" ' +
          'placeholder="Write to ' + esc(k.first_name) + '" data-write ' +
          'style="flex:1;min-width:0;min-height:44px;padding:8px 12px;border:0;background:none;' +
          'font-size:17px;color:var(--ks3-ink)">' +
        '<button data-act="send" data-write aria-label="Send" style="display:grid;place-items:center;' +
          'width:44px;height:44px;border:2px solid var(--ks3-ink);border-radius:12px;' +
          'background:var(--ks3-ink);color:var(--ks3-on-dark);cursor:pointer">' +
          svg(MARK.send) + '</button></div></div>');
