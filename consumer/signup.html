    child:    { view: viewChild,    bind: bindChild },
    unit:     { view: viewUnit,     bind: bindUnit },
    children: { view: viewChildren, bind: bindChildren },
    plan:     { view: viewPlan,     bind: bindPlan }
  };

  function render() {
    var v = VIEWS[S.step] || VIEWS.account;
    $('su-main').innerHTML = v.view();
    renderChrome();
    v.bind();
  }

  /* ⚠️ ONE delegated listener, installed ONCE, for every `data-*` control on
     every step. `render()` replaces `su-main`'s innerHTML, which throws away
     the child elements and their listeners — but NOT a listener on su-main
     itself. Registering the delegation inside each step's `bind()` therefore
     stacks a fresh copy on every render, and after three renders of the
     child step one tap on "Y9" runs the handler three times. It looks
     correct (idempotent state writes) right up until a handler stops being
     idempotent, and then it is a bug nobody can reproduce on the first
     click. So it lives here, outside the render cycle, and dispatches on
     the attribute rather than on which step drew it. */
  function installDelegation() {
    $('su-main').addEventListener('click', function (e) {
      /* ⚠️ `button[…]`, and INSIDE #su-main, and both halves are load-bearing.
         MRB-327 §1. Every consumer page's root carries the KS3 design-system
         hook `<div class="rd" data-mode="ks3" id="c-main">`, and #su-main sits
         inside it — so an unqualified `closest('[data-mode]')` walked straight
         past the form and matched the PAGE, on every click in the step that
         was not on an option button. Pressing "Is it free?" therefore set
         S.form.mode = 'ks3', which is truthy (so validation passed) and is not
         'home' (so createChild sent alongside_school / light). A home-educating
         family was silently signed up for the alongside-school schedule, and
         the only visible symptom was the Home-education button quietly losing
         its selected state. */
      var form = $('su-main');
      var b = e.target.closest('button[data-year],button[data-board],button[data-route],' +
                               'button[data-tier],button[data-mode],' +
                               'button[data-edit],button[data-plan],button[data-finish]');
      if (!b || !form.contains(b)) { return; }

      if (b.hasAttribute('data-plan')) {
        S.plan = b.getAttribute('data-plan');
        return render();
      }

      if (b.hasAttribute('data-finish')) {
        var p = S.pending[Number(b.getAttribute('data-finish'))];
        if (!p) { return; }
        S.form = Object.assign(blankChild(), p, { userStatus: 'idle', retryOf: p.user });
        S.editing = -1;
        go('child');
        return checkUsername(true);
      }

      if (b.hasAttribute('data-edit')) {
        var c = S.children[Number(b.getAttribute('data-edit'))];
        if (!c) { return; }
        S.form = editForm(c);
        S.editing = S.children.indexOf(c);
        return go('child');
      }

      S.childError = '';
      if (b.hasAttribute('data-year'))  { S.form.year  = Number(b.getAttribute('data-year')); }
      if (b.hasAttribute('data-board')) { S.form.board = b.getAttribute('data-board'); }
      if (b.hasAttribute('data-route')) { S.form.route = b.getAttribute('data-route'); }
      if (b.hasAttribute('data-tier'))  { S.form.tier  = b.getAttribute('data-tier'); }
      if (b.hasAttribute('data-mode'))  { S.form.mode  = b.getAttribute('data-mode'); }
      render();
    });
  }

  /* ⊕ B2C onboarding repair (V5). Every step is a history entry, so the
     browser's Back goes one step back INSIDE the flow instead of leaving it
     for whatever page came before signup. `opts.replace` is for a step this
     page chose on its own (where to land after a load or a sign-in), which
     must not leave a dead entry behind it. */
  function go(step, opts) {
    var moved = S.step !== step;
    S.step = step;
    S.childError = '';
    saveDraft();
    recordTerms();          // see the note on recordTerms — retried, not blocking
    recordName();
    try {
      if (opts && opts.replace) { history.replaceState({ mrbStep: step }, ''); }
      else if (moved || !(history.state && history.state.mrbStep)) {
        history.pushState({ mrbStep: step }, '');
      }
    } catch (e) { /* a sandboxed frame: Back simply leaves, as before */ }
    render();
    if (moved) { window.scrollTo(0, 0); }
  }

  window.addEventListener('popstate', function (e) {
    var want = e.state && e.state.mrbStep;
    if (!want || !VIEWS[want]) { return; }
    // A step that is no longer reachable goes to the nearest one that is.
    if (want === 'unit' && !S.unitChildId) { want = 'children'; }
    if ((want === 'account' || want === 'verify') && S.verified) {
      want = (S.children.length || S.pending.length) ? 'children' : 'child';
    }
    if (want === 'plan' && (!S.verified || !S.children.length || S.subscribed)) { want = 'children'; }
    if (want === 'children' && !S.children.length && !S.pending.length) {
      want = S.verified ? 'child' : 'account';
    }
    S.step = want;
    S.childError = '';
    S.error = '';
    if (want !== 'child') { S.editing = -1; }
    saveDraft();
    render();
  });

  /* Everything but `pending` — see addPending(). */
  function saveDraft() {
    var d = readDraft();
    d.email = S.email; d.name = S.name; d.step = S.step; d.plan = S.plan; d.terms = S.terms;
    writeDraft(d);
    S.pending = d.pending || [];
  }

  /* Read the family back. This is the truth about who exists; the list, the
     price lines and the seat count all come from here. */
  function loadFamily() {
    if (!S.token) { return Promise.resolve(); }
    return C.api('/api/consumer/family', { token: S.token }).then(function (d) {
      var bst = d && d.billing && d.billing.state;
      S.subscribed = !!(bst && bst !== 'none');
      S.children = ((d && d.children) || []).map(function (c) {
        var mode = c.mode === 'home_education' ? 'Home education' : 'Alongside school';
        var board = c.exam_board || null;
        var route = c.pathway ? (c.pathway.charAt(0).toUpperCase() + c.pathway.slice(1)) : null;
        var tierLabel = c.tier === 'foundation' ? 'Foundation'
                      : (c.tier === 'higher' ? 'Higher' : 'Not decided');
        var isKs4 = Number(c.year_group) >= 10;
        return {
          id: c.id,
          name: c.first_name,
          year: Number(c.year_group),
          username: c.username,
          mode: c.mode,
          board: isKs4 ? board : null,
          routeLabel: route,
          tierLabel: tierLabel,
          meta: 'Year ' + c.year_group + (isKs4 && board ? ' · ' + board : '') +
                (isKs4 && route ? ' · ' + route : '') + ' · ' + mode + ' · @' + c.username
        };
      });
    }, function (e) {
      // A family that cannot be read is not a family that does not exist.
      console.error('[signup] family', e);
    });
  }

  /* Everything that happens the moment a verified session appears: make the
     family, create anything held on the device, and put the parent on the
     step that is now actually available. */
  /* ── recording the acceptance (Night 4, MRB-317 ruling 7) ─────────────
     The tick is taken on the account step, but there is no account to write
     it against until Supabase has made one — and on the Google path that is
     a different page load entirely. So it is written at the first moment a
     parent token exists, which is here, and it is retried on every step
     transition until it lands (see `go()`).

     ⚠️ It does NOT block. A parent who agreed and whose consent write failed
     on a flaky connection must not be stuck on a spinner in the middle of
     signing up: they agreed, we have the tick in the draft, and the retry on
     the next step is a better answer than a dead button. If it never lands
     the console says so and the account simply has no timestamp, which is
     visible and fixable — unlike a parent who gave up. */
  function recordTerms() {
    /* ⚠️ `S.ensured` is not belt-and-braces, it is the ORDER. `PATCH /parent`
       is behind `requireParent`, and requireParent needs a `profiles` row —
       which does not exist until `/family/ensure` has made one. Called any
       earlier this 403s with "This is a parent-only area", every time, on
       every signup. Found by driving it, 3 Sep 2026. The acceptance for a
       brand-new account is carried on the ensure call itself (below); this
       is the retry for an account that already had a profile. */
    if (!S.terms || S.termsSent || !S.token || !S.ensured) { return; }
    S.termsSent = true;
    /* ⊕ MRB-327. The name rides on THIS call rather than getting one of its
       own, for the same reason the acceptance does: it is the first request
       in the flow allowed to write to the profile, and a second PATCH would
       be a second thing that can fail on its own. Omitted entirely when
       blank, so a parent who skipped the box does not overwrite a name
       Google already gave us. */
    C.api('/api/consumer/parent', {
      method: 'PATCH', token: S.token, body: { terms_accepted: true }
    }).catch(function (e) {
      S.termsSent = false;                 // let the next step try again
      console.error('[signup] terms', e);
    });
  }

  /* ⊕ B2C onboarding repair (V1). The parent's name, on its OWN call. It
     used to ride on the terms PATCH above, and that PATCH is skipped
     whenever /family/ensure has already stamped the terms — which is every
     ordinary signup — so the name was never sent and the dashboard opened
     on "Evening, You". Omitted when blank, so a name Google gave us is never
     overwritten with nothing. */
  function recordName() {
    if (!S.name || S.nameSent || !S.token || !S.ensured) { return; }
    S.nameSent = true;
    C.api('/api/consumer/parent', {
      method: 'PATCH', token: S.token, body: { first_name: S.name }
    }).catch(function (e) {
      S.nameSent = false;                  // the next step tries again
      console.error('[signup] name', e);
    });
  }

  var adopting = null;
  function adoptSession(session) {
    // The button, the poll and the page coming back into view can all find
    // the same session at once; one adoption is enough.
    if (adopting && S.token === session.access_token) { return adopting; }
    S.session = session;
    S.token = session.access_token;
    S.email = session.user.email || S.email;
    S.verified = !!session.user.email_confirmed_at;
    if (!S.verified) { return Promise.resolve(); }

    /* A verify link opened in ANOTHER browser has no draft there: the name
       and the tick came across on the account itself (see bindAccount). */
    var meta = session.user.user_metadata || {};
    if (!S.name && typeof meta.first_name === 'string') { S.name = meta.first_name.trim(); }
    var ticked = S.terms || meta.terms_accepted === true;

    /* The acceptance rides on the call that CREATES the profile, because
       that is the first request in the whole flow that is allowed to write
       one. The backend's stamp is write-once, so sending it on every ensure
       — this route is idempotent and runs on every sign-in — cannot walk the
       date forward. */
    adopting = C.api('/api/consumer/family/ensure', {
        method: 'POST', token: S.token,
        body: ticked ? { terms_accepted: true } : {}
      })
      .then(function (d) {
        S.ensured = true;
        if (d && d.terms_accepted_at) { S.termsSent = true; }
        return loadFamily();
      })
      .then(flushPending)
      .then(function () { recordTerms(); recordName(); });   // retry if ensure did not stamp
    adopting.catch(function () { adopting = null; });
    return adopting;
  }

  /* Create every child held on this device.
     ⊕ B2C onboarding repair (V3/V4). Each child is re-read from the draft
     just before it is created and dropped from it the moment it exists, so
     two tabs flushing at once cannot create one child twice; a child whose
     username already belongs to THIS family is one that was created already
     (by the other tab, or on an earlier visit) and is skipped, never
     reported as "taken". A child that genuinely cannot be created stays in
     the draft and comes back as the child form, with the reason. */
  function flushPending() {
    var queue = readDraft().pending || [];
    S.flushed = []; S.flushFailed = [];
    if (!queue.length) { return Promise.resolve(); }

    function ours(u) { return S.children.some(function (c) { return sameUser(c.username, u); }); }

    // One at a time and in order: two creates racing for one seat cap, or
    // for one username, is a refusal nobody can explain afterwards.
    return queue.reduce(function (chain, f) {
      return chain.then(function () {
        var still = (readDraft().pending || []).some(function (p) { return sameUser(p.user, f.user); });
        if (!still || ours(f.user)) { dropPending(f.user); return; }
        return createChild(f).then(function (res) {
          dropPending(f.user);
          S.flushed.push(res);
        }, function (e) {
          console.error('[signup] pending child', e);
          if (e && e.status === 409 && e.code === 'username_unavailable') {
            return loadFamily().then(function () {
              if (ours(f.user)) { dropPending(f.user); return; }
              S.flushFailed.push({ form: f, err: e });
            });
          }
          S.flushFailed.push({ form: f, err: e });
        });
      });
    }, Promise.resolve());
  }

  /* ══ where to land ═════════════════════════════════════════════════════
     ⊕ B2C onboarding repair (V2). Called once the page knows who is here,
     and again whenever this tab signs in. A signed-in parent's place comes
     from the SERVER — the children that exist and whether the family has
     been through Stripe — never from a step this device happened to save:
     a saved `unit` landed on an empty list with no child to ask about, and
     a saved `stripe` on a spinner that never ended. */
  var wanted = null;        // ?step=…, honoured once
  function settle() {
    var d = readDraft();
    var fromUrl = RESUMABLE[wanted] ? wanted : null;
    wanted = null;
    var w = fromUrl || d.step || '';
    if (!RESUMABLE[w]) { w = ''; }

    if (!S.session || !S.verified) {
      if (w === 'account' || (w === 'verify' && S.email)) { return go(w, { replace: true }); }
      if (w === 'child' && S.email) { return go('child', { replace: true }); }
      if (S.pending.length) { return go('children', { replace: true }); }
      return go(S.email && d.step ? 'verify' : 'account', { replace: true });
    }

    /* Signed in, but the family could not be set up (/family/ensure
       refused — a rate limit, the network). Nothing held can be created
       yet; say why on the list rather than open a blank child form. */
    if (!S.ensured) {
      if (S.pending.length || S.children.length) { return go('children', { replace: true }); }
      S.childError = S.error;
      go('child', { replace: true });
      if (S.error) { S.childError = S.error; render(); }
      return;
    }

    var failed = S.flushFailed || [];
    S.flushFailed = [];
    if (failed.length) {
      var f = failed[0];
      S.form = Object.assign(blankChild(), f.form, { retryOf: f.form.user });
      if (f.err && f.err.status === 409 && f.err.code === 'username_unavailable') {
        takenFrom(S.form, f.err);
      } else {
        S.childError = (f.err && f.err.message) || 'We couldn’t set ' + (f.form.name || 'that child') + ' up just now.';
      }
      S.editing = -1;
      var keepErr = S.childError;
      go('child', { replace: true });
      if (keepErr) { S.childError = keepErr; render(); }
      return;
    }

    var made = S.flushed || [];
    S.flushed = [];
    if (made.length) {
      S.unitQueue = made.slice(1);
      return startUnitStep(made[0], { replace: true });
    }

    if (w === 'plan' && S.children.length && !S.subscribed) { return go('plan', { replace: true }); }
    // "Add a child" from the dashboard names the step; a step merely left
    // in the draft does not get to re-open a half-typed form.
    if (fromUrl === 'child') { S.form = blankChild(); S.editing = -1; return go('child', { replace: true }); }
    return go(S.children.length ? 'children' : 'child', { replace: true });
  }

  /* ══ boot ═════════════════════════════════════════════════════════════ */
  C.boot({ sessionOptional: true, run: function (ctx) {
    sb = ctx.sb;
    installDelegation();

    var draft = readDraft();
    S.email   = draft.email || '';
    S.name    = draft.name || '';
    S.plan    = draft.plan === 'year' ? 'year' : 'month';
    S.pending = draft.pending || [];
    S.terms   = draft.terms === true;

    wanted = new URLSearchParams(window.location.search).get('step');

    /* Prices first, but never blocking: the plan step is the only screen
       that needs them and it is four steps away. */
    C.pricing().then(function (p) { tiers = p.tiers; if (S.step === 'plan' || S.step === 'children') { render(); } })
               .catch(function (e) { console.error('[signup] pricing', e); });

    /* The rail's finished steps (V5). Outside #su-main, so its own listener. */
    $('rail-steps').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-rail]') : null;
      if (!b) { return; }
      var to = railTarget(Number(b.getAttribute('data-rail')));
      if (!to) { return; }
      S.error = '';
      if (to === 'edit') {
        var c = S.children[0];
        S.form = editForm(c);
        S.editing = 0;
        return go('child');
      }
      S.editing = -1;
      if (to === 'child') { S.form = blankChild(); }
      go(to);
    });

    /* Another tab on this device changed the draft: the children held here
       are whatever it now says. */
    window.addEventListener('storage', function (e) {
      if (e.key !== DRAFT_KEY) { return; }
      S.pending = readDraft().pending || [];
      if (S.step === 'children') { render(); }
    });

    /* "Check your inbox" moves on by itself once the link has been used:
       a session appearing in this browser (another tab) is noticed within a
       few seconds, and coming back to this tab after verifying anywhere else
       signs it in with the password typed a moment ago. */
    setInterval(function () { if (S.step === 'verify' && !document.hidden) { checkVerified(false, true); } }, 4000);
    function onLook() { if (S.step === 'verify' && !document.hidden) { checkVerified(false); } }
    document.addEventListener('visibilitychange', onLook);
    window.addEventListener('focus', onLook);

    if (ctx.session) {
      adoptSession(ctx.session).then(settle, function (e) {
        console.error('[signup] adopt', e);
        S.error = (e && e.message) || '';
        settle();
      });
    } else {
      settle();
    }
  }});
})();
</script>
