<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#F7F1E5"/>
  <title>Sign in — MrBadmus</title>
  <link rel="preload" href="/shared/fonts/bricolage-grotesque-var-latin.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="preload" href="/shared/fonts/plus-jakarta-sans-var-latin.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="stylesheet" href="/shared/tokens.css?v=bbfbe9e0"/>
  <link rel="stylesheet" href="/consumer/consumer.css"/>
</head>
<body>

<div id="c-nav"></div>

<div class="container" id="c-main">
  <div class="page-header"><h1>Sign in</h1></div>
  <div class="page-sub">Type the username and password your grown-up set up for you.</div>

  <div class="card">
    <div class="c-msg" id="msg"></div>

    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" autocapitalize="off"
             autocorrect="off" spellcheck="false"/>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password"/>
    </div>

    <button class="btn btn-primary" id="btn-login" type="button">Sign in</button>
  </div>
</div>

<script src="/shared/config.js?v=d1fecb43"></script>
<script src="/consumer/consumer-common.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   consumer/child-login.html — MRB-308 Night 1. SCAFFOLD.

   ⚠️ THERE IS NO EMAIL ON THIS PAGE, AND THAT IS THE WHOLE DESIGN.
   Not a hidden field, not a fallback, not "username or email", not a
   "forgot your email?" link, not the word in a placeholder or a hint. A
   child on MrBadmus does not have an email address, has never been asked
   for one, and must never be shown a form that implies they should have
   one — a ten-year-old who reads "email" on a sign-in page concludes they
   are on the wrong page, or goes and makes one.

   Recovery is the parent's job, from the overview page. That is why there
   is no "forgot password" link here either: the answer is "ask your
   grown-up", and the product should not pretend otherwise.

   ── WHY THE BACKEND ISSUES THE SESSION ─────────────────────────────────
   Supabase authenticates on email + password. A child has no email, so
   there is nothing for the SDK to sign in WITH. The backend owns the
   username→account resolution and mints the session with its service
   credentials; this page receives the token pair and hands it to the SDK
   via `setSession`, which is what makes every downstream page — the child's
   own Today page, and any school page a pupil reaches — see an ordinary
   Supabase session and need no special case at all.

   `boot({ anonymous: true })` is load-bearing: this page must not read,
   inherit or care about a parent session that happens to be in the same
   browser. A parent signed in on the family laptop, then a child signing
   in on it, must produce the CHILD's session.

   ── ONE MESSAGE FOR EVERY FAILURE ──────────────────────────────────────
   Wrong password, no such username, removed child, disabled account — all
   render the identical sentence. Distinguishing them turns this form into
   a tool for discovering which usernames exist on the platform, and those
   usernames belong to children. The backend must return the same status
   for all of them too; a 404 for "no such user" and a 401 for "wrong
   password" leaks exactly what this message refuses to.
   ═══════════════════════════════════════════════════════════════════════ */
(function () {
  var C = window.MrBadmusConsumer;

  // The one thing this page ever says when sign-in does not work.
  var GENERIC = 'That username and password don’t match. Check them and try again — ' +
                'if you’re stuck, ask the grown-up who set up your account.';

  C.boot({ anonymous: true, run: function (ctx) {
    document.getElementById('c-nav').innerHTML = C.navHtml('');

    var msgEl = document.getElementById('msg');
    var btn   = document.getElementById('btn-login');
    var uEl   = document.getElementById('username');
    var pEl   = document.getElementById('password');

    function signIn() {
      var username = uEl.value.trim();
      var password = pEl.value;
      if (!username || !password) {
        return C.setMsg(msgEl, 'Type your username and your password.', 'error');
      }

      C.setBusy(btn, true, 'Signing in…');
      C.setMsg(msgEl, '');

      C.api('/api/consumer/child/login', {
        method: 'POST',
        body: { username: username, password: password }
      }).then(function (d) {
        var at = d && (d.access_token || (d.session && d.session.access_token));
        var rt = d && (d.refresh_token || (d.session && d.session.refresh_token));
        if (!at || !rt) {
          /* A 200 with no tokens in it. Not the child's fault and not a
             wrong password, so it does not get the generic message —
             that would send them off to re-type a correct password
             forever. */
          C.setBusy(btn, false);
          return C.setMsg(msgEl, 'Something went wrong signing you in. Please try again in a moment.', 'error');
        }
        // Hand the pair to the SDK so every page after this one sees an
        // ordinary Supabase session and needs no special case.
        return ctx.sb.auth.setSession({ access_token: at, refresh_token: rt })
          .then(function (r) {
            if (r.error) {
              C.setBusy(btn, false);
              return C.setMsg(msgEl, 'Something went wrong signing you in. Please try again in a moment.', 'error');
            }
            /* ⊕ MRB-310, Night 2. This used to land on /student/class.html,
               which is the SCHOOL product's class page: it wants a class, a
               teacher and an assignment feed, none of which a family child
               has. A consumer child now lands on their own Today page.

               `C.go` rather than a literal, so `?env=test` and `?api=` come
               with them — a child who signed in against the test backend
               must not arrive on a page talking to production, which would
               reject the session they just got and read as "your password
               is wrong". */
            C.go('/consumer/today.html');
          });
      }).catch(function (e) {
        C.setBusy(btn, false);
        /* Only a genuine network failure is reported as itself. Everything
           the server said no to becomes GENERIC — see the header. */
        if (/couldn’t reach MrBadmus/i.test(e.message)) {
          return C.setMsg(msgEl, e.message, 'error');
        }
        C.setMsg(msgEl, GENERIC, 'error');
      });
    }

    btn.addEventListener('click', signIn);
    // Enter submits from either field — this is a two-field form and
    // reaching for the mouse is friction a child does not need.
    [uEl, pEl].forEach(function (el) {
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter') { signIn(); } });
    });
  }});
})();
</script>
</body>
</html>
